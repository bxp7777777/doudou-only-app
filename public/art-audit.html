<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>所有立绘 · 翻转 / 删除</title>
<style>
:root{--bg:#12131a;--card:#1b1d27;--line:#2b2e3d;--txt:#e9e6df;--dim:#9aa0b4;--warn:#ff8a8a;--del:#ff5c5c;--ok:#8ee6a0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:9;background:rgba(18,19,26,.96);border-bottom:1px solid var(--line);padding:10px 14px}
h1{margin:0 0 4px;font-size:15px}
.hint{color:var(--dim);font-size:12px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
button{background:#242838;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
button.on{background:#3a4258;border-color:#6f7bb0}
.mode{font-weight:600}
.mode.flip{color:var(--warn)}
.mode.del{color:var(--del)}
textarea{width:100%;height:58px;background:#0e0f16;color:var(--ok);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:ui-monospace,monospace;font-size:12px;margin-top:8px}
section{padding:14px}
h2{font-size:13px;color:var(--dim);margin:6px 0 10px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;cursor:pointer;position:relative}
.card:hover{border-color:#4a5168}
.card.flip{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn) inset}
.card.drop{border-color:var(--del);box-shadow:0 0 0 1px var(--del) inset}
.card.flip img{transform:scaleX(-1)}
.card.drop img{opacity:.28;filter:grayscale(1)}
.card img{width:100%;height:100px;object-fit:contain;display:block;transition:.12s}
.name{margin-top:4px;font-size:11px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.id{font-size:9px;color:var(--dim);text-align:center;font-family:ui-monospace,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{position:absolute;top:4px;right:4px;font-size:10px;color:#1a1a1a;padding:0 4px;border-radius:5px;display:none}
.card.flip .tag{display:block;background:var(--warn)}
.card.drop .tag{display:block;background:var(--del);color:#fff}
</style></head>

    <button data-mode="flip" id="mFlip" class="on">🔄 翻转模式</button>
    <button data-mode="del" id="mDel">🗑 删除模式</button>
    <span style="width:8px"></span>

    <button id="copyFlip">复制翻转清单</button>
    <button id="copyDel">复制删除清单</button>
    <button id="clear">清空</button>
  </div>
  <textarea id="out" placeholder="清单会出现在这里"></textarea>
</header>

let mode = 'flip';
let filter = 'all';
const flipSet = new Set(), delSet = new Set();
function visible(it) {
  if (filter === 'all') return true;
  return it.sub === filter;
}
function render() {
  const groups = {};
  ITEMS.filter(visible).forEach(it => (groups[it.sub] = groups[it.sub] || []).push(it));
  const root = document.getElementById('list');
  root.innerHTML = '';
  for (const [sub, arr] of Object.entries(groups)) {
    const sec = document.createElement('section');
    sec.innerHTML = '<h2>' + sub + ' · ' + arr.length + ' 张</h2>';
    const grid = document.createElement('div');
    grid.className = 'grid';
    arr.forEach(it => {
      const el = document.createElement('div');
      el.className = 'card';
      const isFlip = flipSet.has(it.key), isDel = delSet.has(it.key);
      if (isFlip) el.classList.add('flip');
      if (isDel) el.classList.add('drop');
      el.innerHTML = '<span class="tag">' + (isDel ? '删' : '翻') + '</span><img src="' + it.file + '" loading="lazy" alt=""><div class="name">' + it.label + '</div><div class="id">' + it.btn + '</div>';
      el.addEventListener('click', () => {
        if (mode === 'del') {
          flipSet.delete(it.key);
          if (delSet.has(it.key)) delSet.delete(it.key); else delSet.add(it.key);
        } else {
          delSet.delete(it.key);
          if (flipSet.has(it.key)) flipSet.delete(it.key); else flipSet.add(it.key);
        }
        el.classList.toggle('flip', flipSet.has(it.key));
        el.classList.toggle('drop', delSet.has(it.key));
        el.querySelector('.tag').textContent = delSet.has(it.key) ? '删' : '翻';
        refresh();
      });
      grid.appendChild(el);
    });
    sec.appendChild(grid);
    root.appendChild(sec);
  }
  refresh();
}
function refresh() {
  document.getElementById('fc').textContent = flipSet.size;
  document.getElementById('dc').textContent = delSet.size;
}
document.getElementById('filters').addEventListener('click', e => {
  const m = e.target.closest('button[data-mode]');
  if (m) {
    mode = m.dataset.mode;
    document.getElementById('mFlip').classList.toggle('on', mode === 'flip');
    document.getElementById('mDel').classList.toggle('on', mode === 'del');
    const nm = document.getElementById('modeName');
    nm.textContent = '当前：标记' + (mode === 'flip' ? '翻转' : '删除');
    nm.className = 'mode ' + mode;
    return;
  }
  const f = e.target.closest('button[data-f]');
  if (f) {
    filter = f.dataset.f;
    document.querySelectorAll('button[data-f]').forEach(x => x.classList.toggle('on', x === f));
    render();
  }
});
document.getElementById('copyFlip').addEventListener('click', () => {
  const out = document.getElementById('out');
  out.value = [...flipSet].map(k => ITEMS.find(i => i.key === k).btn).join(', ');
  out.select(); try { document.execCommand('copy'); } catch (e) {}
  document.getElementById('copyFlip').textContent = '已复制 ✓'; setTimeout(() => document.getElementById('copyFlip').textContent = '复制翻转清单', 1200);
});
document.getElementById('copyDel').addEventListener('click', () => {
  const out = document.getElementById('out');
