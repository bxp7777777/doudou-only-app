<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>逐张朝向检查</title>
<style>
:root{--bg:#12131a;--card:#1b1d27;--line:#2b2e3d;--txt:#e9e6df;--dim:#9aa0b4;--warn:#ff8a8a;--ok:#8ee6a0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:9;background:rgba(18,19,26,.95);border-bottom:1px solid var(--line);padding:10px 14px}
h1{margin:0 0 4px;font-size:15px}
.hint{color:var(--dim);font-size:12px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
button{background:#242838;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
button.on{background:#3a4258;border-color:#6f7bb0}
.count{color:var(--warn);font-weight:600}
textarea{width:100%;height:56px;background:#0e0f16;color:var(--ok);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:ui-monospace,monospace;font-size:12px;margin-top:8px}
section{padding:14px}
h2{font-size:13px;color:var(--dim);margin:6px 0 10px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;cursor:pointer;position:relative}
.card:hover{border-color:#4a5168}
.card.on{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn) inset}
.card img{width:100%;height:104px;object-fit:contain;display:block;transition:transform .12s}
.card.on img{transform:scaleX(-1)}
.name{margin-top:4px;font-size:12px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.id{font-size:10px;color:var(--dim);text-align:center;font-family:ui-monospace,monospace}
.tag{position:absolute;top:4px;right:4px;font-size:10px;color:#1a1a1a;background:var(--warn);padding:0 4px;border-radius:5px;display:none}
.card.on .tag{display:block}
.hide{display:none}
</style></head>
<body>
<header>
  <h1>逐张朝向检查 · 点一张 = 这张要翻</h1>
  <div class="hint">已标记 <b class="count" id="cnt">0</b> 张 · 点「复制清单」把文件名发我，我按文件名逐张翻转（宠物会同时更新对应 png/jpg）</div>
  <div class="bar" id="filters">
    <button data-f="all" class="on">全部</button>
    <button data-f="幼体">幼体</button><button data-f="成长体">成长体</button><button data-f="究极体">究极体</button><button data-f="形态Ⅰ">形态Ⅰ</button><button data-f="形态Ⅱ">形态Ⅱ</button><button data-f="形态Ⅲ">形态Ⅲ</button>
    <button data-f="boss">首领</button>
    <button id="markAll">本页全标记</button>
    <button id="markNone">取消本页</button>
    <button id="copy">复制清单</button>
    <button id="clear">清空</button>
  </div>
  <textarea id="out" placeholder="标记结果会出现在这里"></textarea>
</header>
<div id="list"></div>

const marked = new Set();
const listEl = document.getElementById('list');
function render(filter) {
  listEl.innerHTML = '';
  const groups = {};
  ITEMS.filter(it => filter === 'all' || (filter === 'boss' ? it.kind === 'boss' : it.sub === filter)).forEach(it => {
    (groups[it.sub] = groups[it.sub] || []).push(it);
  });
  for (const [sub, arr] of Object.entries(groups)) {
    const sec = document.createElement('section');
    sec.innerHTML = '<h2>' + sub + ' · ' + arr.length + ' 张</h2>';
    const grid = document.createElement('div');
    grid.className = 'grid';
    arr.forEach(it => {
      const el = document.createElement('div');
      el.className = 'card' + (marked.has(it.key) ? ' on' : '');
      el.innerHTML = '<span class="tag">翻</span><img src="' + it.file + '" loading="lazy" alt=""><div class="name">' + it.label + '</div><div class="id">' + it.key + '</div>';
      el.addEventListener('click', () => {
        if (marked.has(it.key)) { marked.delete(it.key); el.classList.remove('on'); }
        else { marked.add(it.key); el.classList.add('on'); }
        refresh();
      });
      grid.appendChild(el);
    });
    sec.appendChild(grid);
    listEl.appendChild(sec);
  }
}
let currentFilter = 'all';
function markPage(on) {
  ITEMS.filter(it => currentFilter === 'all' || (currentFilter === 'boss' ? it.kind === 'boss' : it.sub === currentFilter)).forEach(it => {
    if (on) marked.add(it.key); else marked.delete(it.key);
  });
  document.querySelectorAll('.card').forEach(c => {});
  render(currentFilter);
  refresh();
}
function refresh() {
  document.getElementById('cnt').textContent = marked.size;
  document.getElementById('out').value = [...marked].join(', ');
}
document.getElementById('filters').addEventListener('click', e => {
  const b = e.target.closest('button[data-f]');
  if (!b) return;
  document.querySelectorAll('#filters button[data-f]').forEach(x => x.classList.toggle('on', x === b));
  currentFilter = b.dataset.f;
  render(b.dataset.f);
});
document.getElementById('copy').addEventListener('click', () => {
  const out = document.getElementById('out');
  out.select();
  try { document.execCommand('copy'); document.getElementById('copy').textContent = '已复制 ✓'; setTimeout(() => document.getElementById('copy').textContent = '复制清单', 1200); } catch (e) {}
});
document.getElementById('clear').addEventListener('click', () => {
  marked.clear();
  document.querySelectorAll('.card.on').forEach(c => c.classList.remove('on'));
  refresh();
});
render('all');
document.getElementById('markAll').addEventListener('click', () => markPage(true));
document.getElementById('markNone').addEventListener('click', () => markPage(false));
window.__auditReady = true;
</script></body></html>
