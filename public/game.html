.ach-group>summary:hover{background:#fffaf4}
.ach-group-emoji{font-size:17px}
.ach-group-name{flex:0 1 auto}
.ach-group .achievement-grid{padding:0 12px 12px}
.achievement-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.achievement-card{
  display:flex;gap:9px;padding:10px;border-radius:15px;border:1px solid #eedcc7;background:#fffaf3;
  align-items:center;flex-wrap:wrap;transition:.18s;
}
.achievement-card.ready{background:linear-gradient(140deg,#fffaf0,#fff1df);border-color:#f0d09b}
.achievement-card.claimed{opacity:.68;background:#f8f3eb}
.achievement-card .ach-info{flex:1;min-width:135px}
.achievement-card .ach-info b{font-size:11.5px;display:block}
.achievement-card .ach-info p{font-size:9.5px;color:var(--muted);margin:1px 0 3px;line-height:1.45}
.achievement-card .ach-note{color:#a08a94}
.achievement-card .btn{flex:0 0 auto}

/* 七日签到 */
.signin-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.signin-card{
  border:1px solid #ecd9c1;border-radius:13px;padding:8px 4px;text-align:center;background:#fffaf2;
  min-height:122px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;position:relative;
}
.signin-card .day{font-size:9px;color:var(--muted)}
.signin-card .signin-icons{font-size:21px;line-height:1.2;display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.signin-card .reward-text{font-size:7.5px;color:#927553;line-height:1.3}
.signin-card .stamp{font-size:7.5px;color:#bd9b74;border:1px dashed #dfc8ab;border-radius:5px;padding:1px 4px}
.signin-card.today{background:linear-gradient(150deg,#fff6e0,#ffe7d0);border-color:#f0cfab;box-shadow:0 4px 12px rgba(226,181,129,.13)}
.signin-card.claimed{background:linear-gradient(150deg,#f1fbf5,#e4f7ed);border-color:#c4e8d8;opacity:.85}
.signin-card.today .stamp{background:#ffb98a;color:#fff;border-color:#ffb98a}

/* 抽蛋 */
.gacha-banners{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-bottom:13px}
.gacha-banner{display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.banner-art{position:relative;flex:0 0 auto;width:85px;height:92px;display:grid;place-items:center}
.egg-big{font-size:58px;line-height:1;filter:drop-shadow(0 8px 5px rgba(115,83,54,.16));animation:wiggle 5s ease-in-out infinite}
.banner-art .spark{position:absolute;color:#f1b23d;font-size:13px;animation:sparkle 1.7s infinite}
.banner-art .spark.s1{left:9px;top:12px}
.banner-art .spark.s2{right:4px;bottom:18px;animation-delay:.7s}
.banner-info{flex:1;min-width:190px;position:relative;z-index:1}
.banner-info h2{font-size:18px;margin:3px 0 2px}
.banner-info p{font-size:10px;color:var(--muted);margin:0;line-height:1.5}
.rate-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.rarity-rate{font-size:9px;border-radius:7px;padding:3px 6px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.8);color:var(--muted)}
.rarity-rate b{font-size:9.5px;color:var(--rarity)}
.last-pulls{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.last-pull{
  width:43px;min-height:53px;border-radius:10px;background:linear-gradient(160deg,#fffdf8,var(--rarity-soft,#f7f0e6));
  border:1px solid color-mix(in srgb,var(--rarity,#ccc) 45%,white);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:4px 2px;font-size:21px;line-height:1.05;
}
.last-pull small{font-size:6.5px;color:var(--muted);white-space:nowrap}
.shop-item{
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:11px;
  border:1px solid #efddc7;border-radius:15px;background:#fffaf2;
}
.shop-item b{font-size:11px}
.shop-item p{font-size:9px;color:var(--muted);margin:0;line-height:1.4}
.shop-ico{font-size:25px;line-height:1.15}
.stone-shop{background:linear-gradient(155deg,#fffdf8,var(--el-soft,#f7f2eb));border-color:color-mix(in srgb,var(--el-color,#ccc) 25%,white)}
.exchange-emoji{font-size:30px;width:42px;text-align:center;flex:0 0 auto}
.exchange-info{flex:1;min-width:108px}
.exchange-info b{font-size:11.5px;display:block}
.exchange-info p{font-size:9px;color:var(--muted);margin:2px 0 0;line-height:1.5}
.exchange-actions{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.cos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.cos-preview{
  height:84px;border-radius:13px;display:grid;place-items:center;font-size:37px;margin-bottom:7px;
  background:linear-gradient(150deg,#ffeed2,#f8dcc4);border:1px solid #f0d9bd;position:relative;overflow:hidden;
}
.cos-preview.acc-preview{background:linear-gradient(150deg,#fff4e9,#ffe7ef)}
.cos-preview.bg-seaside{background:linear-gradient(165deg,#bfe8fb 0%,#e7f6ff 46%,#f7e2b8 47%,#efcf94 100%)}
.cos-preview.bg-autumn{background:linear-gradient(165deg,#ffe3bd 0%,#f8cd8f 48%,#eda85f 100%)}
.cos-preview.bg-seaside,.cos-preview.bg-autumn{font-size:34px}
.cos-preview .acc-emoji,.cos-preview span{position:absolute;right:12px;top:9px;font-size:20px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.1))}
.cos-info b{font-size:11.5px}
.cos-info p{font-size:9px;color:var(--muted);margin:2px 0 6px;line-height:1.45}
.cos-actions{display:flex;justify-content:center;gap:5px;flex-wrap:wrap}
.cosmetic-card.locked{opacity:.82}
.cosmetic-card.active{border-color:#b8e2ce;background:linear-gradient(150deg,#f8fffb,#eefaf4)}

/* 梦练场 / Boss 榜单 */
.arena-opponents{display:flex;flex-direction:column;gap:6px}
.arena-opponent{
  display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:11px;
  background:rgba(255,255,255,.6);border:1px solid rgba(195,218,237,.7);flex-wrap:wrap;
}
.opp-rank{width:18px;text-align:center;font-size:10px;font-weight:800;color:#9db2c3}
.arena-opponent .opp-info{flex:1;min-width:110px;display:flex;flex-direction:column;gap:1px}
.arena-opponent .opp-info b{font-size:11px}
.arena-opponent .opp-info span{font-size:9px;color:var(--muted)}
.boss-board{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.board-row{display:flex;align-items:center;gap:6px;font-size:10px;padding:4px 6px;border-radius:8px;background:rgba(255,255,255,.55)}
.board-row.me{background:linear-gradient(90deg,#fff2cf,#ffe3cf);font-weight:800;border:1px solid #f3cda2}
.board-rank{width:18px;text-align:center;font-weight:800;color:#b48c5b}
.board-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board-score{font-variant-numeric:tabular-nums;color:#9a6342}
.reward-chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}

/* 宠物弹窗 */
.pet-modal-hero{
  display:flex;gap:13px;align-items:center;padding:12px;border-radius:17px;
  background:linear-gradient(145deg,#fffaf0,var(--rarity-soft,#f7f0e6));border:1px solid color-mix(in srgb,var(--rarity,#ccc) 35%,white);
}
.pet-modal-avatar{position:relative;font-size:58px;line-height:1;flex:0 0 auto;filter:drop-shadow(0 7px 5px rgba(105,75,48,.14))}
.pet-modal-avatar em{position:absolute;left:50%;top:-9px;transform:translateX(-50%);font-style:normal;font-size:24px}
.pet-modal-avatar .spark{position:absolute;font-size:13px;color:#f4bd42;animation:sparkle 1.5s infinite}
.pet-modal-avatar .spark.s1{left:-6px;top:3px}.pet-modal-avatar .spark.s2{right:-5px;top:26px;animation-delay:.5s}
.pet-modal-id{flex:1;min-width:0}
.pet-modal-id h2{font-size:20px;margin:0}
.pet-modal-id p{font-size:10px;color:var(--muted);margin:4px 0 0}
.pet-care-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:11px 0}
.care{background:#fffaf2;border:1px solid #f0deca;border-radius:11px;padding:7px 8px}
.care > span{display:block;font-size:9px;color:var(--muted);margin-bottom:3px}
.pet-stat-panel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:10px 0}
.stat-cell{background:#fffaf3;border:1px solid #f0dfca;border-radius:10px;padding:6px 7px;text-align:center}
.stat-cell small{display:block;font-size:8.5px;color:var(--muted)}
.stat-cell b{font-size:12px;font-variant-numeric:tabular-nums}
.pet-stat-panel .btn{grid-column:span 4;justify-self:center}
.pet-equip-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.pet-equip-list .equip-slot{display:flex;flex-direction:column;gap:2px;min-height:82px}
.pet-equip-list .equip-slot .slot-ico{font-size:18px}
.pet-equip-list .equip-slot p{font-size:8px;color:var(--muted);margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pet-equip-list .equip-slot > .flex{margin-top:auto;justify-content:flex-end}
.pet-equip-list .equip-slot > button{position:static;align-self:flex-end}
.skill-list{display:flex;flex-direction:column}
.rename-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.flavor-text{font-size:10px;color:var(--muted);line-height:1.65;background:#fffaf2;border:1px dashed #efdcc6;border-radius:10px;padding:8px 10px}
.stat-source-list{display:flex;flex-direction:column;gap:6px}
.stat-source-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 10px;border-radius:11px;background:#fffaf2;border:1px solid #f1dfcb;font-size:10.5px}
.stat-source-label{color:var(--muted)}
.stat-source-row b{font-variant-numeric:tabular-nums;color:#a3733d}
.stat-source-row p{grid-column:1 / -1;margin:2px 0 0;font-size:9px;color:var(--muted);line-height:1.5}
.mini-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))!important}

/* 投喂 */
.feed-hero{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:15px;
  background:linear-gradient(145deg,#fff7ea,#ffece3);border:1px solid #f4d7c4;
}
.feed-pet{font-size:48px;line-height:1;animation:floaty 3s ease-in-out infinite}
.feed-hero h3{font-size:15px;margin:0}
.feed-hero p{font-size:10px;color:var(--muted);margin:2px 0 0}
.feed-options{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.feed-option{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:12px;background:#fffaf3;border:1px solid #f0deca;flex-wrap:wrap}
.feed-option b{font-size:11px}
.feed-option p{font-size:9px;color:var(--muted);margin:1px 0 0}
.feed-game{text-align:center;padding:4px 0}
.feed-game-pet{font-size:66px;line-height:1;position:relative;display:inline-block;filter:drop-shadow(0 8px 6px rgba(113,79,50,.16));transition:transform .12s}
.feed-game-pet.bounce{animation:tapBounce .3s ease}
.feed-game h3{font-size:15px;margin:5px 0 2px}
.feed-game > p{font-size:10px;color:var(--muted);margin:0 auto;max-width:390px;line-height:1.6}
.feed-game-progress{display:flex;align-items:center;gap:9px;margin:11px auto;max-width:360px}
.feed-game-progress .progress{flex:1;height:11px}
.feed-game-progress > b{font-size:10px;color:#a3733d;white-space:nowrap}
.feed-game-btn{
  width:min(360px,100%);border:0;border-radius:17px;padding:14px;font:inherit;font-size:15px;font-weight:800;color:#70422c;
  background:linear-gradient(145deg,#ffe4bc,#ffc9b8);box-shadow:0 6px 0 #efb197,0 12px 22px rgba(203,131,95,.2);cursor:pointer;
  transition:transform .12s,box-shadow .12s;
}
.feed-game-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #efb197}
.feed-game-result{text-align:center;padding:8px 2px}
.feed-game-result h3{font-size:19px;margin:5px 0 4px}
.feed-game-result p{font-size:10.5px;color:var(--muted);line-height:1.6}
.feed-game-result .reward-chips{margin:11px 0}
.feed-game-result .btn{max-width:330px;margin:0 auto}
.heart-pop{position:absolute;z-index:6;font-size:20px;pointer-events:none;animation:heartPop 1s ease-out forwards}
.feed-drop{position:absolute;left:50%;top:4px;font-size:21px;pointer-events:none;animation:dropFall .6s ease-in forwards}

/* 离线收益 */
.offline-hero{text-align:center;padding:2px 0 5px}
.offline-moon{font-size:54px;line-height:1.05;display:inline-block;animation:floaty 3.4s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(120,98,150,.2))}
.offline-hero h3{font-size:17px;margin:3px 0 2px}
.offline-hero p{font-size:10px;color:var(--muted);margin:0}
.offline-time{display:inline-flex;align-items:center;gap:5px;margin-top:7px;font-size:10.5px;font-weight:800;color:#8d70b3;background:#f3edff;border:1px solid #e0d3f6;border-radius:999px;padding:4px 10px}
.offline-rewards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0 10px}
.offline-reward{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:13px;background:linear-gradient(145deg,#fff8eb,#ffeade);border:1px solid #f2d9c2}
.offline-reward > span{font-size:25px}
.offline-reward small{display:block;font-size:9px;color:var(--muted)}
.offline-reward b{font-size:16px;color:#a3733d;font-variant-numeric:tabular-nums}
.offline-detail{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin:9px 0}
.offline-detail > div{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:8px;background:#fffaf2;border:1px solid #f2e0cb;font-size:9.5px;color:var(--muted)}
.offline-detail b{color:var(--ink-soft)}
.offline-rewards + .note{margin-top:4px}
.main-pet-emoji{display:inline-block;line-height:1}

/* 轮回 */
.rebirth-hero{
  display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;
  background:linear-gradient(140deg,#f8f2ff,#eee4ff 55%,#fff1f3);border:1px solid #e1d0f4;
}
.rebirth-vortex{font-size:47px;line-height:1;flex:0 0 auto;animation:spinSlow 9s linear infinite;filter:drop-shadow(0 5px 8px rgba(129,99,180,.2))}
.rebirth-hero h3{font-size:14px;margin:0 0 2px;color:#715390}
.rebirth-hero p{font-size:10px;color:#8d779f;margin:0;line-height:1.55}
.rebirth-upgrades{display:flex;flex-direction:column;gap:7px}
.rebirth-upgrade{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:12px;background:#fffaf3;border:1px solid #f0decb;flex-wrap:wrap}
.rebirth-ico{width:37px;height:37px;border-radius:11px;display:grid;place-items:center;font-size:20px;background:#f4ecff;border:1px solid #dfd1f4;flex:0 0 auto}
.rebirth-info{flex:1;min-width:150px}
.rebirth-info b{font-size:11px;display:block}
.rebirth-info p{font-size:9px;color:var(--muted);margin:1px 0 2px;line-height:1.45}
.rebirth-upgrade .btn{flex:0 0 auto}

/* 奇遇选择 */
.encounter-choices{display:flex;flex-direction:column;gap:7px;margin:10px 0}
.encounter-choice{
  width:100%;text-align:left;border:1.5px solid #e6d5f4;border-radius:13px;padding:10px 12px;
  background:linear-gradient(140deg,#fbf8ff,#f2eaff);color:var(--ink-soft);font:inherit;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;gap:9px;transition:.18s;
}
.encounter-choice:hover:not(:disabled){transform:translateY(-1px);border-color:#cbb0eb;box-shadow:0 6px 14px rgba(129,99,180,.12)}
.encounter-choice span{font-size:11.5px;font-weight:800}
.encounter-choice small{font-size:9px;color:#887395;white-space:nowrap}
.encounter-choice:disabled{opacity:.55;cursor:not-allowed}
@media (max-width:430px){.encounter-choice{flex-direction:column;align-items:flex-start;gap:4px}}

/* 抽蛋结果 */
.gacha-result-head{text-align:center;padding:1px 0 4px}
.result-mascot{font-size:47px;line-height:1.1;display:inline-block;animation:celebrate 1.7s ease-in-out infinite}
.gacha-result-head h3{font-size:17px;margin:3px 0 2px}
.gacha-result-head p{font-size:10px;color:var(--muted);margin:0}
.gacha-result-head.ssr-head h3{color:#a56b9f}
.gacha-result-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin-top:12px}
.gacha-result-card{
  position:relative;border-radius:14px;padding:8px 4px;min-height:108px;text-align:center;overflow:hidden;
  background:linear-gradient(160deg,#fffdf8,var(--rarity-soft,#f7f0e6));border:1.5px solid color-mix(in srgb,var(--rarity,#ccc) 50%,white);
  animation:lootPop .35s cubic-bezier(.2,.9,.3,1.2) both;
}
.gacha-result-card.ssr{box-shadow:0 0 0 2px rgba(255,193,105,.38),0 5px 18px rgba(239,167,67,.18)}
.gacha-card-glow{position:absolute;inset:-30%;background:radial-gradient(circle at 50% 20%,rgba(255,255,255,.8),transparent 60%);pointer-events:none}
.gacha-rarity{position:absolute;left:5px;top:4px;font-size:7px;font-weight:900;color:var(--rarity);letter-spacing:.5px}
.gacha-result-card .gacha-emoji{font-size:31px;line-height:1.2;margin-top:8px;position:relative}
.gacha-name{font-size:9.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;position:relative}
.gacha-tag{font-size:8px;color:var(--muted);margin-top:2px;display:flex;gap:2px;justify-content:center;flex-wrap:wrap;position:relative}
.new-tag{font-size:7px;font-weight:900;color:#fff;background:#f4a06d;border-radius:5px;padding:1px 4px}
.shiny-tag{font-size:7px;font-weight:900;color:#a77822;background:#fff0bd;border-radius:5px;padding:1px 4px}

/* 战斗补充 */
.b-unit.boss-unit{border-color:#e8b4b0;background:linear-gradient(160deg,#fffaf8,#ffefed);box-shadow:0 0 0 2px rgba(235,154,150,.16),0 6px 14px rgba(150,90,80,.1)}
.b-shield{
  position:absolute;right:0;top:-3px;font-size:8px;line-height:1.2;color:#679bb9;
  background:rgba(235,248,255,.9);border:1px solid #cbe7f3;border-radius:7px;padding:1px 4px;white-space:nowrap;
  box-shadow:0 2px 5px rgba(90,140,160,.12);
}
@keyframes toastOut{to{opacity:0;transform:translateY(6px) scale(.97)}}
@keyframes dropFall{0%{opacity:1;transform:translate(-50%,0) scale(.7)}100%{opacity:0;transform:translate(-50%,42px) scale(1.1)}}
@media (max-width:760px){
  .gacha-banners{grid-template-columns:1fr}
  .gacha-result-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .signin-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .pet-stat-panel{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pet-stat-panel .btn{grid-column:span 3}
  .pet-equip-list{grid-template-columns:1fr}
  .pet-care-row{grid-template-columns:1fr}
  .frame-grid{grid-template-columns:repeat(auto-fill,minmax(135px,1fr))}
}
@media (max-width:430px){
  .gacha-result-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .signin-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pet-stat-panel{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pet-stat-panel .btn{grid-column:span 2}
  .offline-rewards{grid-template-columns:1fr}
  .modal-actions-row{justify-content:stretch}
  .modal-actions-row .btn{flex:1;min-width:96px}
}
@media (min-width:900px){
  .speech{left:auto;right:calc(100% + 10px);border-radius:16px 16px 4px 16px}
  .speech::after{left:auto;right:-6px;border-left:0;border-bottom:0;border-right:1px solid #f1ddc7;border-top:1px solid #f1ddc7;border-radius:0 3px 0 0}
}

/* ---------- 动效 ---------- */
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes petFloat{0%,100%{transform:translateY(0) rotate(0)}45%{transform:translateY(-7px) rotate(-2deg)}60%{transform:translateY(-5px) rotate(2deg)}}
@keyframes artFadeIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes petWander{0%,100%{transform:translateX(0) translateY(0) rotate(0)}25%{transform:translateX(-16px) translateY(-2px) rotate(-4deg)}55%{transform:translateX(15px) translateY(-3px) rotate(3deg)}80%{transform:translateX(-7px) translateY(-1px) rotate(-2deg)}}

/* ---------- 立绘活物感：呼吸 + 摇摆 + 随机小动作 ---------- */
@keyframes artBreathe{0%,100%{transform:scale(1,1)}50%{transform:scale(.984,1.032)}}
@keyframes artSway{0%,100%{transform:rotate(-.9deg) translateY(.4px)}50%{transform:rotate(.9deg) translateY(-1.6px)}}
@keyframes artFly{0%,100%{transform:rotate(-2.4deg) translate3d(0,1.6px,0)}50%{transform:rotate(2.4deg) translate3d(0,-3.6px,0)}}
@keyframes artBounce{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-15%) scale(1.05,.95)}58%{transform:translateY(0) scale(.96,1.05)}100%{transform:translateY(0) scale(1)}}
@keyframes artTilt{0%{transform:rotate(0)}26%{transform:rotate(-7deg) translateY(-2px)}62%{transform:rotate(7deg) translateY(-2px)}100%{transform:rotate(0)}}
html[data-petanim="1"] .art-alive{animation:artSway var(--sway,8.4s) ease-in-out calc(-1 * var(--delay,0s)) infinite;transform-origin:50% 90%;will-change:transform}
html[data-petanim="1"] .art-alive>img{animation:artBreathe var(--breathe,3.9s) ease-in-out calc(-1 * var(--delay,0s)) infinite;transform-origin:50% 86%}
html[data-petanim="1"] .art-alive.art-fly{animation-name:artFly;animation-duration:var(--sway,5.2s)}
html[data-petanim="1"] .art-alive.art-heavy{animation-duration:var(--sway,11s)}
html[data-petanim="1"] .art-alive.art-act-bounce{animation:artBounce .78s cubic-bezier(.3,.9,.4,1.2)}
html[data-petanim="1"] .art-alive.art-act-tilt{animation:artTilt .86s ease-in-out}
html[data-petanim="1"] .home-pet-img{animation:homePetIn .5s cubic-bezier(.2,.9,.3,1.2) both,artBreathe var(--breathe,4.2s) ease-in-out .55s infinite;transform-origin:50% 86%}
html[data-petanim="1"] .codex-img{animation:artFadeIn .32s ease both,artBreathe var(--breathe,4.6s) ease-in-out calc(-1 * var(--delay,0s)) infinite;transform-origin:50% 86%}
html[data-petanim="1"] .pal-img{animation:petFloat 3.2s ease-in-out infinite,artBreathe 4.4s ease-in-out infinite}
/* ---------- 立绘骨骼：底座 / 躯干骨 / 头骨，三层软蒙版蒙皮 ---------- */
.rig{position:absolute;inset:0;display:block;border-radius:inherit}
.rig>img,.rig-bone>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}
/* 去掉 will-change：蒙版层被 GPU 提升成位图再旋转时边缘会糊出第二道轮廓（重影），这块只做 ±3° 纯旋转，不需要提升 */
.rig-bone{position:absolute;inset:0;display:block;pointer-events:none;border-radius:inherit}
.rig-b1{transform-origin:50% 74%;-webkit-mask-image:linear-gradient(180deg,#000 0%,#000 68%,rgba(0,0,0,.45) 73%,transparent 78%);mask-image:linear-gradient(180deg,#000 0%,#000 68%,rgba(0,0,0,.45) 73%,transparent 78%)}
.rig-b2{transform-origin:50% 58%;-webkit-mask-image:linear-gradient(180deg,#000 0%,#000 52%,rgba(0,0,0,.45) 57%,transparent 62%);mask-image:linear-gradient(180deg,#000 0%,#000 52%,rgba(0,0,0,.45) 57%,transparent 62%)}
.rig-b4{transform-origin:50% 92%;-webkit-mask-image:linear-gradient(0deg,#000 0%,#000 16%,rgba(0,0,0,.4) 22%,transparent 30%);mask-image:linear-gradient(0deg,#000 0%,#000 16%,rgba(0,0,0,.4) 22%,transparent 30%)}
.rig-b3{transform-origin:50% 44%;-webkit-mask-image:linear-gradient(180deg,#000 0%,#000 38%,rgba(0,0,0,.45) 43%,transparent 48%);mask-image:linear-gradient(180deg,#000 0%,#000 38%,rgba(0,0,0,.45) 43%,transparent 48%)}

function enemySkillSlots(kind, id, element) {

function allyBattleQuip(b, unit, hurtOnly) {
  if (!b || b.silent || unit.side !== 'ally') return;
  const pet = state.pets[unit.petUid];
  if (hurtOnly) {
    if (!b._hurtQuipDone) b._hurtQuipDone = {};
    if (b._hurtQuipDone[unit.petUid]) return;
    b._hurtQuipDone[unit.petUid] = true;
    pushBattleLog(b, '💬 ' + pick(HURT_QUIPS));
    return;
  }
  const now = Date.now();
  if (now - (b._speakAt || 0) < 2500) return;
  if (Math.random() > 0.32) return;
  b._speakAt = now;
  const nat = (pet && BATTLE_QUIPS[pet.nature]) ? pet.nature : 'neutral';
  pushBattleLog(b, '💬 ' + pick(BATTLE_QUIPS[nat]));
}
// 1-10 章 7 关，11-12 章 8 关（第 7 关多一只小怪）；首领固定在最后一关，负责解锁下一章
const STAGES_PER_CHAPTER = 7;
const STAGE_KINDS_8 = [...STAGE_KINDS.slice(0, 6), { type: 'mob', name: '小怪', label: '小怪', emoji: '👾' }, STAGE_KINDS[6]];
const STAGE_COUNTS = CHAPTERS.map(c => c.stages || STAGES_PER_CHAPTER);
const STAGE_PREFIX = (() => { const a = [0]; let s = 0; for (const n of STAGE_COUNTS) { s += n; a.push(s); } return a; })();
function stageCountOf(ch) { return STAGE_COUNTS[ch - 1] || STAGES_PER_CHAPTER; }
function chapterStageStart(ch) { return STAGE_PREFIX[ch - 1] || 0; }
function stageIndexOf(ch, sub) { return chapterStageStart(ch) + sub; }
function chapterOfStage(index) { for (let k = CHAPTERS.length; k >= 1; k--) if (index > chapterStageStart(k)) return k; return 1; }
function subOfStage(index) { return index - chapterStageStart(chapterOfStage(index)); }
const STAGES = [];
for (const chapter of CHAPTERS) {
  const kindsFor = stageCountOf(chapter.id) === 8 ? STAGE_KINDS_8 : STAGE_KINDS;
  for (let i = 1; i <= stageCountOf(chapter.id); i++) {
    const kind = kindsFor[i - 1] || STAGE_KINDS[0];
    const index = stageIndexOf(chapter.id, i);
    const recPower = Math.round(650 * Math.pow(1.42, chapter.id - 1) * (1 + 0.16 * (i - 1)));
    const baseGold = Math.round((1.0 + (chapter.id - 1) * 0.9 + i * 0.18) * 10) / 10;
    const bdef = kind.type === 'boss' ? bossByChapter(chapter.id) : null;
    const slotKey = ['mob1', 'mob2', 'mob3', 'elite', 'mob4', 'elite2'][i - 1];
    const suffixPool = STAGE_NAME_WORDS[slotKey] || STAGE_NAME_WORDS.mob1;
    const suffix = bdef ? '' : suffixPool[(chapter.id - 1) % 10];
    const blurbPool = STAGE_BLURB[kind.type] || [];
    const blurb = bdef ? bdef.flavor : (blurbPool[(index - 1) % blurbPool.length] || '');
    STAGES.push({
      index, chapter: chapter.id, chapterName: chapter.name,
      sub: i, type: kind.type, typeName: kind.label,
      name: bdef ? bdef.name : `${chapter.emoji} ${chapter.name}·${suffix}`,
      blurb,
      emoji: bdef ? bdef.emoji : kind.emoji,
      element: bdef ? bdef.element : chapter.element,
      recPower,
      baseGold,
      baseFruit: Math.max(0.01, Math.round(baseGold * 0.08 * 1000) / 1000),
      desc: chapter.desc,
      theme: chapter.theme,
      intro: (CHAPTER_STORY[chapter.id] || {}).intro || '',
      winLine: (CHAPTER_STORY[chapter.id] || {}).winLine || ''
    });
  }
}
function getStage(index) {
  return STAGES[clamp(index, 1, STAGES.length) - 1] || STAGES[0];
}
function stageIndex(chapter, sub) { return stageIndexOf(chapter, sub); }
// 难度系数：敌人实际战力 = recPower × 章系数 × 关卡类型系数。只影响敌人强度与展示，不改奖励公式
// 章系数保持"前期明显加压、后期收敛"的走向；第 10 章少于 1 是为了抵消 7 关布局带来的 recPower 抬升
const STAGE_DIFFICULTY = { 1: 3.4, 2: 2.7, 3: 2.4, 4: 2.1, 5: 1.55, 6: 1.2, 7: 1.15, 8: 1.05, 9: 0.88, 10: 0.84, 11: 0.86, 12: 0.56 };
const STAGE_TYPE_POWER = { mob: 1.06, elite: 1.08, boss: 1.18 };
function stageEnemyPower(stage) {
  if (!stage) return 0;
  const ch = STAGE_DIFFICULTY[stage.chapter] || 1;
  const tp = STAGE_TYPE_POWER[stage.type] || 1;
  return Math.round(num(stage.recPower, 0) * ch * tp);
}
// 界面上展示的「敌人战力」用真实生成的阵容战力（Boss 有额外倍率，比目标值更高），只用于显示与对比
const STAGE_POWER_CACHE = {};
function stageDisplayPower(stage) {
  if (!stage) return 0;
  const key = stage.index + ':' + stageEnemyPower(stage);
  if (STAGE_POWER_CACHE[key] == null) {
    try {
      const units = createEnemyFormation(stageEnemyPower(stage), buildStageEnemyOptions(stage));
      STAGE_POWER_CACHE[key] = Math.round(units.reduce((a, u) => a + calcPower(u), 0));
    } catch (err) {
      STAGE_POWER_CACHE[key] = stageEnemyPower(stage);
    }
  }
  return STAGE_POWER_CACHE[key];
}

function finalEndingLoop() { return clamp(num(state.rebirth && state.rebirth.count, 0) + 1, 1, 3); }
function finalEndingsOwned() {
  const map = (state.encounter && state.encounter.endings && typeof state.encounter.endings === 'object') ? state.encounter.endings : {};
  return Object.keys(map).filter(k => k.indexOf('final:') === 0).map(k => k.slice(6));
}
function openFinalEndingModal() {
  const loop = finalEndingLoop();
  const ownedSet = new Set(finalEndingsOwned());
  if (['A', 'B', 'C'].every(k => ownedSet.has(k + loop))) return;
  const owned = ownedSet;
  const rows = ['A', 'B', 'C'].map(k => {
    const e = FINAL_ENDINGS[k + loop];
    const got = owned.has(k + loop);
    return '<button class="btn ' + (got ? 'btn-ghost' : 'btn-primary') + '" type="button" data-act="finalEnding" data-code="' + k + loop + '" style="display:block;width:100%;margin:0 0 8px;text-align:left;padding:10px 12px">' + '<b>' + esc(e.title) + '</b><br><span class="tiny muted">' + (got ? '这条路已经走过。' : '走这条路。') + '</span></button>';
  }).join('');
  openModal('🌅 梦的尽头', '<p class="note">钟停在 17:47。他坐在椅子上，抬眼看你，没有说话。他知道你在做一个决定。</p>' + rows, { wide: true });
}
function chooseFinalEnding(code) {
  const e = FINAL_ENDINGS[code];
  if (!e) return;
  if (!state.encounter.endings || typeof state.encounter.endings !== 'object' || Array.isArray(state.encounter.endings)) state.encounter.endings = {};
  state.encounter.endings['final:' + code] = Date.now();
  saveGame();
  openModal(e.title, '<p class="note" style="line-height:1.9">' + esc(e.text) + '</p><p class="tiny muted">已记下这条路 · 共 ' + finalEndingsOwned().length + '/9</p><div class="modal-actions-row"><button class="btn btn-ghost" type="button" data-act="closeModal">合上</button></div>', { wide: true });
}

function num(value, fallback = 0) {
  const n = Number(value);
  return Number.isFinite(n) ? n : fallback;
}

function sanitizeState(s) {
  s.version = 1;
  s.savedAt = num(s.savedAt, Date.now());
  if (s.savedAt > Date.now() + 60000) s.savedAt = Date.now();
  s.createdAt = num(s.createdAt, Date.now());
  s.player = s.player && typeof s.player === 'object' ? s.player : {};
  s.player.name = String(s.player.name || '软糖铲屎官').slice(0, 16);
  if (!FRAME_MAP[s.player.frame]) s.player.frame = 'peach';

  for (const key of ['gold', 'crystal', 'fruit']) s.resources[key] = Math.max(0, Math.floor(num(s.resources[key], 0)));
  for (const bar of ['stamina', 'challenge']) {
    s[bar].max = Math.max(1, Math.floor(num(s[bar].max, bar === 'stamina' ? MAX_STAMINA : MAX_CHALLENGE)));
    s[bar].value = clamp(Math.floor(num(s[bar].value, s[bar].max)), 0, s[bar].max);
    s[bar].ts = num(s[bar].ts, Date.now());
  }
  for (const el of ELEMENT_KEYS) s.stones[el] = Math.max(0, Math.floor(num(s.stones[el], 0)));
  for (const key of Object.keys(s.items)) s.items[key] = Math.max(0, Math.floor(num(s.items[key], 0)));

  if (!s.pets || typeof s.pets !== 'object') s.pets = {};
  for (const uid of Object.keys(s.pets)) {
    const p = s.pets[uid];
    if (!p || !PET_MAP[p.templateId]) { delete s.pets[uid]; continue; }
    p.uid = uid;
    p.level = clamp(Math.floor(num(p.level, 1)), 1, MAX_LEVEL);
    p.star = clamp(Math.floor(num(p.star, 1)), 1, 10);
    p.evo = clamp(Math.floor(num(p.evo, 0)), 0, 2);
    p.intimacy = clamp(num(p.intimacy, 10), 0, 100);
    p.hunger = clamp(num(p.hunger, 80), 0, 100);
    p.mood = clamp(num(p.mood, 80), 0, 100);
    p.shiny = !!p.shiny;
    p.nickname = String(p.nickname || '').slice(0, 16);
    p.obtainedAt = num(p.obtainedAt, Date.now());
    p.lastFeed = num(p.lastFeed, Date.now());
    if (!p.skillLv || typeof p.skillLv !== 'object') p.skillLv = {};
    for (const k of ['basic', 'a1', 'a2', 'ult']) p.skillLv[k] = clamp(Math.floor(num(p.skillLv[k], 1)), 1, 10);
    p.equipment = p.equipment && typeof p.equipment === 'object' ? p.equipment : {};
    for (const slot of EQUIP_SLOT_KEYS) p.equipment[slot] = p.equipment[slot] || null;
    p.nature = PET_NATURES[p.nature] ? p.nature : 'neutral';
  }
  s.nextPetId = Math.max(1, Math.floor(num(s.nextPetId, 1)));
  if (!s.petShards || typeof s.petShards !== 'object') s.petShards = {};
  for (const id of Object.keys(PET_MAP)) s.petShards[id] = Math.max(0, Math.floor(num(s.petShards[id], 0)));

  if (!s.team || typeof s.team !== 'object') s.team = { front: [], back: [] };
  const seenTeam = new Set();
  for (const row of ['front', 'back']) {
    if (!Array.isArray(s.team[row])) s.team[row] = [];

// 旧存档是「5 关/章」，新布局是 7 关/章：把 maxCleared 与星星搬过去，章节首领仍算通关
function migrateStageLayout5(oldStage) {
  const oldPer = 5;
  const newPer = STAGES_PER_CHAPTER;
  const s = oldStage || {};
  const stars = s.stars && typeof s.stars === 'object' ? s.stars : {};
  const out = {};
  for (const key of Object.keys(stars)) {
    const idx = Math.floor(num(key, 0));
    if (idx <= 0) continue;
    const ch = Math.floor((idx - 1) / oldPer) + 1;
    const sub = ((idx - 1) % oldPer) + 1;
    if (ch > CHAPTERS.length) continue;
    const newSub = sub === oldPer ? newPer : Math.min(sub, newPer - 1);
    out[(ch - 1) * newPer + newSub] = stars[key];
  }
  const oldMax = Math.floor(num(s.maxCleared, 0));
  let newMax = 0;
  if (oldMax > 0) {
    const ch = Math.floor((oldMax - 1) / oldPer) + 1;
    const sub = ((oldMax - 1) % oldPer) + 1;
    const newSub = sub === oldPer ? newPer : Math.min(sub, newPer - 1);
    newMax = Math.min(STAGES.length, (ch - 1) * newPer + newSub);
  }
  return { maxCleared: newMax, stars: out, layout: newPer };
}

function loadState() {
  let raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (err) { raw = null; }
  if (!raw) return defaultState();
  try {
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object') throw new Error('bad save');
    const merged = deepMerge(defaultState(), parsed);
    const oldLayout = parsed.stage && typeof parsed.stage === 'object' && parsed.stage.layout === undefined;
    if (oldLayout) merged.stage = migrateStageLayout5(merged.stage);
    return sanitizeState(merged);
  } catch (err) {
    UI.loadError = true;
    return defaultState();
  }
}

function saveGame() {
  if (!state) return;
  // 离线收益尚未领取时保留旧 savedAt，避免刷新或关闭页面把这段时间“吃掉”。
  if (!UI.offlineOffer) state.savedAt = Date.now();
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    UI.saveWarned = false;
  } catch (err) {
    if (!UI.saveWarned) {
      UI.saveWarned = true;
      setTimeout(() => toast('本地存档写入失败，可能是浏览器限制或空间不足。', 'bad'), 200);
    }
  }
  gameSyncSchedule();
}

function persist(options = {}) {
  saveGame();
  if (options.render !== false) renderAll();
}

function templateOf(petOrId) {

    return !!(skill && (skill.effects || []).some(e => e.type === 'heal' || e.type === 'revive'));
  });
}

}

}

function autoEvolvePet(pet) {

      if (affix.id === 'crit') out.crit += value;
      if (affix.id === 'dr') out.dr += value;

    if (count >= 2) Object.assign(applied, setDef.bonus2);

  const lv = clamp(pet.level, 1, MAX_LEVEL);
  const star = clamp(pet.star, 1, 10);
  const starScale = 1 + (star - 1) * 0.05;
  const base = {
    hp: (t.base.hp + t.growth.hp * (lv - 1)) * evoData.mult * starScale,
    atk: (t.base.atk + t.growth.atk * (lv - 1)) * evoData.mult * starScale,
    def: (t.base.def + t.growth.def * (lv - 1)) * evoData.mult * starScale,
    spd: (t.base.spd + t.growth.spd * (lv - 1) + pet.evo * 1.5) * (1 + (star - 1) * 0.01),
    crit: t.base.crit + pet.evo * 0.01,
    critDmg: t.base.critDmg + pet.evo * 0.04,
    dr: t.base.dr,
    hit: t.base.hit,
    dodge: t.base.dodge,
    lifesteal: 0
  };
  const starBonus = { hpPct: 0, atkPct: 0, defPct: 0, spdPct: 0, crit: 0, dr: 0, allPct: 0 };
  for (const row of STAR_TABLE) {
    if (star >= row.star) {
      for (const key of Object.keys(row.bonus)) starBonus[key] = (starBonus[key] || 0) + row.bonus[key];
    }
  }
  const eq = equipmentStatsForPet(pet, s);
  const context = ctx || { bonus: { hpPct: 0, atkPct: 0, defPct: 0, spdPct: 0, crit: 0, dr: 0 } };
  const bond = context.bonus || {};
  const codex = codexBonusForState(s);
  const care = careModifiers(pet);
  const nat = (PET_NATURES[pet.nature] && PET_NATURES[pet.nature].bonus) || {};
  const intimacyTier = intimacyTierOf(pet.intimacy);
  const intimacyScale = (1 + clamp(num(pet.intimacy, 0), 0, 100) * 0.0015) * intimacyTier.mult;
  const allScale = 1 + (starBonus.allPct || 0) + (codex.allPct || 0);
  const stats = {};
  stats.hp = (base.hp + eq.flatHp) * (1 + starBonus.hpPct + (bond.hpPct || 0) + eq.hpPct + care.hpPct + (nat.hpPct || 0)) * allScale * intimacyScale;
  stats.atk = (base.atk + eq.flatAtk) * (1 + starBonus.atkPct + (bond.atkPct || 0) + eq.atkPct + care.atkPct + (nat.atkPct || 0)) * allScale * intimacyScale;
  stats.def = (base.def + eq.flatDef) * (1 + starBonus.defPct + (bond.defPct || 0) + eq.defPct + (nat.defPct || 0)) * allScale * intimacyScale;
  stats.spd = (base.spd + eq.flatSpd) * (1 + starBonus.spdPct + (bond.spdPct || 0) + eq.spdPct + care.spdPct + (nat.spdPct || 0)) * allScale * intimacyScale;
  stats.crit = clamp(base.crit + starBonus.crit + eq.crit + (bond.crit || 0) + care.crit + (nat.crit || 0), 0, 0.85);
  stats.critDmg = base.critDmg;
  stats.dr = clamp(base.dr + starBonus.dr + eq.dr + (bond.dr || 0), 0, 0.70);
  stats.hit = clamp(base.hit, 0, 0.35);
  stats.dodge = clamp(base.dodge, 0, 0.35);
  stats.lifesteal = clamp(eq.lifesteal, 0, 0.35);
  for (const key of Object.keys(stats)) stats[key] = Math.round(stats[key] * 100) / 100;
  stats.hp = Math.round(stats.hp);
  stats.atk = Math.round(stats.atk);
  stats.def = Math.round(stats.def);
  stats.spd = Math.round(stats.spd * 10) / 10;
  return stats;
}
function calcPower(stats) {
  return Math.round(
    stats.hp * 0.22 + stats.atk * 2.8 + stats.def * 2.2 + stats.spd * 4.5 +
    stats.crit * 1000 + stats.critDmg * 250 + stats.dr * 600 +
    stats.hit * 200 + stats.dodge * 200 + stats.lifesteal * 200
  );
}
function getPetPower(pet, s = state) {
  if (!pet) return 0;
  const inTeam = [...(s.team.front || []), ...(s.team.back || [])].includes(pet.uid);
  const ctx = inTeam ? teamContextForState(s) : null;
  return calcPower(getPetStats(pet, ctx, s));
}
function calcTeamPower(s = state) {
  const team = teamPetsOf(s);
  if (!team.length) return 0;
  const ctx = teamContextForState(s, team);
  return sum(team.map(p => calcPower(getPetStats(p, ctx, s))));
}
function maxTeamSize() { return 6; }
function getSkillLevel(pet, index) {

function levelCostFor(pet) {

}

/* ========== 4. 经济 / 时间 / 日常 / 抽蛋 / 挂机 ========== */
function ensureRegen(bar, intervalMs, now = Date.now()) {
  if (!bar) return 0;
  bar.max = Math.max(1, Math.floor(num(bar.max, 1)));
  if (bar.value >= bar.max) { bar.ts = now; return 0; }
  if (!Number.isFinite(bar.ts) || bar.ts > now) bar.ts = now;
  const gain = Math.floor((now - bar.ts) / intervalMs);
  if (gain > 0) {
    bar.value = Math.min(bar.max, bar.value + gain);
    bar.ts = bar.value >= bar.max ? now : bar.ts + gain * intervalMs;
  }
  return gain;
}
function regenAll(now = Date.now()) {
  ensureRegen(state.stamina, STAMINA_REGEN_MS, now);
  ensureRegen(state.challenge, CHALLENGE_REGEN_MS, now);
}
function spendStamina(cost) {
  regenAll();
  if (state.stamina.value < cost) return false;
  state.stamina.value -= cost;
  if (state.stamina.value < state.stamina.max) state.stamina.ts = Date.now();
  return true;
}
function spendChallenge(cost) {
  regenAll();
  if (state.challenge.value < cost) return false;
  state.challenge.value -= cost;
  if (state.challenge.value < state.challenge.max) state.challenge.ts = Date.now();
  return true;
}

function ensureDaily(s = state) {
  const today = localDateKey();
  let changed = false;
  if (s.daily.date !== today) {
    s.daily.date = today;
    s.daily.progress = { login: 1 };
    s.daily.claimed = [];
    changed = true;
  }
  if (!s.daily.progress.login) { s.daily.progress.login = 1; changed = true; }
  if (s.dungeon.date !== today) {
    s.dungeon.date = today;
    s.dungeon.attempts = DUNGEON_ATTEMPTS_PER_DAY;
    changed = true;
  }
  if (s.boss.date !== today) {
    s.boss.date = today;
    s.boss.attempts = 3;
    s.boss.bestDamage = 0;
    s.boss.totalDamage = 0;
    s.boss.claimed = false;
    s.boss.seed = String(hashString('boss-' + today));
    changed = true;
  }
  return changed;
}

function ensureEncounter(s = state, now = Date.now()) {
  let changed = false;
  if (!s.encounter.refreshAt || now >= s.encounter.refreshAt) {
    s.encounter.refreshAt = now + 2 * HOUR_MS;
    s.encounter.attempts = 2;
  s.encounter.endings = (s.encounter.endings && typeof s.encounter.endings === 'object') ? s.encounter.endings : {};
    const prev = s.encounter.activeId;
    const pool = ENCOUNTERS.filter(e => e.id !== prev);
    const seed = hashString(localDateKey() + ':' + Math.floor(now / HOUR_MS) + ':' + s.encounter.total);
    s.encounter.activeId = pool[seed % pool.length].id;
    changed = true;
  }
  return changed;
}

function ensureArenaSeason(s = state, now = Date.now()) {
  if (now - s.arena.seasonStart >= 7 * DAY_MS) {
    const tier = arenaTierOf(s.arena.rating);
    const bonus = Math.floor(tier.reward * 1.6);
    s.items.arenaCoin += bonus;
    // 赛季奖励除了梦练币，还按段位发养成材料，让冲段位有实感
    if (tier.order >= 2) s.items.starShard += 6 + tier.order * 4;
    if (tier.order >= 3) s.items.skillBook += 1;
    s.arena.rating = 1000;
    s.arena.wins = 0;
    s.arena.losses = 0;
    s.arena.seasonStart = now;
    s.arena.season += 1;
    UI.arenaOpponents = [];
    return { changed: true, bonus, tier };
  }
  return { changed: false };
}

function updateCareElapsed(seconds, s = state) {

  if (seconds < 1) return;
  for (const pet of Object.values(s.pets)) {
    pet.hunger = clamp(num(pet.hunger, 80) - seconds * 3 / 3600, 0, 100);

function autoDeployPet(pet) {
  if (!pet) return false;
  const total = state.team.front.length + state.team.back.length;
  if (total >= maxTeamSize()) return false;
  const template = templateOf(pet);
  const rows = template.role === 'front' ? ['front', 'back'] : ['back', 'front'];
  for (const row of rows) {
    const cap = row === 'front' ? 2 : 3;
    if (state.team[row].length < cap && !state.team[row].includes(pet.uid)) {
      state.team[row].push(pet.uid);
      noteBonds();
      return true;

  return false;
}

function addReward(reward, options = {}) {

  if (reward.fruit) {

      state.stones[el] += amount;

  if (reward.stonesRandom) {
    const gains = randomStoneGain(Math.max(0, Math.floor(num(reward.stonesRandom, 0))));
    for (const el of ELEMENT_KEYS) {
      if (!gains[el]) continue;
      state.stones[el] += gains[el];
      logs.push({ icon: ELEMENTS[el].emoji, label: ELEMENTS[el].name + '进化石', amount: gains[el] });
    }
  }
  if (reward.stoneChoice) {
    const gains = randomStoneGain(Math.max(0, Math.floor(num(reward.stoneChoice, 0))));
    for (const el of ELEMENT_KEYS) {
      if (!gains[el]) continue;
      state.stones[el] += gains[el];
      logs.push({ icon: ELEMENTS[el].emoji, label: ELEMENTS[el].name + '进化石', amount: gains[el] });
    }
  }
  if (reward.randomShards) {
    const amount = Math.floor(num(reward.randomShards, 0));
    const before = JSON.stringify(state.petShards);
    randomPetShards(amount);
    const diff = [];
    for (const id of Object.keys(state.petShards)) {
      const prev = JSON.parse(before)[id] || 0;

    }

  }
  for (const key of ['skillBook', 'equipShard', 'starShard', 'bondBadge', 'enhanceStone', 'arenaCoin', 'eternal']) {
    if (reward[key]) {

    state.stamina.value = Math.min(state.stamina.max, state.stamina.value + Math.floor(num(reward.energy, 0)));
    logs.push({ icon: '⚡', label: '体力', amount: Math.floor(num(reward.energy, 0)) });
  }
  if (reward.challenge) {
    regenAll();
    state.challenge.value = Math.min(state.challenge.max, state.challenge.value + Math.floor(num(reward.challenge, 0)));
    logs.push({ icon: '🎟️', label: '挑战券', amount: Math.floor(num(reward.challenge, 0)) });

  if (reward.intimacyAll) {
    const amount = Math.max(0, num(reward.intimacyAll, 0));
    for (const pet of Object.values(state.pets)) pet.intimacy = clamp(num(pet.intimacy, 0) + amount, 0, 100);
    if (amount) logs.push({ icon: '💗', label: '全队亲密度', amount, extra: '+' + amount });
  }
  if (reward.equipment) {
    const item = makeEquipment(reward.equipment === true ? null : reward.equipment);
    if (item) logs.push({ icon: '🎁', label: item.name, amount: 1, itemId: item.id });
  }
  if (reward.frame && FRAME_MAP[reward.frame] && !state.quests.frames.includes(reward.frame)) {
    state.quests.frames.push(reward.frame);
    logs.push({ icon: '🖼️', label: '头像框·' + FRAME_MAP[reward.frame].name, amount: 1 });
  }
  return logs;
}

function canPayCost(cost) {
  if (!cost) return true;
  for (const key of ['gold', 'crystal', 'fruit']) {
    if (cost[key] && state.resources[key] < cost[key]) return false;
  }
  if (cost.stamina && state.stamina.value < cost.stamina) return false;
  if (cost.challenge && state.challenge.value < cost.challenge) return false;
  return true;
}
function payCost(cost) {
  if (!cost || !canPayCost(cost)) return false;
  if (cost.gold) state.resources.gold -= cost.gold;
  if (cost.crystal) state.resources.crystal -= cost.crystal;
  if (cost.fruit) state.resources.fruit -= cost.fruit;
  if (cost.stamina) spendStamina(cost.stamina);
  if (cost.challenge) spendChallenge(cost.challenge);
  return true;
}
function costText(cost) {
  if (!cost) return '免费';
  const parts = [];
  if (cost.gold) parts.push(`🪙 ${fmt(cost.gold)}`);
  if (cost.crystal) parts.push(`💎 ${fmt(cost.crystal)}`);
  if (cost.fruit) parts.push(`🍎 ${fmt(cost.fruit)}`);
  if (cost.stamina) parts.push(`⚡ ${cost.stamina}`);
  if (cost.challenge) parts.push(`🎟️ ${cost.challenge}`);
  return parts.join(' · ') || '免费';
}

/* -------- 装备生成 -------- */
function rollEquipmentQuality(bias = 0) {
  const keys = Object.keys(EQUIP_QUALITIES);
  const weights = keys.map(k => {
    const base = EQUIP_QUALITIES[k].weight;
    if (k === 'common') return Math.max(2, base - bias * 10);
    if (k === 'fine') return base + bias * 2;
    if (k === 'epic') return base + bias * 5;
    return base + bias * 2;
  });
  return weightedPick(keys, weights);
}
function makeEquipment(quality = null, slot = null, s = state) {
  const qKey = EQUIP_QUALITIES[quality] ? quality : rollEquipmentQuality(0);
  const q = EQUIP_QUALITIES[qKey];
  const slotKey = EQUIP_SLOT_KEYS.includes(slot) ? slot : pick(EQUIP_SLOT_KEYS);
  const affixCount = q.affixes;
  const pool = EQUIP_AFFIXES.slice();
  const affixes = [];
  for (let i = 0; i < affixCount && pool.length; i++) {
    const affix = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
    const base = affix.min + Math.random() * (affix.max - affix.min);
    const value = base * (0.86 + q.mult * 0.20);
    affixes.push({ id: affix.id, value: Math.round(value * 10000) / 10000 });
  }
  const item = {
    id: 'eq' + (s.nextEquipId++),
    name: `${pick(EQUIP_PREFIX)}·${q.name}${EQUIP_SLOTS[slotKey].name}`,
    slot: slotKey,
    quality: qKey,
    level: 0,
    affixes,
    setId: Math.random() < 0.62 ? pick(EQUIP_SET_KEYS) : null,
    equippedBy: null
  };
  s.equipment.push(item);
  return item;
}
function equipQualityRarity(item) {
  return ({ common: 'N', fine: 'R', epic: 'SR', legend: 'SSR' })[item && item.quality] || 'N';
}
function affixText(affix) {
  const t = EQUIP_AFFIXES.find(a => a.id === affix.id);
  if (!t) return '';
  return t.fmt.replace('{v}', (affix.value * 100).toFixed(1).replace(/\.0$/, ''));
}
function itemAffixSummary(item) {
  return (item.affixes || []).map(affixText).join(' · ');
}
function itemPowerHint(item) {
  if (!item) return 0;
  const q = EQUIP_QUALITIES[item.quality];
  return Math.round(EQUIP_SLOTS[item.slot].base * q.mult * (1 + item.level * 0.085));
}
function equipmentInventory(s = state) {
  return (s.equipment || []).slice().sort((a, b) => {
    const order = { legend: 4, epic: 3, fine: 2, common: 1 };
    return (order[b.quality] - order[a.quality]) || (b.level - a.level);
  });
}

function getDailyBossInfo() {

function getBossLeaderboard() {
  const info = getDailyBossInfo();
  // 排行榜的对手按「主线进度」生成，不再跟着玩家战力自缩放：推得越远，榜上的伤害越高
  const chapter = Math.max(1, chapterOfStage(Math.max(1, state.stage.maxCleared)));
  const baseline = Math.max(7000, Math.round(2400 * Math.pow(1.34, chapter - 1)));
  const rng = seededRandom(hashString('lb-' + localDateKey()));
  const bots = ARENA_NAMES.slice(0, 11).map((name, i) => ({
    name,
    score: Math.round(baseline * (0.55 + rng() * 2.5)),
    isPlayer: false
  }));
  const mine = Math.max(num(state.boss.totalDamage, 0), num(state.boss.bestDamage, 0));
  const list = bots.slice();
  if (mine > 0) list.push({ name: state.player.name || '你', score: mine, isPlayer: true });

  const rank = list.findIndex(x => x.isPlayer) + 1;
  const top = list.slice(0, 10);
  const me = list.find(x => x.isPlayer);
  if (me && rank > 10) top.push(me);
  return { info, list: top, rank, baseline, mine };
}
function bossRankReward(rank) {

  if (rank === 2) return { crystal: 230, arenaCoin: 60, starShard: 6 };
  if (rank === 3) return { crystal: 180, arenaCoin: 45, starShard: 4 };
  if (rank >= 4 && rank <= 6) return { crystal: 150, arenaCoin: 35, starShard: 3 };

/* -------- 挂机经济 -------- */
function idleStageInfo() {
  const index = state.stage.maxCleared > 0 ? state.stage.maxCleared : 1;
  return getStage(index);
}
function calcIdleRates(ignoreBoost = false) {
  const team = getTeamPets();
  const stage = idleStageInfo();
  if (!team.length) {
    return { gold: 0, fruit: 0, stage, teamPower: 0, efficiency: 0, boost: false };
  }
  const teamPower = calcTeamPower();
  const efficiency = clamp(teamPower / Math.max(1, stage.recPower), 0.45, 2.2);
  const eternalBonus = 1 + (state.eternal.idle || 0) * 0.05;
  const boost = !ignoreBoost && state.idle.boostUntil > Date.now();
  const boostMult = boost ? 2 : 1;
  // 全队平均饱食 / 心情温和影响挂机产出：喂饱、哄开心略增产，长期冷落略减产
  const avgHunger = sum(team.map(p => num(p.hunger, 80))) / team.length;
  const avgMood = sum(team.map(p => num(p.mood, 80))) / team.length;
  const idleCareMult = (avgHunger >= 80 ? 1.05 : (avgHunger < 30 ? 0.90 : 1))
    * (avgMood >= 80 ? 1.03 : (avgMood < 30 ? 0.95 : 1))
    * selfCareBonusMult();
  return {
    // 挂机产出 ÷15：原来 1 小时挂机 ≈ 60 关的金币、120 关的果实，把关卡经济彻底淹掉了
    gold: stage.baseGold * efficiency * eternalBonus * boostMult * idleCareMult / IDLE_RATE_DIVISOR,
    fruit: stage.baseFruit * efficiency * eternalBonus * boostMult * idleCareMult * IDLE_FRUIT_BOOST / IDLE_RATE_DIVISOR,
    stage,
    teamPower,
    efficiency,
    boost,
    careMult: idleCareMult,
    avgHunger: Math.round(avgHunger),
    avgMood: Math.round(avgMood)
  };
}
function accrueIdle(seconds, s = state) {
  seconds = Math.max(0, Math.min(seconds, 86400));
  if (seconds <= 0) return;
  const team = teamPetsOf(s);
  if (!team.length) return;
  const saved = state;
  state = s;
  const rates = calcIdleRates();
  state = saved;
  s.idle.pendingGold = Math.min(1e15, s.idle.pendingGold + rates.gold * seconds);
  s.idle.pendingFruit = Math.min(1e12, s.idle.pendingFruit + rates.fruit * seconds);
  s.quests.metrics.idleSeconds += seconds;
  for (const pet of team) pet.intimacy = clamp(num(pet.intimacy, 0) + seconds * 0.00035, 0, 100);
}
function offlineSlotsBonus(s = state) {
  return 1 + clamp(s.idle.offlineSlots, 0, 4) * 0.2;
}
// 离线时长上限：基础 12 小时 + 小夜灯升级（最多 +12 小时）。
function offlineCapSec() {
  return OFFLINE_CAP_SEC + clamp(num(state.idle && state.idle.capHours, 0), 0, 6) * 3600;
}
// 离线收益 = 离线时每秒产出 × 离线秒数 × 0.6 × 挂机位加成。
// 离线秒数由 Date.now() 与存档 savedAt 的差值得到，最多 offlineCapSec()。
function buildOfflineOffer(seconds) {
  const capSec = offlineCapSec();
  const capped = clamp(seconds, 0, capSec);
  const team = getTeamPets();
  if (!team.length || capped < 20) return null;
  const rates = calcIdleRates(true);
  if (rates.gold <= 0) return null;
  const slotBonus = offlineSlotsBonus();
  const gold = Math.floor(rates.gold * capped * OFFLINE_RATE * slotBonus);
  const fruit = Math.floor(rates.fruit * capped * OFFLINE_RATE * slotBonus);
  return {
    seconds: capped,
    requestedSeconds: Math.max(0, seconds),
    cappedOut: seconds > capSec,
    capHours: Math.round(capSec / 3600),
    gold,
    fruit,
    goldPerSec: rates.gold,
    efficiency: rates.efficiency,
    slotBonus,
    stage: rates.stage
  };
}
function claimOfflineOffer() {
  const offer = UI.offlineOffer;
  if (!offer) return;
  state.resources.gold += offer.gold;
  state.resources.fruit += offer.fruit;
  state.quests.metrics.goldEarned += offer.gold;
  state.quests.metrics.idleSeconds += offer.seconds;
  UI.offlineOffer = null;
  UI.lastTick = Date.now();
  UI.lastSaveTick = Date.now();
  closeModal(true);
  saveGame();
  renderAll();
  toast(`收下啦！金币 +${fmt(offer.gold)}，经验果 +${fmt(offer.fruit)}`, 'good', 3000);
}

/* -------- 抽蛋 -------- */
function gachaCost(type, count) {
  if (type === 'rare') return count === 10 ? { crystal: 2700 } : { crystal: 300 };
  return count === 10 ? { gold: 4500 } : { gold: 500 };
}
function ownedSsrCount() {
  const own = new Set(Object.values(state.pets).map(p => p.templateId));
  return PETS.filter(p => p.rarity === 'SSR' && own.has(p.id)).length;
}
function rollRarity(type) {
  const rates = GACHA_RATES[type] || GACHA_RATES.normal;
  const keys = ['R', 'SR', 'SSR'];
  return weightedPick(keys, keys.map(k => rates[k]));
}
function randomTemplateOfRarity(rarity) {
  const pool = PETS.filter(p => p.rarity === rarity);
  return pick(pool.length ? pool : PETS);
}
function pullGacha(type, count) {
  const cost = gachaCost(type, count);
  if (!canPayCost(cost)) { toast(`资源不足：${costText(cost)}`, 'bad'); return null; }
  payCost(cost);
  const rarities = [];
  for (let i = 0; i < count; i++) rarities.push(rollRarity(type));
  let guaranteed = false;
  if (count === 10 && !rarities.some(r => r === 'SR' || r === 'SSR')) {
    const forced = chance(0.72) ? 'SR' : 'SSR';
    rarities[9] = forced;
    guaranteed = true;
  }
  const results = [];
  for (let i = 0; i < count; i++) {
    const rarity = rarities[i];
    const template = randomTemplateOfRarity(rarity);
    const ownedBefore = Object.values(state.pets).some(p => p.templateId === template.id);
    const shiny = chance(template.rarity === 'SSR' ? 0.05 : SHINY_RATE);
    let isNew = false;
    let shards = 0;
    if (ownedBefore) {
      shards = RARITIES[template.rarity].dup;
      addPetShards(template.id, shards);
    } else {
      createPet(template.id, { shiny, autoDeploy: true });
      isNew = true;
    }
    results.push({
      templateId: template.id,
      rarity: template.rarity,
      name: template.name,
      emoji: petEmojiById(template.id, 0),
      element: template.element,
      shiny,
      isNew,
      shards,
      guaranteed: guaranteed && i === 9
    });
  }
  if (type === 'rare') state.gacha.rare += count; else state.gacha.normal += count;
  state.gacha.total += count;
  state.quests.metrics.pulls += count;
  bumpMetric('pulls', count);
  state.gacha.lastResults = results.map(r => ({
    templateId: r.templateId, rarity: r.rarity, emoji: r.emoji, isNew: r.isNew, shiny: r.shiny
  }));
  noteBonds();
  saveGame();
  return results;
}

function weekIndexNow(d = new Date()) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.floor(((t - yearStart) / 86400000 + 1) / 7);
}
function weekKeyNow(d = new Date()) {
  return `${d.getFullYear()}-W${String(weekIndexNow(d)).padStart(2, '0')}`;
}
function weeklyThemeOf(s = state) {
  ensureWeekly(s);
  return WEEKLY_THEMES[weekIndexNow() % WEEKLY_THEMES.length];
}
function ensureWeekly(s = state) {
  const key = weekKeyNow();
  if (!s.weekly || s.weekly.key !== key) {
    s.weekly = { key, m: {}, claimed: [] };
  }
  if (!s.weekly.m) s.weekly.m = {};
  if (!Array.isArray(s.weekly.claimed)) s.weekly.claimed = [];
}
function bumpWeekly(metric, amount = 1) {

  state.weekly.m[metric] = Math.max(0, num(state.weekly.m[metric], 0) + amount);

function makeStageRewards(stage, firstClear) {
  const reward = {
    gold: Math.round(stage.baseGold * 45 + stage.recPower * 0.16),
    crystal: 4 + stage.chapter * 2 + (stage.type === 'boss' ? 8 : 0),
    fruit: 6 + stage.chapter * 3 + (stage.type === 'boss' ? 10 : 0)
  };
  if (firstClear) {
    reward.crystal += 10 + stage.chapter * 4;
    if (stage.type === 'elite') reward.stones = { [stage.element]: 1 };
    if (stage.type === 'boss') {
      reward.stones = { [stage.element]: 3 };
      reward.starShard = 2;
      reward.equipment = stage.chapter >= 5 ? 'epic' : 'fine';
    }
  } else if (stage.type === 'boss') {
    reward.equipment = 'fine';
  } else if (stage.type === 'elite' && chance(0.30)) {
    reward.equipShard = 8;
  }
  return reward;
}
// repeat=true 表示这层以前通过过（每周重置后的重复挑战），基础收益 5 折、里程碑奖励不再重复发放
function makeTowerReward(floor, repeat) {
  const k = repeat ? 0.5 : 1;
  const reward = {
    gold: Math.round((520 + floor * 180) * k),
    // 钻石只在首通给：每周重复清层如果也给钻，会让钻石通胀到没有意义
    crystal: repeat ? 0 : (15 + floor * 2),
    stonesRandom: repeat ? 1 : 2,
    fruit: Math.round((8 + floor) * k)
  };
  if (floor % 5 === 0 && !repeat) {
    reward.starShard = 4;
    reward.skillBook = 1;
    reward.equipment = floor >= 15 ? 'epic' : 'fine';
  }
  return reward;
}
function makeDungeonReward(modeIndex = currentDungeonModeIndex()) {
  const progress = state.stage.maxCleared;
  if (modeIndex === 0) {
    return { fruit: 70 + progress * 6, gold: 900 + progress * 80, crystal: 10 };
  }
  if (modeIndex === 1) {
    return { gold: 3200 + progress * 420, fruit: 12 + Math.floor(progress / 3), crystal: 15 };
  }
  return { stonesRandom: 4 + Math.floor(progress / 10), crystal: 30, starShard: 1 };
}

function statSourceRows(pet) {
  const t = templateOf(pet);
  const evo = EVOLUTIONS[pet.evo] || EVOLUTIONS[0];
  const ctx = [...state.team.front, ...state.team.back].includes(pet.uid) ? teamContextForState() : null;
  const stats = getPetStats(pet, ctx);
  const eq = equipmentStatsForPet(pet);
  const star = pet.star;
  const codex = codexBonusForState();
  const bond = (ctx && ctx.bonus) || {};
  const intimacyPct = Math.round(pet.intimacy * 0.15 * 10) / 10;
  const rows = [
    { label: '生命', icon: '❤️', value: fmt(stats.hp), sources: `基础 ${fmt(t.base.hp)} · Lv/进化 ×${evo.mult.toFixed(2)} · 装备 +${fmt(eq.flatHp)}` },
    { label: '攻击', icon: '⚔️', value: fmt(stats.atk), sources: `基础 ${fmt(t.base.atk)} · 等级成长 ${t.growth.atk}/级 · 装备 +${fmt(eq.flatAtk)}` },
    { label: '防御', icon: '🛡️', value: fmt(stats.def), sources: `基础 ${fmt(t.base.def)} · 等级成长 ${t.growth.def}/级 · 装备 +${fmt(eq.flatDef)}` },
    { label: '速度', icon: '💨', value: stats.spd.toFixed(1), sources: `基础 ${fmt(t.base.spd)} · 星级/装备/羁绊加成` },
    { label: '暴击', icon: '🎯', value: (stats.crit * 100).toFixed(1) + '%', sources: `基础 ${(t.base.crit * 100).toFixed(0)}% · 星级词条 · 装备 ${(eq.crit * 100).toFixed(1)}%` },
    { label: '暴伤', icon: '💥', value: (stats.critDmg * 100).toFixed(0) + '%', sources: `基础 ${(t.base.critDmg * 100).toFixed(0)}% · 进化加成` },
    { label: '减伤', icon: '🧿', value: (stats.dr * 100).toFixed(1) + '%', sources: `基础 ${(t.base.dr * 100).toFixed(0)}% · 星级/装备/羁绊` },
    { label: '命中', icon: '🎯', value: (stats.hit * 100).toFixed(1) + '%', sources: `种族基础 ${(t.base.hit * 100).toFixed(0)}%` },
    { label: '闪避', icon: '🌫️', value: (stats.dodge * 100).toFixed(1) + '%', sources: `种族基础 ${(t.base.dodge * 100).toFixed(0)}%` }
  ];
  const shared = [];
  if (star > 1) shared.push(`星级 ${star}★`);
  if (codex.allPct) shared.push(`图鉴 +${Math.round(codex.allPct * 100)}%`);
  if (intimacyPct) shared.push(`亲密 +${intimacyPct}%`);
  if (bond.hpPct || bond.atkPct || bond.defPct || bond.spdPct || bond.crit) shared.push('羁绊加成');
  if (eq.hpPct || eq.atkPct || eq.spdPct) shared.push('装备词条');
  for (const row of rows) row.shared = shared.join(' · ') || '无额外全属性来源';
  return { stats, rows };
}

function pickMob(element, elite) {
  const arr = MOB_DEFS.filter(m => m.element === element && !!m.elite === !!elite);
  if (arr.length) return pick(arr);
  const fallback = MOB_DEFS.filter(m => !!m.elite === !!elite);
  return pick(fallback.length ? fallback : MOB_DEFS);
}

function createEnemyFormation(powerTarget, options = {}) {
  const count = clamp(Math.floor(num(options.count, 3)), 1, 5);
  const targetPower = Math.max(250, num(powerTarget, 1000));
  const level = clamp(Math.floor(num(options.level, 5 + targetPower / 850)), 3, 99);
  const lineup = [];
  if (Array.isArray(options.lineup)) for (const id of options.lineup) if (PET_MAP[id] && lineup.length < count) lineup.push(id);
  let guard = 0;
  while (lineup.length < count && guard++ < 20) {
    const preferred = PETS.filter(p => p.element === options.element && !templateHasHeal(p));
    const fallback = PETS.filter(p => p.element === options.element);
    const source = preferred.length ? preferred : (fallback.length ? fallback : enemyPetPool());
    lineup.push(pick(source).id);
  }
  const artFor = (i) => {
    const isB = !!options.boss && i === 0;
    if (isB && options.bossDef) {
      return { artKind: 'boss', artId: options.bossDef.id, element: options.bossDef.element, name: options.bossDef.name, emoji: options.bossDef.emoji };
    }
    if (!isB) {
      const m = pickMob(options.element, options.type === 'elite');
      return { artKind: 'mob', artId: m.id, element: m.element, name: m.name, emoji: m.emoji };
    }
    return {};
  };
  const raw = lineup.slice(0, count).map((id, i) => {
    const art = artFor(i);
    return makeEnemyRuntime(id, level, i, {
      row: i < 2 ? 'front' : 'back',
      star: options.star || 1,
      evo: options.evo || 0,
      elite: options.type === 'elite',
      boss: !!options.boss && i === 0,
      isBoss: !!options.boss && i === 0,
      artKind: art.artKind || null,
      artId: art.artId || null,
      element: art.element || undefined,
      name: art.name || options.name || ((options.boss && i === 0) ? options.bossName : null),
      emoji: art.emoji || options.emoji || ((options.boss && i === 0) ? options.bossEmoji : null)
    });
  });
  const rawPower = Math.max(100, sum(raw.map(u => calcPower(u))));
  const scale = clamp(targetPower * (options.powerFactor || 0.95) / rawPower, 0.12, 25);
  raw.forEach((unit, i) => {
    const boss = !!options.boss && i === 0;
    const bdef = options.bossDef || null;
    const bs = options.bossScale || 1;
    const bossHp = boss ? (bdef ? bdef.hpMult * bs : (options.bossHpMult || 3.0) * bs) : 1;
    const bossAtk = boss ? (bdef ? bdef.atkMult * bs : 1.20 * bs) : 1;
    const bossDefMult = boss ? (bdef ? bdef.defMult * bs : 1.25 * bs) : 1;
    unit.maxHp = Math.max(80, Math.round(unit.maxHp * scale * bossHp));
    unit.hp = unit.maxHp;
    unit.atk = Math.max(12, Math.round(unit.atk * scale * bossAtk));
    unit.def = Math.max(6, Math.round(unit.def * scale * bossDefMult));
    unit.spd = Math.round(unit.spd * 10) / 10;
    if (boss) {
      if (bdef && bdef.spd) unit.spd = Math.round(bdef.spd * 10) / 10;
      unit.dr = clamp(unit.dr + (bdef ? 0.07 : 0.08), 0, 0.75);
      // 有几张阶段立绘就有几条命：第 2 条命换 p2、第 3 条换 p3。
      // 总血量不变，按命数切成几条血条 —— 打三遍等于打一条更长的血，难度不额外膨胀。
      const lifeN = bossLivesOf(bdef ? bdef.id : null);
      unit.lives = lifeN;
      unit.lifeLeft = lifeN;
      if (lifeN > 1) { unit.maxHp = Math.max(80, Math.round(unit.maxHp / lifeN)); unit.hp = unit.maxHp; }
    }
  });
  // 缩放只作用于 hp/atk/def，速度与暴击不随缩放变化，所以上面一次缩放算出来的战力会偏（人数少的关偏低、多的偏高）。
  // 这里按真实战力再校 2~3 次，保证每关敌人数值都和关卡目标战力对得上，难度曲线才是顺的。
  const wantPower = targetPower * (options.powerFactor || 0.95);
  for (let pass = 0; pass < 3; pass++) {
    const got = sum(raw.map(u => calcPower(u)));
    if (!got || Math.abs(got / wantPower - 1) < 0.02) break;
    const k = clamp(wantPower / got, 0.5, 2);
    raw.forEach(u => {
      u.maxHp = Math.max(80, Math.round(u.maxHp * k));
      u.hp = u.maxHp;
      u.atk = Math.max(12, Math.round(u.atk * k));
      u.def = Math.max(6, Math.round(u.def * k));
    });
  }
  return raw;
}

function buildDailyBossEnemy() {
  const info = getDailyBossInfo();
  const template = PETS.find(p => p.element === info.element && !templateHasHeal(p)) || PETS.find(p => p.element === info.element) || pick(PETS);
  const allyPower = Math.max(1600, calcTeamPower());
  const team = getTeamPets();
  const ctx = teamContextForState();
  const teamStats = team.map(p => getPetStats(p, ctx));
  const avgAtk = teamStats.length ? sum(teamStats.map(s => s.atk)) / teamStats.length : 120;
  const avgDef = teamStats.length ? sum(teamStats.map(s => s.def)) / teamStats.length : 60;
  const level = info.level;
  const def = BOSS_MAP[info.bossId] || BOSS_DEFS[0];
  // 三条命共 3.6×战力：一次挑战（12 回合）差不多打掉一条命，三次挑战正好走完三个阶段
  const totalHp = Math.max(9000, Math.round(allyPower * 3.6));
  return {
    uid: 'enemy-boss',
    petUid: null,
    side: 'enemy',
    templateId: template.id,
    artKind: 'boss',
    artId: info.bossId,
    name: info.name,
    emoji: info.emoji,
    element: info.element,
    rarity: 'UR',
    row: 'front',
    level,
    maxHp: totalHp,
    hp: totalHp,
    atk: Math.max(180, Math.round(avgAtk * 1.5)),
    def: Math.max(80, Math.round(avgDef * 2.2)),
    spd: def.spd || 24,
    crit: 0.14,
    critDmg: 0.65,
    dr: 0.32,
    hit: 0.04,
    dodge: 0.01,
    lifesteal: 0,
    rage: 0,
    alive: true,
    shield: 0,
    shieldTurns: 0,
    buffs: [],
    dots: [],
    hots: [],
    cooldowns: { 1: 0, 2: 0 },
    reviveUsed: false,
    shiny: false,
    isBoss: true,
    raidBoss: true,
    lives: bossLivesOf(info.bossId),
    lifeLeft: bossLivesOf(info.bossId),
    maxHp: Math.round(totalHp / bossLivesOf(info.bossId)),
    hp: Math.round(totalHp / bossLivesOf(info.bossId)),
    skills: enemySkillSlots('boss', info.bossId, info.element) || template.skills.map((id, i) => ({ def: SKILLS[id], level: 2, index: i }))
  };
}

// Boss 置顶血条：仅当敌方存在首领时渲染；低血量切“激愤”纯表现提示，不改变任何战斗机制与数值
function bossBarHTML(battle) {
  const boss = battle.enemies.find(u => u.isBoss);
  if (!boss) return '';
  return `<div class="boss-bar" id="bossBar"><div class="bb-head"><span class="bb-emo">${esc(boss.emoji)}</span><span class="bb-name">👹 ${esc(boss.name)}</span><span class="bb-pct" id="bossBarPct"></span></div><div class="bb-track"><i class="bb-fill" id="bossBarFill"></i></div></div>`;
}
function syncBossBar() {
  const b = UI.battle;
  if (!b) return;
  const bar = $('#bossBar');
  if (!bar) return;
  const boss = b.enemies.find(u => u.isBoss);
  if (!boss) { bar.style.display = 'none'; return; }
  bar.style.display = '';
  const p = clamp(boss.hp / Math.max(1, boss.maxHp) * 100, 0, 100);
  const fill = $('#bossBarFill');
  const pct = $('#bossBarPct');
  if (fill) fill.style.width = p + '%';
  if (pct) pct.textContent = Math.ceil(p) + '%';
  bar.classList.toggle('enraged', boss.alive && p <= 30);
  syncBossArtPhase(b, boss);
}
// Boss 跨过 67% / 34% 时换阶段立绘：只换表现，不碰任何数值
function syncBossArtPhase(battle, boss) {
  if (!boss || boss.artKind !== 'boss' || !boss.artId) return;
  const phase = (boss.artId && bossLivesOf(boss.artId) > 1) ? bossUnitPhase(boss) : bossPhaseOf((boss.hp || 0) / Math.max(1, boss.maxHp || 1));
  if (boss._artPhase === phase) return;
  const first = boss._artPhase === undefined;
  boss._artPhase = phase;
  if (first) return;
  const el = getBattleUnitEl(boss.uid);
  if (el) el.dataset.bossPhase = String(phase);
  const wrap = el ? el.querySelector('.b-emoji-wrap') : null;
  const html = enemyArtFrame(boss);
  if (wrap && html) {
    wrap.innerHTML = html;
    petAnimDecorate();
    el.classList.remove('hit-flash');
    void el.offsetWidth;
    el.classList.add('hit-flash');
  }
  pushBattleLog(battle, phase === 3 ? '👹 ' + boss.name + ' 气息骤变，进入濒死爆发形态！' : '👹 ' + boss.name + ' 激愤了，形态发生变化！');
}

/* -------- 战斗开场 -------- */
function startBattle(config) {
  // 上一场若是异常中断（没有计时器、over 仍为 false），不再永久挡住新战斗
  if (UI.battle && !UI.battle.over && UI.battle.timer) return false;
  UI.battle = null;
  const battleRoot = document.getElementById('battleRoot');
  if (battleRoot) battleRoot.className = 'battle-layer open';
  const bail = (msg) => { if (battleRoot) battleRoot.className = 'battle-layer'; if (msg) toast(msg, 'bad'); return false; };
  const allies = buildAllyBattleTeam();
  // 羁绊合体：同队凑齐一组羁绊（双宠）时，双方开战自带怒气、攻防小加成，战报里点名喊话
  let bondCombo = null;
  if (allies.length >= 2) {
    bondCombo = BONDS.find(b => b.pets.length === 2 && b.pets.every(id => allies.some(a => a.templateId === id))) || null;
    if (bondCombo) {
      for (const a of allies) {
        if (bondCombo.pets.indexOf(a.templateId) < 0) continue;
        a.rage = Math.min(100, num(a.rage, 0) + 30);
        a.atk = Math.round(a.atk * 1.10);
        a.def = Math.round(a.def * 1.06);
        a.bondCombo = bondCombo.id;
      }
    }
  }
  if (!allies.length) return bail('还没有上阵宠物，先去宠物页安排队伍吧');
  let enemies = Array.isArray(config.enemies) && config.enemies.length ? config.enemies : null;
  if (!enemies) {
    enemies = createEnemyFormation(config.enemyPower || 1000, config.enemyOptions || {});
  }
  if (!enemies.length) return bail('这一关没有可出战的敌人，稍后重试');
  const battle = {
    config: { ...config },
    allies,
    enemies,
    round: 0,
    queue: [],
    idx: 0,
    over: false,
    finished: false,
    outcome: '',
    win: false,
    stars: 0,
    speed: 1,
    earlyUltUsed: false,
    paused: false,
    focusUid: null,
    manualSkill: {},
    timer: null,
    log: [],
    totalDamage: 0,
    perf: { allies: {} },
    silent: false,
    maxRounds: config.maxRounds || (config.mode === 'boss' ? 12 : 30),
    startedAt: Date.now()
  };
  UI.battle = battle;
  pushBattleLog(battle, `⚔️ ${config.title || '战斗'} 开始！`);
  pushBattleLog(battle, `我方 ${allies.length} 名伙伴登场，对方 ${enemies.length} 名敌人。`);

    const layers = [scrim, "url('" + (bgArt.scenes || [])[0] + "')", "url('art/battle-field.jpg')"];

function renderBattleLog() {
  const b = UI.battle;

  el.innerHTML = lines.map((line, i) => {

    return `<div class="log-${kind}${last}">${esc(text)}</div>`;
  }).join('');
  el.classList.remove('idle');
  clearTimeout(b.logIdleTimer);
  b.logIdleTimer = setTimeout(() => { if (!el.classList.contains('expanded')) el.classList.add('idle'); }, 2800);
