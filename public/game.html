.hunger-row{display:flex;gap:8px;margin-top:8px}
.hunger-col{flex:1}
.hunger-col .bar-label{font-size:9px;margin-bottom:2px}
.hunger-col .progress{height:5px}
.codex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:9px}
.codex-card{border:1px solid rgba(237,219,197,.95);border-radius:16px;padding:10px;background:linear-gradient(160deg,#fffdf8,#fff6ea);text-align:center;position:relative;min-height:146px;transition:transform .2s;box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 4px 12px rgba(151,118,84,.07)}
.codex-card:hover{transform:translateY(-2px)}
.codex-card.locked{background:#f7f1e8;border-color:#e9ddcd}
.codex-card.locked .codex-emoji{filter:grayscale(1) brightness(.42);opacity:.38}
.codex-emoji{position:relative;font-size:41px;line-height:1.15;margin-top:5px;display:grid;place-items:center;min-height:48px}
.codex-img{position:absolute;inset:0;margin:auto;width:46px;height:46px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px rgba(255,255,255,.85),0 3px 8px rgba(151,118,84,.16)}
.codex-card.locked .codex-emoji::after{content:"?";position:absolute;left:50%;top:38px;transform:translateX(-50%);font-size:20px;color:#8a7765;font-weight:800;filter:none}
.codex-card h4{margin:4px 0 2px;font-size:12px}
.codex-card p{margin:0;font-size:9px;color:var(--muted);line-height:1.45;min-height:25px}
.codex-card .codex-state{font-size:9px;margin-top:5px}
.bond-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px}
.bond-card{border:1px solid #ecdac5;border-radius:15px;padding:11px;background:#fffaf2}
.bond-card.active{border-color:#a8ddc8;background:linear-gradient(140deg,#f2fbf7,#e8f8f1)}
.bond-card.activated{border-color:#d8c8ef;background:linear-gradient(140deg,#faf7ff,#f1eafe)}
.bond-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bond-head b{font-size:12px}
.bond-card p{font-size:10px;color:var(--muted);margin:4px 0 0}
.bond-card .bond-quote{font-style:italic;color:#9a6ea8;margin-top:3px!important}
.bond-pets{font-size:16px;letter-spacing:2px}
/* 羁绊图鉴卡：成员立绘并排同框行；有图显图、无图由调用方回退 emoji，纯展示不影响数值 */
.bond-mates{display:flex;gap:5px;align-items:center;margin:6px 0 3px}
.bond-mate-face{width:30px;height:30px;border-radius:50%;overflow:hidden;border:1.5px solid #f3d9ee;background:#fdf3d8;flex:0 0 auto}
.bond-mate-face .art-emoji{font-size:17px}
.bond-mate-emoji{font-size:21px;line-height:1;flex:0 0 auto;filter:drop-shadow(0 1px 1px rgba(0,0,0,.06))}
.bag-res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:8px}
.bag-res{padding:10px;border:1px solid #efddc8;border-radius:13px;background:#fffaf2;display:flex;align-items:center;gap:7px}
.bag-res .ico{font-size:20px}
.bag-res b{display:block;font-size:13px;font-variant-numeric:tabular-nums}
.bag-res span{font-size:9.5px;color:var(--muted)}
.eq-list{display:flex;flex-direction:column;gap:8px}
.eq-row{display:flex;align-items:center;gap:9px;border:1px solid #efddc8;border-radius:14px;padding:9px 10px;background:#fffaf3;flex-wrap:wrap}
.eq-icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:21px;background:var(--rarity-soft,#f5eee4);border:1px solid color-mix(in srgb,var(--rarity,#ccc) 40%,white);flex:0 0 auto}
.eq-info{flex:1;min-width:130px}
.eq-info b{font-size:12px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.eq-affix{font-size:9.5px;color:var(--muted);margin-top:2px}
.eq-actions{display:flex;gap:5px;flex-wrap:wrap}
.equip-slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.equip-slot{border:1px dashed #e7d3ba;border-radius:13px;padding:9px;background:#fffaf2;min-height:71px;position:relative}
.equip-slot.filled{border-style:solid;border-color:var(--rarity,#e1cfba)}
.equip-slot .slot-label{font-size:9px;color:var(--muted)}
.equip-slot b{font-size:11.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.equip-slot .eq-mini{font-size:8.5px;color:var(--muted)}
.equip-slot button{position:absolute;right:5px;bottom:5px}
.skill-row{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px dashed #f0dfcb}
.skill-row:last-child{border-bottom:0}
.skill-ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;background:#fff1dd;border:1px solid #f0d8b7;flex:0 0 auto}
.skill-row.ult .skill-ico{background:#f0e8ff;border-color:#d8c4f4}
.skill-row.active .skill-ico{background:#eaf8f1;border-color:#c5e9da}
.skill-info{flex:1;min-width:0}
.skill-info b{font-size:12px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.skill-info p{margin:2px 0 0;font-size:10px;color:var(--muted);line-height:1.5}
.skill-lv{font-size:9px;background:#fff0da;border-radius:6px;padding:1px 5px;color:#a47537}

/* ---------- 冒险 / 关卡 ---------- */
.chapter-strip{display:flex;gap:7px;overflow-x:auto;padding:5px 2px 10px;scrollbar-width:none}
.chapter-strip::-webkit-scrollbar{display:none}
.chapter-pill{flex:0 0 auto;border:1px solid #ecd8c0;background:#fffaf2;border-radius:14px;padding:7px 11px;display:flex;gap:7px;align-items:center;font-size:11px;color:var(--ink-soft);transition:.18s}
.chapter-pill .ch-emoji{font-size:17px}
.chapter-pill.active{background:linear-gradient(130deg,#fff0d7,#ffdcd2);border-color:#f0bfac;color:var(--ink);box-shadow:0 5px 14px rgba(210,160,125,.16);transform:translateY(-1px)}
.chapter-pill.locked{opacity:.55}
.chapter-banner{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 17px;border-radius:20px;background:linear-gradient(120deg,#fff3df,#ffe6dd 55%,#f1eaff);border:1px solid #f0d9c6;margin-bottom:12px;flex-wrap:wrap;position:relative;overflow:hidden}
.chapter-banner .ch-large{font-size:40px;line-height:1}
.chapter-banner h2{margin:0;font-size:18px}
.chapter-banner p{margin:3px 0 0;font-size:11px;color:var(--muted);max-width:620px}
.team-power-line{display:flex;align-items:center;gap:7px;font-size:11px;flex-wrap:wrap}
.stage-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:9px}
.stage-card{
  border:1.5px solid #eddbc6;border-radius:17px;padding:11px;background:linear-gradient(155deg,#fffdfa,#fff5e9);position:relative;transition:.2s;
}
.stage-card:hover{transform:translateY(-2px);box-shadow:0 9px 18px rgba(151,118,84,.1)}
.stage-card.locked{opacity:.52;filter:grayscale(.3);background:#f8f2ea}
.stage-card.cleared{border-color:#cbeada;background:linear-gradient(155deg,#fbfffc,#eefaf4)}
.stage-card.next{border-color:#f3bea8;box-shadow:0 0 0 2px rgba(255,183,163,.14)}
.stage-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.stage-no{font-size:11px;font-weight:800;color:var(--ink-soft)}
.stage-type{font-size:9px;color:var(--muted);background:#fff4e3;border-radius:6px;padding:2px 5px}
.stage-emoji{font-size:30px;margin:6px 0 2px;line-height:1}
.stage-name{font-size:12px;font-weight:800}
.stage-meta{font-size:9.5px;color:var(--muted);margin-top:2px}
.stage-card .stage-actions{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.stage-card .stars-display{font-size:12px;letter-spacing:2px;color:#f1b53d}
.stage-card .stars-display .off{color:#dbcdbd}
.dungeon-card{display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.dungeon-orb{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:28px;background:linear-gradient(145deg,#fff0ca,#ffd9b4);border:1px solid #f0cfaa;flex:0 0 auto}
.dungeon-info{flex:1;min-width:170px}
.dungeon-info b{font-size:14px}
.dungeon-info p{margin:2px 0 0;font-size:10.5px;color:var(--muted)}

/* ---------- 对战 ---------- */
.mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.mode-card{padding:17px;border-radius:22px;border:1px solid #ecd9c2;background:linear-gradient(150deg,#fffdf8,#fff6e9);box-shadow:var(--shadow);position:relative;overflow:hidden}
.mode-card::after{content:"";position:absolute;width:95px;height:95px;border-radius:50%;background:rgba(255,255,255,.4);right:-30px;top:-30px;pointer-events:none}
.mode-card.tower{background:linear-gradient(150deg,#fff7e8,#ffe7d5)}
.mode-card.arena{background:linear-gradient(150deg,#f4f9ff,#e5f1fd)}
.mode-card.boss{background:linear-gradient(150deg,#fff0f2,#ffdce1)}
.mode-card.encounter{background:linear-gradient(150deg,#f5f1ff,#e9e0ff)}
.mode-head{display:flex;align-items:center;gap:9px;position:relative;z-index:1}
.mode-icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:23px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.8);box-shadow:var(--shadow-soft)}
.mode-head h3{margin:0;font-size:15px}
.mode-head p{margin:1px 0 0;font-size:10px;color:var(--muted)}
.mode-body{margin-top:11px;position:relative;z-index:1}
.mode-stat-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;margin-top:6px;color:var(--ink-soft);flex-wrap:wrap}
.mode-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.tier-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:10px;font-size:11px;font-weight:800;color:#60408b;background:linear-gradient(140deg,#f0e7ff,#dfd0fa);border:1px solid #d4c1f2}
.opponent-list{display:flex;flex-direction:column;gap:7px;margin-top:9px}
.opp-card{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:12px;background:rgba(255,255,255,.62);border:1px solid rgba(195,218,237,.7);flex-wrap:wrap}
.opp-card .opp-info{flex:1;min-width:100px}
.opp-card b{font-size:11px;display:block}
.opp-card .opp-pets{font-size:14px;letter-spacing:0}
.opp-card .opp-meta{font-size:9px;color:var(--muted)}
.opp-card .opp-power{font-size:10px;color:#577a97;font-weight:700;white-space:nowrap}
.leaderboard{display:flex;flex-direction:column;gap:5px;margin-top:9px}
.lb-row{display:flex;align-items:center;gap:7px;font-size:10.5px;padding:5px 7px;border-radius:9px;background:rgba(255,255,255,.55)}
.lb-row.me{background:linear-gradient(90deg,#fff2cf,#ffe3cf);font-weight:800;border:1px solid #f3cda2}
.lb-rank{width:20px;text-align:center;font-weight:800;color:#b48c5b}
.lb-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-score{font-variant-numeric:tabular-nums;color:#9a6342}
.encounter-event{text-align:center;padding:7px 4px 2px}
.encounter-event .big-emoji{font-size:48px;display:inline-block;animation:floaty 3s ease-in-out infinite}
.encounter-event h4{margin:4px 0 2px;font-size:14px}
.encounter-event p{font-size:10.5px;color:var(--muted);margin:0 auto;max-width:390px;line-height:1.55}
.encounter-history{display:flex;flex-direction:column;gap:5px;margin-top:9px}
.encounter-history .hist{font-size:10px;color:var(--muted);border-left:2px solid #e2cff5;padding-left:7px}

/* ---------- 商店 / 抽蛋 ---------- */
.shop-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.gacha-banner{
  padding:18px;border-radius:23px;position:relative;overflow:hidden;border:1px solid #f1d4b7;
  background:linear-gradient(145deg,#fff6df,#ffe8d2 57%,#ffd9e0);box-shadow:var(--shadow);
}
.gacha-banner.rare{background:linear-gradient(145deg,#f3f3ff,#e5dcff 52%,#d9e9ff);border-color:#d7c9f4}
.gacha-banner::before{content:"";position:absolute;right:-20px;bottom:-35px;width:160px;height:160px;background:radial-gradient(circle,rgba(255,255,255,.7),transparent 70%);border-radius:50%}
.gacha-head{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.gacha-emoji{font-size:40px;filter:drop-shadow(0 5px 3px rgba(116,82,52,.15));animation:wiggle 4s ease-in-out infinite}
.gacha-head h3{margin:0;font-size:17px}
.gacha-head p{margin:2px 0 0;font-size:10.5px;color:var(--muted)}
.rate-table{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:12px 0;position:relative;z-index:1}
.rate-cell{border-radius:10px;padding:5px 3px;text-align:center;font-size:9.5px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.8)}
.rate-cell b{display:block;font-size:12px}
.pull-actions{display:flex;gap:7px;flex-wrap:wrap;position:relative;z-index:1}
.pull-actions .btn{flex:1;min-width:118px}
.last-pulls{margin-top:12px}
.last-pulls .pull-row{display:flex;gap:5px;flex-wrap:wrap}
.mini-loot{width:37px;height:43px;border-radius:10px;background:rgba(255,255,255,.7);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:21px;position:relative}
.mini-loot .mini-rarity{position:absolute;bottom:-1px;font-size:7px;font-weight:800;color:var(--rarity)}
.exchange-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:9px}
.exchange-card{border:1px solid #eddbc7;border-radius:16px;background:#fffaf2;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.exchange-card .ex-emoji{font-size:31px;width:45px;text-align:center;flex:0 0 auto}
.exchange-card .ex-info{flex:1;min-width:110px}
.exchange-card .ex-info b{font-size:11.5px;display:block}
.exchange-card .ex-info p{font-size:9px;color:var(--muted);margin:1px 0 0}
.exchange-card .ex-btn{flex:0 0 auto}
.cosmetic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.cosmetic-card{border:1px solid #eedcc6;border-radius:17px;padding:13px;background:linear-gradient(145deg,#fffdf8,#fff6e9);text-align:center}
.cosmetic-preview{height:72px;border-radius:12px;display:grid;place-items:center;font-size:38px;margin-bottom:7px;background:linear-gradient(145deg,#ffeed2,#f8dcc4);border:1px solid #f0d9bd}
.cosmetic-preview.starry{background:linear-gradient(145deg,#48426e,#6e6197);color:#fff}
.cosmetic-preview.sakura{background:linear-gradient(145deg,#ffe4ef,#f6cbdc)}
.cosmetic-preview.forest{background:linear-gradient(145deg,#dff5e7,#b8e5cc)}
.cosmetic-card b{font-size:12px}
.cosmetic-card p{font-size:9.5px;color:var(--muted);margin:2px 0 6px}

/* ---------- 任务 / 成就 ---------- */
.task-list{display:flex;flex-direction:column;gap:8px}
.task-row{display:flex;align-items:center;gap:10px;border:1px solid #efddc9;border-radius:14px;padding:9px 11px;background:#fffaf3;flex-wrap:wrap}
.task-row .task-icon{width:35px;height:35px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:#fff1df;border:1px solid #f0d9bc;flex:0 0 auto}
.task-row .task-main{flex:1;min-width:150px}
.task-row .task-main b{font-size:12px}
.task-row .task-main p{margin:1px 0 3px;font-size:9.5px;color:var(--muted)}
.task-row .task-reward{font-size:9.5px;color:var(--muted);white-space:nowrap}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:8px}
.ach-card{display:flex;gap:9px;padding:10px;border-radius:14px;border:1px solid #eedcc7;background:#fffaf3;align-items:center;flex-wrap:wrap}
.ach-card.done{background:linear-gradient(140deg,#f6fffb,#e8f9f0);border-color:#c8eadd}
.ach-card.claimed{opacity:.7;background:#f8f3eb}
.ach-icon{width:37px;height:37px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:linear-gradient(145deg,#fff0cd,#ffdfaa);border:1px solid #f0d09b;flex:0 0 auto}
.ach-body{flex:1;min-width:130px}
.ach-body b{font-size:11.5px;display:block}
.ach-body p{font-size:9.5px;color:var(--muted);margin:1px 0 3px;line-height:1.45}
.ach-progress{display:flex;justify-content:space-between;font-size:8.5px;color:var(--muted);margin-bottom:2px}
.ach-reward{font-size:8.5px;color:#a47431}
.ach-actions{flex:0 0 auto}
.sign-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.sign-card{border:1px solid #ecd9c1;border-radius:13px;padding:8px 4px;text-align:center;background:#fffaf2;position:relative;min-height:114px;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.sign-card.day{background:linear-gradient(150deg,#fff6e0,#ffe7d0);border-color:#f0cfab;box-shadow:0 4px 12px rgba(226,181,129,.13)}
.sign-card.claimed{background:linear-gradient(150deg,#f1fbf5,#e4f7ed);border-color:#c4e8d8;opacity:.85}
.sign-card .sign-day{font-size:9px;color:var(--muted)}
.sign-card .sign-gift{font-size:25px;line-height:1.1}
.sign-card .sign-reward{font-size:8px;color:#927553;line-height:1.3}
.sign-card .sign-state{font-size:7.5px;color:#bd9b74}
.sign-card.big{transform:scale(1.02);border-color:#f0b98f}
.frame-grid{display:flex;gap:7px;flex-wrap:wrap}
.frame-choice{width:48px;height:48px;border-radius:50%;position:relative;display:grid;place-items:center;font-size:22px;border:2px solid transparent;background:#fff;transition:.2s}
.frame-choice.active{border-color:#a78ada;box-shadow:0 0 0 3px rgba(167,138,218,.16);transform:scale(1.06)}
.frame-choice span{position:absolute;inset:-3px;border-radius:50%;z-index:-1;background:conic-gradient(from 0deg,#ffadad,#ffd6a5,#fdffb6,#caffbf,#9bf6ff,#bdb2ff)}
.frame-choice.frame-mint span{background:linear-gradient(135deg,#a8e6cf,#dcedc1,#fff)}
.frame-choice.frame-peach span{background:linear-gradient(135deg,#ffb7b2,#ffdac1,#ffe6a9)}
.frame-choice.frame-star span{background:linear-gradient(135deg,#ffe66d,#ffb86c,#ff8fb1)}
.frame-choice.frame-moon span{background:linear-gradient(135deg,#cdb4db,#9fb8f8,#e0c3fc)}
.frame-choice.frame-rainbow span{background:conic-gradient(from 0deg,#ffadad,#ffd6a5,#fdffb6,#caffbf,#9bf6ff,#bdb2ff)}

/* ---------- 弹窗 ---------- */
.modal-layer{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(75,57,43,.28);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.modal-layer.open{display:flex;animation:fadeIn .2s ease}
.modal{
  width:min(720px,96vw);max-height:88vh;overflow:hidden;background:linear-gradient(160deg,#fffdf9,#fff9ef);
  border:1px solid rgba(255,255,255,.8);border-radius:26px;box-shadow:0 30px 80px rgba(75,53,36,.24);
  display:flex;flex-direction:column;animation:modalPop .3s cubic-bezier(.2,.9,.3,1.15);
}
.modal.wide{width:min(920px,96vw)}
.modal.narrow{width:min(440px,95vw)}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 12px;border-bottom:1px solid #f4e5d2}
.modal-head h2{margin:0;font-size:18px;line-height:1.3}
.modal-head p{margin:3px 0 0;font-size:11px;color:var(--muted)}
.modal-close{width:31px;height:31px;flex:0 0 auto;border-radius:11px;border:1px solid #ecd9c4;background:#fff7ec;color:#a9886d;display:grid;place-items:center;font-size:15px;line-height:1}
.modal-close:hover{background:#ffeadf;color:#8b5c45}
.modal-body{padding:16px 20px 20px;overflow-y:auto}
.modal-body::-webkit-scrollbar{width:6px}
.modal-body::-webkit-scrollbar-thumb{background:#e5cfb6;border-radius:9px}
body.modal-open{overflow:hidden}
.confirm-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.modal-section{margin:14px 0}
.modal-section:first-child{margin-top:0}
.modal-section h3{font-size:13px;margin:0 0 7px}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed #f0dfcd;flex-wrap:wrap}
.settings-row:last-child{border-bottom:0}
.settings-row .sr-info{flex:1;min-width:150px}
.settings-row b{font-size:12px}
.settings-row p{font-size:9.5px;color:var(--muted);margin:1px 0 0}
.faq-item{border-bottom:1px dashed #efdec9;padding:7px 0}
.faq-item summary{cursor:pointer;font-size:11.5px;font-weight:700;color:var(--ink-soft)}
.faq-item p{font-size:10.5px;color:var(--muted);margin:4px 0 0;line-height:1.65}
.stat-detail-table{width:100%;border-collapse:collapse;font-size:11px}
.stat-detail-table th,.stat-detail-table td{padding:6px 5px;border-bottom:1px dashed #f0dfca;text-align:left;vertical-align:top}
.stat-detail-table th{font-size:9.5px;color:var(--muted);font-weight:500}
.stat-detail-table td b{font-variant-numeric:tabular-nums}
.source-badges{display:flex;gap:3px;flex-wrap:wrap}
.source-badges .chip{font-size:8px;padding:1px 5px}

/* ---------- 成就 / 抽卡结果 ---------- */
.result-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin-top:12px}
.loot-card{border-radius:14px;padding:8px 4px;background:linear-gradient(160deg,#fffdf8,var(--rarity-soft,#f7f0e6));border:1.5px solid color-mix(in srgb,var(--rarity,#ccc) 55%,white);text-align:center;position:relative;min-height:104px;animation:lootPop .35s cubic-bezier(.2,.9,.3,1.2) both}
.loot-card .loot-emoji{font-size:30px;line-height:1.2;margin-top:4px}
.loot-card .loot-name{font-size:9px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.loot-card .loot-note{font-size:8px;color:var(--muted);margin-top:1px}
.loot-card .new-badge{position:absolute;top:-6px;right:-3px;font-size:7px;font-weight:800;color:#fff;background:#f5a06d;border-radius:6px;padding:1px 4px;box-shadow:0 2px 4px rgba(205,127,70,.2)}
.loot-card.ssr{box-shadow:0 0 0 2px rgba(255,193,105,.35),0 6px 18px rgba(239,167,67,.18)}
.ssr-burst{position:relative}
.ssr-burst::before{content:"";position:absolute;inset:-30px;background:conic-gradient(from 0deg,transparent,rgba(255,212,118,.5),transparent,rgba(177,145,244,.36),transparent);border-radius:50%;animation:spinSlow 3.5s linear infinite;z-index:-1;pointer-events:none}
.gacha-result-note{margin-top:10px;text-align:center;font-size:10px;color:var(--muted)}
.guarantee-tag{display:inline-flex;font-size:8px;background:#ffe7bb;color:#a57425;border-radius:5px;padding:1px 4px;margin-left:3px;font-weight:800}

/* ---------- 战斗世界观 ---------- */
.battle-layer{position:fixed;inset:0;z-index:120;display:none;background:linear-gradient(180deg,rgba(255,250,242,.84),rgba(255,240,224,.82) 46%,rgba(246,231,240,.86)),radial-gradient(circle at 50% 14%,rgba(255,250,240,.92),rgba(232,217,239,.96)),url('art/battle-field.jpg') center/cover no-repeat;overflow-y:auto}
.battle-layer.open{display:block;animation:fadeIn .2s ease}
/* 章节主题换肤：只改变叠加渐变色调，底图 art/battle-field.jpg 保持一致 */
.battle-layer.theme-pink{background:linear-gradient(180deg,rgba(255,236,241,.85),rgba(255,213,228,.83) 46%,rgba(244,222,237,.87)),radial-gradient(circle at 50% 14%,rgba(255,246,248,.9),rgba(238,205,225,.94)),url('art/battle-field.jpg') center/cover no-repeat}
.battle-layer.theme-mint{background:linear-gradient(180deg,rgba(235,250,247,.85),rgba(214,243,238,.83) 46%,rgba(226,244,232,.87)),radial-gradient(circle at 50% 14%,rgba(244,253,251,.9),rgba(196,232,224,.94)),url('art/battle-field.jpg') center/cover no-repeat}
.battle-layer.theme-honey{background:linear-gradient(180deg,rgba(255,248,226,.86),rgba(255,236,196,.83) 46%,rgba(250,238,214,.87)),radial-gradient(circle at 50% 14%,rgba(255,252,238,.92),rgba(238,214,160,.93)),url('art/battle-field.jpg') center/cover no-repeat}
.battle-layer.theme-night{background:linear-gradient(180deg,rgba(38,40,74,.72),rgba(48,44,86,.70) 46%,rgba(62,52,96,.74)),radial-gradient(circle at 50% 14%,rgba(88,82,140,.55),rgba(30,30,64,.82)),url('art/battle-field.jpg') center/cover no-repeat}
.battle-layer.theme-sky{background:linear-gradient(180deg,rgba(232,246,255,.85),rgba(208,236,252,.83) 46%,rgba(224,240,250,.87)),radial-gradient(circle at 50% 14%,rgba(244,251,255,.92),rgba(190,224,246,.93)),url('art/battle-field.jpg') center/cover no-repeat}
.battle-layer.theme-fire{background:linear-gradient(180deg,rgba(255,238,226,.84),rgba(255,214,190,.82) 46%,rgba(248,224,208,.86)),radial-gradient(circle at 50% 14%,rgba(255,246,236,.9),rgba(238,178,142,.9)),url('art/battle-field.jpg') center/cover no-repeat}
.battle-layer.theme-star{background:linear-gradient(180deg,rgba(234,249,252,.85),rgba(214,240,245,.83) 46%,rgba(226,244,248,.87)),radial-gradient(circle at 50% 14%,rgba(246,253,254,.92),rgba(188,226,236,.93)),url('art/battle-field.jpg') center/cover no-repeat}
.battle-layer.theme-rainbow{background:linear-gradient(180deg,rgba(250,240,255,.85),rgba(244,224,250,.83) 46%,rgba(250,230,240,.87)),radial-gradient(circle at 50% 14%,rgba(255,246,255,.91),rgba(226,200,240,.93)),url('art/battle-field.jpg') center/cover no-repeat}
.battle-layer.theme-peak{background:linear-gradient(180deg,rgba(238,244,250,.85),rgba(218,232,244,.83) 46%,rgba(228,238,246,.87)),radial-gradient(circle at 50% 14%,rgba(248,251,255,.91),rgba(196,214,232,.93)),url('art/battle-field.jpg') center/cover no-repeat}
.battle-story{font-size:11px;color:#7a6a58;background:rgba(255,251,244,.84);border-left:3px solid #e6c88f;border-radius:8px;padding:6px 10px;margin:6px 2px 0;line-height:1.5;font-style:italic}
.battle-layer.theme-night .battle-story{color:#d8d4f2;background:rgba(48,48,92,.62);border-left-color:#9b8fe0}
.battle-story.boss-taunt{font-style:normal;color:#8a4a3c;background:rgba(255,240,235,.92);border-left-color:#e8927c;font-weight:600}
.result-story{font-size:12px;color:#8a6f52;font-style:italic;text-align:center;margin:6px 18px 2px;line-height:1.5}
.battle-shell{min-height:100%;max-width:1180px;margin:0 auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:10px}
.battle-top{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap;position:sticky;top:0;z-index:5;background:rgba(255,250,241,.78);backdrop-filter:blur(12px);padding:9px 10px;border-radius:17px;border:1px solid rgba(255,255,255,.8);box-shadow:0 6px 20px rgba(129,96,68,.1),inset 0 1px 0 rgba(255,255,255,.7)}
.battle-title{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800}
.battle-title small{font-size:9px;font-weight:400;color:var(--muted);display:block}
.battle-rounds{font-size:10px;color:var(--muted);background:#fff7e9;border:1px solid var(--line);border-radius:999px;padding:4px 8px;white-space:nowrap}
.battle-controls{display:flex;gap:5px;flex-wrap:wrap}
.battle-controls .btn{padding:6px 9px;font-size:10.5px;border-radius:10px;box-shadow:0 2px 0 rgba(180,149,118,.12)}
.battle-field{display:grid;grid-template-columns:1fr 44px 1fr;gap:8px;align-items:stretch;min-height:340px;flex:1;position:relative}
.b-side{display:flex;flex-direction:column;justify-content:center;gap:7px;position:relative;padding:8px;border-radius:21px;background:rgba(255,255,255,.30);border:1px solid rgba(255,255,255,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.b-side.enemy{background:rgba(255,236,240,.32)}
.b-side-label{font-size:9px;letter-spacing:1.5px;color:#8d7865;text-align:center;margin-bottom:2px;font-weight:800}
.b-side-label .power{font-weight:500;color:var(--muted);letter-spacing:0}
.b-team{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.b-team.enemy-team{grid-template-columns:repeat(2,minmax(0,1fr))}
.b-row{display:contents}
.b-unit{
  border-radius:15px;padding:7px 6px;background:rgba(255,253,248,.9);border:1.5px solid #ecdac4;
  position:relative;min-width:0;transition:opacity .3s, filter .3s, transform var(--b-return,.2s);box-shadow:0 5px 12px rgba(137,102,71,.09),inset 0 1px 0 rgba(255,255,255,.85);
  --b-lunge:.12s;--b-cast:.18s;--b-return:.2s;--b-fall:.62s
}
.b-unit.front{border-color:#f0bfa9;background:linear-gradient(160deg,#fffdf8,#fff3e5)}
.b-unit.back{border-color:#d8d2ed;background:linear-gradient(160deg,#fffdf8,#f6f2ff)}
.b-unit.rarity-R{border-color:#d8c28c}
.b-unit.rarity-SR{border-color:#c6a3e8;box-shadow:0 6px 14px rgba(150,120,200,.16),inset 0 1px 0 rgba(255,255,255,.9)}
.b-unit.rarity-SSR{border-color:#f0c05a;box-shadow:0 7px 16px rgba(226,166,80,.24),0 0 0 1px rgba(240,192,90,.35),inset 0 1px 0 rgba(255,255,255,.9)}
.b-unit .b-top{display:flex;justify-content:space-between;align-items:flex-start;gap:3px}
.b-unit .b-role{font-size:7px;background:#fff0db;color:#a67b4d;padding:1px 4px;border-radius:5px}
.b-unit .b-lv{font-size:7.5px;color:var(--muted)}
.b-emoji-wrap{position:relative;text-align:center;line-height:1;padding:2px 0 3px;font-size:31px;min-height:37px;display:flex;align-items:center;justify-content:center}
.b-emoji{display:inline-block;transition:transform .15s;filter:drop-shadow(0 4px 3px rgba(85,61,41,.16))}
.b-unit .b-name{font-size:9px;font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-unit .b-el{font-size:7px;text-align:center;color:var(--muted);margin-bottom:3px}
.b-unit .bar{margin-top:3px}
.b-unit .bar-label{font-size:7px;margin-bottom:1px}
.b-unit .progress{height:5px}
.b-unit .progress.rage{height:4px}
.b-unit .rage-fill{background:linear-gradient(90deg,#ffd784,#ffb463);box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.b-unit .b-hp-fill{background:linear-gradient(90deg,#a7e6c8,#6cc7a2);box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.b-unit .shield-label{position:absolute;right:4px;top:17px;font-size:7px;color:#73a9c7}
.b-buffs{position:absolute;left:4px;bottom:4px;display:flex;gap:2px;flex-wrap:wrap;font-size:8px;pointer-events:none}
.b-unit.dead{opacity:.3;filter:grayscale(1);transform:scale(.94)}
.b-unit.dead .b-emoji{transform:rotate(80deg);opacity:.5}
.b-unit.hit-flash .b-emoji{animation:hitFlash .32s ease}
.b-unit.damage-shake{animation:shake .34s ease}
/* ===== 第一梯队表现层：出手动作 / 受击 / 闪避 / 死亡 / 行动光圈 / 施法横幅 ===== */
.b-unit.attack-forward{transition:transform var(--b-lunge,.12s) cubic-bezier(.2,.9,.3,1.2),opacity .3s,filter .3s;z-index:5}
.b-side.ally .b-unit.attack-forward{transform:translateX(7px)}
.b-side.enemy .b-unit.attack-forward{transform:translateX(-7px)}
.b-unit.cast-raise{transition:transform var(--b-cast,.18s) cubic-bezier(.2,.9,.3,1.2),opacity .3s,filter .3s;z-index:5}
.b-side.ally .b-unit.cast-raise{transform:translate(10px,-5px)}
.b-side.enemy .b-unit.cast-raise{transform:translate(-10px,-5px)}
.b-unit.cast-raise::before,.b-unit.ult-lunge::before{
  content:"";position:absolute;inset:-4px;border-radius:18px;z-index:-1;pointer-events:none;
  background:radial-gradient(circle at 50% 34%,rgba(255,213,136,.5),rgba(255,213,136,0) 72%);
}
.b-unit.ult-lunge{transition:transform var(--b-cast,.18s) cubic-bezier(.2,.9,.3,1.2),opacity .3s,filter .3s;z-index:6}
.b-side.ally .b-unit.ult-lunge{transform:translate(14px,-7px) scale(1.05)}
.b-side.enemy .b-unit.ult-lunge{transform:translate(-14px,-7px) scale(1.05)}
.b-unit.hit-recoil .b-emoji-wrap{animation:bHitRecoil .34s cubic-bezier(.2,.9,.3,1.2) both}
.b-side.enemy .b-unit.hit-recoil .b-emoji-wrap{animation-name:bHitRecoilR}
.b-unit.dodge-out .b-emoji-wrap{animation:bDodgeOut .5s cubic-bezier(.2,.8,.3,1) both}
.b-side.enemy .b-unit.dodge-out .b-emoji-wrap{animation-name:bDodgeOutR}
.b-unit.death-fall{animation:bDeathFall var(--b-fall,.62s) cubic-bezier(.35,0,.55,1) both;pointer-events:none}
.b-unit.death-fall .b-emoji{transform:none;animation:none}
.b-emoji{animation:bBattleBreathe 2.7s ease-in-out infinite}
.b-unit.boss-unit:not(.hit-flash):not(.dead) .b-emoji{animation-name:bBattleBreatheBoss;animation-duration:3.1s}
.b-unit.dead .b-emoji{animation:none}
.b-unit.active-turn{z-index:4;box-shadow:0 0 0 2px rgba(245,187,110,.5),0 6px 16px rgba(214,147,89,.18)}
.b-unit.active-turn::after{
  content:"";position:absolute;left:50%;bottom:-5px;width:64%;height:11px;border-radius:50%;
  transform:translateX(-50%);pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,201,118,.92),rgba(255,201,118,0));
  animation:bTurnRing 1.15s ease-in-out infinite;
}
.b-skill-banner{
  position:absolute;left:50%;top:-3px;z-index:15;display:flex;align-items:center;gap:3px;white-space:nowrap;
  padding:2px 7px;border-radius:999px;background:rgba(255,250,241,.97);border:1px solid #f0d2ad;
  box-shadow:0 4px 12px rgba(150,110,70,.18);font-size:8.5px;font-weight:800;color:#8a5a3a;pointer-events:none;
  animation:bSkillBanner 1s ease-out both;
}
.b-skill-banner .skill-tag{font-size:7px;font-weight:800;color:#a0683d;background:#ffeac9;border-radius:5px;padding:0 3px}
/* 2 倍速下所有战斗过渡 / 动效时长减半 */
.battle-layer.speed-2 .b-unit{--b-lunge:.06s;--b-cast:.09s;--b-return:.1s;--b-fall:.31s}
.battle-layer.speed-2 .float-num{animation-duration:.55s}
.battle-layer.speed-2 .b-skill-banner{animation-duration:.55s}
.battle-layer.speed-2 .b-unit.hit-flash .b-emoji{animation-duration:.16s}
.battle-layer.speed-2 .b-unit.damage-shake{animation-duration:.17s}
.battle-layer.speed-2 .b-unit.hit-recoil .b-emoji-wrap{animation-duration:.17s}
.battle-layer.speed-2 .b-unit.dodge-out .b-emoji-wrap{animation-duration:.25s}
.battle-layer.speed-2 .b-unit.active-turn::after{animation-duration:.58s}
.battle-layer.speed-2 .ult-flash.active{animation-duration:.45s}
@media (prefers-reduced-motion:reduce){
  .b-emoji,.b-unit.boss-unit .b-emoji,.b-unit.active-turn::after,.b-unit.hit-recoil .b-emoji-wrap,
  .b-unit.dodge-out .b-emoji-wrap,.b-unit.death-fall,.b-skill-banner,.ult-flash.active{animation:none!important}
}
.b-vs{display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;color:#c29a73;text-shadow:0 2px 0 #fff}
.b-vs::before,.b-vs::after{content:"";display:block;width:1px;height:44px;background:linear-gradient(transparent,#ddc6ad,transparent);position:absolute}
.b-vs{position:relative}
.float-num{position:absolute;left:50%;top:5px;transform:translateX(-50%);font-size:15px;font-weight:900;pointer-events:none;z-index:12;white-space:nowrap;animation:floatUp 1s ease-out both;text-shadow:0 1px 0 #fff,0 2px 5px rgba(0,0,0,.1);font-variant-numeric:tabular-nums}
.float-num.dmg{color:#d95b50}
.float-num.crit{color:#e2512f;font-size:21px}
.float-num.crit-tag{color:#e2512f;font-size:10px;font-weight:900;top:24px;letter-spacing:.5px}
.float-num.heal{color:#2f9b75}
.float-num.miss{color:#8c857c;font-size:11px}
.float-num.buff{color:#7c62b5;font-size:10px}
.float-num.effect{font-size:9px;color:#a65ca2;top:-4px}
.float-num.elem-strong{color:#dd7a24;font-size:9.5px;font-weight:800;top:-7px}
.float-num.elem-weak{color:#7d95a8;font-size:9.5px;top:-7px}
.float-num.shield{color:#3b8cb8;font-size:11px}
.float-num.dodge{color:#8c857c;font-size:11px;letter-spacing:1px}
/* ===== 表现补强：血条/怒气条平滑、后排纵深、持续效果与充能飘字、状态角标 ===== */
.b-unit .b-hp-fill,.b-unit .b-rage-fill{transition:width .26s ease}
.b-unit.back:not(.dead){margin-top:6px;opacity:.95;filter:saturate(.94)}
.float-num.dot{color:#d2602e;font-size:10px;font-weight:800}
.float-num.hot{color:#2f9b75;font-size:10px;font-weight:800}
.float-num.energy{color:#e0a334;font-size:10px;font-weight:800}
.b-buffs .mark-dot{color:#d2602e}
.b-buffs .mark-hot{color:#2f9b75}
.b-buffs .mark-buff-up{color:#2f9b75;font-weight:700}
.b-buffs .mark-buff-down{color:#c05a5a;font-weight:700}
.b-buffs .mark-focus{color:#e08a2e;font-weight:800}
.b-queue{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:4px 2px 0}
.b-q-chip{font-size:10px;padding:2px 8px;border-radius:999px;background:#f3eee7;color:#6b5a48;border:1px solid #e7dccb;white-space:nowrap}
.b-q-chip.ally{background:#e8f6ee;color:#2e7b5f;border-color:#bfe6cf}
.b-q-chip.enemy{background:#fdecec;color:#a84f4f;border-color:#f4c8c8}
.b-q-chip.now{outline:2px solid #f0b45f;font-weight:800}
.b-q-chip.empty{background:transparent;color:var(--muted);border-style:dashed}
.b-unit.focus-target{outline:2px solid #f0b45f;box-shadow:0 0 12px rgba(240,180,95,.4)}
.b-unit.heal-ring{animation:healRingPulse .62s ease}
@keyframes healRingPulse{0%{box-shadow:0 0 0 0 rgba(94,205,143,.55)}100%{box-shadow:0 0 0 14px rgba(94,205,143,0)}}
.b-unit.crit-impact{animation:critImpactPulse .34s ease}
@keyframes critImpactPulse{0%{transform:scale(1)}40%{transform:scale(1.13)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){
  .b-unit .b-hp-fill,.b-unit .b-rage-fill{transition:none}
}
.battle-log{min-height:68px;border-radius:16px;padding:9px 11px;background:rgba(255,253,248,.82);border:1px solid rgba(255,255,255,.85);font-size:10px;color:var(--ink-soft);display:flex;flex-direction:column;gap:2px;max-height:100px;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 12px rgba(151,118,84,.06)}
.battle-log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.8}
.battle-log div:first-child{opacity:1;font-weight:700}
.battle-log div.log-last{opacity:1;font-weight:800;background:rgba(255,229,196,.55);border-radius:7px;padding:1px 5px;box-shadow:inset 0 0 0 1px rgba(240,205,160,.45)}
.battle-log div.log-damage{color:#b8503f}
.battle-log div.log-heal{color:#2f8f6c}
.battle-log div.log-buff{color:#6d5aa8}
.battle-log div.log-skill{color:#8a5a9c}
.battle-log div.log-ult{color:#c0791f;font-weight:700}
.battle-log div.log-ctrl{color:#8a7458}
.battle-log div.log-death{color:#5f5148;font-style:italic}
.battle-log div.log-round{color:#9b8a78}
.battle-log div.log-result{color:#a2632d;font-weight:700}
.battle-result{display:none;position:fixed;inset:0;z-index:130;background:rgba(75,57,43,.3);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:16px}
.battle-result.open{display:flex;animation:fadeIn .2s}
.result-box{width:min(520px,95vw);max-height:92vh;overflow:auto;background:linear-gradient(160deg,#fffdf8,#fff7ea);border:1px solid #fff;border-radius:26px;padding:22px;box-shadow:0 30px 80px rgba(75,53,36,.24);text-align:center;animation:modalPop .32s cubic-bezier(.2,.9,.3,1.2)}
.result-box h2{font-size:24px;margin:7px 0 3px}
.result-box .result-sub{font-size:11px;color:var(--muted);margin:0}
.result-emoji{font-size:53px;line-height:1.1;animation:celebrate 1.3s ease-in-out infinite}
.result-stars{font-size:31px;letter-spacing:6px;color:#f3b94d;margin:5px 0 2px;text-shadow:0 2px 0 #fff}
.result-stars .off{color:#e1d3c2;text-shadow:none}
.result-rewards{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:13px 0 4px}
.result-rewards .reward-chip{font-size:10px;padding:5px 9px;border-radius:10px;background:#fff8ea;border:1px solid #efdfc8}
.result-note{font-size:10px;color:var(--muted);margin:8px 0 0;line-height:1.6}
.result-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:15px}
.ult-flash{position:fixed;inset:0;z-index:125;pointer-events:none;opacity:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;transition:opacity .16s}
.ult-flash.active{opacity:1;animation:ultFlash .9s ease both;background:radial-gradient(circle at center,rgba(255,255,255,.9),rgba(255,164,138,.6) 40%,transparent 70%)}
.ult-flash.ssr{background:radial-gradient(circle at center,rgba(255,255,255,.95),rgba(255,206,117,.6) 35%,rgba(176,136,235,.4) 58%,transparent 76%)}
.ult-flash .ult-name{font-size:22px;font-weight:900;color:#7b4e6c;text-shadow:0 2px 0 #fff,0 0 30px #fff}
.ult-flash .ult-rays{position:absolute;width:460px;height:460px;border-radius:50%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.55),transparent 20%,rgba(255,255,255,.55),transparent 40%);animation:spinSlow 1.2s linear infinite;opacity:.7}
/* ---------- 进化闪光横幅（全局，复用大招闪光语言，pointer-events 不挡操作） ---------- */
.evo-flash{position:fixed;inset:0;z-index:130;pointer-events:none;opacity:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;transition:opacity .18s}
.evo-flash.active{opacity:1;animation:evoFlash 1.5s ease both;background:radial-gradient(circle at center,rgba(255,255,255,.95),rgba(255,214,128,.55) 34%,rgba(190,150,240,.32) 56%,transparent 76%)}
.evo-flash .evo-rays{position:absolute;width:440px;height:440px;border-radius:50%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.55),transparent 18%,rgba(255,238,190,.5),transparent 38%);animation:spinSlow 1.4s linear infinite;opacity:.75}
.evo-flash .evo-name{position:relative;font-size:24px;font-weight:900;color:#8a5a2b;text-shadow:0 2px 0 #fff,0 0 34px #fff;letter-spacing:1px}
.evo-flash .evo-stage{position:relative;font-size:13px;font-weight:800;color:#a86a22;background:rgba(255,255,255,.74);padding:4px 16px;border-radius:999px;box-shadow:0 4px 18px rgba(200,150,60,.25)}
@keyframes evoFlash{0%{opacity:0;transform:scale(.92)}14%{opacity:1;transform:scale(1)}78%{opacity:.9}100%{opacity:0;transform:scale(1.04)}}
.battle-empty{text-align:center;padding:20px;font-size:12px;color:var(--muted)}

/* ---------- 新手引导 / Toast ---------- */
#tutorialRoot{position:fixed;right:22px;bottom:22px;z-index:80;width:min(330px,calc(100vw - 28px));pointer-events:none}
.tutorial-card{
  pointer-events:auto;background:linear-gradient(155deg,#fffdf8,#fff4e2);border:1px solid #f0d6b9;
  border-radius:21px;box-shadow:0 18px 50px rgba(130,93,59,.2);padding:15px;position:relative;animation:tourIn .38s cubic-bezier(.2,.9,.3,1.2);
}
.tutorial-card::before{content:"";position:absolute;right:0;top:0;width:60px;height:60px;border-radius:0 21px 0 40px;background:linear-gradient(145deg,#ffe7a9,#ffd0c2);opacity:.5}
.tutorial-card .tour-tag{font-size:9px;font-weight:800;letter-spacing:1px;color:#b27846}
.tutorial-card h3{margin:3px 0 3px;font-size:14px;position:relative;z-index:1}
.tutorial-card p{margin:0;font-size:10.5px;color:var(--muted);line-height:1.55}
.tutorial-card .tour-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tutorial-card .tour-dots{display:flex;gap:4px;margin-top:8px}
.tour-dot{width:15px;height:4px;border-radius:99px;background:#efdfcd}
.tour-dot.done{background:#f0b67e}.tour-dot.current{background:#f08e79}
.toast-root{position:fixed;left:50%;bottom:94px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:5px;align-items:center;pointer-events:none;width:max-content;max-width:90vw}
.toast{font-size:11.5px;padding:8px 14px;border-radius:12px;background:rgba(83,64,50,.9);color:#fff;box-shadow:0 8px 22px rgba(63,45,32,.2);animation:toastIn .28s cubic-bezier(.2,.9,.3,1.2);backdrop-filter:blur(8px);text-align:center}
.toast.good{background:rgba(52,132,101,.93)}
.toast.bad{background:rgba(172,77,74,.93)}
.toast.gold{background:rgba(169,124,42,.94)}
.toast.out{animation:toastOut .24s ease forwards}

/* ---------- 补充组件 ---------- */
.input{
  min-width:0;width:180px;max-width:100%;border:1.5px solid #e8d3b9;border-radius:11px;
  padding:8px 10px;background:#fffdf8;color:var(--ink);font:inherit;font-size:12px;outline:0;
  transition:border-color .18s, box-shadow .18s;
}
.input:focus{border-color:#e7ad8d;box-shadow:0 0 0 3px rgba(240,164,128,.12)}
textarea.input{width:100%;resize:vertical;line-height:1.55}
.modal-x{
  width:31px;height:31px;flex:0 0 auto;border-radius:11px;border:1px solid #ecd9c4;background:#fff7ec;
  color:#a9886d;display:grid;place-items:center;font-size:17px;line-height:1;cursor:pointer;
}
.modal-x:hover{background:#ffeadf;color:#8b5c45}
.modal-actions-row{display:flex;justify-content:flex-end;align-items:center;gap:7px;flex-wrap:wrap;margin-top:14px}
.modal-actions-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:6px;margin-top:12px}
.modal-actions-grid .btn{min-width:0}
.modal-h3{font-size:13px;margin:16px 0 7px}
.warning-box{
  border:1px solid #f0c9c4;background:linear-gradient(150deg,#fff5f2,#ffeae5);border-radius:15px;
  padding:13px 14px;color:#8a514b;
}
.warning-box b{font-size:13px}
.warning-box p{font-size:10.5px;line-height:1.65;margin:5px 0 0;color:#a26961}
.settings-section{margin:14px 0 17px}
.settings-section:first-child{margin-top:0}
.settings-section h3{font-size:13px;margin:0 0 6px}
.compare-table{display:flex;flex-direction:column;gap:5px;font-size:11px}
.compare-table > div{display:flex;justify-content:space-between;gap:8px;padding:7px 9px;border-radius:9px;background:#fffaf2;border:1px solid #f2e0cb}
.compare-table b{color:#a3733d;font-variant-numeric:tabular-nums}
.faq-list details{padding:8px 0;border-bottom:1px dashed #efdec9}
.faq-list details:last-child{border-bottom:0}
.faq-list summary{cursor:pointer;font-size:11.5px;font-weight:700;color:var(--ink-soft);list-style:none}
.faq-list summary::-webkit-details-marker{display:none}
.faq-list summary::before{content:"＋";display:inline-block;width:16px;color:#c29a73;font-weight:400}
.faq-list details[open] summary::before{content:"－"}
.faq-list p{font-size:10.5px;color:var(--muted);margin:5px 0 0 16px;line-height:1.7}
.save-box{min-height:96px;font-family:ui-monospace,Consolas,monospace;font-size:10px}

/* 头像框选择 */
.frame-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(154px,1fr));gap:9px}
.frame-card{
  border:1.5px solid #eedcc6;border-radius:15px;padding:11px;background:linear-gradient(150deg,#fffdf8,#fff6e9);
  display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;
}
.frame-card.active{border-color:#c8b2ea;background:linear-gradient(150deg,#fbf8ff,#f0e9ff);box-shadow:0 0 0 2px rgba(167,138,218,.12)}
.frame-card.locked{opacity:.62}
.frame-card b{font-size:11.5px}
.frame-card p{font-size:9px;color:var(--muted);margin:0;line-height:1.45;min-height:26px}
.frame-preview{
  width:57px;height:57px;border-radius:50%;display:grid;place-items:center;font-size:25px;
  background:#fff6e8;border:2px solid #fff;box-shadow:0 0 0 3px #f0dcc4,0 5px 12px rgba(143,105,71,.12);
}
.frame-preview.frame-peach{box-shadow:0 0 0 3px #ffcdb5,0 5px 12px rgba(255,160,130,.16)}
.frame-preview.frame-mint{box-shadow:0 0 0 3px #b9ead6,0 5px 12px rgba(91,191,154,.16)}
.frame-preview.frame-star{box-shadow:0 0 0 3px #ffe08a,0 5px 12px rgba(240,180,60,.18)}
.frame-preview.frame-moon{box-shadow:0 0 0 3px #cdbcf0,0 5px 12px rgba(149,120,211,.17)}
.frame-preview.frame-rainbow{box-shadow:0 0 0 3px transparent;background:linear-gradient(#fff6e8,#fff6e8) padding-box,conic-gradient(from 0deg,#ffadad,#ffd6a5,#fdffb6,#caffbf,#9bf6ff,#bdb2ff) border-box;border:3px solid transparent}
.frame-pill{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:#fff9ef;border:1px solid #f0ddc6;box-shadow:0 4px 10px rgba(140,104,70,.1)}

/* 成就 */
.achievement-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.achievement-card{
  display:flex;gap:9px;padding:10px;border-radius:15px;border:1px solid #eedcc7;background:#fffaf3;
  align-items:center;flex-wrap:wrap;transition:.18s;
}
.achievement-card.ready{background:linear-gradient(140deg,#fffaf0,#fff1df);border-color:#f0d09b}
.achievement-card.claimed{opacity:.68;background:#f8f3eb}
.achievement-card .ach-info{flex:1;min-width:135px}
.achievement-card .ach-info b{font-size:11.5px;display:block}
.achievement-card .ach-info p{font-size:9.5px;color:var(--muted);margin:1px 0 3px;line-height:1.45}
.achievement-card .btn{flex:0 0 auto}

/* 七日签到 */
.signin-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.signin-card{
  border:1px solid #ecd9c1;border-radius:13px;padding:8px 4px;text-align:center;background:#fffaf2;
  min-height:122px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;position:relative;
}
.signin-card .day{font-size:9px;color:var(--muted)}
.signin-card .signin-icons{font-size:21px;line-height:1.2;display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.signin-card .reward-text{font-size:7.5px;color:#927553;line-height:1.3}
.signin-card .stamp{font-size:7.5px;color:#bd9b74;border:1px dashed #dfc8ab;border-radius:5px;padding:1px 4px}
.signin-card.today{background:linear-gradient(150deg,#fff6e0,#ffe7d0);border-color:#f0cfab;box-shadow:0 4px 12px rgba(226,181,129,.13)}
.signin-card.claimed{background:linear-gradient(150deg,#f1fbf5,#e4f7ed);border-color:#c4e8d8;opacity:.85}
.signin-card.today .stamp{background:#ffb98a;color:#fff;border-color:#ffb98a}

/* 抽蛋 */
.gacha-banners{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-bottom:13px}
.gacha-banner{display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.banner-art{position:relative;flex:0 0 auto;width:85px;height:92px;display:grid;place-items:center}
.egg-big{font-size:58px;line-height:1;filter:drop-shadow(0 8px 5px rgba(115,83,54,.16));animation:wiggle 5s ease-in-out infinite}
.banner-art .spark{position:absolute;color:#f1b23d;font-size:13px;animation:sparkle 1.7s infinite}
.banner-art .spark.s1{left:9px;top:12px}
.banner-art .spark.s2{right:4px;bottom:18px;animation-delay:.7s}
.banner-info{flex:1;min-width:190px;position:relative;z-index:1}
.banner-info h2{font-size:18px;margin:3px 0 2px}
.banner-info p{font-size:10px;color:var(--muted);margin:0;line-height:1.5}
.rate-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.rarity-rate{font-size:9px;border-radius:7px;padding:3px 6px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.8);color:var(--muted)}
.rarity-rate b{font-size:9.5px;color:var(--rarity)}
.last-pulls{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.last-pull{
  width:43px;min-height:53px;border-radius:10px;background:linear-gradient(160deg,#fffdf8,var(--rarity-soft,#f7f0e6));
  border:1px solid color-mix(in srgb,var(--rarity,#ccc) 45%,white);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:4px 2px;font-size:21px;line-height:1.05;
}
.last-pull small{font-size:6.5px;color:var(--muted);white-space:nowrap}
.shop-item{
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:11px;
  border:1px solid #efddc7;border-radius:15px;background:#fffaf2;
}
.shop-item b{font-size:11px}
.shop-item p{font-size:9px;color:var(--muted);margin:0;line-height:1.4}
.shop-ico{font-size:25px;line-height:1.15}
.stone-shop{background:linear-gradient(155deg,#fffdf8,var(--el-soft,#f7f2eb));border-color:color-mix(in srgb,var(--el-color,#ccc) 25%,white)}
.exchange-emoji{font-size:30px;width:42px;text-align:center;flex:0 0 auto}
.exchange-info{flex:1;min-width:108px}
.exchange-info b{font-size:11.5px;display:block}
.exchange-info p{font-size:9px;color:var(--muted);margin:2px 0 0;line-height:1.5}
.exchange-actions{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.cos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.cos-preview{
  height:84px;border-radius:13px;display:grid;place-items:center;font-size:37px;margin-bottom:7px;
  background:linear-gradient(150deg,#ffeed2,#f8dcc4);border:1px solid #f0d9bd;position:relative;overflow:hidden;
}
.cos-preview.acc-preview{background:linear-gradient(150deg,#fff4e9,#ffe7ef)}
.cos-preview.bg-seaside{background:linear-gradient(165deg,#bfe8fb 0%,#e7f6ff 46%,#f7e2b8 47%,#efcf94 100%)}
.cos-preview.bg-autumn{background:linear-gradient(165deg,#ffe3bd 0%,#f8cd8f 48%,#eda85f 100%)}
.cos-preview.bg-seaside,.cos-preview.bg-autumn{font-size:34px}
.cos-preview .acc-emoji,.cos-preview span{position:absolute;right:12px;top:9px;font-size:20px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.1))}
.cos-info b{font-size:11.5px}
.cos-info p{font-size:9px;color:var(--muted);margin:2px 0 6px;line-height:1.45}
.cos-actions{display:flex;justify-content:center;gap:5px;flex-wrap:wrap}
.cosmetic-card.locked{opacity:.82}
.cosmetic-card.active{border-color:#b8e2ce;background:linear-gradient(150deg,#f8fffb,#eefaf4)}

/* 竞技场 / Boss 榜单 */
.arena-opponents{display:flex;flex-direction:column;gap:6px}
.arena-opponent{
  display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:11px;
  background:rgba(255,255,255,.6);border:1px solid rgba(195,218,237,.7);flex-wrap:wrap;
}
.opp-rank{width:18px;text-align:center;font-size:10px;font-weight:800;color:#9db2c3}
.arena-opponent .opp-info{flex:1;min-width:110px;display:flex;flex-direction:column;gap:1px}
.arena-opponent .opp-info b{font-size:11px}
.arena-opponent .opp-info span{font-size:9px;color:var(--muted)}
.boss-board{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.board-row{display:flex;align-items:center;gap:6px;font-size:10px;padding:4px 6px;border-radius:8px;background:rgba(255,255,255,.55)}
.board-row.me{background:linear-gradient(90deg,#fff2cf,#ffe3cf);font-weight:800;border:1px solid #f3cda2}
.board-rank{width:18px;text-align:center;font-weight:800;color:#b48c5b}
.board-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board-score{font-variant-numeric:tabular-nums;color:#9a6342}
.reward-chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}

/* 宠物弹窗 */
.pet-modal-hero{
  display:flex;gap:13px;align-items:center;padding:12px;border-radius:17px;
  background:linear-gradient(145deg,#fffaf0,var(--rarity-soft,#f7f0e6));border:1px solid color-mix(in srgb,var(--rarity,#ccc) 35%,white);
}
.pet-modal-avatar{position:relative;font-size:58px;line-height:1;flex:0 0 auto;filter:drop-shadow(0 7px 5px rgba(105,75,48,.14))}
.pet-modal-avatar em{position:absolute;left:50%;top:-9px;transform:translateX(-50%);font-style:normal;font-size:24px}
.pet-modal-avatar .spark{position:absolute;font-size:13px;color:#f4bd42;animation:sparkle 1.5s infinite}
.pet-modal-avatar .spark.s1{left:-6px;top:3px}.pet-modal-avatar .spark.s2{right:-5px;top:26px;animation-delay:.5s}
.pet-modal-id{flex:1;min-width:0}
.pet-modal-id h2{font-size:20px;margin:0}
.pet-modal-id p{font-size:10px;color:var(--muted);margin:4px 0 0}
.pet-care-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:11px 0}
.care{background:#fffaf2;border:1px solid #f0deca;border-radius:11px;padding:7px 8px}
.care > span{display:block;font-size:9px;color:var(--muted);margin-bottom:3px}
.pet-stat-panel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:10px 0}
.stat-cell{background:#fffaf3;border:1px solid #f0dfca;border-radius:10px;padding:6px 7px;text-align:center}
.stat-cell small{display:block;font-size:8.5px;color:var(--muted)}
.stat-cell b{font-size:12px;font-variant-numeric:tabular-nums}
.pet-stat-panel .btn{grid-column:span 4;justify-self:center}
.pet-equip-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.pet-equip-list .equip-slot{display:flex;flex-direction:column;gap:2px;min-height:82px}
.pet-equip-list .equip-slot .slot-ico{font-size:18px}
.pet-equip-list .equip-slot p{font-size:8px;color:var(--muted);margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pet-equip-list .equip-slot > .flex{margin-top:auto;justify-content:flex-end}
.pet-equip-list .equip-slot > button{position:static;align-self:flex-end}
.skill-list{display:flex;flex-direction:column}
.rename-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.flavor-text{font-size:10px;color:var(--muted);line-height:1.65;background:#fffaf2;border:1px dashed #efdcc6;border-radius:10px;padding:8px 10px}
.stat-source-list{display:flex;flex-direction:column;gap:6px}
.stat-source-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 10px;border-radius:11px;background:#fffaf2;border:1px solid #f1dfcb;font-size:10.5px}
.stat-source-label{color:var(--muted)}
.stat-source-row b{font-variant-numeric:tabular-nums;color:#a3733d}
.stat-source-row p{grid-column:1 / -1;margin:2px 0 0;font-size:9px;color:var(--muted);line-height:1.5}
.mini-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))!important}

/* 投喂 */
.feed-hero{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:15px;
  background:linear-gradient(145deg,#fff7ea,#ffece3);border:1px solid #f4d7c4;
}
.feed-pet{font-size:48px;line-height:1;animation:floaty 3s ease-in-out infinite}
.feed-hero h3{font-size:15px;margin:0}
.feed-hero p{font-size:10px;color:var(--muted);margin:2px 0 0}
.feed-options{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.feed-option{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:12px;background:#fffaf3;border:1px solid #f0deca;flex-wrap:wrap}
.feed-option b{font-size:11px}
.feed-option p{font-size:9px;color:var(--muted);margin:1px 0 0}
.feed-game{text-align:center;padding:4px 0}
.feed-game-pet{font-size:66px;line-height:1;position:relative;display:inline-block;filter:drop-shadow(0 8px 6px rgba(113,79,50,.16));transition:transform .12s}
.feed-game-pet.bounce{animation:tapBounce .3s ease}
.feed-game h3{font-size:15px;margin:5px 0 2px}
.feed-game > p{font-size:10px;color:var(--muted);margin:0 auto;max-width:390px;line-height:1.6}
.feed-game-progress{display:flex;align-items:center;gap:9px;margin:11px auto;max-width:360px}
.feed-game-progress .progress{flex:1;height:11px}
.feed-game-progress > b{font-size:10px;color:#a3733d;white-space:nowrap}
.feed-game-btn{
  width:min(360px,100%);border:0;border-radius:17px;padding:14px;font:inherit;font-size:15px;font-weight:800;color:#70422c;
  background:linear-gradient(145deg,#ffe4bc,#ffc9b8);box-shadow:0 6px 0 #efb197,0 12px 22px rgba(203,131,95,.2);cursor:pointer;
  transition:transform .12s,box-shadow .12s;
}
.feed-game-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #efb197}
.feed-game-result{text-align:center;padding:8px 2px}
.feed-game-result h3{font-size:19px;margin:5px 0 4px}
.feed-game-result p{font-size:10.5px;color:var(--muted);line-height:1.6}
.feed-game-result .reward-chips{margin:11px 0}
.feed-game-result .btn{max-width:330px;margin:0 auto}
.heart-pop{position:absolute;z-index:6;font-size:20px;pointer-events:none;animation:heartPop 1s ease-out forwards}
.feed-drop{position:absolute;left:50%;top:4px;font-size:21px;pointer-events:none;animation:dropFall .6s ease-in forwards}

/* 离线收益 */
.offline-hero{text-align:center;padding:2px 0 5px}
.offline-moon{font-size:54px;line-height:1.05;display:inline-block;animation:floaty 3.4s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(120,98,150,.2))}
.offline-hero h3{font-size:17px;margin:3px 0 2px}
.offline-hero p{font-size:10px;color:var(--muted);margin:0}
.offline-time{display:inline-flex;align-items:center;gap:5px;margin-top:7px;font-size:10.5px;font-weight:800;color:#8d70b3;background:#f3edff;border:1px solid #e0d3f6;border-radius:999px;padding:4px 10px}
.offline-rewards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0 10px}
.offline-reward{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:13px;background:linear-gradient(145deg,#fff8eb,#ffeade);border:1px solid #f2d9c2}
.offline-reward > span{font-size:25px}
.offline-reward small{display:block;font-size:9px;color:var(--muted)}
.offline-reward b{font-size:16px;color:#a3733d;font-variant-numeric:tabular-nums}
.offline-detail{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin:9px 0}
.offline-detail > div{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:8px;background:#fffaf2;border:1px solid #f2e0cb;font-size:9.5px;color:var(--muted)}
.offline-detail b{color:var(--ink-soft)}
.offline-rewards + .note{margin-top:4px}
.main-pet-emoji{display:inline-block;line-height:1}

/* 轮回 */
.rebirth-hero{
  display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;
  background:linear-gradient(140deg,#f8f2ff,#eee4ff 55%,#fff1f3);border:1px solid #e1d0f4;
}
.rebirth-vortex{font-size:47px;line-height:1;flex:0 0 auto;animation:spinSlow 9s linear infinite;filter:drop-shadow(0 5px 8px rgba(129,99,180,.2))}
.rebirth-hero h3{font-size:14px;margin:0 0 2px;color:#715390}
.rebirth-hero p{font-size:10px;color:#8d779f;margin:0;line-height:1.55}
.rebirth-upgrades{display:flex;flex-direction:column;gap:7px}
.rebirth-upgrade{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:12px;background:#fffaf3;border:1px solid #f0decb;flex-wrap:wrap}
.rebirth-ico{width:37px;height:37px;border-radius:11px;display:grid;place-items:center;font-size:20px;background:#f4ecff;border:1px solid #dfd1f4;flex:0 0 auto}
.rebirth-info{flex:1;min-width:150px}
.rebirth-info b{font-size:11px;display:block}
.rebirth-info p{font-size:9px;color:var(--muted);margin:1px 0 2px;line-height:1.45}
.rebirth-upgrade .btn{flex:0 0 auto}

/* 奇遇选择 */
.encounter-choices{display:flex;flex-direction:column;gap:7px;margin:10px 0}
.encounter-choice{
  width:100%;text-align:left;border:1.5px solid #e6d5f4;border-radius:13px;padding:10px 12px;
  background:linear-gradient(140deg,#fbf8ff,#f2eaff);color:var(--ink-soft);font:inherit;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;gap:9px;transition:.18s;
}
.encounter-choice:hover:not(:disabled){transform:translateY(-1px);border-color:#cbb0eb;box-shadow:0 6px 14px rgba(129,99,180,.12)}
.encounter-choice span{font-size:11.5px;font-weight:800}
.encounter-choice small{font-size:9px;color:#887395;white-space:nowrap}
.encounter-choice:disabled{opacity:.55;cursor:not-allowed}
@media (max-width:430px){.encounter-choice{flex-direction:column;align-items:flex-start;gap:4px}}

/* 抽蛋结果 */
.gacha-result-head{text-align:center;padding:1px 0 4px}
.result-mascot{font-size:47px;line-height:1.1;display:inline-block;animation:celebrate 1.7s ease-in-out infinite}
.gacha-result-head h3{font-size:17px;margin:3px 0 2px}
.gacha-result-head p{font-size:10px;color:var(--muted);margin:0}
.gacha-result-head.ssr-head h3{color:#a56b9f}
.gacha-result-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin-top:12px}
.gacha-result-card{
  position:relative;border-radius:14px;padding:8px 4px;min-height:108px;text-align:center;overflow:hidden;
  background:linear-gradient(160deg,#fffdf8,var(--rarity-soft,#f7f0e6));border:1.5px solid color-mix(in srgb,var(--rarity,#ccc) 50%,white);
  animation:lootPop .35s cubic-bezier(.2,.9,.3,1.2) both;
}
.gacha-result-card.ssr{box-shadow:0 0 0 2px rgba(255,193,105,.38),0 5px 18px rgba(239,167,67,.18)}
.gacha-card-glow{position:absolute;inset:-30%;background:radial-gradient(circle at 50% 20%,rgba(255,255,255,.8),transparent 60%);pointer-events:none}
.gacha-rarity{position:absolute;left:5px;top:4px;font-size:7px;font-weight:900;color:var(--rarity);letter-spacing:.5px}
.gacha-result-card .gacha-emoji{font-size:31px;line-height:1.2;margin-top:8px;position:relative}
.gacha-name{font-size:9.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;position:relative}
.gacha-tag{font-size:8px;color:var(--muted);margin-top:2px;display:flex;gap:2px;justify-content:center;flex-wrap:wrap;position:relative}
.new-tag{font-size:7px;font-weight:900;color:#fff;background:#f4a06d;border-radius:5px;padding:1px 4px}
.shiny-tag{font-size:7px;font-weight:900;color:#a77822;background:#fff0bd;border-radius:5px;padding:1px 4px}

/* 战斗补充 */
.b-unit.boss-unit{border-color:#e8b4b0;background:linear-gradient(160deg,#fffaf8,#ffefed);box-shadow:0 0 0 2px rgba(235,154,150,.16),0 6px 14px rgba(150,90,80,.1)}
.b-shield{
  position:absolute;right:0;top:-3px;font-size:8px;line-height:1.2;color:#679bb9;
  background:rgba(235,248,255,.9);border:1px solid #cbe7f3;border-radius:7px;padding:1px 4px;white-space:nowrap;
  box-shadow:0 2px 5px rgba(90,140,160,.12);
}
@keyframes toastOut{to{opacity:0;transform:translateY(6px) scale(.97)}}
@keyframes dropFall{0%{opacity:1;transform:translate(-50%,0) scale(.7)}100%{opacity:0;transform:translate(-50%,42px) scale(1.1)}}
@media (max-width:760px){
  .gacha-banners{grid-template-columns:1fr}
  .gacha-result-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .signin-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .pet-stat-panel{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pet-stat-panel .btn{grid-column:span 3}
  .pet-equip-list{grid-template-columns:1fr}
  .pet-care-row{grid-template-columns:1fr}
  .frame-grid{grid-template-columns:repeat(auto-fill,minmax(135px,1fr))}
}
@media (max-width:430px){
  .gacha-result-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .signin-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pet-stat-panel{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pet-stat-panel .btn{grid-column:span 2}
  .offline-rewards{grid-template-columns:1fr}
  .modal-actions-row{justify-content:stretch}
  .modal-actions-row .btn{flex:1;min-width:96px}
}
@media (min-width:900px){
  .speech{left:auto;right:calc(100% + 10px);border-radius:16px 16px 4px 16px}
  .speech::after{left:auto;right:-6px;border-left:0;border-bottom:0;border-right:1px solid #f1ddc7;border-top:1px solid #f1ddc7;border-radius:0 3px 0 0}
}

/* ---------- 动效 ---------- */
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes petFloat{0%,100%{transform:translateY(0) rotate(0)}45%{transform:translateY(-7px) rotate(-2deg)}60%{transform:translateY(-5px) rotate(2deg)}}
@keyframes artFadeIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes petWander{0%,100%{transform:translateX(0) translateY(0) rotate(0)}25%{transform:translateX(-16px) translateY(-2px) rotate(-4deg)}55%{transform:translateX(15px) translateY(-3px) rotate(3deg)}80%{transform:translateX(-7px) translateY(-1px) rotate(-2deg)}}
@keyframes petHop{0%,100%{transform:translateY(0)}32%{transform:translateY(-24px)}58%{transform:translateY(0) scale(.95)}82%{transform:translateY(-10px)}}
@keyframes petRoll{0%{transform:rotate(0deg) translateY(0)}100%{transform:rotate(360deg) translateY(0)}}
@keyframes shadowPulse{0%,100%{transform:scaleX(1);opacity:.8}50%{transform:scaleX(.88);opacity:.55}}
@keyframes cloudDrift{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}
@keyframes wiggle{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
@keyframes sparkle{0%,100%{opacity:.25;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(20deg)}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes cardShine{0%,76%{left:-60%}88%,100%{left:130%}}
@keyframes speechPop{from{opacity:0;transform:translateY(6px) scale(.94)}to{opacity:1;transform:none}}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalPop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes tourIn{from{opacity:0;transform:translateY(15px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:none}}
@keyframes lootPop{from{opacity:0;transform:translateY(8px) scale(.9)}to{opacity:1;transform:none}}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,8px) scale(.8)}18%{opacity:1;transform:translate(-50%,0) scale(1.08)}70%{opacity:1;transform:translate(-50%,-22px)}100%{opacity:0;transform:translate(-50%,-38px) scale(.94)}}
@keyframes hitFlash{0%,100%{filter:brightness(1)}30%{filter:brightness(2.7) saturate(.2)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes ultFlash{0%{opacity:0}16%{opacity:1}72%{opacity:.85}100%{opacity:0}}
@keyframes celebrate{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
@keyframes heartPop{0%{opacity:1;transform:translate(-50%,0) scale(.6)}20%{opacity:1;transform:translate(-50%,-15px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-58px) scale(.9)}}
@keyframes tapBounce{0%,100%{transform:scale(1)}40%{transform:scale(.93) rotate(-3deg)}70%{transform:scale(1.04) rotate(2deg)}}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(255,183,163,.35)}50%{box-shadow:0 0 0 9px rgba(255,183,163,0)}}
/* 战斗表现层动效（只动 transform / opacity） */
@keyframes bBattleBreathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.045)}}
@keyframes bBattleBreatheBoss{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.085)}}
@keyframes bHitRecoil{0%{transform:translateX(0) rotate(0)}28%{transform:translateX(-4px) rotate(-4deg)}62%{transform:translateX(2px) rotate(1.5deg)}100%{transform:translateX(0) rotate(0)}}
@keyframes bHitRecoilR{0%{transform:translateX(0) rotate(0)}28%{transform:translateX(4px) rotate(4deg)}62%{transform:translateX(-2px) rotate(-1.5deg)}100%{transform:translateX(0) rotate(0)}}
@keyframes bDodgeOut{0%{transform:translateX(0);opacity:1}35%{transform:translateX(-12px);opacity:.42}100%{transform:translateX(0);opacity:1}}
@keyframes bDodgeOutR{0%{transform:translateX(0);opacity:1}35%{transform:translateX(12px);opacity:.42}100%{transform:translateX(0);opacity:1}}
@keyframes bDeathFall{0%{opacity:1;transform:rotate(0) scale(1)}30%{opacity:.95;transform:rotate(-7deg) scale(1.02)}100%{opacity:.34;transform:rotate(82deg) scale(.9)}}
@keyframes bTurnRing{0%,100%{transform:translateX(-50%) scale(.9);opacity:.5}50%{transform:translateX(-50%) scale(1.06);opacity:1}}
@keyframes bSkillBanner{0%{opacity:0;transform:translate(-50%,5px) scale(.9)}16%{opacity:1;transform:translate(-50%,-6px) scale(1)}70%{opacity:1;transform:translate(-50%,-9px) scale(1)}100%{opacity:0;transform:translate(-50%,-18px) scale(.96)}}
.pat-heart{position:absolute;left:50%;top:12px;font-size:18px;pointer-events:none;animation:heartPop 1.1s ease-out both;z-index:9}
.pat-bounce .idle-pet{animation:tapBounce .55s cubic-bezier(.2,.9,.3,1.3)!important}
.tutorial-card .btn{pointer-events:auto}

const STAGES = [];
for (const chapter of CHAPTERS) {
  for (let i = 1; i <= 5; i++) {
    const kind = STAGE_KINDS[i - 1];
    const index = (chapter.id - 1) * 5 + i;
    const recPower = Math.round(650 * Math.pow(1.42, chapter.id - 1) * (1 + 0.16 * (i - 1)));
    const baseGold = Math.round((1.0 + (chapter.id - 1) * 0.9 + i * 0.18) * 10) / 10;
    const bdef = kind.type === 'boss' ? bossByChapter(chapter.id) : null;
    const slotKey = ['mob1', 'mob2', 'mob3', 'elite'][i - 1];
    const suffix = bdef ? '' : STAGE_NAME_WORDS[slotKey][(chapter.id - 1) % 10];
    const blurbPool = STAGE_BLURB[kind.type] || [];
    const blurb = bdef ? bdef.flavor : (blurbPool[(index - 1) % blurbPool.length] || '');
    STAGES.push({
      index, chapter: chapter.id, chapterName: chapter.name,
      sub: i, type: kind.type, typeName: kind.label,
      name: bdef ? bdef.name : `${chapter.emoji} ${chapter.name}·${suffix}`,
      blurb,
      emoji: bdef ? bdef.emoji : kind.emoji,
      element: bdef ? bdef.element : chapter.element,
      recPower,
      baseGold,
      baseFruit: Math.max(0.01, Math.round(baseGold * 0.08 * 1000) / 1000),
      desc: chapter.desc,
      theme: chapter.theme,
      intro: (CHAPTER_STORY[chapter.id] || {}).intro || '',
      winLine: (CHAPTER_STORY[chapter.id] || {}).winLine || ''
    });
  }
}
function getStage(index) {
  return STAGES[clamp(index, 1, STAGES.length) - 1] || STAGES[0];
}
function stageIndex(chapter, sub) { return (chapter - 1) * 5 + sub; }

function loadState() {
  let raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (err) { raw = null; }
  if (!raw) return defaultState();
  try {
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object') throw new Error('bad save');
    return sanitizeState(deepMerge(defaultState(), parsed));
  } catch (err) {
    UI.loadError = true;
    return defaultState();
  }
}

function saveGame() {
  if (!state) return;
  // 离线收益尚未领取时保留旧 savedAt，避免刷新或关闭页面把这段时间“吃掉”。
  if (!UI.offlineOffer) state.savedAt = Date.now();
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    UI.saveWarned = false;
  } catch (err) {
    if (!UI.saveWarned) {
      UI.saveWarned = true;
      setTimeout(() => toast('本地存档写入失败，可能是浏览器限制或空间不足。', 'bad'), 200);
    }
  }
  gameSyncSchedule();
}

function persist(options = {}) {
  saveGame();
  if (options.render !== false) renderAll();
}

/* ========== 3. 派生数值与成长 ========== */
function templateOf(petOrId) {
  const id = typeof petOrId === 'string' ? petOrId : (petOrId && petOrId.templateId);
  return PET_MAP[id] || PETS[0];
}
function templateHasHeal(template) {
  if (!template || !Array.isArray(template.skills)) return false;
  return template.skills.some(id => {
    const skill = SKILLS[id];
    return !!(skill && (skill.effects || []).some(e => e.type === 'heal' || e.type === 'revive'));
  });
}
function enemyPetPool() {
  const pool = PETS.filter(p => !templateHasHeal(p));
  return pool.length ? pool : PETS;
}
function ownedPets(s = state) {
  return Object.values(s.pets || {}).filter(Boolean).sort((a, b) => b.level - a.level);
}
function teamPetsOf(s = state) {
  if (!s || !s.team) return [];
  return [...(s.team.front || []), ...(s.team.back || [])].map(uid => s.pets[uid]).filter(Boolean);
}
function getTeamPets() { return teamPetsOf(state); }
function getMainPet() {
  const team = getTeamPets();
  if (team.length) return team[0];
  const all = ownedPets();
  return all[0] || null;
}
function petDisplayName(pet) {
  if (!pet) return '无';
  return pet.nickname || templateOf(pet).name;
}
function petEmoji(pet, stage) {
  const t = templateOf(pet);
  const evo = stage == null ? (pet ? pet.evo : 0) : clamp(stage, 0, 2);
  return t.emoji[evo] || t.emoji[0];
}

      if (affix.id === 'dr') out.dr += value;

  return Math.round(
    stats.hp * 0.22 + stats.atk * 2.8 + stats.def * 2.2 + stats.spd * 4.5 +
    stats.crit * 1000 + stats.critDmg * 250 + stats.dr * 600 +
    stats.hit * 200 + stats.dodge * 200 + stats.lifesteal * 200
  );
}
function getPetPower(pet, s = state) {

  const inTeam = [...(s.team.front || []), ...(s.team.back || [])].includes(pet.uid);
  const ctx = inTeam ? teamContextForState(s) : null;
  return calcPower(getPetStats(pet, ctx, s));
}
function calcTeamPower(s = state) {
  const team = teamPetsOf(s);
  if (!team.length) return 0;
  const ctx = teamContextForState(s, team);
  return sum(team.map(p => calcPower(getPetStats(p, ctx, s))));
}
function averageTeamPower(s = state) {

function ensureRegen(bar, intervalMs, now = Date.now()) {
  if (!bar) return 0;
  bar.max = Math.max(1, Math.floor(num(bar.max, 1)));
  if (bar.value >= bar.max) { bar.ts = now; return 0; }
  if (!Number.isFinite(bar.ts) || bar.ts > now) bar.ts = now;
  const gain = Math.floor((now - bar.ts) / intervalMs);
  if (gain > 0) {
    bar.value = Math.min(bar.max, bar.value + gain);
    bar.ts = bar.value >= bar.max ? now : bar.ts + gain * intervalMs;
  }
  return gain;
}
function regenAll(now = Date.now()) {
  ensureRegen(state.stamina, STAMINA_REGEN_MS, now);
  ensureRegen(state.challenge, CHALLENGE_REGEN_MS, now);
}
function spendStamina(cost) {
  regenAll();
  if (state.stamina.value < cost) return false;
  state.stamina.value -= cost;
  if (state.stamina.value < state.stamina.max) state.stamina.ts = Date.now();
  return true;
}
function spendChallenge(cost) {
  regenAll();
  if (state.challenge.value < cost) return false;
  state.challenge.value -= cost;
  if (state.challenge.value < state.challenge.max) state.challenge.ts = Date.now();
  return true;
}

function ensureDaily(s = state) {
  const today = localDateKey();
  let changed = false;
  if (s.daily.date !== today) {
    s.daily.date = today;
    s.daily.progress = { login: 1 };
    s.daily.claimed = [];
    changed = true;
  }
  if (!s.daily.progress.login) { s.daily.progress.login = 1; changed = true; }
  if (s.dungeon.date !== today) {
    s.dungeon.date = today;
    s.dungeon.attempts = DUNGEON_ATTEMPTS_PER_DAY;
    changed = true;
  }
  if (s.boss.date !== today) {
    s.boss.date = today;
    s.boss.attempts = 3;
    s.boss.bestDamage = 0;
    s.boss.claimed = false;
    s.boss.seed = String(hashString('boss-' + today));
    changed = true;
  }
  return changed;
}

function ensureEncounter(s = state, now = Date.now()) {
  let changed = false;
  if (!s.encounter.refreshAt || now >= s.encounter.refreshAt) {
    s.encounter.refreshAt = now + 2 * HOUR_MS;
    s.encounter.attempts = 2;
    const prev = s.encounter.activeId;
    const pool = ENCOUNTERS.filter(e => e.id !== prev);
    const seed = hashString(localDateKey() + ':' + Math.floor(now / HOUR_MS) + ':' + s.encounter.total);
    s.encounter.activeId = pool[seed % pool.length].id;
    changed = true;
  }
  return changed;
}

function ensureArenaSeason(s = state, now = Date.now()) {
  if (now - s.arena.seasonStart >= 7 * DAY_MS) {
    const tier = arenaTierOf(s.arena.rating);
    const bonus = Math.floor(tier.reward * 1.6);
    s.items.arenaCoin += bonus;
    s.arena.rating = 1000;
    s.arena.wins = 0;
    s.arena.losses = 0;
    s.arena.seasonStart = now;

  return { changed: false };

function canPayCost(cost) {

  if (cost.stamina && state.stamina.value < cost.stamina) return false;
  if (cost.challenge && state.challenge.value < cost.challenge) return false;
  return true;
}

  if (cost.gold) state.resources.gold -= cost.gold;
  if (cost.crystal) state.resources.crystal -= cost.crystal;
  if (cost.fruit) state.resources.fruit -= cost.fruit;

  if (cost.challenge) spendChallenge(cost.challenge);
  return true;
}

/* -------- 装备生成 -------- */
function rollEquipmentQuality(bias = 0) {
  const keys = Object.keys(EQUIP_QUALITIES);
  const weights = keys.map(k => {
    const base = EQUIP_QUALITIES[k].weight;
    if (k === 'common') return Math.max(2, base - bias * 10);
    if (k === 'fine') return base + bias * 2;
    if (k === 'epic') return base + bias * 5;
    return base + bias * 2;
  });
  return weightedPick(keys, weights);
}
function makeEquipment(quality = null, slot = null, s = state) {
  const qKey = EQUIP_QUALITIES[quality] ? quality : rollEquipmentQuality(0);
  const q = EQUIP_QUALITIES[qKey];
  const slotKey = EQUIP_SLOT_KEYS.includes(slot) ? slot : pick(EQUIP_SLOT_KEYS);
  const affixCount = q.affixes;
  const pool = EQUIP_AFFIXES.slice();
  const affixes = [];
  for (let i = 0; i < affixCount && pool.length; i++) {
    const affix = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
    const base = affix.min + Math.random() * (affix.max - affix.min);
    const value = base * (0.86 + q.mult * 0.20);
    affixes.push({ id: affix.id, value: Math.round(value * 10000) / 10000 });
  }
  const item = {
    id: 'eq' + (s.nextEquipId++),
    name: `${pick(EQUIP_PREFIX)}·${q.name}${EQUIP_SLOTS[slotKey].name}`,
    slot: slotKey,
    quality: qKey,
    level: 0,
    affixes,
    setId: Math.random() < 0.62 ? pick(EQUIP_SET_KEYS) : null,
    equippedBy: null
  };
  s.equipment.push(item);
  return item;
}
function equipQualityRarity(item) {
  return ({ common: 'N', fine: 'R', epic: 'SR', legend: 'SSR' })[item && item.quality] || 'N';
}
function affixText(affix) {
  const t = EQUIP_AFFIXES.find(a => a.id === affix.id);
  if (!t) return '';
  return t.fmt.replace('{v}', (affix.value * 100).toFixed(1).replace(/\.0$/, ''));
}
function itemAffixSummary(item) {
  return (item.affixes || []).map(affixText).join(' · ');
}
function itemPowerHint(item) {
  if (!item) return 0;
  const q = EQUIP_QUALITIES[item.quality];
  return Math.round(EQUIP_SLOTS[item.slot].base * q.mult * (1 + item.level * 0.085));
}
function equipmentInventory(s = state) {
  return (s.equipment || []).slice().sort((a, b) => {
    const order = { legend: 4, epic: 3, fine: 2, common: 1 };
    return (order[b.quality] - order[a.quality]) || (b.level - a.level);
  });
}
