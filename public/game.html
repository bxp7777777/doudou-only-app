    enhance: [[520, 0.06, 'square', 0.014], [780, 0.13, 'triangle', 0.018, 0.05]],
    battle: [[260, 0.12, 'sawtooth', 0.014], [390, 0.16, 'triangle', 0.018, 0.1]],
    start: [[392, 0.1, 'triangle', 0.018], [523, 0.14, 'triangle', 0.018, 0.1]],
    win: [[523, 0.12, 'triangle', 0.022], [659, 0.12, 'triangle', 0.022, 0.1], [784, 0.28, 'sine', 0.02, 0.2]],
    lose: [[392, 0.16, 'sine', 0.02], [330, 0.16, 'sine', 0.018, 0.14], [262, 0.28, 'sine', 0.016, 0.28]],
    ult: [[220, 0.16, 'sawtooth', 0.02], [440, 0.18, 'triangle', 0.024, 0.09], [880, 0.3, 'sine', 0.022, 0.19]],
    gacha: [[660, 0.1, 'triangle', 0.02], [880, 0.18, 'triangle', 0.018, 0.09]],
    ssr: [[523, 0.08, 'sine', 0.022], [659, 0.08, 'sine', 0.022, 0.07], [784, 0.08, 'sine', 0.022, 0.14], [1046, 0.3, 'sine', 0.02, 0.21]],
    encounter: [[600, 0.1, 'sine', 0.018], [760, 0.16, 'sine', 0.016, 0.08]],
    feed: [[700, 0.07, 'triangle', 0.018], [840, 0.08, 'triangle', 0.016, 0.05]],
    rebirth: [[220, 0.2, 'sine', 0.024], [440, 0.2, 'triangle', 0.022, 0.16], [880, 0.4, 'sine', 0.02, 0.34]]
  };
  for (const [freq, dur, type, vol, delay] of (map[name] || map.tap)) audioTone(freq, dur, type, vol, delay || 0);
}
function playMusicBar() {
  if (!state || !state.settings.music || document.hidden) return;
  ensureAudio();
  const ctx = UI.audioCtx;
  if (!ctx) return;
  const chords = [
    [261.63, 329.63, 392.00],
    [220.00, 261.63, 329.63],
    [293.66, 349.23, 440.00],
    [246.94, 293.66, 392.00]
  ];
  if (state.settings.musicStyle === 'calm') {
    const calmSets = [
      [220.00, 261.63, 329.63],
      [196.00, 246.94, 293.66],
      [174.61, 220.00, 261.63],
      [246.94, 293.66, 349.23]
    ];
    const seq = pick(calmSets);
    seq.forEach((freq, i) => audioTone(freq, 3.2, 'sine', 0.0045, i * 0.55));
    audioTone(seq[0] * 2, 2.4, 'sine', 0.0028, 2.0);
    return;
  }
  const chord = pick(chords);
  chord.forEach((freq, i) => audioTone(freq, 2.4, 'sine', 0.006, i * 0.06));
  audioTone(chord[0] * 2, 1.4, 'triangle', 0.0035, 1.3);
  audioTone(chord[1] * 2, 1.2, 'triangle', 0.003, 2.5);
}
function startMusic() {
  if (!state || !state.settings.music || UI.musicTimer) return;
  const ctx = ensureAudio();
  if (!ctx) return;
  playMusicBar();
  UI.musicTimer = setInterval(playMusicBar, 5200);
}
function stopMusic() {
  if (UI.musicTimer) clearInterval(UI.musicTimer);
  UI.musicTimer = null;
}
function syncAudio() {
  if (!state) return;
  if (state.settings.music && !document.hidden) startMusic();
  else stopMusic();
  if (UI.audioCtx) {
    if (document.hidden || (!state.settings.music && !state.settings.sfx)) {
      UI.audioCtx.suspend().catch(() => {});
      UI.mutedByVisibility = true;
    } else {
      UI.audioCtx.resume().catch(() => {});
      UI.mutedByVisibility = false;
    }
  }
}

/* -------- 主循环 -------- */
let mainGameTimer = null;
let lastArenaSeasonToast = 0;
function gameTick() {
  if (!state) return;
  ensureRegen();
  const dailyChanged = ensureDaily();
  const encounterChanged = ensureEncounter();
  const season = ensureArenaSeason();
  if (dailyChanged) {
    saveGame();
    if (!UI.modal && !UI.battle) renderAll();
  }
  if (encounterChanged) {
    saveGame();
    if (UI.tab === 'battle' && !UI.modal && !UI.battle) renderPage();
  }
  if (season.changed) {
    saveGame();
    if (!UI.modal) {
      toast(`新赛季开始！上赛季段位奖励 🎖️${fmt(season.bonus)} 已发放。`, 'gold', 3600);
    }
    if (!UI.battle && !UI.modal) renderAll();
  }
  if (!UI.offlineOffer) accrueIdleToNow();
  else UI.lastTick = Date.now();
  const now = Date.now();
  if (UI.tab === 'home' && !UI.modal && !UI.battle && !UI.offlineOffer) {
    const anyReady = gardenJustReady();
    if (anyReady && !UI.gardenReadyPing) { UI.gardenReadyPing = true; renderPage(); }
    else if (!anyReady) UI.gardenReadyPing = false;
    if (now - (UI.petActAt || 0) > 3600 && Math.random() < 0.5) { UI.petActAt = now; scheduleHomePetAct(); }
    if (now - (UI.palActAt || 0) > 5200 && Math.random() < 0.45) { UI.palActAt = now; schedulePalAct(); }
  }
  if (now - UI.lastSaveTick >= 10000) {
    UI.lastSaveTick = now;
    saveGame();
  }
  refreshHUD();
  if (UI.battle && !UI.battle.over) updateBattleControls();
}

function handleVisibilityChange() {
  if (!state) return;
  if (document.hidden) {
    saveGame();
    gameSyncPush(true);
    stopMusic();
    syncAudio();
    return;
  }
  const now = Date.now();
  if (!UI.offlineOffer) {
    const gap = Math.max(0, (now - UI.lastTick) / 1000);
    if (gap > 1) {
      updateCareElapsed(gap);
      if (!UI.offlineOffer) accrueIdle(gap);
    }
  }
  UI.lastTick = now;
  regenAll();
  ensureDaily();
  ensureEncounter();
  ensureArenaSeason();
  refreshHUD();
  syncAudio();
  if (!UI.modal && !UI.battle) renderPage();
  gameSyncNow(true);
}

function bindGlobalEvents() {
  document.addEventListener('click', handleActionClick);
  document.addEventListener('click', (event) => {
    if (event.target && event.target.hasAttribute && event.target.hasAttribute('data-modal-backdrop')) {
      if (UI.modal && UI.modal.closable !== false) closeModal();
    }
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && UI.modal && UI.modal.closable !== false) closeModal();
  });
  document.addEventListener('visibilitychange', handleVisibilityChange);
  window.addEventListener('beforeunload', saveGame);
  window.addEventListener('pagehide', saveGame);
  document.addEventListener('pointerdown', () => {
    ensureAudio();
    syncAudio();
  }, { once: true });
  document.addEventListener('keydown', () => {
    ensureAudio();
    syncAudio();
  }, { once: true });
}

function startGameLoop() {
  if (mainGameTimer) clearInterval(mainGameTimer);
  mainGameTimer = setInterval(gameTick, 1000);
  if (!gameBgSyncTimer) {
    gameBgSyncTimer = setInterval(() => {
      if (!document.hidden && gameSyncCfg()) gameSyncNow(true);
    }, 120000);
  }
}

function bootGame() {
  try {
    state = loadState();
    UI.tab = TABS.some(t => t.id === state.lastTab) ? state.lastTab : 'home';
    UI.adventureChapter = currentChapterNumber();
    UI.petTab = 'team';
    UI.shopTab = 'gacha';
    UI.questTab = 'daily';
    UI.scrollReset = false;
    UI.lastTick = Date.now();
    UI.lastSaveTick = Date.now();
    UI.loadError = false;
    const elapsed = Math.max(0, (Date.now() - state.savedAt) / 1000);
    regenAll();
    ensureDaily();
    ensureEncounter();
    ensureArenaSeason();
    updateCareElapsed(elapsed);
    const offer = buildOfflineOffer(elapsed);
    UI.offlineOffer = offer;
    if (offer) {
      // 未领取离线收益前，savedAt 保持旧值，刷新页面不会丢失这段时间。
    } else {
      if (elapsed > 1 && teamPetsOf(state).length) accrueIdle(elapsed);
    }
    saveGame();
    renderAll();
    bindGlobalEvents();
    startGameLoop();
    if (gameSyncCfg()) setTimeout(() => gameSyncNow(true), 1200);
    if (UI.loadError) toast('存档读取失败，已用新的小镇重新开始。', 'bad', 3600);
    if (offer) setTimeout(() => showOfflineModal(offer), 520);
    if (state.settings.music) setTimeout(() => syncAudio(), 900);
  } catch (err) {
    try {
      state = defaultState();
      renderAll();
      bindGlobalEvents();
      startGameLoop();
      toast('游戏初始化遇到问题，已启动一个全新的小镇。', 'bad', 4000);
    } catch (inner) {
      const view = $('#view');
      if (view) view.innerHTML = '<div class="card empty"><h2>初始化失败</h2><p>请刷新页面重试。</p></div>';
    }
  }
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootGame);
else bootGame();
</script>
