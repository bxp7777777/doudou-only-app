<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff7e9">
<meta name="description" content="萌宠小镇：单文件挂机养成对战小游戏">
<title>萌宠小镇 · 挂机养成对战</title>
<style>
/* ============================================================
   萌宠小镇 · 视觉层
   奶油底色 + 马卡龙点缀 / 圆角卡片 / Q 弹动效
   ============================================================ */
:root{
  --cream:#fff8ec;
  --cream-deep:#f9ecd9;
  --paper:#fffdf8;
  --ink:#5b4a3f;
  --ink-soft:#806b5d;
  --muted:#a89586;
  --line:#f1e2cf;
  --peach:#ffb6a3;
  --peach-deep:#f58e77;
  --pink:#ffd4e2;
  --pink-deep:#f08db2;
  --mint:#b8e8d3;
  --mint-deep:#5cbf9a;
  --blue:#b9def7;
  --blue-deep:#6aaede;
  --lav:#d7c9f6;
  --lav-deep:#a78ada;
  --yellow:#ffe79a;
  --yellow-deep:#e9b93f;
  --danger:#ef8d8d;
  --gold:#f3b94d;
  --shadow:0 16px 40px rgba(151,118,84,.13);
  --shadow-soft:0 6px 18px rgba(151,118,84,.08);
  --hl-white:inset 0 1px 0 rgba(255,255,255,.82);
  --ring-soft:0 0 0 1.5px rgba(255,255,255,.9),0 5px 12px rgba(137,102,71,.15);
  --radius:22px;
  --radius-sm:14px;
  --tab-h:72px;
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;
  color:var(--ink);
  font-family:var(--font);
  font-size:14px;
  line-height:1.55;
  background:
    radial-gradient(circle at 8% 4%, rgba(255,212,226,.58), transparent 25%),
    radial-gradient(circle at 92% 9%, rgba(185,222,247,.55), transparent 26%),
    radial-gradient(circle at 78% 94%, rgba(184,232,211,.45), transparent 28%),
    radial-gradient(circle at 15% 82%, rgba(255,231,154,.32), transparent 24%),
    var(--cream);
  -webkit-tap-highlight-color:transparent;
}
body::before{
  content:"";
  position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.22;
  background-image:radial-gradient(rgba(151,118,84,.25) 1px, transparent 1.5px);
  background-size:24px 24px;
  mask-image:linear-gradient(to bottom, rgba(0,0,0,.42), transparent 75%);
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid rgba(167,138,218,.4);outline-offset:2px}
a{color:var(--ink)}
img{max-width:100%}
::selection{background:var(--pink);color:var(--ink)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#e8d7c2;border:3px solid transparent;background-clip:content-box;border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 布局骨架 ---------- */
#app{position:relative;z-index:1;min-height:100vh}
.topbar{
  z-index:50;
  display:flex;align-items:center;gap:14px;
  padding:12px 20px;
  background:rgba(255,250,241,.9);
  border-bottom:1px solid rgba(222,198,170,.45);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  box-shadow:0 4px 24px rgba(151,118,84,.06);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-logo{
  width:42px;height:42px;border-radius:16px;display:grid;place-items:center;font-size:23px;
  background:linear-gradient(145deg,#ffe6a9,#ffc9bb 52%,#d8c9f6);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 5px 14px rgba(231,164,127,.3);
  transform:rotate(-4deg);
}
.brand h1{font-size:18px;line-height:1.1;margin:0;letter-spacing:.4px}
.brand p{margin:2px 0 0;font-size:11px;color:var(--muted);letter-spacing:1px}
.mobile-brand{display:none}
.res-strip{display:flex;align-items:center;gap:8px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.res-strip::-webkit-scrollbar{display:none}
.res-pill{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;
  min-height:35px;padding:5px 11px 5px 9px;
  background:linear-gradient(180deg,#fffdf9,#fff6ea);border:1px solid rgba(237,221,198,.9);border-radius:999px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 3px 10px rgba(151,118,84,.07);
  white-space:nowrap;
}
.res-pill .ico{font-size:17px;line-height:1}
.res-pill em{font-style:normal;font-size:11px;color:var(--muted)}
.res-pill b{font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink)}
.res-pill .sub{font-size:10px;color:var(--muted);margin-left:2px}
.top-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.icon-btn{
  width:38px;height:38px;border-radius:13px;border:1px solid var(--line);
  background:var(--paper);display:grid;place-items:center;font-size:18px;
  box-shadow:var(--shadow-soft);transition:transform .16s ease, box-shadow .16s ease;
}
.icon-btn:hover{transform:translateY(-2px) rotate(-4deg)}
.icon-btn:active{transform:scale(.92)}
.avatar-frame{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;
  position:relative;z-index:0;background:#fff7e8;
}
.avatar-frame::before{
  content:"";position:absolute;inset:-3px;border-radius:50%;z-index:-1;
  background:linear-gradient(135deg,var(--peach),var(--yellow),var(--mint),var(--blue));
  animation:spinSlow 9s linear infinite;
}
.avatar-frame.frame-mint::before{background:linear-gradient(135deg,#a8e6cf,#dcedc1,#fff)}
.avatar-frame.frame-peach::before{background:linear-gradient(135deg,#ffb7b2,#ffdac1,#ffe6a9)}
.avatar-frame.frame-star::before{background:linear-gradient(135deg,#ffe66d,#ffb86c,#ff8fb1)}
.avatar-frame.frame-moon::before{background:linear-gradient(135deg,#cdb4db,#9fb8f8,#e0c3fc)}
.avatar-frame.frame-rainbow::before{background:conic-gradient(from 0deg,#ffadad,#ffd6a5,#fdffb6,#caffbf,#9bf6ff,#bdb2ff)}
.sidebar{
  display:none;
  padding:20px 16px 18px;
  border-right:1px solid rgba(222,198,170,.46);
  background:rgba(255,250,242,.56);
  backdrop-filter:blur(10px);
}
.sidebar .brand{padding:2px 6px 20px}
.side-nav{display:flex;flex-direction:column;gap:7px}
.side-nav button{
  display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;
  border:0;border-radius:16px;background:transparent;text-align:left;
  font-size:14px;font-weight:600;color:var(--ink-soft);
  transition:background .2s, transform .2s, color .2s;
}
.side-nav button .nav-ico{font-size:21px;filter:saturate(.9)}
.side-nav button:hover{background:rgba(255,255,255,.65);transform:translateX(3px)}
.side-nav button.active{
  color:var(--ink);
  background:linear-gradient(120deg,#fff3dc,#ffd9d0 52%,#e5dcfa);
  box-shadow:0 7px 18px rgba(219,173,143,.2), inset 0 1px 0 rgba(255,255,255,.8);
}
.side-nav button.active .nav-ico{animation:wiggle 2.4s ease-in-out infinite}
.side-foot{margin-top:auto;padding:18px 8px 0;font-size:11px;color:var(--muted);line-height:1.7}
.side-card{
  margin-top:16px;padding:13px;border-radius:18px;background:rgba(255,255,255,.55);
  border:1px dashed #e7d3b9;font-size:12px;color:var(--ink-soft)
}
.side-card b{display:block;color:var(--ink);font-size:13px;margin-bottom:3px}
.main{min-width:0;padding:22px 24px 48px;position:relative}
.main-inner{max-width:1180px;margin:0 auto}
.tabbar{display:none}

/* ---------- 通用组件 ---------- */
.page{animation:pageIn .32s cubic-bezier(.2,.75,.35,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:2px 0 16px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin:0 0 2px}
.page-title{font-size:25px;line-height:1.2;margin:0;letter-spacing:.5px}
.page-title .emoji{margin-right:6px}
.page-sub{margin:4px 0 0;color:var(--ink-soft);font-size:12.5px}
.head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card{
  background:linear-gradient(165deg,rgba(255,254,251,.97),rgba(255,248,237,.94));
  border:1px solid rgba(237,221,198,.95);
  border-radius:var(--radius);
  box-shadow:var(--shadow),var(--hl-white);
  padding:18px;
  position:relative;
}
.card.flat{box-shadow:none;background:rgba(255,255,255,.52)}
.card.soft{background:linear-gradient(145deg,rgba(255,253,248,.97),rgba(255,247,236,.82))}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.card-head h2,.card-head h3{margin:0;font-size:16.5px;line-height:1.25}
.card-head h3{font-size:14.5px}
.card-head p{margin:2px 0 0;font-size:11.5px;color:var(--muted)}
.card-head .emoji{margin-right:5px}
.card + .card{margin-top:14px}
.grid{display:grid;gap:14px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.auto{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.gap-sm{gap:9px}
.muted{color:var(--muted)}
.tiny{font-size:11px}
.small{font-size:12px}
.ink-soft{color:var(--ink-soft)}
.gold-text{color:#b8791d}
.mint-text{color:#278a6d}
.pink-text{color:#c75f88}
.center{text-align:center}
.flex{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flex.between{justify-content:space-between}
.flex.end{justify-content:flex-end}
.spacer{flex:1}
.hr{height:1px;background:linear-gradient(90deg,transparent,#ead7c0,transparent);margin:14px 0;border:0}
.hidden{display:none!important}
.no-wrap{white-space:nowrap}
.big-number{font-size:31px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.btn{
  border:1px solid transparent;border-radius:15px;padding:10px 15px;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  font-weight:700;font-size:13px;line-height:1.2;
  background:#fff;color:var(--ink);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),0 4px 0 rgba(180,149,118,.12), var(--shadow-soft);
  transition:transform .14s cubic-bezier(.2,.8,.3,1), box-shadow .14s, filter .14s;
  user-select:none;
}
.btn:hover{transform:translateY(-1px);filter:brightness(1.02)}
.btn:active{transform:translateY(2px) scale(.985);box-shadow:0 1px 0 rgba(180,149,118,.12)}
.btn-primary{background:linear-gradient(145deg,#ffd1c5,#ffb7a3);border-color:#ffc0ae;color:#6b4033;box-shadow:0 4px 0 #e8a18d,0 8px 20px rgba(244,163,138,.22)}
.btn-mint{background:linear-gradient(145deg,#d5f4e6,#b8e8d3);border-color:#b0e2cc;color:#286e5b;box-shadow:0 4px 0 #8fcdb6,0 8px 20px rgba(125,205,176,.2)}
.btn-blue{background:linear-gradient(145deg,#dff1ff,#b9def7);border-color:#b6dcf5;color:#356b93;box-shadow:0 4px 0 #93c6e8,0 8px 20px rgba(137,192,232,.2)}
.btn-lav{background:linear-gradient(145deg,#eee6ff,#d7c9f6);border-color:#d2c2f1;color:#66518f;box-shadow:0 4px 0 #bba7e3,0 8px 20px rgba(177,155,223,.2)}
.btn-pink{background:linear-gradient(145deg,#ffe6ef,#ffd4e2);border-color:#ffc9dc;color:#9c4e6e;box-shadow:0 4px 0 #e9adc7,0 8px 20px rgba(238,170,197,.2)}
.btn-yellow{background:linear-gradient(145deg,#fff4c9,#ffe79a);border-color:#ffe293;color:#7a5b1c;box-shadow:0 4px 0 #e7c45b,0 8px 20px rgba(230,195,97,.2)}
.btn-ghost{background:rgba(255,255,255,.56);border-color:var(--line);box-shadow:none}
.btn-danger{background:linear-gradient(145deg,#ffd6d6,#ffb9b9);border-color:#ffc0c0;color:#8f3c3c;box-shadow:0 4px 0 #e79797}
.btn-sm{padding:7px 11px;font-size:12px;border-radius:12px}
.btn-xs{padding:5px 8px;font-size:10.5px;border-radius:10px;box-shadow:0 2px 0 rgba(180,149,118,.12)}
.btn-wide{width:100%}
.btn[disabled],.btn.disabled{filter:grayscale(.55);opacity:.58;cursor:not-allowed;transform:none!important;box-shadow:none}
.btn .ico{font-size:15px}
.chip{
  display:inline-flex;align-items:center;gap:4px;padding:4px 9px;
  border-radius:999px;background:#fff5e6;border:1px solid #f3e1ca;
  font-size:10.5px;color:var(--ink-soft);white-space:nowrap;
}
.chip.mint{background:#e9f9f1;border-color:#c8eedd;color:#317a63}
.chip.blue{background:#eaf6ff;border-color:#c9e7fb;color:#3c7399}
.chip.pink{background:#fff0f5;border-color:#ffd7e4;color:#a94367}
.chip.lav{background:#f4efff;border-color:#e3d5fa;color:#6e5898}
.chip.yellow{background:#fff9dd;border-color:#f7e8a8;color:#836724}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 8px;border-radius:999px;background:#fff;border:1px solid var(--line)}
.rarity-N{--rarity:#b9b5ad;--rarity-soft:#f3f0ea}
.rarity-R{--rarity:#75bfe9;--rarity-soft:#eaf7ff}
.rarity-SR{--rarity:#b388e5;--rarity-soft:#f4edff}
.rarity-SSR{--rarity:#f0a23c;--rarity-soft:#fff4dd}
.rarity-tag{font-size:10px;font-weight:800;letter-spacing:.5px;color:#fff;background:var(--rarity,#aaa);border-radius:8px;padding:2px 7px;display:inline-flex;align-items:center;gap:3px}
.element-tag{display:inline-flex;align-items:center;gap:3px;border-radius:8px;padding:2px 7px;font-size:10.5px;font-weight:700;background:var(--el-soft,#eee);color:var(--el-color,#555);border:1px solid color-mix(in srgb,var(--el-color,#aaa) 28%,white)}
.stars{color:#f0b43c;letter-spacing:1px;font-size:11px;white-space:nowrap;text-shadow:0 1px 0 #fff5cf}
.stars .off{color:#ddd2c4;text-shadow:none}
.progress{height:8px;border-radius:999px;background:#f3e6d5;overflow:hidden;position:relative}
.progress > i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#ffc5b2,#ffb6a3);transition:width .4s cubic-bezier(.2,.8,.25,1)}
.progress > i.mint{background:linear-gradient(90deg,#c9f1df,#8ed8bd)}
.progress > i.blue{background:linear-gradient(90deg,#cceaff,#9bd2f6)}
.progress > i.lav{background:linear-gradient(90deg,#e7dcff,#c7b2f2)}
.progress > i.yellow{background:linear-gradient(90deg,#fff2b5,#ffdc78)}
.progress.thick{height:12px}
.progress.thin{height:5px}
.bar-label{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-bottom:4px;gap:8px}
.section-title{display:flex;align-items:center;gap:8px;margin:18px 0 10px;font-size:16px;font-weight:800}
.section-title .emoji{font-size:19px}
.section-title .count{font-size:11px;color:var(--muted);font-weight:500;margin-left:auto}
.empty{padding:32px 16px;text-align:center;color:var(--muted);font-size:12.5px}
.empty .empty-emoji{display:block;font-size:40px;margin-bottom:8px;opacity:.75;animation:floaty 4s ease-in-out infinite}
.note{padding:10px 12px;border-radius:13px;background:#fff7e7;border:1px dashed #eddaa9;font-size:11.5px;color:#8a6c43;line-height:1.65}
.note.mint{background:#eefaf4;border-color:#cdeee1;color:#397865}
.note.pink{background:#fff2f7;border-color:#ffd5e3;color:#964c68}
.note.lav{background:#f6f1ff;border-color:#e1d5fa;color:#64518c}
.divider-dots{display:flex;align-items:center;gap:5px;color:#dec9b1;font-size:9px;margin:10px 0}
.divider-dots::before,.divider-dots::after{content:"";height:1px;flex:1;background:#f0dfca}

/* ---------- 首页 ---------- */
.home-hero{
  background:linear-gradient(135deg,rgba(255,255,255,.82),rgba(255,241,224,.72));
  border:1px solid rgba(238,218,194,.9);border-radius:28px;padding:18px;box-shadow:var(--shadow),var(--hl-white);
  position:relative;overflow:hidden;
}
.home-hero::after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.4);top:-70px;right:-40px;pointer-events:none}
.home-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;position:relative;z-index:2}
.hello h2{font-size:20px;margin:0 0 3px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.hello p{margin:0;color:var(--ink-soft);font-size:12px}
.home-top .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.idle-scene{
  margin-top:13px;position:relative;height:294px;border-radius:24px;overflow:hidden;
  background:linear-gradient(#d9f1ff 0%,#effaff 42%,#d7f1d8 42%,#b8e5c8 100%);
  border:1px solid rgba(255,255,255,.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
}
.idle-scene.bg-cream{background:linear-gradient(#ffeed2 0%,#fff7e6 44%,#f5dfbd 44%,#eac9a0 100%)}
.idle-scene.bg-cream .scene-sky{background:radial-gradient(circle at 70% 22%,#fff7c9 0 18%,transparent 19%)}
.idle-scene.bg-sakura{background:linear-gradient(#ffe8f2 0%,#fff4f8 42%,#e6f4d7 42%,#c5e5b6 100%)}
.idle-scene.bg-starry{background:linear-gradient(#3f3b6b 0%,#6b6197 38%,#424f79 38%,#34476c 100%)}
.idle-scene.bg-starry .house,.idle-scene.bg-starry .house-roof{filter:brightness(.82) saturate(.8)}
.idle-scene.bg-starry .scene-sun{background:#fff4bd;box-shadow:0 0 25px #fff2ae}
.idle-scene.bg-starry .scene-cloud{opacity:.24}
.idle-scene.bg-forest{background:linear-gradient(#dff4e8 0%,#f4fff8 42%,#c9ebcf 42%,#a6d8b6 100%)}
.idle-scene.bg-seaside{background:linear-gradient(#bfe9fb 0%,#eafcff 42%,#fdeec9 42%,#f3cf96 100%)}
.idle-scene.bg-autumn{background:linear-gradient(#ffdcae 0%,#fff0d8 42%,#f2c78e 42%,#d99a5e 100%)}
.scene-sun{position:absolute;right:13%;top:11%;width:50px;height:50px;border-radius:50%;background:#fff4bf;box-shadow:0 0 34px rgba(255,241,169,.8)}
.scene-cloud{position:absolute;background:rgba(255,255,255,.78);border-radius:999px;filter:blur(.2px);opacity:.8;animation:cloudDrift 18s linear infinite}
.scene-cloud::before,.scene-cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.scene-cloud.c1{width:76px;height:22px;left:12%;top:16%}
.scene-cloud.c1::before{width:30px;height:30px;left:10px;top:-13px}
.scene-cloud.c1::after{width:24px;height:24px;right:10px;top:-10px}
.scene-cloud.c2{width:58px;height:17px;right:24%;top:31%;animation-delay:-7s;opacity:.55}
.scene-cloud.c2::before{width:22px;height:22px;left:8px;top:-10px}
.scene-cloud.c2::after{width:18px;height:18px;right:8px;top:-8px}
.house{position:absolute;left:8%;bottom:34%;width:174px;height:112px;background:#ffe3d0;border-radius:14px 14px 8px 8px;box-shadow:0 8px 0 rgba(184,129,98,.16)}
.house-roof{position:absolute;left:-12px;top:-42px;width:198px;height:55px;background:linear-gradient(145deg,#f9a996,#e9877b);border-radius:16px 16px 4px 4px;transform:skewY(-1.5deg)}
.house-roof::after{content:"";position:absolute;left:50%;top:-14px;width:22px;height:22px;background:#e9877b;transform:translateX(-50%) rotate(45deg);border-radius:4px}
.house .window{position:absolute;left:22px;top:24px;width:44px;height:38px;border-radius:8px;background:#bfe5f7;border:5px solid #fff8ef;box-shadow:inset 0 0 0 2px #d3edf9}
.house .window::after{content:"";position:absolute;left:50%;top:0;width:2px;height:100%;background:#fff8ef;transform:translateX(-50%)}
.house .door{position:absolute;right:24px;bottom:0;width:39px;height:64px;border-radius:14px 14px 0 0;background:#c58c6e;border:4px solid #fff2e4}
.house .door::after{content:"•";position:absolute;right:6px;top:28px;color:#ffe9b4;font-size:18px;line-height:1}
.idle-scene .rug{position:absolute;bottom:9%;left:50%;transform:translateX(-50%);width:64%;height:38px;border-radius:50%;background:radial-gradient(ellipse,#ffd4dc 0 48%,#ffe8ee 49% 72%,transparent 73%);opacity:.9}
.idle-scene .grass{position:absolute;bottom:20%;left:0;right:0;height:12px;background:radial-gradient(ellipse at center,#91cf9b 0 50%,transparent 51%) repeat-x;background-size:24px 12px;opacity:.55}

.idle-pet .accessory{position:absolute;left:50%;top:-18px;transform:translateX(-50%) rotate(-8deg);font-size:31px;animation:wiggle 2.5s ease-in-out infinite;filter:drop-shadow(0 3px 2px rgba(0,0,0,.12))}
.idle-pet .shiny-star{position:absolute;font-size:20px;animation:sparkle 1.6s ease-in-out infinite;color:#ffd76a}
.idle-pet .shiny-star.s1{left:-9px;top:10px}.idle-pet .shiny-star.s2{right:-7px;top:34px;animation-delay:.6s}
.pet-shadow{width:96px;height:20px;border-radius:50%;background:rgba(91,66,44,.18);margin:-10px auto 0;filter:blur(3px);animation:shadowPulse 3.3s ease-in-out infinite}
.speech{
  position:absolute;left:calc(100% + 10px);bottom:62%;min-width:142px;max-width:220px;
  background:rgba(255,255,255,.92);border:1px solid #f1ddc7;border-radius:16px 16px 16px 4px;
  padding:9px 11px;font-size:11.5px;color:var(--ink-soft);box-shadow:0 10px 22px rgba(136,101,71,.1);

.speech .who{display:block;font-weight:800;color:var(--ink);font-size:10px;margin-bottom:1px}
.pet-name-bubble{
  position:absolute;left:50%;bottom:3px;transform:translateX(-50%);
  padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.86);border:1px solid #f2deca;
  font-size:10.5px;font-weight:700;white-space:nowrap;color:var(--ink-soft);
}
.idle-hud{position:absolute;right:12px;bottom:12px;left:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rate-badge{background:rgba(255,253,248,.9);border:1px solid #f1ddc7;border-radius:14px;padding:7px 11px;font-size:11px;box-shadow:0 5px 14px rgba(135,99,68,.09);backdrop-filter:blur(5px)}
.rate-badge b{font-size:13px;color:#b46e35;font-variant-numeric:tabular-nums}
.rate-badge small{display:block;color:var(--muted);font-size:9.5px;margin-top:1px}
.idle-hud .buttons{display:flex;gap:6px;align-items:center}
.idle-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.idle-stat{padding:10px 11px;border-radius:15px;background:rgba(255,255,255,.65);border:1px solid #f0dfca}
.idle-stat span{display:block;font-size:10px;color:var(--muted)}
.idle-stat b{font-size:15px;font-variant-numeric:tabular-nums}
.pending-box{display:flex;align-items:center;gap:10px;justify-content:space-between;Padding:11px 13px;border-radius:16px;background:linear-gradient(120deg,#fff5df,#ffe4dc);border:1px solid #f5d6c2;margin-top:12px;flex-wrap:wrap}
.pending-box .pending-nums{display:flex;gap:14px;font-size:12px;font-weight:700}
.pending-box .pending-nums small{display:block;color:var(--muted);font-weight:400;font-size:9.5px}
.team-chips{display:flex;gap:6px;flex-wrap:wrap}
.mini-pet{
  display:flex;align-items:center;gap:5px;padding:4px 8px 4px 4px;border-radius:999px;
  background:#fff;border:1px solid var(--line);font-size:10.5px;font-weight:700;
}
.mini-pet .mini-emoji{width:25px;height:25px;display:grid;place-items:center;border-radius:50%;font-size:17px;background:#fff7e7}
.mini-pet .front-mark{font-size:8px;color:var(--muted);font-weight:500}
.home-pet-img{width:96px;height:96px;border-radius:50%;object-fit:cover;display:inline-block;box-shadow:0 0 0 2px rgba(255,255,255,.92),0 6px 14px rgba(111,82,54,.18)}
.mini-pet-img{width:25px;height:25px;border-radius:50%;object-fit:cover;display:block;box-shadow:0 0 0 1px rgba(255,255,255,.85)}
.scene-pal{position:absolute;bottom:23%;z-index:3;filter:drop-shadow(0 4px 6px rgba(111,82,54,.14));transition:transform .18s ease}
.scene-pal.pal-click{cursor:pointer;user-select:none}
.scene-pal.pal-click:hover{transform:scale(1.12)}
.scene-pal.pal-click:active{transform:scale(.9)}
.scene-pal.pal-s1{left:7%;bottom:34%}
.scene-pal.pal-s2{right:7%;bottom:38%}
.scene-pal.pal-s3{left:16%;bottom:13%}
.scene-pal.pal-s4{right:16%;bottom:13%}
.scene-pal.pal-s5{right:27%;bottom:20%}
.pal-art{position:relative;display:block;line-height:0}
.pal-img{position:relative;z-index:1;width:54px;height:54px;border-radius:50%;object-fit:cover;display:block;animation:petFloat 3.2s ease-in-out infinite;background:#fff7e7}
.pal-emoji{font-size:54px;line-height:1;display:inline-block;animation:petFloat 3.2s ease-in-out infinite}
.scene-pal.pal-s2 .pal-img,.scene-pal.pal-s2 .pal-emoji{animation-delay:.55s}
.scene-pal.pal-s3 .pal-img,.scene-pal.pal-s3 .pal-emoji{animation-delay:1.1s}
.scene-pal.pal-s4 .pal-img,.scene-pal.pal-s4 .pal-emoji{animation-delay:1.6s}
.pal-acc{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:18px;animation:wiggle 2.6s ease-in-out infinite;filter:drop-shadow(0 2px 1px rgba(0,0,0,.12))}
.pal-spark{position:absolute;top:-3px;right:1px;color:#ffd76a;font-size:13px;animation:sparkle 1.5s ease-in-out infinite}
.pal-name{position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);font-size:9px;font-weight:700;background:rgba(255,255,255,.88);padding:1px 6px;border-radius:999px;white-space:nowrap;color:#7a5a44;box-shadow:0 1px 4px rgba(136,101,71,.12)}
.pal-setmain{position:absolute;top:-8px;right:-7px;width:20px;height:20px;border-radius:50%;border:1px solid #f0d9a8;background:#fff7df;font-size:11px;line-height:1;padding:0;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.14)}
.pal-extra .pal-img,.pal-extra .pal-emoji{outline:2px dashed #c9a8e8;outline-offset:1px}
.pal-art-inner{position:relative;width:54px;height:54px;display:grid;place-items:center}
.pal-emoji-bg{position:absolute;inset:0;display:grid;place-items:center;animation:none!important}
.pal-img.hidden{display:none}
.bond-echo{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:5;display:flex;flex-direction:column;gap:4px;align-items:center;max-width:94%;pointer-events:none}
.bond-quote-chip{background:rgba(255,255,255,.84);border:1px solid #f3d9ee;border-radius:999px;padding:3px 11px;font-size:10px;color:#8a5a86;box-shadow:0 3px 10px rgba(136,101,140,.14);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;animation:speechPop .4s ease}
.scene-photo{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.scene-photo img{width:100%;height:100%;object-fit:cover;opacity:.5}
.bond-photo{width:46px;height:30px;object-fit:cover;border-radius:8px;border:1px solid #f3d9ee;box-shadow:0 2px 8px rgba(136,101,140,.18)}
.bond-quote-chip b{color:#b4559f}
@media (max-width:420px){.bond-quote-chip{font-size:9px;max-width:86vw}}
.pal-heart{left:50%;top:4px;font-size:15px}
.scene-pal.pal-patted{animation:palBounce .36s ease}
@keyframes palBounce{0%{transform:scale(1)}35%{transform:scale(1.2) rotate(-5deg)}100%{transform:scale(1)}}
@keyframes palHop{0%,100%{transform:translateY(0)}40%{transform:translateY(-13px)}70%{transform:translateY(0) scale(.96)}}
@keyframes palSway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes palSpin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.scene-pal.act-hop .pal-art-inner{animation:palHop .8s ease-out 2}
.scene-pal.act-sway .pal-art-inner{animation:palSway 2.3s ease-in-out infinite}
.scene-pal.act-spin .pal-art-inner{animation:palSpin .9s ease-in-out 2}
.stage-blurb{font-size:9px;color:var(--muted);margin:3px 2px 0;line-height:1.35;min-height:24px}
.combo-pop{position:absolute;left:50%;top:2px;transform:translateX(-50%);z-index:8;font-weight:800;font-size:13px;color:#ff6fa5;text-shadow:0 1px 0 #fff,0 2px 6px rgba(255,111,165,.35);pointer-events:none;white-space:nowrap;animation:comboRise .95s ease forwards}
@keyframes comboRise{0%{opacity:0;transform:translate(-50%,8px) scale(.7)}22%{opacity:1;transform:translate(-50%,-6px) scale(1.12)}100%{opacity:0;transform:translate(-50%,-30px) scale(1)}}
.idle-pet-wrap.hero-evo .idle-pet{animation:petFloat 3.3s ease-in-out infinite,heroGlow 2.8s ease-in-out infinite}
@keyframes heroGlow{0%,100%{filter:drop-shadow(0 15px 10px rgba(111,82,54,.16))}50%{filter:drop-shadow(0 16px 16px rgba(255,214,106,.42))}}
@media (max-width:420px){.scene-pal.pal-s1{left:3%}.scene-pal.pal-s2{right:3%}.scene-pal.pal-s3{left:10%}.scene-pal.pal-s4{right:10%}.scene-pal.pal-s5{right:20%}.pal-art-inner{width:38px;height:38px}.pal-img{width:38px;height:38px}.pal-emoji{font-size:38px}.pal-name{display:none}.pal-acc{font-size:14px}.pal-setmain{width:17px;height:17px;font-size:9px}}
.quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.quick-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:16px;border:1px solid #f0dfca;background:rgba(255,255,255,.6);padding:12px 5px;font-size:11px;font-weight:700;color:var(--ink-soft);transition:transform .2s,background .2s}
.quick-btn:hover{transform:translateY(-2px);background:#fff9f0}
.quick-btn .emoji{font-size:24px}
.task-mini-list{display:flex;flex-direction:column;gap:8px}
.task-mini{display:flex;align-items:center;gap:8px;font-size:11.5px}
.task-mini .dot{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10px;background:#f7ebdb;color:var(--muted);flex:0 0 auto}
.task-mini.done .dot{background:#c9f1df;color:#2b8064}
.task-mini .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-mini .reward{font-size:10px;color:var(--muted);white-space:nowrap}
.home-bottom-grid{display:grid;grid-template-columns:1.3fr .9fr;gap:14px;margin-top:14px}
.boost-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.garden-card{margin-top:12px}
.garden-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.garden-cell{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border:1px solid var(--line);border-radius:14px;background:#fffdf6;cursor:pointer}
.garden-cell:disabled{cursor:default}
.garden-cell .garden-emoji{font-size:26px;line-height:1}
.garden-cell .garden-label{font-size:10px;color:var(--muted);line-height:1.2;text-align:center}
.garden-cell.plot-growing{background:#f3fbf0}
.garden-cell.plot-ready{background:#fff3ec;border-color:#f2b58a;animation:gardenPulse 1.5s ease-in-out infinite}
@keyframes gardenPulse{0%,100%{box-shadow:0 0 0 0 rgba(242,158,107,0)}50%{box-shadow:0 0 0 4px rgba(242,158,107,.16)}}
.garden-cell{position:relative}
.garden-cell.plot-growing .garden-emoji{animation:growSway 2.6s ease-in-out infinite}
@keyframes growSway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) translateY(-1px)}}
.water-drop{position:absolute;top:2px;right:6px;font-size:15px;pointer-events:none;animation:dropRise .9s ease forwards}
@keyframes dropRise{0%{opacity:0;transform:translateY(4px) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translateY(-10px) scale(1)}}
.mini-arena{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0}
.mini-foe{display:flex;flex-direction:column;gap:2px;align-items:center;background:#fff3ec;border:1px solid #f2c7a8;border-radius:14px;padding:10px 14px}
.mini-foe-emoji{font-size:30px;line-height:1}
.mini-foe-tip{font-size:9.5px;color:var(--muted);max-width:230px;text-align:center;line-height:1.4}
.mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.mini-el{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 6px;border-radius:13px;border:1px solid var(--line);background:var(--el-soft,#fff);cursor:pointer;transition:transform .15s ease}
.mini-el:hover{transform:translateY(-2px)}
.mini-el-emoji{font-size:20px;line-height:1}
.mini-el b{font-size:11px;color:var(--ink)}
.mini-el-tag{font-size:9px;color:var(--muted)}
.mini-el.beats{border-color:#8fd3ae;box-shadow:0 0 0 2px rgba(143,211,174,.25)}
.mini-msg{margin-top:10px;padding:9px 12px;border-radius:12px;font-size:12px;font-weight:600;line-height:1.4}
.mini-msg.ok{background:#e6f7ec;color:#2e7b5f;border:1px solid #b9e6c9}
.mini-msg.no{background:#fdeeee;color:#b15050;border:1px solid #f4c4c4}
@media (max-width:420px){.garden-grid{grid-template-columns:repeat(2,1fr)}.mini-grid{grid-template-columns:repeat(3,1fr)}}
.boost-pill{font-size:10.5px;padding:6px 9px;border-radius:11px;background:#fff1dc;border:1px dashed #f0cf9f;color:#95652d;font-weight:700}
.boost-pill.active{background:#daf7e9;border-color:#9edcbf;color:#2e7b5f}
.feed-hint{font-size:10.5px;color:var(--muted);margin-top:6px}

/* ---------- 宠物 ---------- */
.subnav{display:flex;gap:6px;padding:5px;background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}

.subnav button.active{background:#fff;color:var(--ink);box-shadow:0 4px 12px rgba(151,118,84,.1)}
.team-board{display:grid;gap:12px}
.formation-row{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.row-label{writing-mode:vertical-rl;text-orientation:upright;font-size:10px;letter-spacing:2px;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:4px 0;width:20px}
.slot{
  flex:1;min-width:120px;min-height:96px;border-radius:17px;border:1.5px dashed #e5cfb5;
  background:rgba(255,255,255,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;position:relative;padding:8px 6px;transition:.2s;
}
.slot.filled{border-style:solid;background:linear-gradient(150deg,#fffdf8,#fff4e7);border-color:var(--rarity,#ead6bf);box-shadow:var(--shadow-soft)}
.slot:hover{transform:translateY(-2px);background:#fffaf2}
.slot .slot-emoji{font-size:35px;line-height:1.1;position:relative}
.slot .art-frame{margin:0 auto}
.slot .slot-name{font-size:11px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .slot-lv{font-size:9.5px;color:var(--muted)}
.slot .slot-power{font-size:10px;color:#ac7435;font-weight:700}
.slot .remove-x{position:absolute;right:5px;top:5px;width:20px;height:20px;border-radius:50%;border:0;background:#fff0e3;color:#b08266;font-size:11px;line-height:1;display:grid;place-items:center}
.slot .remove-x:hover{background:#ffd9d0;color:#9c4e3d}
.slot.empty{color:#bda98f;font-size:11px;gap:3px}
.slot.empty .plus{font-size:24px;line-height:1;opacity:.65}
.slot .slot-role{position:absolute;left:6px;top:6px;font-size:8px;padding:1px 5px;border-radius:6px;background:#fff0df;color:#a47746}
.pet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.pet-card{
  position:relative;border-radius:19px;padding:12px 12px 10px;background:linear-gradient(155deg,var(--paper),var(--rarity-soft,#f7f2eb));
  border:1.5px solid color-mix(in srgb,var(--rarity,#d8c8b6) 55%,white);
  box-shadow:0 6px 16px rgba(151,118,84,.08);transition:transform .2s, box-shadow .2s;overflow:hidden;
}
.pet-card:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(151,118,84,.13)}
.pet-card.ssr{box-shadow:0 0 0 2px rgba(255,195,105,.22),0 8px 22px rgba(240,162,60,.16)}

.pet-card.deployed{border-color:var(--mint-deep);box-shadow:0 0 0 2px rgba(92,191,154,.12),var(--shadow-soft)}
.pet-top{display:flex;align-items:flex-start;justify-content:space-between;gap:5px}
.pet-avatar{font-size:43px;line-height:1;position:relative;display:inline-block;filter:drop-shadow(0 4px 3px rgba(86,62,41,.13));transition:.2s}
.pet-card:hover .pet-avatar{transform:translateY(-2px) rotate(-3deg)}
.pet-avatar .acc{position:absolute;left:50%;top:-10px;transform:translateX(-50%);font-size:18px}
.pet-avatar.droopy{filter:grayscale(.45) drop-shadow(0 4px 3px rgba(86,62,41,.1));opacity:.83}
.pet-avatar .spark{position:absolute;font-size:11px;color:#f6bd3b;animation:sparkle 1.5s infinite}
.pet-avatar .spark.s1{left:-5px;top:3px}.pet-avatar .spark.s2{right:-4px;top:22px;animation-delay:.55s}
.art-frame{position:relative;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;line-height:1}

.art-modal{width:76px;height:76px}
.art-frame.art-tag{width:15px;height:15px;flex:0 0 auto}
.art-frame.art-resico{width:16px;height:16px;flex:0 0 auto}
.art-frame.art-bagico{width:20px;height:20px;flex:0 0 auto}
.art-frame.art-shopico{width:24px;height:24px;flex:0 0 auto}
.b-unit.dead .art-frame img{filter:grayscale(1);opacity:.5}
.pet-avatar.droopy .art-frame img{filter:grayscale(.45);opacity:.83}
.pet-name{font-size:13px;font-weight:800;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pet-sub{font-size:9.5px;color:var(--muted);margin-top:1px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pet-headline{flex:1;min-width:0}
.pet-card .stars{margin-top:5px}

.pet-card .pet-actions{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}

.intimacy-hearts{display:flex;gap:1px;font-size:9px;letter-spacing:-1px}
.evo-track{display:flex;align-items:center;gap:4px;margin:8px 0}
