function pushBattleLog(b, text, kind = 'info') {
  b.log.push({ text, kind });
  if (b.log.length > 80) b.log.splice(0, b.log.length - 80);
}

function effectiveStat(unit, stat) {
  if (stat === 'dr') {
    let add = 0;
    for (const buff of unit.buffs) if (buff.stat === 'dr') add += buff.pct;
    return clamp(unit.dr + add, 0, 0.85);
  }
  let multiplier = 1;
  for (const buff of unit.buffs) if (buff.stat === stat) multiplier += buff.pct;
  const value = unit[stat] * Math.max(0.12, multiplier);
  return Math.max(0.1, value);
}

function aliveOf(b, side) {
  return (side === 'ally' ? b.allies : b.enemies).filter(u => u.alive);
}
function sideOf(b, unit) {
  return unit.side === 'ally' ? b.allies : b.enemies;
}
function foeSideOf(b, unit) {
  return unit.side === 'ally' ? b.enemies : b.allies;
}
function resolveTargets(target, caster, b) {
  const foes = foeSideOf(b, unitOfBattleSide(caster.side, b)).filter(u => u.alive);
  const allies = sideOf(b, unitOfBattleSide(caster.side, b)).filter(u => u.alive);
  const allAllies = sideOf(b, unitOfBattleSide(caster.side, b));
  if (!target) return [];
  // 集火仅作用于我方单体敌方技能；AoE（enemy_all）与友方技能不被改写
  if (b && caster.side === 'ally' && b.focusUid && ['enemy_front', 'enemy_back', 'enemy_lowest', 'enemy_random'].includes(target)) {
    const f = b.enemies.find(u => u.uid === b.focusUid && u.alive);
    if (f) return [f];
  }
  if (target === 'self') return [caster];
  if (target === 'enemy_front') {
    const fronts = foes.filter(u => u.row === 'front');
    return [(fronts.length ? fronts : foes).sort((a, c) => a.hp / a.maxHp - c.hp / c.maxHp)[0]].filter(Boolean);
  }
  if (target === 'enemy_back') {
    const backs = foes.filter(u => u.row === 'back');
    return [(backs.length ? backs : foes).sort((a, c) => a.hp / a.maxHp - c.hp / c.maxHp)[0]].filter(Boolean);
  }
  if (target === 'enemy_lowest') {
    return [foes.sort((a, c) => a.hp / a.maxHp - c.hp / c.maxHp)[0]].filter(Boolean);
  }
  if (target === 'enemy_random') return foes.length ? [pick(foes)] : [];
  if (target === 'enemy_all') return foes;
  if (target === 'ally_all') return allies;
  if (target === 'ally_lowest') return [allies.sort((a, c) => a.hp / a.maxHp - c.hp / c.maxHp)[0]].filter(Boolean);
  if (target === 'ally_fallen') return allAllies.filter(u => !u.alive);
  return [];
}
function unitOfBattleSide(side, b) {
  return side === 'ally' ? b.allies[0] : b.enemies[0];
}

function startRound(b) {
  if (b.over) return;
  if (b.round >= b.maxRounds) { endBattle('timeout'); return; }
  b.round += 1;
  const units = [...b.allies, ...b.enemies].filter(u => u.alive);
  units.forEach(u => {
    u.queueSpeed = effectiveStat(u, 'spd') * rnd(0.95, 1.05);
  });
  b.queue = units.sort((a, c) => c.queueSpeed - a.queueSpeed);
  b.idx = 0;
  pushBattleLog(b, `—— 第 ${b.round} 回合 ——`, 'round');
}
function endRound(b, events = []) {
  for (const unit of [...b.allies, ...b.enemies]) {
    if (!unit.alive) continue;
    for (const key of Object.keys(unit.cooldowns)) if (unit.cooldowns[key] > 0) unit.cooldowns[key] -= 1;
    unit.buffs = unit.buffs.filter(buff => {
      buff.turns -= 1;
      return buff.turns > 0;
    });
    if (unit.shieldTurns > 0) {
      unit.shieldTurns -= 1;
      if (unit.shieldTurns <= 0) unit.shield = 0;
    }
    // 持续伤害 dot（灼烧等）：每回合按施术者攻击 × 固定比例扣血，不吃暴击/闪避/克制
    let fatal = false;
    unit.dots = (unit.dots || []).filter(dot => {
      dot.turns -= 1;
      const amount = Math.max(1, Math.round(dot.atk * num(dot.mult, 0.1)));
      unit.hp = Math.max(0, unit.hp - amount);
      events.push({ type: 'dotTick', unitUid: unit.uid, amount, turns: dot.turns, dotKind: dot.kind || 'burn' });
      if (unit.hp <= 0) fatal = true;
      return dot.turns > 0;
    });
    // 持续回复 hot：每回合按自身最大生命比例回血；若本回合 dot 已致命，不再把单位拉起来
    if (fatal) {
      unit.hots = [];
    } else {
      unit.hots = (unit.hots || []).filter(hot => {
        hot.turns -= 1;
        const amount = Math.max(1, Math.round(unit.maxHp * num(hot.hpPct, 0.03)));
        unit.hp = Math.min(unit.maxHp, unit.hp + amount);
        events.push({ type: 'hotTick', unitUid: unit.uid, amount, turns: hot.turns });
        return hot.turns > 0;
      });
    }
    if (fatal || unit.hp <= 0) {
      unit.alive = false;
      unit.hp = 0;
      unit.rage = 0;
      events.push({ type: 'death', unitUid: unit.uid });
      pushBattleLog(b, `💫 ${unit.name} 倒下了`, 'death');
    }
  }
}

function advanceTurn() {
  const b = UI.battle;
  const events = [];
  if (!b || b.over) return events;
  checkBattleEnd(b);
  if (b.over) return events;
  if (!b.queue.length || b.idx >= b.queue.length) {
    if (b.round >= b.maxRounds) { endBattle('timeout'); return events; }
    startRound(b);
    if (b.over) return events;
  }
  let unit = null;
  while (b.idx < b.queue.length) {
    const candidate = b.queue[b.idx++];
    if (candidate && candidate.alive) { unit = candidate; break; }
  }
  if (!unit) {
    endRound(b, events);
    checkBattleEnd(b);
    if (b.over) return events;
    if (b.round >= b.maxRounds) endBattle('timeout');
    return events;
  }
  const active = chooseSkillIndex(unit);
  executeUnitSkill(unit, active, events);
  checkBattleEnd(b);
  if (!b.over && b.idx >= b.queue.length) {
    endRound(b, events);
    checkBattleEnd(b);
    if (b.over) return events;
    if (b.round >= b.maxRounds) endBattle('timeout');
  }
  return events;
}

function skillEffectsOf(index, unit) {
  const entry = unit.skills[index];
  return (entry && entry.def && entry.def.effects) || [];
}
function chooseSkillIndex(unit) {
  const b = UI.battle;
  if (!b) return 0;
  if (b.manualSkill && b.manualSkill[unit.uid] != null) {
    const mi = b.manualSkill[unit.uid];
    delete b.manualSkill[unit.uid];
    if (unit.skills[mi] && (mi === 1 || mi === 2) && unit.cooldowns[mi] <= 0) return mi;
  }
  const allies = sideOf(b, unit).filter(u => u.alive);
  const hurt = allies.some(u => u.hp / Math.max(1, u.maxHp) < 0.76);
  const fallen = allies.length < sideOf(b, unit).length;
  const ultIdx = Math.max(1, unit.skills.length - 1);
  const ready = unit.skills.map((_, i) => i).filter(i => i >= 1 && i < ultIdx && unit.skills[i] && !(unit.cooldowns[i] > 0));
  const ult = unit.skills[ultIdx] && unit.skills[ultIdx].def;
  if (unit.rage >= 100) {
    const ultEffects = (ult && ult.effects) || [];
    const ultDamage = ultEffects.some(e => e.type === 'damage');
    const ultHeal = ultEffects.some(e => e.type === 'heal');
    const ultRevive = ultEffects.some(e => e.type === 'revive');
    const ultSupport = ultEffects.some(e => e.type === 'buff' || e.type === 'shield');
    if (ultDamage || ultSupport || (hurt || fallen) && (ultHeal || ultRevive)) return ultIdx;
  }
  // 优先使用带伤害的主动技，避免辅助在全员满血时反复治疗而拖慢战斗。
  for (const i of ready) if (skillEffectsOf(i, unit).some(e => e.type === 'damage')) return i;
  for (const i of ready) {
    const effects = skillEffectsOf(i, unit);
    if (hurt && effects.some(e => e.type === 'heal')) return i;
    if (fallen && effects.some(e => e.type === 'revive')) return i;
  }
  // 非伤害的增益/护盾只在开场两回合使用，之后回归普攻，保证辅助也有输出。
  if (b.round <= 2) {
    for (const i of ready) {
      const effects = skillEffectsOf(i, unit);
      if (effects.some(e => e.type === 'buff' || e.type === 'shield')) return i;
    }
  }
  return 0;
}

function executeUnitSkill(unit, index, events) {
  const b = UI.battle;
  if (!b || b.over || !unit.alive) return;
  const skillEntry = unit.skills[index] || unit.skills[0];
  if (!skillEntry || !skillEntry.def) return;
  const skill = skillEntry.def;
  if (skill.kind === 'ult') {
    if (unit.rage < 100) return;
    unit.rage = 0;
  } else if (index > 0) {
    unit.cooldowns[index] = Math.max(1, skill.cooldown || 2);
  }
  pushBattleLog(b, `${unit.name} 使用了「${skill.name}」`, 'skill');
  if (unit.side === 'ally') {
    if (unit.hp / Math.max(1, unit.maxHp) < 0.35) allyBattleQuip(b, unit, true);
    else allyBattleQuip(b, unit, false);
  }
  // 表现层事件：行动高亮、出手动作、主动技横幅（不改动结算逻辑）
  events.push({ type: 'turn', unitUid: unit.uid });
  events.push({ type: 'action', unitUid: unit.uid, kind: skill.kind || 'normal' });
  if (skill.kind === 'active') {
    events.push({ type: 'skill', unitUid: unit.uid, name: skill.name, skill });
  }
  if (skill.kind === 'ult') {
    events.push({ type: 'ult', unitUid: unit.uid, name: skill.name, rarity: unit.rarity, element: unit.element });
    pushBattleLog(b, `✨ ${unit.name} 的奥义发动！`, 'ult');
    // 合体技：任意一方满怒即可启动——羁绊队友在场、存活且怒气 ≥40 就会跟手
    unit.comboBoost = 1;
    if (unit.bondCombo) {
      const mate = b.allies.find(a => a !== unit && a.alive && a.bondCombo === unit.bondCombo && num(a.rage, 0) >= 40);
      if (mate) {
        mate.rage = Math.max(0, num(mate.rage, 0) - 40);
        unit.comboBoost = 1.5;
        events.push({ type: 'ult', unitUid: mate.uid, name: '合体 · ' + skill.name, rarity: mate.rarity, element: mate.element });
        pushBattleLog(b, '💞 合体技 · ' + unit.name + ' × ' + mate.name + '！伤害 ×1.5', 'ult');
      }
    }
  }
  const levelMult = (1 + (skillEntry.level - 1) * 0.06) * (unit.comboBoost || 1);
    unit.comboBoost = 1;
  for (const effect of skill.effects || []) {
    applySkillEffect(unit, skill, effect, levelMult, events);
    if (b.over) break;
  }
  if (skill.kind !== 'ult') {
    unit.rage = Math.min(100, unit.rage + (skill.rageGain || (skill.kind === 'active' ? 10 : 30)));
  }
  events.push({ type: 'rage', unitUid: unit.uid, rage: unit.rage });
}

function applySkillEffect(caster, skill, effect, levelMult, events) {
  const b = UI.battle;
  if (!b || b.over) return;
  const targets = resolveTargets(effect.target, caster, b);
  if (!targets.length) return;
  if (effect.type === 'damage') {
    const primary = new Set();
    for (const target of targets) {
      if (!target.alive) continue;
      primary.add(target.uid);
      damageOne(caster, target, effect.mult * levelMult, events);
    }
    if (effect.splash) {
      const extra = aliveOf(b, caster.side === 'ally' ? 'enemy' : 'ally').filter(u => !primary.has(u.uid));
      for (const target of extra.slice(0, 2)) {
        damageOne(caster, target, effect.mult * levelMult * effect.splash, events, true);
      }
    }
    return;
  }
  if (effect.type === 'heal') {
    const healMult = levelMult;
    for (const target of targets) {
      if (!target.alive) continue;
      const amount = Math.max(1, Math.round((caster.atk * num(effect.atkPct, 0) + caster.maxHp * num(effect.hpPct, 0)) * healMult));
      const before = target.hp;
      target.hp = Math.min(target.maxHp, target.hp + amount);
      const real = Math.round(target.hp - before);
      if (real <= 0) continue;
      events.push({ type: 'heal', unitUid: target.uid, amount: real });
      pushBattleLog(b, `${caster.name} 治疗了 ${target.name} ${fmt(real)} 点生命`, 'heal');
    }
    return;
  }
  if (effect.type === 'buff') {
    for (const target of targets) {
      if (!target.alive) continue;
      const pct = num(effect.pct, 0);
      if (!pct) continue;
      target.buffs.push({
        stat: effect.stat,
        pct,
        turns: Math.max(1, Math.floor(num(effect.turns, 2))),
        source: caster.name
      });
      events.push({ type: 'buff', unitUid: target.uid, stat: effect.stat, pct, turns: effect.turns });
      const statName = ({ atk: '攻击', def: '防御', spd: '速度', dr: '减伤' })[effect.stat] || effect.stat;
      pushBattleLog(b, `${target.name} 的${statName}${pct > 0 ? '提升' : '降低'} ${Math.abs(Math.round(pct * 100))}%`, 'buff');
    }
    return;
  }
  if (effect.type === 'shield') {
    for (const target of targets) {
      if (!target.alive) continue;
      const amount = Math.max(1, Math.round(target.maxHp * num(effect.hpPct, 0) * levelMult));
      target.shield += amount;
      target.shieldTurns = Math.max(target.shieldTurns, Math.floor(num(effect.turns, 2)));
      events.push({ type: 'shield', unitUid: target.uid, amount });
      pushBattleLog(b, `${target.name} 获得 ${fmt(amount)} 点护盾`, 'buff');
    }
    return;
  }
  if (effect.type === 'revive') {
    if (caster.reviveUsed) return;
    const fallen = targets.find(u => !u.alive);
    if (!fallen) return;
    caster.reviveUsed = true;
    fallen.alive = true;
    fallen.hp = Math.max(1, Math.round(fallen.maxHp * num(effect.hpPct, 0.35)));
    fallen.rage = 30;
    fallen.buffs = [];
    fallen.shield = 0;
    events.push({ type: 'revive', unitUid: fallen.uid });
    pushBattleLog(b, `🪶 ${fallen.name} 在余烬中重新站了起来！`, 'heal');
    return;
  }
  if (effect.type === 'dot') {
    // 持续伤害：按施术者当前攻击 × mult，挂 turns 回合，每回合结算一次
    for (const target of targets) {
      if (!target.alive) continue;
      target.dots.push({
        kind: effect.dotKind || 'burn',
        mult: num(effect.mult, 0.10),
        turns: Math.max(1, Math.floor(num(effect.turns, 3))),
        atk: effectiveStat(caster, 'atk')
      });
      events.push({ type: 'dot', unitUid: target.uid, turns: effect.turns, dotKind: effect.dotKind || 'burn' });
      pushBattleLog(b, `${target.name} 被「${effect.dotKind === 'poison' ? '毒蚀' : '灼烧'}」缠住，持续 ${effect.turns || 3} 回合`, 'ctrl');
    }
    return;
  }
  if (effect.type === 'hot') {
    // 持续回复：按受击者最大生命比例回血，挂 turns 回合
    for (const target of targets) {
      if (!target.alive) continue;
      target.hots.push({ hpPct: num(effect.hpPct, 0.03), turns: Math.max(1, Math.floor(num(effect.turns, 2))) });
      events.push({ type: 'hot', unitUid: target.uid, turns: effect.turns });
      pushBattleLog(b, `${target.name} 获得持续回复，${effect.turns || 2} 回合内缓缓回血`, 'heal');
    }
    return;
  }
  if (effect.type === 'energy') {
    // 充能：立即提升怒气，为奥义蓄力（不替代普攻/主动技的回怒节奏）
    const gain = Math.round(num(effect.rage, 10) * levelMult);
    for (const target of targets) {
      if (!target.alive) continue;
      target.rage = Math.min(100, target.rage + gain);
      events.push({ type: 'energy', unitUid: target.uid, amount: gain });
      pushBattleLog(b, `${target.name} 战意充能，怒气 +${gain}`, 'buff');
    }
    return;
  }
}

// 伤害公式（核心）：
// dmg = 攻击 × 技能倍率 × (1 + 暴击加成[暴击时]) × 克制系数
//       × (1 − 对方有效减伤) × 随机浮动(0.95~1.05)
// 对方有效减伤 = 面板减伤 + 防御/(防御 + 900 + 等级×28)，封顶 80%。
// 结算顺序：命中判定 → 防御减伤 → 暴击 → 属性克制 → ±5% 浮动 → 护盾吸收；
// 即“先防后暴”，防御先吃掉一部分基础伤害，再由暴击放大最终收益。
function damageOne(caster, target, multiplier, events, splash = false) {
  const b = UI.battle;
  if (!target.alive) return;
  const hitChance = clamp(0.92 + caster.hit - target.dodge, 0.55, 0.99);
  if (!chance(hitChance)) {
    const dodged = num(target.dodge, 0) > 0.01;
    events.push({ type: 'miss', unitUid: target.uid, label: dodged ? '闪避' : 'MISS', dodged });
    pushBattleLog(b, dodged ? `${caster.name} 的攻击被 ${target.name} 闪避了` : `${caster.name} 的攻击落空了（MISS）`, 'ctrl');
    return;
  }
  const isCrit = chance(caster.crit);
  const elemMult = elementMultiplier(caster.element, target.element);
  const targetDef = effectiveStat(target, 'def');
  const defReduction = clamp(target.dr + targetDef / (targetDef + 900 + target.level * 28) * 0.55, 0, 0.80);
  const variance = rnd(0.95, 1.05);
  let damage = effectiveStat(caster, 'atk') * multiplier * (isCrit ? (1 + caster.critDmg) : 1) * elemMult * (1 - defReduction) * variance;
  if (splash) damage *= 0.9;
  damage = Math.max(1, Math.round(damage));
  let absorbed = 0;
  if (target.shield > 0) {
    absorbed = Math.min(target.shield, damage);
    target.shield -= absorbed;
    damage -= absorbed;
  }
  target.hp = Math.max(0, target.hp - damage);
  target.rage = Math.min(100, target.rage + 6);
  if (caster.side === 'ally') { b.totalDamage += damage; perfRecordHit(caster, damage, isCrit); }
  if (caster.lifesteal > 0 && damage > 0) {
    const before = caster.hp;
    caster.hp = Math.min(caster.maxHp, caster.hp + damage * caster.lifesteal);
    const real = Math.round(caster.hp - before);
    if (real > 0) events.push({ type: 'heal', unitUid: caster.uid, amount: real, small: true });
  }
  const effectText = elemMult > 1 ? '效果拔群' : (elemMult < 1 ? '效果一般' : '');
  events.push({
    type: 'damage',
    unitUid: target.uid,
    amount: damage,
    crit: isCrit,
    elemMult,
    elemText: effectText,
    absorbed,
    splash
  });
  pushBattleLog(
    b,
    `${caster.name} 对 ${target.name} 造成 ${fmt(damage)} 伤害${isCrit ? '（暴击）' : ''}${effectText ? '（' + effectText + '）' : ''}`,
    'damage'
  );
  if (target.hp <= 0 && target.alive) {
    // 多命首领：还有命就原地复活，血回满、换下一张立绘，越打越凶
    if (target.side === 'enemy' && Math.floor(num(target.lifeLeft, 1)) > 1) {
      target.lifeLeft = Math.floor(num(target.lifeLeft, 1)) - 1;
      target.hp = target.maxHp;
      target.shield = 0;
      target.rage = 0;
      target.atk = Math.round(target.atk * 1.06);
      events.push({ type: 'bossRevive', unitUid: target.uid, lifeLeft: Math.floor(num(target.lifeLeft, 1)) });
      pushBattleLog(b, `🌙 ${target.name} 还没走 —— 第 ${Math.floor(num(target.lifeLeft, 1))} 条命`, 'heal');
      return;
    }
    target.alive = false;
    target.hp = 0;
    target.rage = 0;
    events.push({ type: 'death', unitUid: target.uid });
    pushBattleLog(b, `💫 ${target.name} 倒下了`, 'death');
  }
}

function checkBattleEnd(b) {
  if (!b || b.over) return;
  if (!b.allies.some(u => u.alive)) { endBattle('lose'); return; }
  if (!b.enemies.some(u => u.alive)) { endBattle('win'); return; }
  if (b.round >= b.maxRounds && b.idx >= b.queue.length) endBattle('timeout');
}
function endBattle(outcome) {
  const b = UI.battle;
  if (!b || b.over) return;
  b.over = true;
  b.outcome = outcome;
  b.win = outcome === 'win';
  markActiveTurn(null);
  if (b.timer) { clearTimeout(b.timer); b.timer = null; }
  pushBattleLog(b, outcome === 'win' ? '🎉 战斗胜利！' : (outcome === 'timeout' ? '⌛ 回合耗尽 · 你撑住了' : '😴 你睡着了…'), 'result');
}

function battleLoop() {
  const b = UI.battle;
  if (!b || b.over) {
    if (b && b.over && !b.finished) finishBattle();
    return;
  }
  b.timer = null;
  const events = advanceTurn();
  if (!b.silent) applyBattleEvents(events);
  updateBattleUI();
  if (b.over) { finishBattle(); return; }
  if (b.paused) { b.timer = null; return; }
  b.timer = setTimeout(battleLoop, b.speed >= 2 ? 340 : 760);
}

function applyBattleEvents(events) {
  const b = UI.battle;
  if (!b) return;
  for (const event of events) {
    if (!event) continue;
    if (event.type === 'turn') {
      markActiveTurn(event.unitUid);
    } else if (event.type === 'action') {
      playUnitAction(event.unitUid, event.kind);
    } else if (event.type === 'skill') {
      showSkillBanner(event.unitUid, event.name, event.skill);
    } else if (event.type === 'damage') {
      showBattleFloat(event.unitUid, '-' + fmt(event.amount), 'dmg' + (event.crit ? ' crit' : ''));
      if (event.crit) { showBattleFloat(event.unitUid, '暴击!', 'crit-tag'); critImpact(event.unitUid); }
      if (event.elemMult > 1) showBattleFloat(event.unitUid, '克制 ×1.5', 'elem-strong');
      else if (event.elemMult && event.elemMult < 1) showBattleFloat(event.unitUid, '抵抗 ×0.75', 'elem-weak');
      else if (event.elemText) showBattleFloat(event.unitUid, event.elemText, 'effect');
      if (event.absorbed) showBattleFloat(event.unitUid, '盾 -' + fmt(event.absorbed), 'shield');
      flashBattleUnit(event.unitUid);
      playSfx(event.crit ? 'crit' : 'hit');
    } else if (event.type === 'heal') {
      if (!event.small) { showBattleFloat(event.unitUid, '+' + fmt(event.amount), 'heal'); healRing(event.unitUid); }
      playSfx('heal');
    } else if (event.type === 'miss') {
      showBattleFloat(event.unitUid, event.label || '闪避', event.dodged ? 'dodge' : 'miss');
      playDodgeOut(event.unitUid);
    } else if (event.type === 'buff') {
      const label = ({ atk: '攻击', def: '防御', spd: '速度', dr: '减伤' })[event.stat] || '状态';
      showBattleFloat(event.unitUid, `${label}${event.pct > 0 ? '↑' : '↓'}`, 'buff');
    } else if (event.type === 'shield') {
      showBattleFloat(event.unitUid, '盾 +' + fmt(event.amount), 'shield');
    } else if (event.type === 'dot') {
      showBattleFloat(event.unitUid, `灼烧·${event.turns}回合`, 'dot');
    } else if (event.type === 'hot') {
      showBattleFloat(event.unitUid, `回复·${event.turns}回合`, 'hot');
    } else if (event.type === 'energy') {
      showBattleFloat(event.unitUid, '⚡+' + fmt(event.amount), 'energy');
    } else if (event.type === 'dotTick') {
      showBattleFloat(event.unitUid, '🔥-' + fmt(event.amount), 'dot');
    } else if (event.type === 'hotTick') {
      showBattleFloat(event.unitUid, '💚+' + fmt(event.amount), 'hot');
    } else if (event.type === 'death') {
      playDeathFall(event.unitUid);
    } else if (event.type === 'revive') {
      resetDeathFall(event.unitUid);
      showBattleFloat(event.unitUid, '复活！', 'heal');
      playSfx('revive');
    } else if (event.type === 'bossRevive') {
      resetDeathFall(event.unitUid);
      showBattleFloat(event.unitUid, '还剩 ' + Math.max(1, Math.floor(num(event.lifeLeft, 1))) + ' 条命', 'boss');
      playSfx('revive');
    } else if (event.type === 'ult') {
      showUltFlash(event.name, event.rarity, event.element);
      playSfx('ult');
    }
  }
  renderBattleLog();
}

/* -------- 表现层小工具（只切换 class / DOM，不参与结算） -------- */
const B_ACTION_MS = { normal: 150, active: 240, ult: 320 };
function bSpeedFactor() {
  const b = UI.battle;
  return b && b.speed >= 2 ? 0.5 : 1;
}
function playUnitAction(uid, kind) {
  const el = getBattleUnitEl(uid);
  if (!el) return;
  const cls = kind === 'ult' ? 'ult-lunge' : (kind === 'active' ? 'cast-raise' : 'attack-forward');
  el.classList.remove('attack-forward', 'cast-raise', 'ult-lunge');
  void el.offsetWidth;
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), Math.round((B_ACTION_MS[kind] || B_ACTION_MS.normal) * bSpeedFactor()));
}
function markActiveTurn(uid) {
  $$('#battleRoot .b-unit.active-turn').forEach(el => el.classList.remove('active-turn'));
  if (!uid) return;
  const el = getBattleUnitEl(uid);
  if (el) el.classList.add('active-turn');
}
const SKILL_STAT_LABEL = { hp: '生命', atk: '攻击', def: '防御', spd: '速度' };
const SKILL_TARGET_LABEL = { enemy_front: '前排', enemy_back: '后排', enemy_all: '全体', enemy_lowest: '残血', ally_all: '我方全体', ally_lowest: '最脆友方', ally_fallen: '倒下友方', self: '自身' };
// 把技能效果翻译成可读的数值标签（技能等级越高，数字越大）
function skillStatChips(skill, lv = 1) {
  const effects = (skill && skill.effects) || [];
  const scale = 1 + (Math.max(1, Math.min(10, lv)) - 1) * 0.06;
  const pct = v => Math.round(v * scale * 100) + '%';
  const who = tg => SKILL_TARGET_LABEL[tg] || '';
  const chips = [];
  for (const e of effects) {
    if (e.type === 'damage') chips.push(`⚔ 伤害 ${pct(num(e.mult, 1))}${who(e.target) ? '·' + who(e.target) : ''}${num(e.splash, 0) ? '（溅射 ' + pct(num(e.splash, 0)) + '）' : ''}`);
    else if (e.type === 'heal') {
      const bits = [];
      if (num(e.atkPct, 0)) bits.push('攻击×' + pct(num(e.atkPct, 0)));
      if (num(e.hpPct, 0)) bits.push('生命' + pct(num(e.hpPct, 0)));
      chips.push('💚 治疗 ' + bits.join('+') + (who(e.target) ? '·' + who(e.target) : ''));
    }
    else if (e.type === 'shield') chips.push('🛡 护盾 ' + pct(num(e.hpPct, 0)) + ' · ' + Math.max(1, Math.floor(num(e.turns, 2))) + '回合');
    else if (e.type === 'buff') {
      const stat = SKILL_STAT_LABEL[e.stat] || e.stat;
      const v = num(e.pct, 0);
      chips.push('📈 ' + stat + (v >= 0 ? '+' : '') + Math.round(v * 100) + '% · ' + Math.max(1, Math.floor(num(e.turns, 2))) + '回合');
    }
    else if (e.type === 'dot') chips.push('🔥 ' + (e.dotKind === 'poison' ? '毒蚀' : '灼烧') + ' ' + pct(num(e.mult, 0.05)) + '×' + Math.max(1, Math.floor(num(e.turns, 3))) + '回合');
    else if (e.type === 'hot') chips.push('🌿 回复 ' + pct(num(e.hpPct, 0.03)) + '×' + Math.max(1, Math.floor(num(e.turns, 2))) + '回合');
    else if (e.type === 'energy') chips.push('⚡ 充能 +' + Math.round(num(e.rage, 8)));
    else if (e.type === 'revive') chips.push('🪶 复活 ' + pct(num(e.hpPct, 0.35)));
  }
  if (skill && skill.kind === 'ult') chips.push('🔥 奥义 · 耗怒 100');
  else if (skill && skill.kind === 'basic') chips.push('⚡ 怒气 +' + Math.round(num(skill.rageGain, 35)));
  else if (skill && num(skill.cooldown, 0)) chips.push('⏱ 冷却 ' + num(skill.cooldown, 0) + ' 回合');
  return chips;
}
function skillEffectTags(skill) {
  const effects = (skill && skill.effects) || [];
  const has = (type) => effects.some(e => e.type === type);
  const tags = [];
  if (has('revive')) tags.push('复活');
  if (has('heal')) tags.push('治疗');
  if (has('hot')) tags.push('持续回复');
  if (has('shield')) tags.push('护盾');
  if (has('buff')) tags.push(effects.some(e => e.type === 'buff' && num(e.pct, 0) < 0) ? '削弱' : '增益');
  if (has('dot')) tags.push('持续伤害');
  if (has('energy')) tags.push('充能');
  if (has('damage')) tags.push('伤害');
  return tags.slice(0, 3);
}
function showSkillBanner(uid, name, skill) {
  const el = getBattleUnitEl(uid);
  if (!el) return;
  const wrap = el.querySelector('.b-emoji-wrap');
  if (!wrap) return;
  const banner = document.createElement('div');
  banner.className = 'b-skill-banner';
  banner.innerHTML = `<span>${esc(name)}</span>` + skillEffectTags(skill).map(t => `<span class="skill-tag">${esc(t)}</span>`).join('');
  wrap.appendChild(banner);
  setTimeout(() => banner.remove(), Math.round(1050 * bSpeedFactor()));
}
function playDodgeOut(uid) {
  const el = getBattleUnitEl(uid);
  if (!el) return;
  el.classList.remove('dodge-out');
  void el.offsetWidth;
  el.classList.add('dodge-out');
  setTimeout(() => el.classList.remove('dodge-out'), Math.round(520 * bSpeedFactor()));
}
function playDeathFall(uid) {
  const el = getBattleUnitEl(uid);
  if (!el) return;
  el.classList.add('death-fall');
}
function resetDeathFall(uid) {
  const el = getBattleUnitEl(uid);
  if (!el) return;

}
const B_TRANSIENT_CLASSES = ['attack-forward', 'cast-raise', 'ult-lunge', 'hit-flash', 'damage-shake', 'hit-recoil', 'dodge-out', 'death-fall', 'active-turn', 'heal-ring', 'crit-impact'];
function clearBattleFx() {

  $$('#battleRoot .b-skill-banner, #battleRoot .float-num').forEach(el => el.remove());

function showBattleFloat(uid, text, cls) {
  const unitEl = getBattleUnitEl(uid);
  if (!unitEl) return;
  const wrap = unitEl.querySelector('.b-emoji-wrap');
  if (!wrap) return;
  const el = document.createElement('span');
  el.className = 'float-num ' + cls;
  el.textContent = text;
  el.style.left = (42 + Math.random() * 16) + '%';
  el.style.animationDelay = (Math.random() * 0.04) + 's';
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 1100);
}
function flashBattleUnit(uid) {

function computeBattleStars(b) {

  const alive = b.allies.filter(u => u.alive).length;

  if (ratio >= 0.6) stars++;
  if (alive === b.allies.length) stars++;
  return clamp(stars, 1, 3);
}

// 主线失败时的“变强清单”：依据当前队伍真实状态给可执行提示，纯展示不自动战斗
function stoneLabelOf(element) {
  return { fire: '火', grass: '草', water: '水', light: '光', dark: '暗', earth: '土' }[element] || '通用';
}
// 战败时给出「缺什么、去哪补」的具体方案，而不是一句"再去练练"
// 实战需要：敌人显示战力 × 经验系数。实测前期要 1.4 倍才打得平（敌人属性分配更极端），
// 后期玩家技能/装备更全，1.18 倍就够；用同一条曲线，避免"推荐强度"和战力对比两条标准打架。
function stageNeedPower(stage) {
  const k = 1.4 - 0.22 * ((stage.index - 1) / Math.max(1, STAGES.length - 1));
  return Math.round(stageDisplayPower(stage) * k);
}
// 关卡推荐强度：把敌人战力换算成"等级/星级/进化"这类玩家看得懂的目标
function stageAdvice(stage) {
  const need = stageNeedPower(stage);
  if (need < 3000) return 'Lv.10 · ★1 · 幼体';
  if (need < 6000) return 'Lv.20 · ★2 · 幼体';
  if (need < 10000) return 'Lv.30 · ★4 · 成体';
  if (need < 15000) return 'Lv.40 · ★6 · 成体';
  if (need < 21000) return 'Lv.50 · ★8 · 成体';
  if (need < 28000) return 'Lv.60 · ★9 · 究极体';
  return 'Lv.60 · ★10 · 究极体';
}
function stageUpgradePlan(stage) {
  const team = getTeamPets();
  const power = Math.round(calcTeamPower(state));
  const need = stageNeedPower(stage);
  const gap = Math.max(0, need - power);
  let gapLine = `参考强度：${stageAdvice(stage)}。`;
  if (need > 0) {
    gapLine = (gap > 0
      ? `当前队伍战力 ${fmt(power)}，本关推荐 ${fmt(need)}，还差 ${fmt(gap)}。`
      : `战力够了（${fmt(power)} ≥ ${fmt(need)}），这次多半是属性被克或状态太低，调整队伍再打一次。`) + ` 参考强度：${stageAdvice(stage)}。`;
  }
  // 每条建议带一个"还差多少 / 已经有多少"的比值，越小越接近达成，战败页按它排序
  const actions = [];
  if (!team.length) {
    actions.push({ text: '先在宠物页上阵至少一只主力，再回来挑战。', weight: 0 });
    return { gapLine, actions };
  }
  const low = [...team].sort((a, b) => num(a.level, 1) - num(b.level, 1))[0];
  if (num(low.level, 1) < MAX_LEVEL) {
    let cost = 0;
    const target = Math.min(MAX_LEVEL, num(low.level, 1) + 5);
    for (let lv = num(low.level, 1); lv < target; lv++) cost += Math.round(7 + lv * 2.6 + Math.pow(lv, 1.15));
    const t = templateOf(low);
    const have = num(state.resources.fruit, 0);
    const lack = Math.max(0, cost - have);
    actions.push({
      text: `升级最快：把「${t.name}」从 ${num(low.level, 1)} 级升到 ${target} 级要 ${fmt(cost)} 经验果（现有 ${fmt(have)}${lack > 0 ? `，还差 ${fmt(lack)}` : '，够了'}）。`,
      weight: lack / (have + 1)
    });
  }
  const evoPet = team.find((p) => {
    const n = nextEvolution(p);
    return n && num(p.level, 1) >= n.levelReq && num(state.stones[templateOf(p).element], 0) < n.stones;
  });
  if (evoPet) {
    const n = nextEvolution(evoPet);
    const el = templateOf(evoPet).element;
    const haveStone = num(state.stones[el], 0);
    const lack = n.stones - haveStone;
    const ch = Math.min(CHAPTERS.length, Math.max(1, evoPet.evo === 0 ? 1 : 5));
    actions.push({
      text: `进化缺材料：「${templateOf(evoPet).name}」进${n.name}还差 ${lack} 枚${stoneLabelOf(el)}进化石——刷第 ${ch} 章第 4 关精英、梦塔、开图鉴里程碑都会给。`,
      weight: lack / (haveStone + 1)
    });
  }
  const starPet = [...team].sort((a, b) => num(a.star, 1) - num(b.star, 1))[0];
  if (num(starPet.star, 1) < 10) {
    const c2 = starUpCost(starPet) || 0;
    const haveShard = num(state.items.starShard, 0);
    const lack = Math.max(0, c2 - haveShard);
    if (lack > 0) {
      actions.push({
        text: `升星缺材料：「${templateOf(starPet).name}」升到 ${num(starPet.star, 1) + 1} 星还差 ${fmt(lack)} 星石——首领首通、抽到重复伙伴都会给。`,
        weight: lack / (haveShard + 1)
      });
    }
  }
  return { gapLine, actions };
}

function stageWeakTips() {
  const tips = [];
  const team = getTeamPets();
  if (!team.length) { tips.push('先在宠物页上阵至少一只主力伙伴。'); return tips; }
  const maxLv = Math.max(...team.map(p => num(p.level, 1)));
  if (maxLv < 15) tips.push(`主力最高 Lv.${maxLv} 偏低，先在主线刷小怪攒经验果升级。`);
  else if (maxLv < 25) tips.push(`主力 Lv.${maxLv}，可再升几级或给主力升 1–2 星。`);
  const evolvable = team.filter(p => { const n = nextEvolution(p); return n && p.level >= n.levelReq; });
  if (evolvable.length) tips.push(`有 ${evolvable.length} 只达到进化等级，进化后属性倍率明显提升（成体 ×1.28、究极 ×1.62）。`);
  const emptySlots = team.reduce((n, p) => n + EQUIP_SLOT_KEYS.filter(s => !equipmentById((p.equipment || {})[s])).length, 0);
  if (emptySlots >= 2) tips.push('主力还有空装备槽，可在商店兑换装备并强化，补足攻防生存。');
  const needy = team.filter(p => num(p.hunger, 80) < 30 || num(p.mood, 80) < 30).length;
  if (needy) tips.push(`${needy} 只伙伴饱食或心情偏低（<30）会减攻减速，先投喂、摸头回状态。`);
  const next = nextStageInfo();
  if (next && next.element) tips.push('按属性克制调整队友：' + counterAdviceForElement(next.element));
  tips.push('保证主力饱食≥80、心情≥80，可小幅提升攻击 / 生命 / 速度 / 暴击。');
  return tips;
}
function finishBattle() {
  const b = UI.battle;
  if (!b || b.finished) return;
  b.finished = true;
  markActiveTurn(null);
  if (b.timer) { clearTimeout(b.timer); b.timer = null; }
  const mode = b.config.mode;
  const win = b.win;
  const outcome = b.outcome;
  b.stars = computeBattleStars(b);
  const survived = b.allies.filter(u => u.alive).length;
  const totalAllies = b.allies.length;
  let logs = [];
  let resultTitle = win ? '胜利！' : (outcome === 'timeout' ? '时间到！' : '惜败…');
  let resultEmoji = win ? '🎉' : '💧';
  let resultNote = '';
  let resultChips = [];
  let resultAdvice = null;
  let mainStars = 0;
  let storyLine = '';
  let resultSub = '';
  let review = null;

  // 所有出战宠物获得少量亲密度
  for (const ally of b.allies) {
    const pet = state.pets[ally.petUid];
    if (pet) pet.intimacy = clamp(num(pet.intimacy, 0) + (win ? 1.2 : 0.35), 0, 100);
  }
  if (win) bumpMetric('wins', 1);

  if (mode === 'stage') {
    const stage = b.config.stage || getStage(b.config.stageIndex || 1);
    mainStars = win ? b.stars : 0;
    if (win) {
      const firstClear = state.stage.maxCleared < stage.index;
      const rewards = makeStageRewards(stage, firstClear);
      logs = addReward(rewards);
      state.stage.maxCleared = Math.max(state.stage.maxCleared, stage.index);
  if (stage.index >= STAGES.length) setTimeout(() => { try { openFinalEndingModal(); } catch (e) {} }, 900);
      state.stage.stars[stage.index] = Math.max(num(state.stage.stars[stage.index], 0), b.stars);
      bumpMetric('stageClears', 1);
      resultTitle = firstClear ? '首通成功！' : pick(['再次胜利！', '漂亮取胜！', '稳稳拿下！']);
      resultSub = pick(WIN_SUB_POOL);
      if (firstClear) {
        const feels = [stage.winLine].filter(Boolean);
        if (stage.type === 'boss') {
          const bossAfter = BOSS_AFTER[stage.chapter];
          feels.push(bossAfter || pick(WIN_BOSS_FEEL));
          const chNarr = CHAPTER_NARRATIVE[stage.chapter];
          if (bossAfter && chNarr && chNarr.clear) feels.push(chNarr.clear);
        }
        else feels.push(pick(FIRST_CLEAR_FEEL));
        if (stage.chapter === 10 && stage.type === 'boss') feels.push(FINAL_CLEAR_FEEL);
        if (stage.chapter === 12 && stage.type === 'boss') feels.push(FINAL_END_FEEL);
        storyLine = feels.filter(Boolean).join(' ');
        if (stage.type === 'boss') {
          const chObj = CHAPTERS.find(c => c.id === stage.chapter);
          const base = chapterStageStart(stage.chapter);
          const cnt = stageCountOf(stage.chapter);
          const chStars = Array.from({ length: cnt }, (_, k) => num(state.stage.stars[base + k + 1], 0)).reduce((sum, v) => sum + v, 0);
          review = {
            title: `第${stage.chapter}章 · ${chObj ? chObj.name : ''} 通关回顾`,
            stars: `本章星级 ${chStars}/${cnt * 3}`,
            boss: `首领「${stage.name}」已被击退`,
            vibe: chObj ? chObj.desc : ''
          };
        }
      } else {
        storyLine = pick(REPEAT_WIN);
      }
      resultNote = firstClear
        ? `第 ${stage.chapter} 章进度推进了，新的挂机上限已更新到 ${stage.chapter}-${stage.sub}。`
        : `扫荡与重复挑战都会继续产出资源。当前最高通关：${chapterOfStage(state.stage.maxCleared)}-${subOfStage(state.stage.maxCleared)}。`;
    } else {
      storyLine = pick(FAIL_FEEL);
      resultSub = pick(FAIL_SUB_POOL);
      resultNote = outcome === 'timeout'
        ? '回合打满了还没打完，说明输出不够：先升攻击型宠物的等级/装备，或换被克制的属性上阵。'
        : pick(['队伍还需要再成长一点。', '再练练等级、装备与属性克制就好了。', '先养一波状态，回头轻松拿下这关。']);
      {
        const plan = stageUpgradePlan(stage);
        const ordered = plan.actions.slice().sort((a, b) => a.weight - b.weight);
        resultAdvice = [];
        if (plan.gapLine) resultAdvice.push(plan.gapLine);
        ordered.forEach((a, k) => resultAdvice.push(k === 0 && ordered.length > 1 ? `【最快】${a.text}` : a.text));
        resultAdvice = resultAdvice.concat(stageWeakTips().slice(0, 2));
      }
    }
    resultChips = [
      { icon: '❤️', label: '存活', value: `${survived}/${totalAllies}` },
      { icon: '🔁', label: '回合', value: `${b.round}/${b.maxRounds}` }
    ];
  } else if (mode === 'tower') {
    const floor = b.config.floor || 1;
    mainStars = win ? b.stars : 0;
    if (win) {
      const repeat = floor <= num(state.tower.best, 0);
      logs = addReward(makeTowerReward(floor, repeat));
      if (floor >= state.tower.floor) {
        state.tower.floor = floor + 1;
        state.tower.best = Math.max(state.tower.best, floor);
        state.tower.weekClears = Math.max(num(state.tower.weekClears, 0), floor);
      }
      bumpMetric('towerClears', 1);
      resultTitle = `第 ${floor} 层通过！`;
      resultNote = repeat
        ? `重复挑战的收益是首通的 5 折。本周已推进到第 ${Math.min(30, state.tower.floor)} 层。`
        : `梦散了，下一层是第 ${Math.min(30, state.tower.floor)} 层。`;
    } else {
      resultNote = '梦里的东西站起来了。强化装备、升星或试试属性克制再来吧。';
    }
    resultChips = [
      { icon: '🗼', label: '最高层', value: `${state.tower.best} / 30` },
      { icon: '🔁', label: '回合', value: `${b.round}/${b.maxRounds}` }
    ];
  } else if (mode === 'arena') {
    const opp = b.config.opponent || { name: '对手', rating: 1000 };
    const tier = arenaTierOf(state.arena.rating);
    let delta = 0;
    let streakExtra = [];
    let streakNote = '';
    if (win) {
      // 越强的对手给越多的段位分：挑战第三档才有爬段位的意义
      const oppIndex = clamp(Math.floor(num(b.config.opponent && b.config.opponent.index, 0)), 0, 2);
      delta = [14, 22, 30][oppIndex] + rndInt(0, 5) + tier.order * 2;
      state.arena.rating += delta;
      state.arena.wins += 1;
      bumpMetric('arenaWins', 1);
      state.hall.arenaStreak = (state.hall.arenaStreak || 0) + 1;
      state.hall.arenaWinStreak = Math.max(state.hall.arenaWinStreak || 0, state.hall.arenaStreak);
      state.hall.arenaBest = Math.max(state.hall.arenaBest || 0, state.arena.rating);
      logs = addReward({ arenaCoin: 24 + tier.order * 6, crystal: 8 + tier.order * 3 });
      // 每日首胜：一天一次，把「每天来打一场」变成习惯
      const winDay = localDateKey();
      if (state.arena.lastWinBonusDate !== winDay) {
        state.arena.lastWinBonusDate = winDay;
        logs = logs.concat(addReward({ crystal: 20, arenaCoin: 30 }));
        streakNote += ' 🌅今日首胜额外奖励已发放。';
      }
      // 连胜档一次性奖励：达到 3/5/8 且未领过才发，不重复领取
      const curStreak = state.hall.arenaStreak;
      let givenMark = state.arena.streakRewardGiven || 0;
      for (const r of ARENA_STREAK_REWARDS) {
        if (curStreak >= r.streak && givenMark < r.streak) {
          logs = logs.concat(addReward(r.reward));
          givenMark = r.streak;
          state.arena.streakRewardGiven = givenMark;
          streakExtra.push({ icon: '🏆', label: r.label + '奖励', value: '已发放' });
          streakNote += ` 🏆达成${r.label}，额外发放连胜奖励。`;
        }
      }
    } else {
      delta = -Math.min(16, 8 + Math.floor(tier.order * 1.5));
      state.arena.rating = Math.max(0, state.arena.rating + delta);
      state.arena.losses += 1;
      state.hall.arenaStreak = 0;
      state.arena.streakRewardGiven = 0; // 连败清零，连胜档重新计数
      logs = addReward({ arenaCoin: 5 });
    }
    generateArenaOpponents(true);
    resultNote = `对 ${opp.name} ${win ? '胜利' : '失败'}，段位分 ${delta > 0 ? '+' : ''}${delta}。当前段位：${arenaTierOf(state.arena.rating).name}。` + streakNote;
    resultChips = [
      { icon: '🏟️', label: '段位分', value: fmt(state.arena.rating) },
      { icon: '🎖️', label: '梦练币', value: fmt(state.items.arenaCoin) },
      ...streakExtra
    ];
  } else if (mode === 'boss') {
    const damage = b.totalDamage;
    const before = state.boss.bestDamage;
    state.boss.bestDamage = Math.max(before, damage);
    state.boss.totalDamage = num(state.boss.totalDamage, 0) + damage;
    state.boss.everBest = Math.max(num(state.boss.everBest, 0), state.boss.bestDamage);
    const board = getBossLeaderboard();
    // 长夜之影 以伤害排名，不发放普通通关奖励；排名奖励在面板领取。
    resultTitle = damage > before ? '伤害新纪录！' : '讨伐结束';
    resultEmoji = '👹';
    resultNote = `本次打出 ${fmt(damage)} 点伤害，今日最佳 ${fmt(state.boss.bestDamage)}。当前预计排名第 ${board.rank || '—'} 名。排名奖励可在长夜之影 面板领取。`;
    resultChips = [
      { icon: '💥', label: '本次伤害', value: fmt(damage) },
      { icon: '👑', label: '预计排名', value: board.rank ? `第 ${board.rank} 名` : '未上榜' }
    ];
    logs = addReward({ crystal: 10 });
  } else if (mode === 'dungeon') {
    const modeData = DUNGEON_MODES[b.config.dungeonMode] || currentDungeonMode();
    if (win) {
      logs = addReward(b.config.reward || makeDungeonReward(b.config.dungeonMode));
      resultTitle = `${modeData.name} 通关！`;
      resultNote = '今天的副本次数已经记录，明天会轮换新的副本。';
    } else {
      resultNote = '副本守卫有点厉害，先去提升队伍再来吧。';
    }
    resultChips = [
      { icon: modeData.emoji, label: '副本', value: modeData.name },
      { icon: '🔁', label: '回合', value: `${b.round}/${b.maxRounds}` }
    ];
  }

  // 主线 / 副本惜败返还 50% 体力（封顶不超过上限），避免失败一次就空转
  let refundStamina = 0;
  if (!win && (mode === 'stage' || mode === 'dungeon') && num(b.config.staminaCost, 0) > 0) {
    refundStamina = Math.round(num(b.config.staminaCost, 0) * 0.5);
    state.stamina.value = Math.min(state.stamina.max, state.stamina.value + refundStamina);
    resultChips.push({ icon: '⚡', label: '惜败返还体力', value: `+${refundStamina}` });
    resultNote += ` 本次惜败返还 50% 体力（⚡+${refundStamina}），先去提升队伍再来。`;
  }

  if (mode !== 'boss') {
    if (win) playSfx('win'); else playSfx('lose');
  } else {
    playSfx('win');
  }
  if (state.tutorial && !state.tutorial.done && state.tutorial.step === 2) {
    advanceTutorial(2);
  }
  saveGame();
  renderAll();
  const perfRows = Object.values(b.perf ? b.perf.allies : {})
    .filter(m => m.dmg > 0 || m.hits > 0)
    .sort((a, c) => c.dmg - a.dmg)
    .map(m => ({ emoji: m.emoji, name: m.name, dmg: Math.round(m.dmg), crit: m.crit, hits: m.hits }));
  const battleMeta = { rounds: b.round, totalDmg: Math.round(b.totalDamage || 0), top: perfRows[0] ? perfRows[0].name : '—' };
  renderBattleResult({
    win, title: resultTitle, emoji: resultEmoji, stars: mainStars,
    note: resultNote, chips: resultChips, logs, advice: resultAdvice,
    story: storyLine, sub: resultSub, review, mode, perfRows, battleMeta
  });
}

function renderBattleResult(data) {
  // 连战模式下逐层静默结算，只在最后汇总一次
  if (UI.towerRush) return;
  const resultEl = $('#battleResult');
  if (!resultEl) return;
  const starHtml = data.mode === 'stage' || data.mode === 'tower' ? starRow(data.stars) : '';
  const chips = (data.chips || []).map(c => `<span class="reward-chip">${esc(c.icon)} ${esc(c.label)} ${esc(c.value)}</span>`).join('');
  const perfHtml = (data.perfRows && data.perfRows.length) ? `
      <div class="perf-panel">
        <div class="pp-title">📊 战斗明细</div>
        <div class="pp-meta">🔁 ${data.battleMeta.rounds} 回合 · 💥 全队输出 ${fmt(data.battleMeta.totalDmg)} · 最高输出 ${esc(data.battleMeta.top)}</div>
        ${data.perfRows.map((m, i) => `<div class="perf-row${i === 0 ? ' top' : ''}"><span class="pr-rank">${i + 1}</span><span class="pr-emo">${esc(m.emoji)}</span><span class="pr-name">${esc(m.name)}</span><span class="pr-stat">💥${fmt(m.dmg)}${m.crit ? ` · 暴击×${m.crit}` : ''} · 出手${m.hits}</span></div>`).join('')}
      </div>` : '';
  const resChapter = (UI.battle && UI.battle.config && UI.battle.config.stage) ? UI.battle.config.stage.chapter : 0;
  const resArt = resChapter ? chapterArt(resChapter) : null;
  if (resArt) {
    resultEl.style.setProperty('--res-deep', resArt.deep);
    resultEl.style.setProperty('--res-accent', resArt.accent);
    resultEl.style.setProperty('--res-light', resArt.light);
    resultEl.setAttribute('style', resultEl.getAttribute('style') + ';' + chapterSceneStyle(resArt, 'linear-gradient(180deg,rgba(255,253,247,.9),rgba(255,246,238,.94))'));
  }
  resultEl.classList.add('open');
  resultEl.innerHTML = `
    <div class="result-box">
      <div class="result-emoji">${esc(data.emoji || (data.win ? '🎉' : '💧'))}</div>
      <h2>${esc(data.title)}</h2>
      <p class="result-sub">${esc(data.sub || (data.win ? '毛茸茸的胜利！' : '下次一定会更好。'))}</p>
      ${starHtml}
      ${data.story ? `<p class="result-story">📖 ${esc(data.story)}</p>` : ''}
      ${data.review ? `<div class="chapter-review"><div class="cr-title">${esc(data.review.title)}</div><div class="cr-line">⭐ ${esc(data.review.stars)}</div><div class="cr-line">👑 ${esc(data.review.boss)}</div>${data.review.vibe ? `<div class="cr-vibe">${esc(data.review.vibe)}</div>` : ''}</div>` : ''}
      <div class="result-rewards">${chips}</div>
      <div class="result-rewards">${rewardLogHTML(data.logs)}</div>
      ${perfHtml}
      <p class="result-note">${esc(data.note || '')}</p>
      ${data.advice && data.advice.length ? `<div class="note" style="margin-top:8px"><b>📋 变强清单</b><ul style="margin:6px 0 0 18px;padding:0">${data.advice.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>` : ''}
      <div class="result-actions">
        ${data.advice && data.advice.length ? `<button class="btn btn-mint" type="button" data-act="battleGrow">🐾 去养成提升</button>` : ''}
        <button class="btn btn-primary" type="button" data-act="battleClose">收下结果 · 返回小镇</button>
      </div>
    </div>`;
}

function closeBattle() {
  const b = UI.battle;
  if (b && b.timer) clearTimeout(b.timer);
  clearBattleFx();
  UI.battle = null;
  const root = $('#battleRoot');
  if (root) { root.className = 'battle-layer'; root.innerHTML = ''; }
  document.body.classList.remove('battle-open');
  renderAll();
}

const PET_SUBTABS = [

];

function starsHTML(star, compact = false) {
  if (compact) return `<span class="stars">★${Math.floor(star)}</span>`;
  return `<span class="stars">${Array.from({ length: 10 }, (_, i) => `<span class="${i < star ? '' : 'off'}">★</span>`).join('')}</span>`;
}
function elementTag(el) {
  const e = ELEMENTS[el] || ELEMENTS.light;
  const head = artIconFrame(elementArtUrl(el), e.emoji, 'art-tag') || e.emoji;
  return `<span class="element-tag" style="--el-color:${e.color};--el-soft:${e.soft}">${head} ${e.name}</span>`;
}
function rarityTag(rarity) {
  const r = RARITIES[rarity] || RARITIES.N;
  return `<span class="rarity-tag rarity-${rarity}" style="background:${r.color}">${rarity}</span>`;
}
function progressHTML(value, max, cls = '', showText = false) {
  const pct = clamp(value / Math.max(1, max) * 100, 0, 100);
  return `${showText ? `<div class="bar-label"><span>${fmt(value)}</span><span>${fmt(max)}</span></div>` : ''}<div class="progress ${cls}"><i style="width:${pct}%"></i></div>`;
}
function pageHead(eyebrow, title, sub, actions = '') {
  return `<div class="page-head"><div><p class="eyebrow">${esc(eyebrow)}</p><h1 class="page-title">${title}</h1><p class="page-sub">${sub}</p></div><div class="head-actions">${actions}</div></div>`;
}
function currentChapterNumber() {
  return clamp(chapterOfStage(Math.max(1, state.stage.maxCleared + 1)), 1, CHAPTERS.length);
}
function chapterUnlocked(chapterId) {
  if (chapterId <= 1) return true;
  return state.stage.maxCleared >= chapterStageStart(chapterId);
}
function highestStageLabel() {
  if (!state.stage.maxCleared) return '尚未通关';
  const st = getStage(state.stage.maxCleared);
  return `${st.chapter}-${st.sub}`;
}
function nextStageInfo() {
  if (state.stage.maxCleared >= STAGES.length) return null;
  return STAGES[state.stage.maxCleared];
}
function accessoryOf(uid) {
  const id = state.cosmetics.petAccessory[uid];
  const c = COSMETIC_MAP[id];
  return c && c.type === 'acc' ? c : null;
}
function deployedRow(uid) {
  if (state.team.front.includes(uid)) return 'front';
  if (state.team.back.includes(uid)) return 'back';
  return null;
}
/* 主页伙伴小像：进化图优先，缺失逐级回退到 emoji，不白图 */
function palArtHTML(pet) {
  if (!pet) return '';
  const t = templateOf(pet);
  const urls = evoArtCandidates(t.id, pet.evo || 0).concat(petArtCandidates(t.id));
  const char = petEmoji(pet);
  if (!urls.length) return `<span class="pal-art-inner"><span class="pal-emoji">${esc(char)}</span></span>`;
  // 立绘成功时 DOM 不预铺旧 emoji，杜绝新旧叠加；整条候选链（进化PNG→进化JPG→基础PNG→基础JPG）都失败才换 emoji 占位
  return `<span class="pal-art-inner"><img class="pal-img" src="${urls[0]}" alt="${esc(char)}" loading="lazy" ${artChainAttr(urls, char)}></span>`;
}
/* 把某只宠置顶为主宠（team[0]）：只重排，维持前排2/后排3与总数上限5，不改任何数值 */
function setMain(uid) {
  const pet = state.pets[uid];
  if (!pet) return;
  const wasIn = deployedRow(uid) != null;
  if (!wasIn && teamPetsOf(state).length >= maxTeamSize()) {
    toast('队伍已满 6 只，先在队伍页让一只下阵，再设为主宠', 'bad'); return;
  }
  // 先按 uid 去重再排：旧写法后排直接取 rest 前 3 只，会把「刚被顶到前排的那只」又放进后排，
  // 于是主页中间和伙伴位出现同一只宠物。这里前排吃 rest 第 1 只，后排从第 2 只开始。
  const rest = [];
  for (const id of [...state.team.front, ...state.team.back]) {
    if (!id || id === uid || rest.includes(id) || !state.pets[id]) continue;
    rest.push(id);
  }
  state.team.front = [uid, ...rest.slice(0, 1)];
  state.team.back = rest.slice(1, 4);
  noteBonds();
  saveGame();
  renderAll();
  toast(`⭐ ${petDisplayName(pet)} 已站到 C 位主宠`, 'good');
  playSfx('claim');
}
function petPowerSafe(pet) {
  try { return getPetPower(pet); } catch (err) { return 0; }
}
function frameOfPlayer() {
  return FRAME_MAP[state.player.frame] || FRAMES[0];
}

function renderAll() {
  if (!state) return;
  ensureDaily();
  ensureEncounter();
  noteBonds();
  renderTopbar();
  renderNav();
  applyAvatar();
  renderPage();
  renderTutorial();
  if (typeof petAnimDecorate === 'function') petAnimDecorate();
}
function renderPage() {
  const scroller = $('#main');
  const oldMainScroll = scroller ? scroller.scrollTop : 0;
  const oldWindowScroll = window.scrollY || 0;
  const reset = !!UI.scrollReset;
  UI.scrollReset = false;
  let html = '';
  switch (UI.tab) {
    case 'adventure': html = renderAdventure(); break;
    case 'pets': html = renderPets(); break;
    case 'battle': html = renderBattlePage(); break;
    case 'shop': html = renderShop(); break;
    case 'quest': html = renderQuest(); break;
    default: html = renderHome(); break;
  }
  const view = $('#view');
  if (view) view.innerHTML = html;
  if (reset) {
    if (scroller) scroller.scrollTop = 0;
    window.scrollTo(0, 0);
  } else {
    if (scroller) scroller.scrollTop = oldMainScroll;
    window.scrollTo(0, oldWindowScroll);
  }
  refreshHUD();
}

function patSpeech(pet, combo = 0) {
  const h = num(pet.hunger, 80), m = num(pet.mood, 80), int = num(pet.intimacy, 0);
  const tierLine = tierLineOf(pet);
  if (tierLine && Math.random() < 0.5) return tierLine;
  const pool = (templateOf(pet).lines || []).slice();
  if (h < 30) pool.push(...PAT_COMMON.hungry);

function townProgressPct() {
  const stage = Math.min(1, num(state.stage && state.stage.maxCleared, 0) / STAGES.length);
  const codex = Math.min(1, stateCodexSeenCount() / PETS.length);
  const ach = Math.min(1, ACHIEVEMENTS.filter((a) => achievementClaimed(a.id)).length / ACHIEVEMENTS.length);

  return Math.round((stage + codex + ach + tower) * 25);
}

function addRewardPreview(reward) {
  const out = [];
  const labelMap = {
    gold: '金币', crystal: '钻石', fruit: '经验果', skillBook: '技能书', equipShard: '装备碎片',
    enhanceStone: '强化石', bondBadge: '羁绊徽章', arenaCoin: '梦练币', starShard: '升星碎片',
    stonesRandom: '随机进化石', stoneChoice: '随机进化石', randomShards: '随机碎片',
    intimacyAll: '全队亲密', frame: '头像框', equipment: '装备', eternal: '永恒结晶'
  };
  for (const key of Object.keys(reward || {})) {
    if (!reward[key]) continue;
    if (key === 'frame') {
      const frame = FRAME_MAP[reward.frame];
      out.push({ icon: '🖼️', label: '头像框·' + (frame ? frame.name : '神秘框'), amount: 1 });
    } else if (key === 'equipment') {
      out.push({ icon: '🎁', label: '装备', amount: 1 });
    } else if (key === 'stones' && typeof reward.stones === 'object') {
      for (const el of ELEMENT_KEYS) if (reward.stones[el]) out.push({ icon: ELEMENTS[el].emoji, label: ELEMENTS[el].name + '进化石', amount: reward.stones[el] });
    } else {
      out.push({ icon: resourceIcon(key), label: labelMap[key] || resourceLabel(key), amount: reward[key] });
    }
  }
  return out;
}

// 塔层战力：1.118 的指数和主线成长对齐，第 30 层约 29,200（满配队 32,000 上下，需要装备补齐）
// 旧曲线 1.18^29 ≈ 79,664 是全游戏战力天花板的 2.5 倍，玩家实际只能到第 10 层
function towerFloorPower(floor) {
  return Math.round(1150 * Math.pow(1.118, clamp(floor, 1, 30) - 1));
}
// 每周重置：周一 0 点开新一周，历史最高（best）永久保留，层数回到第 1 层
function towerWeekStart(now = Date.now()) {
  const d = new Date(now);
  const day = (d.getDay() + 6) % 7;
  d.setHours(0, 0, 0, 0);
  return d.getTime() - day * DAY_MS;
}
function ensureTowerWeek(s = state) {
  const start = towerWeekStart();
  if (num(s.tower.weekStart, 0) === start) return false;
  s.tower.weekStart = start;
  s.tower.weekClears = 0;
  // 全新存档（从没爬过）不动；已爬过的重置到第 1 层，best 保留
  if (num(s.tower.best, 0) > 0) s.tower.floor = 1;
  return true;
}
function towerWeekRemainMs(now = Date.now()) {
  return Math.max(0, towerWeekStart(now) + 7 * DAY_MS - now);
}
function seasonRemainMs() {
  return Math.max(0, 7 * DAY_MS - (Date.now() - state.arena.seasonStart));
}

function logsFromReward(reward) {
  const logs = [];
  for (const key of Object.keys(reward || {})) {
    if (!reward[key]) continue;
    if (key === 'equipment') { logs.push({ icon: '🎁', label: '装备', amount: 1 }); continue; }
    if (key === 'frame') {
      const frame = FRAME_MAP[reward.frame];
      logs.push({ icon: '🖼️', label: '头像框·' + (frame ? frame.name : '神秘框'), amount: 1 });
      continue;
    }
    if (key === 'stones' && typeof reward.stones === 'object') {
      for (const el of ELEMENT_KEYS) if (reward.stones[el]) logs.push({ icon: ELEMENTS[el].emoji, label: ELEMENTS[el].name + '进化石', amount: reward.stones[el] });
      continue;
    }
    if (key === 'intimacyAll') { logs.push({ icon: '💗', label: '全队亲密度', amount: reward[key] }); continue; }
    if (key === 'randomShards') { logs.push({ icon: '🧩', label: '随机宠物碎片', amount: reward[key] }); continue; }
    logs.push({ icon: resourceIcon(key), label: resourceLabel(key), amount: reward[key] });
  }
  return logs;
}

function achGroupOf(ach) {
  const src = String(ach.get || '');
  for (const g of ACH_NOTE_GROUPS) {
    if (g.key === 'collect') continue;
    if (g.re.test(src)) return g.key;
  }
  return 'collect';
}
function achNoteOf(ach) {
  const key = achGroupOf(ach);
  const group = ACH_NOTE_GROUPS.find((g) => g.key === key) || ACH_NOTE_GROUPS[ACH_NOTE_GROUPS.length - 1];
  const peers = ACHIEVEMENTS.filter((a) => achGroupOf(a) === key);
  const idx = Math.max(0, peers.findIndex((a) => a.id === ach.id));
  return group.notes[idx % group.notes.length];
}

/* ========== 6C. 弹窗 / 通知 / 小游戏 ========== */
function toast(message, type = '', duration = 2400) {
  const root = $('#toastRoot');
  if (!root) return;
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = message;
  root.appendChild(el);
  while (root.children.length > 4) root.removeChild(root.firstElementChild);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 260);
  }, Math.max(800, duration));
}

function animateNumber(el, from, to, duration = 900, formatter = fmt) {
  if (!el) return;
  const token = (el._animToken || 0) + 1;
  el._animToken = token;
  const start = performance.now();
  const span = Math.max(1, to - from);
  function frame(now) {
    if (el._animToken !== token) return;
    const p = clamp((now - start) / duration, 0, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = formatter(from + span * eased);
    if (p < 1) requestAnimationFrame(frame);
    else el.textContent = formatter(to);
  }
  requestAnimationFrame(frame);
}

function openModal(title, body, options = {}) {
  const root = $('#modalRoot');
  if (!root) return;
  if (UI.feedGame) { clearTimeout(UI.feedGame.timer); UI.feedGame = null; }
  UI.modal = {
    closable: options.closable !== false,
    title: String(title || ''),
    className: options.className || ''
  };
  const classes = ['modal', options.wide ? 'wide' : '', options.narrow ? 'narrow' : '', options.className || ''].filter(Boolean).join(' ');
  root.innerHTML = `
    <div class="modal-layer open" data-modal-backdrop="1">
      <div class="${classes}" role="dialog" aria-modal="true">
        <div class="modal-head">
          <div><h2>${title || ''}</h2>${options.subtitle ? `<p>${options.subtitle}</p>` : ''}</div>
          ${options.closable === false ? '' : '<button class="modal-x" type="button" data-act="closeModal" aria-label="关闭">×</button>'}
        </div>
        <div class="modal-body">${body}</div>
      </div>
    </div>`;
  document.body.classList.add('modal-open');
  const modalEl = root.querySelector('.modal');
  if (modalEl) { modalEl.tabIndex = -1; modalEl.focus({ preventScroll: true }); modalEl.scrollTop = 0; }
}
function closeModal(force = false) {
  if (!UI.modal) return;
  if (UI.modal.closable === false && !force) return;
  if (UI.feedGame) { clearTimeout(UI.feedGame.timer); UI.feedGame = null; }
  UI.modal = null;
  const root = $('#modalRoot');
  if (root) root.innerHTML = '';
  document.body.classList.remove('modal-open');
}

/* -------- 入梦池 -------- */
function rebirthUnlocked() {
  return state.stage.maxCleared >= STAGES.length && num(state.stage.stars[STAGES.length], 0) > 0;
}
function rebirthEternalPreview() {
  return 10 + Math.floor(calcTeamPower() / 1500) + Math.max(0, chapterOfStage(Math.max(1, state.stage.maxCleared)) - 1) * 2;
}
function rebirthUpgradeCost(upgrade) {
  const level = clamp(Math.floor(num(state.eternal[upgrade.id], 0)), 0, upgrade.max);
  return Math.round(upgrade.baseCost * Math.pow(1.55, level));
}

// 回忆速通：入梦之后，把上一条走到最远的进度直接接上（不发奖励，只解锁关卡）
function recallRush() {
  const target = clamp(num(state.stage.recall, 0), 0, STAGES.length);
  if (target <= state.stage.maxCleared) { toast('没有可以速通的回忆', 'bad'); return; }
  state.stage.maxCleared = target;
  UI.adventureChapter = chapterOfStage(Math.max(1, target));
  saveGame();
  renderAll();
  toast('回忆接上了：现在走到 ' + chapterOfStage(target) + '-' + subOfStage(target) + '。', 'gold', 3000);
}

    <div class="note lav">已走到 ${highestStageLabel()} · 队伍战力 ${fmt(calcTeamPower())} · 这是第 ${finalEndingLoop()} 次入梦。走得越远，入梦带回的永恒结晶越多。</div>

/* -------- 奇遇 -------- */
function storyEndingTotal() { let n = 0; for (const s of ENCOUNTER_STORIES) for (const k in s.nodes) if (s.nodes[k].ending) n++; return n; }
function storyEndingCount() { const m = state.encounter.endings; return m && typeof m === 'object' ? Object.keys(m).filter(k => k.indexOf('final:') !== 0).length : 0; }
function storyById(id) { return ENCOUNTER_STORIES.find(s => s.id === id) || null; }
function exploreStory(id) {
  ensureEncounter();
  if (state.encounter.attempts <= 0) { toast('奇遇次数用完了，等刷新吧', 'bad'); return; }
  const story = storyById(id);
  if (!story) return;
  state.encounter.attempts -= 1;
  state.encounter.total += 1;
  bumpMetric('encounters', 1);
  UI.story = { id: story.id, node: story.start, logs: [], path: [] };
  saveGame();
  renderAll();
  openStoryModal();
  playSfx('encounter');
}
function openStoryModal() {
  const s = UI.story;
  if (!s) return;
  const story = storyById(s.id);
  if (!story) { UI.story = null; return; }
  const node = story.nodes[s.node];
  if (!node) { UI.story = null; return; }
  if (node.ending) { openStoryEnding(story, node); return; }
  const choices = (node.choices || []).map((c, i) => {
    const hint = c.cost ? `消耗 ${costText(c.cost)}` : '不需要资源';
    const plus = c.gain ? ' · 立刻一点点好感' : '';
    return `<button class="story-choice" type="button" data-act="storyChoose" data-index="${i}" ${!canPayCost(c.cost) ? 'disabled' : ''}><span>${esc(c.t)}</span><small>${hint}${plus}</small></button>`;
  }).join('');
  const body = `
    <div class="story-scene">
      <div class="story-acts">第 ${node.act} 幕 / 共 ${story.acts} 幕 · 已走 ${s.path.length} 步</div>
      <div class="story-speaker"><i>${node.em}</i>${esc(node.sp)}</div>
      <p class="story-text">${esc(node.text)}</p>
      <div class="story-choices">${choices}</div>
      <div class="note">每个选择都会走到不同的下一幕，结局与奖励也不同。本次探索次数已扣除。</div>
      ${s.path.length ? `<div class="tiny muted">已走：${esc(s.path.join(' → '))}</div>` : ''}
    </div>`;
  openModal(`🧭 ${esc(story.title)}`, body, { wide: false });
}
function storyChoose(index) {
  const s = UI.story;
  if (!s) return;
  const story = storyById(s.id);
  if (!story) { UI.story = null; return; }
  const node = story.nodes[s.node];
  if (!node || !node.choices) return;
  const c = node.choices[index];
  if (!c) return;
  if (!canPayCost(c.cost)) { toast(`资源不足：${costText(c.cost)}`, 'bad'); return; }
  if (c.cost) payCost(c.cost);
  if (c.gain) { s.logs.push(...addReward(c.gain)); }
  s.path.push(c.t);
  s.node = c.next;
  playSfx('tap');
  saveGame();
  openStoryModal();
}
function openStoryEnding(story, node) {
  const s = UI.story || { path: [], logs: [] };
  const logs = addReward(node.ending.rewards);
  state.encounter.history.push(`${story.title}：${node.ending.title.replace('结局 · ', '')}`);
  if (!state.encounter.endings || typeof state.encounter.endings !== 'object' || Array.isArray(state.encounter.endings)) state.encounter.endings = {};
  state.encounter.endings[story.id + ':' + node.ending.title] = Date.now();
  state.encounter.history = state.encounter.history.slice(-8);
  const path = s.path.join(' → ');
  UI.story = null;
  saveGame();
  renderAll();
  playSfx('claim');
  const body = `
    <div class="story-ending">
      <div class="big-emoji">${node.em}</div>
      <h3>${esc(node.ending.title)}</h3>
      <p>${esc(node.text)}</p>
      ${path ? `<div class="tiny muted">你的路线：${esc(path)}</div>` : ''}
      <div class="reward-chips center">${rewardLogHTML(logs)}</div>

function accrueIdleToNow() {
  const now = Date.now();
  const seconds = Math.max(0, (now - UI.lastTick) / 1000);
  UI.lastTick = now;
  if (seconds > 0.15) {
    updateCareElapsed(seconds);
    accrueIdle(seconds);
  }
}

function advanceTutorial(step) {
  if (!state || !state.tutorial || state.tutorial.done) return;
  if (state.tutorial.step !== step) return;
  state.tutorial.step += 1;
  if (state.tutorial.step > 5) {
    state.tutorial.done = true;
    state.tutorial.step = 6;
    toast('新手引导完成！接下来就按自己的节奏慢慢玩吧。', 'good', 3200);
  }
  saveGame();
  renderTutorial();
}
function skipTutorial() {
  if (!state) return;
  state.tutorial.done = true;
  state.tutorial.step = 6;
  saveGame();
  renderTutorial();

}
function tutorialGo(btn) {

  const map = { 1: 'shop', 2: 'adventure', 3: 'home', 4: 'pets', 5: 'battle' };
  const tab = map[step] || 'home';
  UI.tab = tab;
  state.lastTab = tab;
  if (step === 1) UI.shopTab = 'gacha';
  if (step === 4) UI.petTab = 'growth';

}

function navTo(tab) {

  if (UI.battle && !UI.battle.over) return;
  closeModal();
  UI.tab = tab;

  state.lastTab = tab;

function claimIdle() {
  accrueIdleToNow();
  const gold = Math.floor(state.idle.pendingGold);
  const fruit = Math.floor(state.idle.pendingFruit);
  if (gold < 1 && fruit < 1) { toast('还没有攒下收益，让伙伴再驻守一会儿吧'); return; }
  const logs = addReward({ gold, fruit });
  state.idle.pendingGold = 0;
  state.idle.pendingFruit = 0;
  advanceTutorial(3);
  saveGame();
  renderAll();
  toast(`收下挂机收益：${rewardLogText(logs)}`, 'good', 3000);
  playSfx('claim');
}

function claimAllHome() {
  accrueIdleToNow();
  const idleGold = Math.floor(num(state.idle.pendingGold, 0));
  const idleFruit = Math.floor(num(state.idle.pendingFruit, 0));
  state.idle.pendingGold = 0;
  state.idle.pendingFruit = 0;
  ensureDaily();
  ensureGarden();
  let tasks = 0;
  for (const t of DAILY_TASKS) {
    if (state.daily.claimed.includes(t.id)) continue;
    if (dailyTaskProgress(t.id) < t.target) continue;
    state.daily.claimed.push(t.id);
    addReward(t.reward);
    state.quests.metrics.dailyClaims += 1;
    tasks++;
  }
  // 家园一键领取直接复用「一键收菜」：成长倍率、经验果加成和掉落都和单独收菜一致
  const now = Date.now();
  let plots = state.garden.plots.filter(p => gardenPlotStatus(p, now) === 'ready').length;
  if (plots) gardenHarvestAll(true);
  if (state.garden.auto) gardenPlantAll(true);
  let signed = false;
  if (state.signIn.days < 7 && state.signIn.lastDate !== localDateKey()) {
    if (!state.signIn.firstDate) state.signIn.firstDate = localDateKey();
    state.signIn.lastDate = localDateKey();
    state.signIn.days += 1;
    addReward(SIGNIN_REWARDS[state.signIn.days - 1] || {});
    signed = true;
  }
  if (idleGold + idleFruit === 0 && !tasks && !plots && !signed) {
    toast('暂时没有可领的东西，去冒个险吧');
    return;
  }
  advanceTutorial(3);
  saveGame();
  renderAll();
  const parts = [];
  if (idleGold + idleFruit > 0) parts.push(`挂机 +${fmt(idleGold)} 金币`);
  if (tasks) parts.push(`任务 ${tasks} 份`);
  if (plots) parts.push(`菜园 ${plots} 块`);
  if (signed) parts.push('签到 1 天');
  toast(`一键领取：${parts.join('、')}`, 'good', 3200);
  playSfx('claim');
}

/* ---------------- 小菜园：播种后定时成熟，点击收获金币+经验果，零成本不耗体力 ---------------- */
const GARDEN_SIZE = 6;
// 六块地由快到慢分档：成熟时长 3/5/10/30/40/60 分钟递增；收获金币与经验果随档递增，单位时间产出边际递减，避免纯挂机套利
const GARDEN_TIERS = [
  { minutes: 3,   gold: 24,  fruit: 3  },
  { minutes: 5,   gold: 36,  fruit: 5  },
  { minutes: 10,  gold: 60,  fruit: 8  },
  { minutes: 30,  gold: 150, fruit: 16 },
  { minutes: 40,  gold: 190, fruit: 21 },
  { minutes: 60,  gold: 260, fruit: 28 }
];
function gardenTier(i) { return GARDEN_TIERS[i] || GARDEN_TIERS[GARDEN_TIERS.length - 1]; }
// 经验果产出系数：升级吃果子太凶，菜园是主要果园，统一乘一个可调系数（金币不动）
const GARDEN_FRUIT_BOOST = 1.7;
// 金币收成随主线温和成长（最高 ×1.42），经验果不缩放：果实是稀缺资源，不能靠种地无限刷
function gardenProgressMult() {
  return 1 + clamp(num(state.stage.maxCleared, 0), 0, STAGES.length) * 0.006;
}
// 收菜时的稀有掉落：星尘碎片 / 进化石，让菜园也是养成材料来源
function gardenDropBonus() {
  const bonus = {};
  if (chance(0.06)) bonus.starShard = 1;
  if (chance(0.04)) bonus.stonesRandom = 1;
  return bonus;
}
function gardenPerHour() {
  const mult = gardenProgressMult();
  let gold = 0, fruit = 0;
  for (let i = 0; i < GARDEN_SIZE; i++) {
    const t = gardenTier(i);
    gold += Math.round(t.gold * mult) * (60 / t.minutes);
    fruit += t.fruit * GARDEN_FRUIT_BOOST * (60 / t.minutes);
  }
  return { gold: Math.round(gold), fruit: Math.round(fruit) };
}
function ensureGarden() {
  if (!state.garden || !Array.isArray(state.garden.plots)) state.garden = { plots: [] };
  if (typeof state.garden.auto !== 'boolean') state.garden.auto = false;
  if (typeof state.garden.autoHarvest !== 'boolean') state.garden.autoHarvest = false;
  if (typeof state.garden.lastSeen !== 'number') state.garden.lastSeen = Date.now();
  while (state.garden.plots.length < GARDEN_SIZE) state.garden.plots.push({ state: 'empty' });
}
// 离线结算：关掉页面这段时间，自动收菜按成熟轮次补发（最多 8 轮，需已买自动收菜）
function settleGardenOffline() {
  ensureGarden();
  const now = Date.now();
  const last = num(state.garden.lastSeen, 0);
  state.garden.lastSeen = now;
  if (!last || last >= now) return;
  if (now - last < 2 * 60000) return;
  if (!state.garden.autoHarvest) return;
  const mult = gardenProgressMult();
  let gold = 0;
  let fruit = 0;
  let n = 0;
  state.garden.plots.forEach((p, i) => {
    if (!p || p.state === 'empty') return;
    const t = gardenTier(i);
    const cycle = Math.max(60000, num(t.minutes, 30) * 60000);
    const readyAt = num(p.readyAt, 0);
    if (readyAt > now) return;
    const cycles = Math.min(8, Math.floor((now - readyAt) / cycle) + 1);
    gold += Math.round(num(p.gold, t.gold) * mult) * cycles;
    fruit += Math.round(num(p.fruit, t.fruit) * GARDEN_FRUIT_BOOST) * cycles;
    n += cycles;
    p.readyAt = now + (cycle - ((now - readyAt) % cycle));
    p.state = state.garden.auto ? 'growing' : 'empty';
  });
  if (!n) return;
  addReward({ gold, fruit, ...gardenDropBonus() });
  bumpMetric('gardens', n);
  persist({ render: false });
}
function gardenPlotStatus(p, now = Date.now()) {
  if (!p || p.state === 'empty') return 'empty';
  if (p.state === 'growing') return now < num(p.readyAt, 0) ? 'growing' : 'ready';
  return 'ready';
}
function gardenPlant(i) {
  ensureGarden();
  const p = state.garden.plots[i];
  if (!p || p.state !== 'empty') return;
  const t = gardenTier(i);
  p.state = 'growing';
  p.tier = i;
  p.minutes = t.minutes;
  p.gold = t.gold;
  p.fruit = t.fruit;
  p.readyAt = Date.now() + t.minutes * 60000;
  toast(`种下啦，约 ${t.minutes} 分钟成熟，收成 ${t.gold} 金币 + ${t.fruit} 经验果～`);
  playSfx('pop');
  persist();
}
function gardenHarvestAll(silent) {
  ensureGarden();
  const now = Date.now();
  const mult = gardenProgressMult();
  let gold = 0;
  let fruit = 0;
  let n = 0;
  state.garden.plots.forEach((p, i) => {
    if (gardenPlotStatus(p, now) !== 'ready') return;
    const t = gardenTier(i);
    gold += Math.round(num(p.gold, t.gold) * mult);
    fruit += Math.round(num(p.fruit, t.fruit) * GARDEN_FRUIT_BOOST);
    p.state = 'empty';
    p.readyAt = 0;
    delete p.tier; delete p.minutes; delete p.gold; delete p.fruit;
    n++;
  });
  if (!n) { if (!silent) toast('还没有成熟的菜，再等等～'); return; }
  const bonus = gardenDropBonus();
  const logs = addReward({ gold, fruit, ...bonus });
  bumpMetric('gardens', n);
  if (state.garden.auto) gardenPlantAll(true);
  if (!silent) {
    toast(`一键收菜：${n} 块地 ${rewardLogText(logs)}`, 'good', 2800);
    playSfx('claim');
  }
  persist();
}
function gardenPlantAll(silent) {
  ensureGarden();
  let n = 0;
  state.garden.plots.forEach((p, i) => {
    if (p.state !== 'empty') return;
    const t = gardenTier(i);
    p.state = 'growing';
    p.tier = i;
    p.minutes = t.minutes;
    p.gold = t.gold;
    p.fruit = t.fruit;
    p.readyAt = Date.now() + t.minutes * 60000;
    n++;
  });
  if (!n) { if (!silent) toast('没有空地可以补种'); return; }
  if (!silent) {
    toast(`补种 ${n} 块地${state.garden.auto ? '，成熟后会自动续种' : ''}～`, 'good');
    playSfx('pop');
  }
  persist();
}
const GARDEN_AUTO_COST = 40000;
function buyOfflineCap() {
  const cur = clamp(num(state.idle.capHours, 0), 0, 6);
  if (cur >= 6) { toast('小夜灯已经点满 24 小时啦', 'bad'); return; }
  if (state.resources.crystal < 200) { toast('钻石不够，先攒一攒', 'bad'); return; }
  state.resources.crystal -= 200;
  state.idle.capHours = cur + 2;
  saveGame();
  renderAll();
  toast(`🌙 小夜灯点亮：离线上限 ${Math.round(offlineCapSec() / 3600)} 小时`, 'good');
}
function buyGardenAutoHarvest() {
  ensureGarden();
  if (state.garden.autoHarvest) { toast('自动收获已经解锁啦', ''); return; }
  if (state.resources.gold < GARDEN_AUTO_COST) { toast(`金币不足，需要 ${fmt(GARDEN_AUTO_COST)}`, 'bad'); return; }
  state.resources.gold -= GARDEN_AUTO_COST;
  state.garden.autoHarvest = true;
  saveGame();
  renderAll();
  toast('自动收获已解锁：菜熟了就自己收，配合自动补种就是一块稳定收入', 'good', 3200);
  playSfx('buy');
}
function gardenAutoTick(now) {
  if (!state.garden || !Array.isArray(state.garden.plots)) return;
  state.garden.lastSeen = now;
  if (!state.garden.autoHarvest) return;
  if (!Array.isArray(state.garden.plots)) return;
  if (!state.garden.plots.some(p => p && gardenPlotStatus(p, now) === 'ready')) return;
  gardenHarvestAll(true);
}
function toggleGardenAuto() {
  ensureGarden();
  state.garden.auto = !state.garden.auto;
  toast(state.garden.auto ? '已开启自动补种：收完自动种回同一块地' : '已关闭自动补种', state.garden.auto ? 'good' : '');
  persist();
  renderAll();
}
function gardenHarvest(i) {
  ensureGarden();
  const p = state.garden.plots[i];
  if (!p) return;
  if (gardenPlotStatus(p) !== 'ready') { toast('还没成熟，再等等哦'); return; }
  const t = gardenTier(i);
  const mult = gardenProgressMult();
  const gold = Math.round(num(p.gold, t.gold) * mult);
  const fruit = Math.round(num(p.fruit, t.fruit) * GARDEN_FRUIT_BOOST);
  addReward({ gold, fruit, ...gardenDropBonus() });
  bumpMetric('gardens', 1);
  p.state = 'empty';
  p.readyAt = 0;
  delete p.tier; delete p.minutes; delete p.gold; delete p.fruit;
  toast(`菜园丰收：+${gold} 金币、+${fruit} 经验果`, 'good', 2600);
  playSfx('claim');
  if (state.garden.auto) gardenPlantAll(true);
  persist();
}
function gardenWater(i) {
  ensureGarden();
  const p = state.garden.plots[i];
  if (!p || gardenPlotStatus(p) !== 'growing') return;
  // 纯表现互动：只播水滴声与水珠动画，不修改成熟时间 readyAt、不修改收成 gold/fruit、不写奖励
  playSfx('heal');

function selfCareToday() {

    state.selfCare = {
      date: localDateKey(), focus: false, move: false, sun: false, water: false,
      doneReward: false, perfect: false,
      streak: clamp(Math.floor(num(prev.streak, 0)), 0, 9999),
      bestStreak: clamp(Math.floor(num(prev.bestStreak, 0)), 0, 9999),
      lastDoneDate: String(prev.lastDoneDate || ''),
      claimed: (prev.claimed && typeof prev.claimed === 'object') ? prev.claimed : {},
      hugAt: 0, nightAt: 0
    };
  }
  const sc = state.selfCare;
  if (typeof sc.doneReward !== 'boolean') sc.doneReward = false;
  if (typeof sc.perfect !== 'boolean') sc.perfect = false;
  if (typeof sc.sun !== 'boolean') sc.sun = false;
  if (typeof sc.water !== 'boolean') sc.water = false;
  sc.streak = clamp(Math.floor(num(sc.streak, 0)), 0, 9999);
  sc.bestStreak = clamp(Math.floor(num(sc.bestStreak, 0)), 0, 9999);
  if (typeof sc.lastDoneDate !== 'string') sc.lastDoneDate = '';

  sc.nightAt = num(sc.nightAt, 0);

function selfCarePoints() {

  const hug = sc.hugAt > 0 ? 1 : 0;

  return { tasks, hug, night, total: tasks + hug + night };

function claimSelfCare(kind) {
  const sc = selfCareToday();
  const task = CARE_TASKS.find(t => t.id === kind) || { label: '陪伴' };
  if (sc[kind]) { toast('今天这项已经完成啦，明天再来'); return; }

    const today = localDateKey();
    const yesterday = localDateKey(new Date(Date.now() - DAY_MS));
    sc.streak = sc.lastDoneDate === yesterday ? clamp(num(sc.streak, 0) + 1, 1, 9999) : 1;
    sc.lastDoneDate = today;

    extra = ' · 今日陪伴达成，今天挂机 +10%（连陪 ' + sc.streak + ' 天）';
    const ms = CARE_MILESTONES.find(m => sc.streak >= m.days && !sc.claimed['d' + m.days]);

function buildStageEnemyOptions(stage) {
  // 一律 3 只：数量少时单只敌人会吃掉全部战力，出现"1 只 6 级怪秒掉 5 只宠"的怪事
  const count = 3;
  const pool = PETS.filter(p => p.element === stage.element && !templateHasHeal(p));
  const source = pool.length ? pool : PETS.filter(p => p.element === stage.element);
  const lineup = [];
  for (let i = 0; i < count; i++) lineup.push(pick(source.length ? source : enemyPetPool()).id);
  // 章节难度统一由 STAGE_DIFFICULTY 决定（见 stageEnemyPower），这里不再二次缩放
  const bossDef = stage.type === 'boss' ? bossByChapter(stage.chapter) : null;
  // 章节越早 Boss 档案倍率打折，避免新手首章被高血 Boss 劝退；后期足额高属性
  const bossScale = bossDef ? (stage.chapter <= 2 ? 0.82 : (stage.chapter <= 5 ? 0.92 : 1)) : 1;
  return {
    count,
    lineup,
    element: stage.element,
    type: stage.type,
    boss: stage.type === 'boss',
    bossDef,
    bossScale,
    bossName: bossDef ? bossDef.name : stage.name,
    bossEmoji: bossDef ? bossDef.emoji : stage.emoji,
    // 第 1 章前三关是教学关：新手开局就有 5 只宠（战力 3,500 左右），这里逐关放开
    powerFactor: stage.chapter === 1 && stage.sub <= 3 ? [0.75, 0.90, 0.95][stage.sub - 1] : 1,
    level: Math.max(3, Math.round(3 + stage.index * 1.45)),
    star: 1,
    evo: stage.chapter >= 7 ? 1 : 0
  };
}

function startDungeon() {

  if (!getTeamPets().length) { toast('请先上阵宠物', 'bad'); return; }

  const modeIndex = currentDungeonModeIndex();

  const enemyLineup = [];
  for (let i = 0; i < 2; i++) enemyLineup.push(pick(enemyPool.length ? enemyPool : enemyPetPool()).id);
  const enemies = createEnemyFormation(Math.max(calcTeamPower() * 1.05, 2800), {

/* -------- 队伍 / 养成 -------- */
function deployPet(uid, row) {
  const pet = state.pets[uid];
  if (!pet) return;
  const cap = row === 'front' ? 2 : 3;
  if (deployedRow(uid) === row) { toast('它已经在那个位置啦'); return; }
  const total = state.team.front.length + state.team.back.length;
  const moving = deployedRow(uid) != null;
  if (!moving && total >= maxTeamSize()) { toast('队伍已满 6 只，请先让一只替补', 'bad'); return; }
  if (state.team[row].length >= cap) { toast(row === 'front' ? '前排已满（2 只）' : '后排已满（3 只）', 'bad'); return; }
  state.team.front = state.team.front.filter(id => id !== uid);
  state.team.back = state.team.back.filter(id => id !== uid);
  state.team[row].push(uid);
  noteBonds();
  saveGame();
  if (UI.modal) closeModal(true);
  renderAll();
  toast(`${petDisplayName(pet)} 已上阵${row === 'front' ? '前排' : '后排'}`, 'good');
}
function benchPet(uid) {
  const pet = state.pets[uid];
  if (!pet) return;
  state.team.front = state.team.front.filter(id => id !== uid);
  state.team.back = state.team.back.filter(id => id !== uid);
  noteBonds();
  saveGame();
  if (UI.modal) closeModal(true);
  renderAll();

}
function openTeamPresets() {
  const presets = Array.isArray(state.team.presets) ? state.team.presets : (state.team.presets = []);
  const rows = [0, 1, 2].map(i => {
    const p = presets[i];
    const info = p
      ? `${(p.front || []).length + (p.back || []).length} 只 · 战力 ${fmt(num(p.power, 0))}`
      : '空位';
    return `<div class="team-preset-row">
      <div><b>预设 ${i + 1}</b><p class="tiny muted" style="margin:2px 0 0">${info}</p></div>
      <div class="flex">
        <button class="btn btn-ghost btn-xs" type="button" data-act="teamPresetSave" data-slot="${i}">存当前</button>
        <button class="btn btn-lav btn-xs" type="button" data-act="teamPresetLoad" data-slot="${i}" ${p ? '' : 'disabled'}>载入</button>
      </div>
    </div>`;
  }).join('');

}
function teamPresetSave(slot) {
  if (!state.team.presets) state.team.presets = [];
  state.team.presets[slot] = {
    front: state.team.front.slice(),
    back: state.team.back.slice(),
    power: calcTeamPower(),
    at: Date.now()
  };
  saveGame();
  toast('阵容已存好', 'good');
  openTeamPresets();
}
function teamPresetLoad(slot) {
  const p = state.team.presets && state.team.presets[slot];
  if (!p) { toast('这个位子还没存过阵容', 'bad'); return; }
  const ok = uid => state.pets[uid];
  const front = (p.front || []).filter(ok).slice(0, 2);
  const back = (p.back || []).filter(ok).slice(0, 3);
  if (!front.length && !back.length) { toast('这套阵容里的宠物已经不在了', 'bad'); return; }
  state.team.front = front;
  state.team.back = back;
  noteBonds();
  saveGame();
  closeModal(true);
  renderAll();
  toast(`已切换回预设 ${slot + 1}`, 'good');
}
function autoTeam() {
  const all = ownedPets().slice().sort((a, b) => petPowerSafe(b) - petPowerSafe(a));
  if (!all.length) { toast('还没有宠物呢', 'bad'); return; }
  const top = all.slice(0, 5);
  const fronts = top.filter(p => templateOf(p).role === 'front').slice(0, 2);
  if (fronts.length < 2) {
    const rest = top.filter(p => !fronts.includes(p)).sort((a, b) => getPetStats(b).def - getPetStats(a).def);
    while (fronts.length < 2 && rest.length) fronts.push(rest.shift());
  }
  const back = top.filter(p => !fronts.includes(p)).slice(0, 3);
  state.team.front = fronts.map(p => p.uid);
  state.team.back = back.map(p => p.uid);
  noteBonds();
  saveGame();
  if (UI.modal) closeModal(true);
  renderAll();
  toast('已按战力自动安排队伍：前排优先高防御，后排补输出', 'good', 3000);
}
function clearTeam() {
  state.team.front = [];
  state.team.back = [];

  renderAll();
  toast('队伍已清空，记得重新上阵哦');
}
