function levelUpPet(uid, count = 1) {
  const pet = state.pets[uid];
  if (!pet) return;
  if (pet.level >= MAX_LEVEL) { toast('已经满级啦', 'bad'); return; }
  count = count >= 10 ? 10 : 1;
  const cost = nextLevelsCost(pet, count);
  if (state.resources.fruit < cost) { toast(`经验果不足，需要 ${fmt(cost)} 个`, 'bad'); return; }
  const before = pet.level;
  state.resources.fruit -= cost;
  pet.level = Math.min(MAX_LEVEL, pet.level + count);
  const actual = pet.level - before;
  bumpMetric('levelUps', actual);
  advanceTutorial(4);
  const evoUps = autoEvolvePet(pet);
  if (evoUps) { bumpMetric('evolutions', evoUps); noteBonds(); }
  saveGame();
  renderAll();
  if (UI.modal) openPetModal(uid);
  toast(`${petDisplayName(pet)} 升到 Lv.${pet.level}`, 'good');
  if (evoUps) {
    showEvolveBanner(petDisplayName(pet), pet.level >= 30 ? '究极体' : '成长体');
    toast(`${petDisplayName(pet)} 达到 Lv.${pet.level}，进化了！`, 'gold', 3200);
    playSfx('evolve');
  } else {
    playSfx('level');
  }
}
function starGoldCost(pet) {
  const star = num(pet.star, 1);
  return star >= 10 ? 0 : 200 * star;
}
function starUpPet(uid) {
  const pet = state.pets[uid];
  if (!pet) return;
  const cost = starUpCost(pet);
  if (!cost) { toast('已经十星啦', 'bad'); return; }
  const shards = petShardCount(pet.templateId);
  const useShards = Math.min(shards, cost);
  const missing = cost - useShards;
  const starNeeded = missing * 2;
  const costGold = starGoldCost(pet);
  if (state.items.starShard < starNeeded) {
    toast(`碎片不足：还缺 ${missing} 枚同名碎片或 ${starNeeded - state.items.starShard} 枚升星碎片`, 'bad');
    return;
  }
  if (state.resources.gold < costGold) {
    toast(`金币不足：升星还要 ${fmt(costGold)} 金币`, 'bad');
    return;
  }
  state.resources.gold -= costGold;
  state.petShards[pet.templateId] = shards - useShards;
  state.items.starShard -= starNeeded;
  pet.star = Math.min(10, pet.star + 1);
  bumpMetric('starUps', 1);
  saveGame();
  renderAll();
  if (UI.modal) openPetModal(uid);
  toast(`${petDisplayName(pet)} 升到 ${pet.star} 星！`, 'gold');
  playSfx('star');
}
function evolvePet(uid) {
  const pet = state.pets[uid];
  if (!pet) return;
  const evo = nextEvolution(pet);
  if (!evo) { toast('已经是究极体了', 'bad'); return; }
  const t = templateOf(pet);
  // 等级到了会自动进化，这里保留「花石头+金币提前进化」的通道，所以不再卡等级
  if (state.stones[t.element] < evo.stones) { toast(`需要 ${evo.stones} 颗${ELEMENTS[t.element].name}进化石`, 'bad'); return; }
  if (state.resources.gold < evo.gold) { toast(`需要 ${fmt(evo.gold)} 金币`, 'bad'); return; }
  state.stones[t.element] -= evo.stones;
  state.resources.gold -= evo.gold;
  pet.evo += 1;
  bumpMetric('evolutions', 1);
  noteBonds();
  saveGame();
  renderAll();
  if (UI.modal) openPetModal(uid);
  showEvolveBanner(petDisplayName(pet), EVOLUTIONS[pet.evo].name);
  toast(`提前进化！${petDisplayName(pet)} 变成了新形态`, 'gold', 3200);
  playSfx('evolve');
}
function upgradeSkill(uid, index) {
  const pet = state.pets[uid];
  if (!pet) return;
  index = clamp(Math.floor(index), 0, 3);
  const keys = ['basic', 'a1', 'a2', 'ult'];
  const key = keys[index];
  const level = getSkillLevel(pet, index);
  if (level >= 10) { toast('技能已经满级', 'bad'); return; }
  if (state.items.skillBook < 1) { toast('需要 1 本技能书', 'bad'); return; }
  const goldCost = 180 + level * 120;
  if (state.resources.gold < goldCost) { toast(`需要 ${fmt(goldCost)} 金币`, 'bad'); return; }
  state.items.skillBook -= 1;
  state.resources.gold -= goldCost;
  pet.skillLv[key] = level + 1;
  saveGame();
  renderAll();
  if (UI.modal) openPetModal(uid);
  toast('技能升级成功！', 'good');
  playSfx('level');
}
function renamePet(uid) {

function feedPet(uid) {

/* -------- 装备 -------- */
function equipItemAction(itemId, uid) {
  const item = equipmentById(itemId);
  const pet = state.pets[uid];
  if (!item || !pet) { toast('装备或宠物不存在', 'bad'); return; }
  if (item.equippedBy && item.equippedBy !== uid) {
    const oldOwner = state.pets[item.equippedBy];
    if (oldOwner && oldOwner.equipment[item.slot] === item.id) oldOwner.equipment[item.slot] = null;
  }
  const previous = equipmentById(pet.equipment[item.slot]);
  if (previous && previous.id !== item.id) previous.equippedBy = null;
  pet.equipment[item.slot] = item.id;
  item.equippedBy = pet.uid;
  saveGame();
  renderAll();
  if (UI.modal) openPetModal(pet.uid);
  toast(`${petDisplayName(pet)} 装备了 ${item.name}`, 'good');
  playSfx('equip');
}
function unequipItemAction(uid, slot) {
  const pet = state.pets[uid];
  if (!pet) return;
  const item = equipmentById(pet.equipment[slot]);
  if (!item) return;
  item.equippedBy = null;
  pet.equipment[slot] = null;
  saveGame();
  renderAll();

  toast(`${item.name} 已放回仓库`);

function enhanceItemAction(itemId) {

  state.items.enhanceStone -= costStone;

function dismantleItemAction(itemId) {

/* -------- 对战 -------- */
function startTower() {
  ensureTowerWeek();
  if (state.tower.floor > 30) { toast('已经登顶啦', 'bad'); return; }
  if (!getTeamPets().length) { toast('请先上阵宠物', 'bad'); return; }
  if (state.challenge.value < TOWER_CHALLENGE_COST) { toast('挑战券不足', 'bad'); return; }
  const floor = state.tower.floor;
  const isBossFloor = floor % 5 === 0;
  spendChallenge(TOWER_CHALLENGE_COST);
  bumpMetric('battles', 1);
  const power = towerFloorPower(floor);
  const chapter = CHAPTERS[(floor - 1) % CHAPTERS.length];
  const pool = PETS.filter(p => p.element === chapter.element && !templateHasHeal(p));
  const lineup = [];
  // 一律 3 只：单只残影会吃掉整层战力，显示数字就完全失真了
  const count = 3;
  for (let i = 0; i < count; i++) lineup.push(pick(pool.length ? pool : enemyPetPool()).id);
  const enemies = createEnemyFormation(power, {
    count,
    lineup,
    element: chapter.element,
    boss: isBossFloor,
    bossName: `第 ${floor} 层残影`,
    bossEmoji: '🗼',
    name: `第 ${floor} 层残影`,
    emoji: '🗼',
    bossHpMult: isBossFloor ? 2.0 : 1,
    powerFactor: 1,
    level: Math.max(10, Math.round(floor * 2.3)),
    star: 1,
    evo: floor >= 15 ? 1 : 0
  });
  saveGame();
  const ok = startBattle({
    mode: 'tower',
    floor,
    title: `梦塔 · 第 ${floor} 层`,
    subtitle: '一层一层走进别人的噩梦 · 每 5 层有额外装备奖励',
    emoji: '🗼',
    enemies,
    maxRounds: 30
  });
  if (ok) {
    advanceTutorial(5);
    renderTopbar();
    saveGame();
    playSfx('battle');
  }
}
function towerRush() {
  ensureTowerWeek();
  if (UI.towerRush) return;
  if (state.tower.floor > 30) { toast('本周已经登顶啦', 'bad'); return; }
  if (state.challenge.value < TOWER_CHALLENGE_COST) { toast('挑战券不足', 'bad'); return; }
  if (!getTeamPets().length) { toast('请先上阵宠物', 'bad'); return; }
  UI.towerRush = { from: state.tower.floor, fights: 0, wins: 0, gold: 0, crystal: 0, stop: '' };
  const rootEl = $('#battleRoot');
  if (rootEl) rootEl.style.display = 'none';   // 连战期间不闪战斗画面

  setTimeout(towerRushStep, 60);

function towerRushStep() {
  const R = UI.towerRush;
  if (!R) return;
  if (state.tower.floor > 30) { R.stop = '本周已登顶'; return towerRushDone(); }
  if (state.challenge.value < TOWER_CHALLENGE_COST) { R.stop = '挑战券不足'; return towerRushDone(); }
  const floor = state.tower.floor;
  const g0 = state.resources.gold, c0 = state.resources.crystal;
  closeBattle();
  startTower();
  const b = UI.battle;
  if (!b) { R.stop = '无法开战'; return towerRushDone(); }
  R.fights++;
  skipBattle();
  R.gold += state.resources.gold - g0;
  R.crystal += state.resources.crystal - c0;
  if (!b.win) { R.stop = `第 ${floor} 层没过`; return towerRushDone(); }
  R.wins++;
  setTimeout(towerRushStep, 60);
}
function towerRushDone() {
  const R = UI.towerRush || { from: 1, fights: 0, wins: 0, gold: 0, crystal: 0, stop: '' };
  UI.towerRush = null;
  const rootEl = $('#battleRoot');
  if (rootEl) rootEl.style.display = '';
  closeBattle();
  const parts = [`连战结束 · ${R.wins}/${R.fights} 胜`, `🪙+${fmt(Math.max(0, R.gold))}`, `💎+${Math.max(0, R.crystal)}`];
  if (R.stop) parts.push(R.stop);
  toast(parts.join(' · '), R.wins ? 'good' : 'bad', 3600);
  playSfx(R.wins ? 'win' : 'lose');
  saveGame();
}

function handleActionClick(event) {

  const act = target.dataset.act;
  const uid = target.dataset.uid || '';
  const index = Number(target.dataset.index);
  const count = Number(target.dataset.count || 1);
  switch (act) {
    case 'nav': navTo(target.dataset.tab); break;
    case 'tutorialGo': tutorialGo(target); break;
    case 'skipTutorial': skipTutorial(); break;

    case 'closeModal': closeModal(); break;
    case 'finalEnding': chooseFinalEnding(target.dataset.code); break;
    case 'recallRush': recallRush(); break;
    case 'openSettings': openSettingsModal(); break;
    case 'openRebirth': openRebirthModal(); break;

    case 'claimWeekly': claimWeekly(target.dataset.goal); break;

    case 'selfMove': claimSelfCare('move'); break;
    case 'selfSun': claimSelfCare('sun'); break;
    case 'selfWater': claimSelfCare('water'); break;
    case 'hugPet': hugPet(); break;
    case 'goodnightPet': goodnightPet(); break;
    case 'pat': patPet(); break;
    case 'palPat': patPet(uid); break;
    case 'setMain': setMain(uid); break;
    case 'buyBoost': buyBoost(target.dataset.kind); break;
    case 'buyOfflineSlot': buyOfflineSlot(); break;
    case 'claimOffline': claimOfflineOffer(); break;
    case 'buyOfflineCap': buyOfflineCap(); break;

    case 'adventureChapter':
      UI.adventureChapter = clamp(Number(target.dataset.chapter) || 1, 1, CHAPTERS.length);
      renderPage();
      break;
    case 'startStage': startStage(Number(target.dataset.index)); break;
    case 'closePreBattle': closePreBattle(); break;
    case 'confirmPreBattle': confirmPreBattle(); break;
    case 'sweepStage': sweepStage(Number(target.dataset.index)); break;

      UI.petTab = target.dataset.tab || 'team';
      renderPage();
      break;
    case 'shopTab':
      UI.shopTab = target.dataset.tab || 'gacha';
      renderPage();
      break;
    case 'questTab':
      UI.questTab = target.dataset.tab || 'daily';
      renderPage();
      break;
    case 'miniDeal': miniDeal(); break;
    case 'miniPick': miniPick(target.dataset.el); break;

      UI.achFilter = target.dataset.filter || 'all';

      break;

    case 'petSort': UI.petSort = target.dataset.sort || 'default'; renderPage(); break;
    case 'exchangeJump': {
      const el = document.getElementById(target.dataset.target || '');
      if (el) window.scrollTo({ top: Math.max(0, el.getBoundingClientRect().top + window.scrollY - 78), behavior: 'smooth' });
      break;

    case 'teamPresetSave': teamPresetSave(Number(target.dataset.slot) || 0); break;

    case 'slotPicker': openSlotPicker(target.dataset.row === 'front' ? 'front' : 'back'); break;

    case 'levelUp': levelUpPet(uid, count); break;

    case 'evolve': evolvePet(uid); break;
    case 'upgradeSkill': upgradeSkill(uid, index); break;

/* ========== 7.5 云端自动后台同步（与主应用共享 dd:sync 同步码） ========== */
const SYNC_CFG_KEY = 'dd:sync';
const SYNC_VALUE_MAX = 256 * 1024;
let gameSyncTimer = null;
let gameBgSyncTimer = null;

function gameSyncCfg() {
  try {
    const c = JSON.parse(localStorage.getItem(SYNC_CFG_KEY) || 'null');
    return c && typeof c === 'object' && c.code ? c : null;
  } catch (err) { return null; }
}
function gameSyncHeaders() {
  const c = gameSyncCfg() || {};
  return { 'content-type': 'application/json', 'x-sync-secret': c.secret || '' };
}
function gameSyncConfigAt() {
  const c = gameSyncCfg();
  return Number(c && c.at) || 0;
}
function gameSyncConfigSave(patch) {
  const c = gameSyncCfg() || {};
  try { localStorage.setItem(SYNC_CFG_KEY, JSON.stringify(Object.assign({}, c, patch))); } catch (err) { /* 忽略 */ }
}
function gameCollectSnapshot() {
  // 全量快照：本机 dd: 记录 + 游戏存档，保证一次 push 覆盖整份云端记录（整体时间戳覆盖语义）
  const out = {};
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k) continue;
      const allowed = (k.indexOf('dd:') === 0 && k !== SYNC_CFG_KEY) || k === SAVE_KEY;
      if (!allowed) continue;
      const v = localStorage.getItem(k);
      if (typeof v === 'string' && v.length <= SYNC_VALUE_MAX) out[k] = v;
    }
  } catch (err) { /* 读不到就当空 */ }
  return out;
}
async function gameSyncPush(silent) {
  const cfg = gameSyncCfg();
  if (!cfg || !cfg.code) return;
  try {
    const savedAt = Date.now();
    const res = await fetch('/api/sync/save', {
      method: 'POST',
      headers: gameSyncHeaders(),
      body: JSON.stringify({ code: cfg.code, payload: gameCollectSnapshot(), savedAt })
    });
    const j = await res.json();
    if (j && j.ok) {
      gameSyncConfigSave({ at: Number(j.updatedAt || savedAt) });
    } else if (!silent && j && j.reason === 'bad-secret') {
      toast('需要先在主应用设置里填服务端口令', 'bad', 2800);
    }
  } catch (err) { /* 后台静默：网络不顺不打断游戏 */ }
}
async function gameSyncPull() {
  const cfg = gameSyncCfg();
  if (!cfg || !cfg.code) return;
  if (UI.battle || UI.modal || UI.offlineOffer) return; // 战斗/弹窗/离线结算中不自动覆盖
  try {
    const res = await fetch('/api/sync/load?code=' + encodeURIComponent(cfg.code), {
      cache: 'no-store', headers: gameSyncHeaders()
    });
    const j = await res.json();
    if (!j || !j.ok) return;
    if (Number(j.savedAt || 0) <= gameSyncConfigAt() + 500) return;
    const remote = j.payload || {};
    // 主应用键写回本机存储，留给主应用页读取；游戏只接管游戏键
    Object.keys(remote).forEach((k) => {
      if ((k.indexOf('dd:') === 0 && k !== SYNC_CFG_KEY) && typeof remote[k] === 'string') {
        try { localStorage.setItem(k, remote[k]); } catch (err) { /* 忽略 */ }
      }
    });
    if (typeof remote[SAVE_KEY] === 'string') {
      let parsed = null;
      try { parsed = JSON.parse(remote[SAVE_KEY]); } catch (err) { return; }
      if (!parsed || typeof parsed !== 'object' || !parsed.pets) return;
      try {
        state = sanitizeState(deepMerge(defaultState(), parsed));
      } catch (err) { return; }
      UI.battle = null; UI.modal = null; UI.feedGame = null; UI.offlineOffer = null;
      UI.lastTick = Date.now(); UI.lastSaveTick = Date.now();
      UI.tab = ['home', 'adventure', 'pets', 'battle', 'shop', 'quest'].includes(state.lastTab) ? state.lastTab : 'home';
      saveGame();
      renderAll();
    }
    gameSyncConfigSave({ at: Number(j.savedAt) });
  } catch (err) { /* 静默 */ }
}
async function gameSyncNow(silent) {
  await gameSyncPull();
  await gameSyncPush(silent);
}
function gameSyncSchedule() {
  if (!gameSyncCfg()) return;
  if (gameSyncTimer) clearTimeout(gameSyncTimer);
  gameSyncTimer = setTimeout(() => {
    gameSyncTimer = null;
    gameSyncPush(true);
  }, 8000);
}

function audioTone(freq, duration, type = 'sine', volume = 0.025, delay = 0, slideTo = null) {
  const ctx = UI.audioCtx;

    const t0 = ctx.currentTime + Math.max(0, delay);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(30, freq), t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + duration);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, volume), t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.03);

const MUSIC_TRACKS = (() => {
  function light() {
    const parts = [];
    const chords = [
      [261.63, 329.63, 392.00, 523.25],
      [196.00, 246.94, 293.66, 392.00],
      [220.00, 261.63, 329.63, 440.00],
      [174.61, 220.00, 261.63, 349.23]
    ];
    const step = 0.275, cell = step * 4;
    for (let rep = 0; rep < 2; rep++) {
      chords.forEach((ch, ci) => {
        const t0 = rep * 4 * cell + ci * cell;
        parts.push([ch[0] / 2, t0, 1.05, 'sine', 0.0048]);
        ch.forEach((f, i) => parts.push([f, t0 + i * step, 0.26, 'triangle', 0.0074]));
      });
    }
    const mt = 2 * 4 * cell;
    [523.25, 659.25, 783.99, 659.25, 523.25].forEach((f, i) => parts.push([f, mt + i * 0.34, 0.42, 'triangle', 0.008]));

  }
  function calm() {
    const parts = [];
    const pads = [
      [220.00, 261.63, 329.63],
      [196.00, 246.94, 293.66],
      [174.61, 220.00, 261.63],
      [246.94, 293.66, 349.23]
    ];
    const cell = 2.1;
    pads.forEach((ch, ci) => {
      const t0 = ci * cell;
      ch.forEach((f, i) => parts.push([f, t0 + i * 0.42, 2.7, 'sine', 0.0042]));
      parts.push([ch[0] / 2, t0, 2.6, 'sine', 0.003]);

  }
  function breeze() {
    const parts = [[261.63, 0, 8.6, 'sine', 0.0032]];
    const pent = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 880.00, 783.99, 659.25, 587.33];
    pent.forEach((f, i) => parts.push([f, 0.5 + i * 0.8, 0.5, i % 2 ? 'triangle' : 'sine', 0.0058]));

    const parts = [];

    const cell = 2.4;

        parts.push([ch[0] / 2, t0, cell * 0.96, 'sine', 0.0036]);
        parts.push([ch[2], t0 + 0.5, 1.5, 'sine', 0.003]);
        parts.push([ch[1], t0 + 1.2, 1.2, 'triangle', 0.0028]);

})();

const ART_LIGHT_PETS = { gull: 1, sparrow: 1, moth: 1, albatross: 1, bat: 1, jellyfish: 1, flysquirrel: 1, bee: 1, phoenix: 1, flamingo: 1, peacock: 1, owl: 1 };

function artRhythm(templateId) {

  const amp2 = amp1 * 0.62 + unit(11) * 0.28;
  const amp3 = amp2 * 0.78 + unit(19) * 0.22;
  const c1 = (light ? 5.4 : heavy ? 10.4 : 7.4) + unit(5) * 1.8;
  const c2 = (light ? 3.8 : heavy ? 7 : 5.2) + unit(17) * 1.2;
  const c3 = c2 * 0.82 + unit(23) * 0.6;
  return { breathe: breathe, sway: sway, delay: delay, amp1: amp1, amp2: amp2, amp3: amp3, c1: c1, c2: c2, c3: c3, cls: light ? 'art-fly' : heavy ? 'art-heavy' : '' };
}
function artIdFromSrc(src) {
  const name = String(src || '').split('/').pop().split('?')[0].replace(/\.(png|jpg|jpeg|webp)$/i, '');
  return name.replace(/_s[12]$/i, '').replace(/_p[1-3]$/i, '');
}
function petAnimDecorate() {
  applyPetAnimPref();
  if (!petAnimOn()) return;
  const frames = document.querySelectorAll('.art-frame');
  for (const frame of frames) {
    if (frame.classList.contains('art-alive')) continue;
    const img = frame.querySelector('img');
    if (!img) continue;
    const src = img.getAttribute('src') || '';
    if (!/(art)\/pets|(art)\/mobs|(art)\/bosses/.test(src)) continue;
    if (frame.getBoundingClientRect().width < 30) continue;
    const id = artIdFromSrc(src);
    if (!id) continue;
    const rhythm = artRhythm(id);
    frame.style.setProperty('--breathe', rhythm.breathe.toFixed(2) + 's');
    frame.style.setProperty('--sway', rhythm.sway.toFixed(2) + 's');
    frame.style.setProperty('--delay', rhythm.delay.toFixed(2) + 's');
    if (rhythm.cls) frame.classList.add(rhythm.cls);
    frame.classList.add('art-alive');
    if (frame.classList.contains('art-rig')) frame.classList.remove('art-alive');
  }
  const rigs = document.querySelectorAll('.rig');
  for (const rig of rigs) {
    if (rig.dataset.rig) continue;
    const img = rig.querySelector('img');
    const id = artIdFromSrc(img ? img.getAttribute('src') : '');
    if (!id) continue;
    const rhythm = artRhythm(id);
    rig.style.setProperty('--amp1', rhythm.amp1.toFixed(2) + 'deg');
    rig.style.setProperty('--amp2', rhythm.amp2.toFixed(2) + 'deg');
    rig.style.setProperty('--amp3', rhythm.amp3.toFixed(2) + 'deg');
    rig.style.setProperty('--c1', rhythm.c1.toFixed(2) + 's');
    rig.style.setProperty('--c2', rhythm.c2.toFixed(2) + 's');
    rig.style.setProperty('--c3', rhythm.c3.toFixed(2) + 's');
    rig.style.setProperty('--d1', rhythm.delay.toFixed(2) + 's');
    rig.style.setProperty('--d2', (rhythm.delay * 1.37).toFixed(2) + 's');
    rig.style.setProperty('--d3', (rhythm.delay * 1.88).toFixed(2) + 's');
    rig.style.setProperty('--shift', (0.22 + (rhythm.amp1 % 0.3)).toFixed(2) + '%');
    rig.dataset.rig = '1';
    const host = rig.parentElement;
    if (host) { host.classList.add('art-alive', 'art-rig'); if (rhythm.cls) host.classList.add(rhythm.cls); }
  }
  const singles = document.querySelectorAll('.home-pet-img,.codex-img,.pal-img');
  for (const img of singles) {
    if (img.dataset.animReady) continue;
    const id = artIdFromSrc(img.getAttribute('src'));
    if (!id) continue;
    const rhythm = artRhythm(id);
    img.style.setProperty('--breathe', rhythm.breathe.toFixed(2) + 's');
    img.style.setProperty('--delay', rhythm.delay.toFixed(2) + 's');
    img.dataset.animReady = '1';
  }
}
let petAnimTimer = 0;
function petIdleTick() {
  petAnimDecorate();
  if (!petAnimOn() || document.hidden || UI.battle || UI.modal) return;
  const nodes = document.querySelectorAll('.art-alive:not([data-acting])');
  if (!nodes.length) return;
  const node = nodes[Math.floor(Math.random() * nodes.length)];
  node.dataset.acting = '1';
  const acts = node.classList.contains('art-rig')
    ? ['bounce', 'bounce', 'tilt', 'shake', 'stretch', 'nod', 'nod', 'drowse']
    : ['bounce', 'tilt'];
  const act = acts[Math.floor(Math.random() * acts.length)];
  node.classList.add('art-act-' + act);
  setTimeout(() => {
    node.classList.remove('art-act-bounce', 'art-act-tilt', 'art-act-shake', 'art-act-stretch', 'art-act-nod', 'art-act-drowse');
    delete node.dataset.acting;
  }, act === 'drowse' ? 2000 : 1000);
}
function startPetAnim() {
  applyPetAnimPref();
  petAnimDecorate();
  if (!startPetAnim.bound) {
    startPetAnim.bound = true;
    document.addEventListener('pointerdown', (ev) => {
      const node = ev.target && ev.target.closest ? ev.target.closest('.art-alive') : null;
      if (!node || !petAnimOn()) return;
      node.classList.remove('art-act-bounce', 'art-act-tilt');
      void node.offsetWidth;
      node.classList.add('art-act-bounce');
      setTimeout(() => node.classList.remove('art-act-bounce'), 820);
    }, { passive: true });
  }
  if (petAnimTimer) return;
  petAnimTimer = setInterval(petIdleTick, 2600);
}
function togglePetAnim() {
  state.settings.petAnim = state.settings.petAnim === false;
  saveGame();
  const button = document.getElementById('btnTogglePetAnim');
  if (button) button.textContent = state.settings.petAnim === false ? '关闭' : '开启';
  applyPetAnimPref();
  restartPetAnim();
  renderAll();
  toast(state.settings.petAnim === false ? '立绘小动作：已关闭' : '立绘小动作：已开启，它们会呼吸了', 'good');
}
function restartPetAnim() {
  if (petAnimTimer) { clearInterval(petAnimTimer); petAnimTimer = 0; }
  petAnimDecorate();
  petAnimTimer = setInterval(petIdleTick, 2600);
}

function bootGame() {
  try {
    state = loadState();
    UI.tab = TABS.some(t => t.id === state.lastTab) ? state.lastTab : 'home';
    UI.adventureChapter = currentChapterNumber();
    UI.petTab = 'team';
    UI.shopTab = 'gacha';
    UI.questTab = 'daily';
    UI.scrollReset = false;
    UI.lastTick = Date.now();
    UI.lastSaveTick = Date.now();
    UI.loadError = false;
    const elapsed = Math.max(0, (Date.now() - state.savedAt) / 1000);
    // 老存档补算：等级已达到但尚未进化的宠物，直接切到对应形态（换名 + 换立绘）
    let migratedEvo = 0;
    Object.values(state.pets || {}).forEach(p => { migratedEvo += autoEvolvePet(p); });
    if (migratedEvo) { bumpMetric('evolutions', migratedEvo); noteBonds(); }
    regenAll();
    ensureDaily();
    ensureGarden();
    settleGardenOffline();
    ensureEncounter();
    ensureArenaSeason();
    updateCareElapsed(elapsed);
    const offer = buildOfflineOffer(elapsed);
    UI.offlineOffer = offer;
    if (offer) {
      // 未领取离线收益前，savedAt 保持旧值，刷新页面不会丢失这段时间。
    } else {
      if (elapsed > 1 && teamPetsOf(state).length) accrueIdle(elapsed);
    }
    saveGame();
    renderAll();
    startPetAnim();
    bindGlobalEvents();
    startGameLoop();
    if (gameSyncCfg()) setTimeout(() => gameSyncNow(true), 1200);
    if (UI.loadError) toast('存档读取失败，已用新的小镇重新开始。', 'bad', 3600);
    if (offer) setTimeout(() => showOfflineModal(offer), 520);
    if (state.settings.music) setTimeout(() => syncAudio(), 900);
    registerGameServiceWorker();
  } catch (err) {
    try {
      state = defaultState();
      renderAll();
      bindGlobalEvents();
      startGameLoop();
      toast('游戏初始化遇到问题，已启动一个全新的小镇。', 'bad', 4000);
    } catch (inner) {
      const view = $('#view');
      if (view) view.innerHTML = '<div class="card empty"><h2>初始化失败</h2><p>请刷新页面重试。</p></div>';
    }
  }
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootGame);
else bootGame();
</script>
