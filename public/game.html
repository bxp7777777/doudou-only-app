/* -------- 挂机经济 -------- */
function idleStageInfo() {
  const index = state.stage.maxCleared > 0 ? state.stage.maxCleared : 1;
  return getStage(index);
}
function calcIdleRates(ignoreBoost = false) {
  const team = getTeamPets();
  const stage = idleStageInfo();
  if (!team.length) {
    return { gold: 0, fruit: 0, stage, teamPower: 0, efficiency: 0, boost: false };
  }
  const teamPower = calcTeamPower();
  const efficiency = clamp(teamPower / Math.max(1, stage.recPower), 0.45, 2.2);
  const eternalBonus = 1 + (state.eternal.idle || 0) * 0.05;
  const boost = !ignoreBoost && state.idle.boostUntil > Date.now();
  const boostMult = boost ? 2 : 1;
  // 全队平均饱食 / 心情温和影响挂机产出：喂饱、哄开心略增产，长期冷落略减产
  const avgHunger = sum(team.map(p => num(p.hunger, 80))) / team.length;
  const avgMood = sum(team.map(p => num(p.mood, 80))) / team.length;
  const idleCareMult = (avgHunger >= 80 ? 1.05 : (avgHunger < 30 ? 0.90 : 1))
    * (avgMood >= 80 ? 1.03 : (avgMood < 30 ? 0.95 : 1));
  return {
    gold: stage.baseGold * efficiency * eternalBonus * boostMult * idleCareMult,
    fruit: stage.baseFruit * efficiency * eternalBonus * boostMult * idleCareMult,
    stage,
    teamPower,
    efficiency,
    boost,
    careMult: idleCareMult,
    avgHunger: Math.round(avgHunger),
    avgMood: Math.round(avgMood)
  };
}
function accrueIdle(seconds, s = state) {
  seconds = Math.max(0, Math.min(seconds, 86400));
  if (seconds <= 0) return;
  const team = teamPetsOf(s);
  if (!team.length) return;
  const saved = state;
  state = s;
  const rates = calcIdleRates();
  state = saved;
  s.idle.pendingGold = Math.min(1e15, s.idle.pendingGold + rates.gold * seconds);
  s.idle.pendingFruit = Math.min(1e12, s.idle.pendingFruit + rates.fruit * seconds);
  s.quests.metrics.idleSeconds += seconds;
  for (const pet of team) pet.intimacy = clamp(num(pet.intimacy, 0) + seconds * 0.00035, 0, 100);
}
function offlineSlotsBonus(s = state) {
  return 1 + clamp(s.idle.offlineSlots, 0, 4) * 0.15;
}
// 离线收益 = 离线时每秒产出 × 离线秒数 × 0.6 × 挂机位加成。
// 离线秒数由 Date.now() 与存档 savedAt 的差值得到，最多 12 小时。
function buildOfflineOffer(seconds) {
  const capped = clamp(seconds, 0, OFFLINE_CAP_SEC);
  const team = getTeamPets();
  if (!team.length || capped < 20) return null;
  const rates = calcIdleRates(true);
  if (rates.gold <= 0) return null;
  const slotBonus = offlineSlotsBonus();
  const gold = Math.floor(rates.gold * capped * OFFLINE_RATE * slotBonus);
  const fruit = Math.floor(rates.fruit * capped * OFFLINE_RATE * slotBonus);
  return {
    seconds: capped,
    requestedSeconds: Math.max(0, seconds),
    cappedOut: seconds > OFFLINE_CAP_SEC,
    gold,
    fruit,
    goldPerSec: rates.gold,
    efficiency: rates.efficiency,
    slotBonus,
    stage: rates.stage
  };
}
function claimOfflineOffer() {

/* -------- 抽蛋 -------- */
function gachaCost(type, count) {
  if (type === 'rare') return count === 10 ? { crystal: 2700 } : { crystal: 300 };
  return count === 10 ? { gold: 4500 } : { gold: 500 };
}
function rollRarity(type) {
  const rates = GACHA_RATES[type] || GACHA_RATES.normal;
  const keys = ['N', 'R', 'SR', 'SSR'];
  return weightedPick(keys, keys.map(k => rates[k]));
}
function randomTemplateOfRarity(rarity) {
  const pool = PETS.filter(p => p.rarity === rarity);
  return pick(pool.length ? pool : PETS);
}
function pullGacha(type, count) {
  const cost = gachaCost(type, count);
  if (!canPayCost(cost)) { toast(`资源不足：${costText(cost)}`, 'bad'); return null; }
  payCost(cost);
  const rarities = [];
  for (let i = 0; i < count; i++) rarities.push(rollRarity(type));
  let guaranteed = false;
  if (count === 10 && !rarities.some(r => r === 'SR' || r === 'SSR')) {
    const forced = chance(0.72) ? 'SR' : 'SSR';
    rarities[9] = forced;
    guaranteed = true;
  }
  const results = [];
  for (let i = 0; i < count; i++) {
    const rarity = rarities[i];
    const template = randomTemplateOfRarity(rarity);
    const ownedBefore = Object.values(state.pets).some(p => p.templateId === template.id);
    const shiny = chance(template.rarity === 'SSR' ? 0.05 : SHINY_RATE);
    let isNew = false;
    let shards = 0;
    if (ownedBefore) {
      shards = RARITIES[template.rarity].dup;
      addPetShards(template.id, shards);
    } else {
      createPet(template.id, { shiny, autoDeploy: true });
      isNew = true;
    }
    results.push({
      templateId: template.id,
      rarity: template.rarity,
      name: template.name,
      emoji: petEmojiById(template.id, 0),
      element: template.element,
      shiny,
      isNew,
      shards,
      guaranteed: guaranteed && i === 9
    });
  }
  if (type === 'rare') state.gacha.rare += count; else state.gacha.normal += count;
  state.gacha.total += count;
  state.quests.metrics.pulls += count;
  bumpMetric('pulls', count);
  state.gacha.lastResults = results.map(r => ({
    templateId: r.templateId, rarity: r.rarity, emoji: r.emoji, isNew: r.isNew, shiny: r.shiny
  }));
  noteBonds();
  saveGame();
  return results;
}

/* -------- 每日任务 / 成就 / 签到 -------- */
function dailyTaskProgress(taskId) {
  const task = DAILY_TASKS.find(t => t.id === taskId);
  if (!task) return 0;
  return Math.min(task.target, Math.floor(num(state.daily.progress[task.metric], 0)));
}
function bumpMetric(metric, amount = 1, s = state) {
  if (!metric) return;
  s.quests.metrics[metric] = Math.max(0, num(s.quests.metrics[metric], 0) + amount);
  for (const task of DAILY_TASKS) {
    if (task.metric === metric) {
      s.daily.progress[task.metric] = Math.min(task.target, Math.floor(num(s.daily.progress[task.metric], 0) + amount));
    }
  }
}
function claimDailyTask(taskId) {
  ensureDaily();
  const task = DAILY_TASKS.find(t => t.id === taskId);
  if (!task) return;
  if (state.daily.claimed.includes(task.id)) { toast('这份奖励已经领过啦', 'bad'); return; }
  if (dailyTaskProgress(task.id) < task.target) { toast('任务还没完成哦', 'bad'); return; }
  state.daily.claimed.push(task.id);
  const logs = addReward(task.reward);
  state.quests.metrics.dailyClaims += 1;
  saveGame();
  renderAll();
  toast(`领取成功：${rewardLogText(logs)}`, 'good');
}
function claimAllDailyTasks() {
  ensureDaily();
  const available = DAILY_TASKS.filter(t => !state.daily.claimed.includes(t.id) && dailyTaskProgress(t.id) >= t.target);
  if (!available.length) { toast('没有可领取的任务奖励', 'bad'); return; }
  let allLogs = [];
  for (const task of available) {
    state.daily.claimed.push(task.id);
    allLogs = allLogs.concat(addReward(task.reward));
    state.quests.metrics.dailyClaims += 1;
  }
  saveGame();
  renderAll();
  toast(`领取 ${available.length} 份任务奖励！`, 'good');
}
function achievementProgress(ach, s = state) {
  try { return Math.min(ach.target, Math.max(0, Math.floor(ach.get(s)))); } catch (err) { return 0; }
}
function achievementClaimed(id) { return !!state.quests.claimedAchievements[id]; }
function claimAchievement(id) {

  if (!ach) return;
  if (state.quests.claimedAchievements[ach.id]) { toast('这个成就已经领取过啦', 'bad'); return; }

function canSignInToday() {

function makeStageRewards(stage, firstClear) {
  const reward = {
    gold: Math.round(stage.baseGold * 45 + stage.recPower * 0.16),
    crystal: 4 + stage.chapter * 2 + (stage.type === 'boss' ? 8 : 0),
    fruit: 6 + stage.chapter * 3 + (stage.type === 'boss' ? 10 : 0)
  };
  if (firstClear) {
    reward.crystal += 10 + stage.chapter * 4;
    if (stage.type === 'elite') reward.stones = { [stage.element]: 1 };
    if (stage.type === 'boss') {
      reward.stones = { [stage.element]: 3 };
      reward.starShard = 2;
      reward.equipment = stage.chapter >= 5 ? 'epic' : 'fine';
    }
  } else if (stage.type === 'boss') {
    reward.equipment = 'fine';
  } else if (stage.type === 'elite' && chance(0.30)) {
    reward.equipShard = 8;
  }
  return reward;
}
function makeTowerReward(floor) {
  const reward = {
    gold: Math.round(520 + floor * 180),
    crystal: 15 + floor * 2,
    stonesRandom: 2,
    fruit: 8 + floor
  };
  if (floor % 5 === 0) {
    reward.starShard = 4;
    reward.skillBook = 1;
    reward.equipment = floor >= 15 ? 'epic' : 'fine';
  }
  return reward;
}
function makeDungeonReward(modeIndex = currentDungeonModeIndex()) {
  const progress = state.stage.maxCleared;
  if (modeIndex === 0) {
    return { fruit: 70 + progress * 6, gold: 900 + progress * 80, crystal: 10 };
  }
  if (modeIndex === 1) {
    return { gold: 3200 + progress * 420, fruit: 12 + Math.floor(progress / 3), crystal: 15 };
  }
  return { stonesRandom: 4 + Math.floor(progress / 10), crystal: 30, starShard: 1 };

function createEnemyFormation(powerTarget, options = {}) {
  const count = clamp(Math.floor(num(options.count, 3)), 1, 5);
  const targetPower = Math.max(250, num(powerTarget, 1000));
  const level = clamp(Math.floor(num(options.level, 5 + targetPower / 850)), 3, 99);
  const lineup = [];
  if (Array.isArray(options.lineup)) for (const id of options.lineup) if (PET_MAP[id] && lineup.length < count) lineup.push(id);
  let guard = 0;
  while (lineup.length < count && guard++ < 20) {
    const preferred = PETS.filter(p => p.element === options.element && !templateHasHeal(p));
    const fallback = PETS.filter(p => p.element === options.element);
    const source = preferred.length ? preferred : (fallback.length ? fallback : enemyPetPool());
    lineup.push(pick(source).id);
  }
  const artFor = (i) => {
    const isB = !!options.boss && i === 0;
    if (isB && options.bossDef) {
      return { artKind: 'boss', artId: options.bossDef.id, element: options.bossDef.element, name: options.bossDef.name, emoji: options.bossDef.emoji };
    }
    if (!isB) {
      const m = pickMob(options.element, options.type === 'elite');
      return { artKind: 'mob', artId: m.id, element: m.element, name: m.name, emoji: m.emoji };
    }
    return {};
  };
  const raw = lineup.slice(0, count).map((id, i) => {
    const art = artFor(i);
    return makeEnemyRuntime(id, level, i, {
      row: i < 2 ? 'front' : 'back',
      star: options.star || 1,
      evo: options.evo || 0,
      elite: options.type === 'elite',
      boss: !!options.boss && i === 0,
      isBoss: !!options.boss && i === 0,
      artKind: art.artKind || null,
      artId: art.artId || null,
      element: art.element || undefined,
      name: art.name || options.name || ((options.boss && i === 0) ? options.bossName : null),
      emoji: art.emoji || options.emoji || ((options.boss && i === 0) ? options.bossEmoji : null)
    });
  });
  const rawPower = Math.max(100, sum(raw.map(u => calcPower(u))));
  const scale = clamp(targetPower * (options.powerFactor || 0.95) / rawPower, 0.12, 25);
  raw.forEach((unit, i) => {
    const boss = !!options.boss && i === 0;
    const bdef = options.bossDef || null;
    const bs = options.bossScale || 1;
    const bossHp = boss ? (bdef ? bdef.hpMult * bs : (options.bossHpMult || 3.0) * bs) : 1;
    const bossAtk = boss ? (bdef ? bdef.atkMult * bs : 1.20 * bs) : 1;
    const bossDefMult = boss ? (bdef ? bdef.defMult * bs : 1.25 * bs) : 1;
    unit.maxHp = Math.max(80, Math.round(unit.maxHp * scale * bossHp));
    unit.hp = unit.maxHp;
    unit.atk = Math.max(12, Math.round(unit.atk * scale * bossAtk));
    unit.def = Math.max(6, Math.round(unit.def * scale * bossDefMult));
    unit.spd = Math.round(unit.spd * 10) / 10;
    if (boss) {
      if (bdef && bdef.spd) unit.spd = Math.round(bdef.spd * 10) / 10;
      unit.dr = clamp(unit.dr + (bdef ? 0.07 : 0.08), 0, 0.75);
    }
  });
  return raw;
}

function startBattle(config) {
  if (UI.battle && !UI.battle.over) return false;
  const allies = buildAllyBattleTeam();
  if (!allies.length) { toast('还没有上阵宠物，先去宠物页安排队伍吧', 'bad'); return false; }
  let enemies = Array.isArray(config.enemies) && config.enemies.length ? config.enemies : null;
  if (!enemies) {
    enemies = createEnemyFormation(config.enemyPower || 1000, config.enemyOptions || {});
  }
  if (!enemies.length) return false;
  const battle = {
    config: { ...config },
    allies,
    enemies,
    round: 0,
    queue: [],
    idx: 0,
    over: false,
    finished: false,
    outcome: '',

  };
  UI.battle = battle;
  pushBattleLog(battle, `⚔️ ${config.title || '战斗'} 开始！`);
  pushBattleLog(battle, `我方 ${allies.length} 名伙伴登场，对方 ${enemies.length} 名敌人。`);

}

function getBattleUnitEl(uid) {
  return document.querySelector(`#battleRoot .b-unit[data-uid="${uid}"]`);
}
function updateBattleUnit(unit) {

  const buffRoot = el.querySelector('.b-buffs');
  if (buffRoot) {

      const arrow = b.pct >= 0 ? '↑' : '↓';

      const cls = b.pct >= 0 ? 'mark-buff-up' : 'mark-buff-down';
      return `<span class="${cls}" title="${b.stat} ${arrow} · ${b.turns}回合">${icon}${arrow}</span>`;
    });
    if (UI.battle && UI.battle.focusUid === unit.uid) marks.unshift('<span class="mark-focus" title="集火目标">🎯</span>');
    for (const dot of (unit.dots || [])) marks.push(`<span class="mark-dot" title="持续伤害剩余 ${dot.turns} 回合">🔥${dot.turns}</span>`);
    for (const hot of (unit.hots || [])) marks.push(`<span class="mark-hot" title="持续回复剩余 ${hot.turns} 回合">💚${hot.turns}</span>`);
    buffRoot.innerHTML = marks.join('');
  }
}
function updateBattleUI() {

function renderBattleLog() {
  const b = UI.battle;
  const el = $('#battleLog');
  if (!el || !b) return;
  const lines = b.log.slice(-7);
  el.innerHTML = lines.map((line, i) => {
    const text = typeof line === 'string' ? line : (line && line.text) || '';
    const kind = (line && line.kind) || 'info';
    const last = i === lines.length - 1 ? ' log-last' : '';
    return `<div class="log-${kind}${last}">${esc(text)}</div>`;
  }).join('');
}
function pushBattleLog(b, text, kind = 'info') {
  b.log.push({ text, kind });
  if (b.log.length > 80) b.log.splice(0, b.log.length - 80);
}

function effectiveStat(unit, stat) {
  if (stat === 'dr') {
    let add = 0;
    for (const buff of unit.buffs) if (buff.stat === 'dr') add += buff.pct;
    return clamp(unit.dr + add, 0, 0.85);
  }
  let multiplier = 1;
  for (const buff of unit.buffs) if (buff.stat === stat) multiplier += buff.pct;
  const value = unit[stat] * Math.max(0.12, multiplier);
  return Math.max(0.1, value);
}

function aliveOf(b, side) {
  return (side === 'ally' ? b.allies : b.enemies).filter(u => u.alive);
}
function sideOf(b, unit) {
  return unit.side === 'ally' ? b.allies : b.enemies;
}
function foeSideOf(b, unit) {
  return unit.side === 'ally' ? b.enemies : b.allies;
}
function resolveTargets(target, caster, b) {
  const foes = foeSideOf(b, unitOfBattleSide(caster.side, b)).filter(u => u.alive);
  const allies = sideOf(b, unitOfBattleSide(caster.side, b)).filter(u => u.alive);
  const allAllies = sideOf(b, unitOfBattleSide(caster.side, b));
  if (!target) return [];
  // 集火仅作用于我方单体敌方技能；AoE（enemy_all）与友方技能不被改写
  if (b && caster.side === 'ally' && b.focusUid && ['enemy_front', 'enemy_back', 'enemy_lowest', 'enemy_random'].includes(target)) {
    const f = b.enemies.find(u => u.uid === b.focusUid && u.alive);
    if (f) return [f];
  }
  if (target === 'self') return [caster];
  if (target === 'enemy_front') {
    const fronts = foes.filter(u => u.row === 'front');
    return [(fronts.length ? fronts : foes).sort((a, c) => a.hp / a.maxHp - c.hp / c.maxHp)[0]].filter(Boolean);
  }
  if (target === 'enemy_back') {
    const backs = foes.filter(u => u.row === 'back');
    return [(backs.length ? backs : foes).sort((a, c) => a.hp / a.maxHp - c.hp / c.maxHp)[0]].filter(Boolean);
  }
  if (target === 'enemy_lowest') {
    return [foes.sort((a, c) => a.hp / a.maxHp - c.hp / c.maxHp)[0]].filter(Boolean);
  }
  if (target === 'enemy_random') return foes.length ? [pick(foes)] : [];
  if (target === 'enemy_all') return foes;
  if (target === 'ally_all') return allies;
  if (target === 'ally_lowest') return [allies.sort((a, c) => a.hp / a.maxHp - c.hp / c.maxHp)[0]].filter(Boolean);
  if (target === 'ally_fallen') return allAllies.filter(u => !u.alive);
  return [];
}
function unitOfBattleSide(side, b) {
  return side === 'ally' ? b.allies[0] : b.enemies[0];
}

function startRound(b) {
  if (b.over) return;
  if (b.round >= b.maxRounds) { endBattle('timeout'); return; }
  b.round += 1;
  const units = [...b.allies, ...b.enemies].filter(u => u.alive);
  units.forEach(u => {
    u.queueSpeed = effectiveStat(u, 'spd') * rnd(0.95, 1.05);
  });
  b.queue = units.sort((a, c) => c.queueSpeed - a.queueSpeed);
  b.idx = 0;
  pushBattleLog(b, `—— 第 ${b.round} 回合 ——`, 'round');
}
function endRound(b, events = []) {
  for (const unit of [...b.allies, ...b.enemies]) {
    if (!unit.alive) continue;
    for (const key of [1, 2]) if (unit.cooldowns[key] > 0) unit.cooldowns[key] -= 1;
    unit.buffs = unit.buffs.filter(buff => {
      buff.turns -= 1;
      return buff.turns > 0;
    });
    if (unit.shieldTurns > 0) {
      unit.shieldTurns -= 1;
      if (unit.shieldTurns <= 0) unit.shield = 0;
    }
    // 持续伤害 dot（灼烧等）：每回合按施术者攻击 × 固定比例扣血，不吃暴击/闪避/克制
    let fatal = false;
    unit.dots = (unit.dots || []).filter(dot => {
      dot.turns -= 1;
      const amount = Math.max(1, Math.round(dot.atk * num(dot.mult, 0.1)));
      unit.hp = Math.max(0, unit.hp - amount);
      events.push({ type: 'dotTick', unitUid: unit.uid, amount, turns: dot.turns, dotKind: dot.kind || 'burn' });
      if (unit.hp <= 0) fatal = true;
      return dot.turns > 0;
    });
    // 持续回复 hot：每回合按自身最大生命比例回血；若本回合 dot 已致命，不再把单位拉起来
    if (fatal) {
      unit.hots = [];
    } else {
      unit.hots = (unit.hots || []).filter(hot => {
        hot.turns -= 1;
        const amount = Math.max(1, Math.round(unit.maxHp * num(hot.hpPct, 0.03)));
        unit.hp = Math.min(unit.maxHp, unit.hp + amount);
        events.push({ type: 'hotTick', unitUid: unit.uid, amount, turns: hot.turns });
        return hot.turns > 0;
      });
    }
    if (fatal || unit.hp <= 0) {
      unit.alive = false;
      unit.hp = 0;
      unit.rage = 0;
      events.push({ type: 'death', unitUid: unit.uid });
      pushBattleLog(b, `💫 ${unit.name} 倒下了`, 'death');
    }
  }
}

function advanceTurn() {
  const b = UI.battle;
  const events = [];
  if (!b || b.over) return events;
  checkBattleEnd(b);
  if (b.over) return events;
  if (!b.queue.length || b.idx >= b.queue.length) {
    if (b.round >= b.maxRounds) { endBattle('timeout'); return events; }
    startRound(b);
    if (b.over) return events;
  }
  let unit = null;
  while (b.idx < b.queue.length) {
    const candidate = b.queue[b.idx++];
    if (candidate && candidate.alive) { unit = candidate; break; }
  }
  if (!unit) {
    endRound(b, events);
    checkBattleEnd(b);
    if (b.over) return events;
    if (b.round >= b.maxRounds) endBattle('timeout');
    return events;
  }
  const active = chooseSkillIndex(unit);
  executeUnitSkill(unit, active, events);
  checkBattleEnd(b);
  if (!b.over && b.idx >= b.queue.length) {
    endRound(b, events);
    checkBattleEnd(b);
    if (b.over) return events;
    if (b.round >= b.maxRounds) endBattle('timeout');
  }
  return events;
}

function skillEffectsOf(index, unit) {
  const entry = unit.skills[index];
  return (entry && entry.def && entry.def.effects) || [];
}
function chooseSkillIndex(unit) {
  const b = UI.battle;
  if (!b) return 0;
  if (b.manualSkill && b.manualSkill[unit.uid] != null) {
    const mi = b.manualSkill[unit.uid];
    delete b.manualSkill[unit.uid];
    if (unit.skills[mi] && (mi === 1 || mi === 2) && unit.cooldowns[mi] <= 0) return mi;
  }
  const allies = sideOf(b, unit).filter(u => u.alive);
  const hurt = allies.some(u => u.hp / Math.max(1, u.maxHp) < 0.76);
  const fallen = allies.length < sideOf(b, unit).length;
  const ready = [1, 2].filter(i => unit.skills[i] && unit.cooldowns[i] <= 0);
  const ult = unit.skills[3] && unit.skills[3].def;
  if (unit.rage >= 100) {
    const ultEffects = (ult && ult.effects) || [];
    const ultDamage = ultEffects.some(e => e.type === 'damage');
    const ultHeal = ultEffects.some(e => e.type === 'heal');
    const ultRevive = ultEffects.some(e => e.type === 'revive');
    const ultSupport = ultEffects.some(e => e.type === 'buff' || e.type === 'shield');
    if (ultDamage || ultSupport || (hurt || fallen) && (ultHeal || ultRevive)) return 3;
  }
  // 优先使用带伤害的主动技，避免辅助在全员满血时反复治疗而拖慢战斗。
  for (const i of ready) if (skillEffectsOf(i, unit).some(e => e.type === 'damage')) return i;
  for (const i of ready) {
    const effects = skillEffectsOf(i, unit);
    if (hurt && effects.some(e => e.type === 'heal')) return i;
    if (fallen && effects.some(e => e.type === 'revive')) return i;
  }
  // 非伤害的增益/护盾只在开场两回合使用，之后回归普攻，保证辅助也有输出。
  if (b.round <= 2) {
    for (const i of ready) {
      const effects = skillEffectsOf(i, unit);
      if (effects.some(e => e.type === 'buff' || e.type === 'shield')) return i;
    }
  }
  return 0;
}

function executeUnitSkill(unit, index, events) {
  const b = UI.battle;
  if (!b || b.over || !unit.alive) return;
  const skillEntry = unit.skills[index] || unit.skills[0];
  if (!skillEntry || !skillEntry.def) return;
  const skill = skillEntry.def;
  if (skill.kind === 'ult') {
    if (unit.rage < 100) return;
    unit.rage = 0;
  } else if (index === 1 || index === 2) {
    unit.cooldowns[index] = Math.max(1, skill.cooldown || 2);
  }
  pushBattleLog(b, `${unit.name} 使用了「${skill.name}」`, 'skill');
  // 表现层事件：行动高亮、出手动作、主动技横幅（不改动结算逻辑）
  events.push({ type: 'turn', unitUid: unit.uid });
  events.push({ type: 'action', unitUid: unit.uid, kind: skill.kind || 'normal' });
  if (skill.kind === 'active') {
    events.push({ type: 'skill', unitUid: unit.uid, name: skill.name, skill });
  }
  if (skill.kind === 'ult') {
    events.push({ type: 'ult', unitUid: unit.uid, name: skill.name, rarity: unit.rarity, element: unit.element });
    pushBattleLog(b, `✨ ${unit.name} 的奥义发动！`, 'ult');
  }
  const levelMult = 1 + (skillEntry.level - 1) * 0.06;
  for (const effect of skill.effects || []) {
    applySkillEffect(unit, skill, effect, levelMult, events);
    if (b.over) break;
  }
  if (skill.kind !== 'ult') {
    unit.rage = Math.min(100, unit.rage + (skill.rageGain || (skill.kind === 'active' ? 10 : 30)));
  }
  events.push({ type: 'rage', unitUid: unit.uid, rage: unit.rage });
}

function applySkillEffect(caster, skill, effect, levelMult, events) {
  const b = UI.battle;
  if (!b || b.over) return;
  const targets = resolveTargets(effect.target, caster, b);
  if (!targets.length) return;
  if (effect.type === 'damage') {
    const primary = new Set();
    for (const target of targets) {
      if (!target.alive) continue;
      primary.add(target.uid);
      damageOne(caster, target, effect.mult * levelMult, events);
    }
    if (effect.splash) {
      const extra = aliveOf(b, caster.side === 'ally' ? 'enemy' : 'ally').filter(u => !primary.has(u.uid));
      for (const target of extra.slice(0, 2)) {
        damageOne(caster, target, effect.mult * levelMult * effect.splash, events, true);
      }
    }
    return;
  }
  if (effect.type === 'heal') {
    const healMult = levelMult;
    for (const target of targets) {
      if (!target.alive) continue;
      const amount = Math.max(1, Math.round((caster.atk * num(effect.atkPct, 0) + caster.maxHp * num(effect.hpPct, 0)) * healMult));
      const before = target.hp;
      target.hp = Math.min(target.maxHp, target.hp + amount);
      const real = Math.round(target.hp - before);
      if (real <= 0) continue;
      events.push({ type: 'heal', unitUid: target.uid, amount: real });
      pushBattleLog(b, `${caster.name} 治疗了 ${target.name} ${fmt(real)} 点生命`, 'heal');
    }
    return;
  }
  if (effect.type === 'buff') {
    for (const target of targets) {
      if (!target.alive) continue;
      const pct = num(effect.pct, 0);
      if (!pct) continue;
      target.buffs.push({
        stat: effect.stat,
        pct,
        turns: Math.max(1, Math.floor(num(effect.turns, 2))),
        source: caster.name
      });
      events.push({ type: 'buff', unitUid: target.uid, stat: effect.stat, pct, turns: effect.turns });
      const statName = ({ atk: '攻击', def: '防御', spd: '速度', dr: '减伤' })[effect.stat] || effect.stat;
      pushBattleLog(b, `${target.name} 的${statName}${pct > 0 ? '提升' : '降低'} ${Math.abs(Math.round(pct * 100))}%`, 'buff');
    }
    return;
  }
  if (effect.type === 'shield') {
    for (const target of targets) {
      if (!target.alive) continue;
      const amount = Math.max(1, Math.round(target.maxHp * num(effect.hpPct, 0) * levelMult));
      target.shield += amount;
      target.shieldTurns = Math.max(target.shieldTurns, Math.floor(num(effect.turns, 2)));
      events.push({ type: 'shield', unitUid: target.uid, amount });
      pushBattleLog(b, `${target.name} 获得 ${fmt(amount)} 点护盾`, 'buff');
    }
    return;
  }
  if (effect.type === 'revive') {
    if (caster.reviveUsed) return;
    const fallen = targets.find(u => !u.alive);
    if (!fallen) return;
    caster.reviveUsed = true;
    fallen.alive = true;
    fallen.hp = Math.max(1, Math.round(fallen.maxHp * num(effect.hpPct, 0.35)));
    fallen.rage = 30;
    fallen.buffs = [];
    fallen.shield = 0;
    events.push({ type: 'revive', unitUid: fallen.uid });
    pushBattleLog(b, `🪶 ${fallen.name} 在余烬中重新站了起来！`, 'heal');
    return;
  }
  if (effect.type === 'dot') {
    // 持续伤害：按施术者当前攻击 × mult，挂 turns 回合，每回合结算一次
    for (const target of targets) {
      if (!target.alive) continue;
      target.dots.push({
        kind: effect.dotKind || 'burn',
        mult: num(effect.mult, 0.10),
        turns: Math.max(1, Math.floor(num(effect.turns, 3))),
        atk: effectiveStat(caster, 'atk')
      });
      events.push({ type: 'dot', unitUid: target.uid, turns: effect.turns, dotKind: effect.dotKind || 'burn' });
      pushBattleLog(b, `${target.name} 被「${effect.dotKind === 'poison' ? '毒蚀' : '灼烧'}」缠住，持续 ${effect.turns || 3} 回合`, 'ctrl');
    }
    return;
  }
  if (effect.type === 'hot') {
    // 持续回复：按受击者最大生命比例回血，挂 turns 回合
    for (const target of targets) {
      if (!target.alive) continue;
      target.hots.push({ hpPct: num(effect.hpPct, 0.03), turns: Math.max(1, Math.floor(num(effect.turns, 2))) });
      events.push({ type: 'hot', unitUid: target.uid, turns: effect.turns });
      pushBattleLog(b, `${target.name} 获得持续回复，${effect.turns || 2} 回合内缓缓回血`, 'heal');
    }
    return;
  }
  if (effect.type === 'energy') {
    // 充能：立即提升怒气，为奥义蓄力（不替代普攻/主动技的回怒节奏）
    const gain = Math.round(num(effect.rage, 10) * levelMult);
    for (const target of targets) {
      if (!target.alive) continue;
      target.rage = Math.min(100, target.rage + gain);
      events.push({ type: 'energy', unitUid: target.uid, amount: gain });
      pushBattleLog(b, `${target.name} 战意充能，怒气 +${gain}`, 'buff');
    }
    return;
  }
}

// 伤害公式（核心）：
// dmg = 攻击 × 技能倍率 × (1 + 暴击加成[暴击时]) × 克制系数
//       × (1 − 对方有效减伤) × 随机浮动(0.95~1.05)
// 对方有效减伤 = 面板减伤 + 防御/(防御 + 900 + 等级×28)，封顶 80%。
// 结算顺序：命中判定 → 防御减伤 → 暴击 → 属性克制 → ±5% 浮动 → 护盾吸收；
// 即“先防后暴”，防御先吃掉一部分基础伤害，再由暴击放大最终收益。
function damageOne(caster, target, multiplier, events, splash = false) {
  const b = UI.battle;
  if (!target.alive) return;
  const hitChance = clamp(0.92 + caster.hit - target.dodge, 0.55, 0.99);
  if (!chance(hitChance)) {
    const dodged = num(target.dodge, 0) > 0.01;
    events.push({ type: 'miss', unitUid: target.uid, label: dodged ? '闪避' : 'MISS', dodged });
    pushBattleLog(b, dodged ? `${caster.name} 的攻击被 ${target.name} 闪避了` : `${caster.name} 的攻击落空了（MISS）`, 'ctrl');
    return;
  }
  const isCrit = chance(caster.crit);
  const elemMult = elementMultiplier(caster.element, target.element);
  const targetDef = effectiveStat(target, 'def');
  const defReduction = clamp(target.dr + targetDef / (targetDef + 900 + target.level * 28) * 0.55, 0, 0.80);
  const variance = rnd(0.95, 1.05);
  let damage = effectiveStat(caster, 'atk') * multiplier * (isCrit ? (1 + caster.critDmg) : 1) * elemMult * (1 - defReduction) * variance;
  if (splash) damage *= 0.9;
  damage = Math.max(1, Math.round(damage));
  let absorbed = 0;
  if (target.shield > 0) {
    absorbed = Math.min(target.shield, damage);
    target.shield -= absorbed;
    damage -= absorbed;
  }
  target.hp = Math.max(0, target.hp - damage);
  target.rage = Math.min(100, target.rage + 6);
  if (caster.side === 'ally') b.totalDamage += damage;
  if (caster.lifesteal > 0 && damage > 0) {
    const before = caster.hp;
    caster.hp = Math.min(caster.maxHp, caster.hp + damage * caster.lifesteal);
    const real = Math.round(caster.hp - before);
    if (real > 0) events.push({ type: 'heal', unitUid: caster.uid, amount: real, small: true });
  }
  const effectText = elemMult > 1 ? '效果拔群' : (elemMult < 1 ? '效果一般' : '');
  events.push({
    type: 'damage',
    unitUid: target.uid,
    amount: damage,
    crit: isCrit,
    elemMult,
    elemText: effectText,
    absorbed,
    splash
  });
  pushBattleLog(
    b,
    `${caster.name} 对 ${target.name} 造成 ${fmt(damage)} 伤害${isCrit ? '（暴击）' : ''}${effectText ? '（' + effectText + '）' : ''}`,
    'damage'
  );
  if (target.hp <= 0 && target.alive) {
    target.alive = false;
    target.hp = 0;
    target.rage = 0;
    events.push({ type: 'death', unitUid: target.uid });
    pushBattleLog(b, `💫 ${target.name} 倒下了`, 'death');
  }
}

function checkBattleEnd(b) {
  if (!b || b.over) return;
  if (!b.allies.some(u => u.alive)) { endBattle('lose'); return; }
  if (!b.enemies.some(u => u.alive)) { endBattle('win'); return; }
  if (b.round >= b.maxRounds && b.idx >= b.queue.length) endBattle('timeout');
}
function endBattle(outcome) {
  const b = UI.battle;
  if (!b || b.over) return;
  b.over = true;
  b.outcome = outcome;
  b.win = outcome === 'win';
  markActiveTurn(null);
  if (b.timer) { clearTimeout(b.timer); b.timer = null; }
  pushBattleLog(b, outcome === 'win' ? '🎉 战斗胜利！' : (outcome === 'timeout' ? '⌛ 回合耗尽' : '💧 战斗失败…'), 'result');
}

function battleLoop() {
  const b = UI.battle;
  if (!b || b.over) {
    if (b && b.over && !b.finished) finishBattle();
    return;
  }
  b.timer = null;
  const events = advanceTurn();
  if (!b.silent) applyBattleEvents(events);
  updateBattleUI();
  if (b.over) { finishBattle(); return; }
  if (b.paused) { b.timer = null; return; }
  b.timer = setTimeout(battleLoop, b.speed >= 2 ? 340 : 760);
}

function applyBattleEvents(events) {
  const b = UI.battle;
  if (!b) return;
  for (const event of events) {
    if (!event) continue;
    if (event.type === 'turn') {
      markActiveTurn(event.unitUid);
    } else if (event.type === 'action') {
      playUnitAction(event.unitUid, event.kind);
    } else if (event.type === 'skill') {
      showSkillBanner(event.unitUid, event.name, event.skill);
    } else if (event.type === 'damage') {
      showBattleFloat(event.unitUid, '-' + fmt(event.amount), 'dmg' + (event.crit ? ' crit' : ''));
      if (event.crit) { showBattleFloat(event.unitUid, '暴击!', 'crit-tag'); critImpact(event.unitUid); }
      if (event.elemMult > 1) showBattleFloat(event.unitUid, '克制 ×1.5', 'elem-strong');
      else if (event.elemMult && event.elemMult < 1) showBattleFloat(event.unitUid, '抵抗 ×0.75', 'elem-weak');
      else if (event.elemText) showBattleFloat(event.unitUid, event.elemText, 'effect');
      if (event.absorbed) showBattleFloat(event.unitUid, '盾 -' + fmt(event.absorbed), 'shield');
      flashBattleUnit(event.unitUid);
      playSfx(event.crit ? 'crit' : 'hit');
    } else if (event.type === 'heal') {
      if (!event.small) { showBattleFloat(event.unitUid, '+' + fmt(event.amount), 'heal'); healRing(event.unitUid); }
      playSfx('heal');
    } else if (event.type === 'miss') {
      showBattleFloat(event.unitUid, event.label || '闪避', event.dodged ? 'dodge' : 'miss');
      playDodgeOut(event.unitUid);
    } else if (event.type === 'buff') {
      const label = ({ atk: '攻击', def: '防御', spd: '速度', dr: '减伤' })[event.stat] || '状态';
      showBattleFloat(event.unitUid, `${label}${event.pct > 0 ? '↑' : '↓'}`, 'buff');
    } else if (event.type === 'shield') {
      showBattleFloat(event.unitUid, '盾 +' + fmt(event.amount), 'shield');
    } else if (event.type === 'dot') {
      showBattleFloat(event.unitUid, `灼烧·${event.turns}回合`, 'dot');
    } else if (event.type === 'hot') {
      showBattleFloat(event.unitUid, `回复·${event.turns}回合`, 'hot');
    } else if (event.type === 'energy') {
      showBattleFloat(event.unitUid, '⚡+' + fmt(event.amount), 'energy');
    } else if (event.type === 'dotTick') {
      showBattleFloat(event.unitUid, '🔥-' + fmt(event.amount), 'dot');
    } else if (event.type === 'hotTick') {
      showBattleFloat(event.unitUid, '💚+' + fmt(event.amount), 'hot');
    } else if (event.type === 'death') {
      playDeathFall(event.unitUid);
    } else if (event.type === 'revive') {
      resetDeathFall(event.unitUid);
      showBattleFloat(event.unitUid, '复活！', 'heal');
      playSfx('revive');
    } else if (event.type === 'ult') {
      showUltFlash(event.name, event.rarity, event.element);
      playSfx('ult');
    }
  }
  renderBattleLog();
}

/* -------- 表现层小工具（只切换 class / DOM，不参与结算） -------- */
const B_ACTION_MS = { normal: 150, active: 240, ult: 320 };
function bSpeedFactor() {
  const b = UI.battle;
  return b && b.speed >= 2 ? 0.5 : 1;
}
function playUnitAction(uid, kind) {
  const el = getBattleUnitEl(uid);
  if (!el) return;
  const cls = kind === 'ult' ? 'ult-lunge' : (kind === 'active' ? 'cast-raise' : 'attack-forward');
  el.classList.remove('attack-forward', 'cast-raise', 'ult-lunge');
  void el.offsetWidth;
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), Math.round((B_ACTION_MS[kind] || B_ACTION_MS.normal) * bSpeedFactor()));
}
function markActiveTurn(uid) {
  $$('#battleRoot .b-unit.active-turn').forEach(el => el.classList.remove('active-turn'));
  if (!uid) return;
  const el = getBattleUnitEl(uid);
  if (el) el.classList.add('active-turn');
}
function skillEffectTags(skill) {
  const effects = (skill && skill.effects) || [];
  const has = (type) => effects.some(e => e.type === type);
  const tags = [];
  if (has('revive')) tags.push('复活');
  if (has('heal')) tags.push('治疗');
  if (has('hot')) tags.push('持续回复');
  if (has('shield')) tags.push('护盾');
  if (has('buff')) tags.push(effects.some(e => e.type === 'buff' && num(e.pct, 0) < 0) ? '削弱' : '增益');
  if (has('dot')) tags.push('持续伤害');
  if (has('energy')) tags.push('充能');
  if (has('damage')) tags.push('伤害');
  return tags.slice(0, 3);
}
function showSkillBanner(uid, name, skill) {
  const el = getBattleUnitEl(uid);
  if (!el) return;
  const wrap = el.querySelector('.b-emoji-wrap');
  if (!wrap) return;
  const banner = document.createElement('div');
  banner.className = 'b-skill-banner';
  banner.innerHTML = `<span>${esc(name)}</span>` + skillEffectTags(skill).map(t => `<span class="skill-tag">${esc(t)}</span>`).join('');
  wrap.appendChild(banner);
  setTimeout(() => banner.remove(), Math.round(1050 * bSpeedFactor()));
}
function playDodgeOut(uid) {
  const el = getBattleUnitEl(uid);
  if (!el) return;
  el.classList.remove('dodge-out');
  void el.offsetWidth;
  el.classList.add('dodge-out');
  setTimeout(() => el.classList.remove('dodge-out'), Math.round(520 * bSpeedFactor()));
}
function playDeathFall(uid) {
  const el = getBattleUnitEl(uid);
  if (!el) return;
  el.classList.add('death-fall');
}
function resetDeathFall(uid) {
  const el = getBattleUnitEl(uid);
  if (!el) return;
  el.classList.remove('death-fall');
}
const B_TRANSIENT_CLASSES = ['attack-forward', 'cast-raise', 'ult-lunge', 'hit-flash', 'damage-shake', 'hit-recoil', 'dodge-out', 'death-fall', 'active-turn', 'heal-ring', 'crit-impact'];
function clearBattleFx() {
  $$('#battleRoot .b-unit').forEach(el => el.classList.remove(...B_TRANSIENT_CLASSES));
  $$('#battleRoot .b-skill-banner, #battleRoot .float-num').forEach(el => el.remove());
}

function showBattleFloat(uid, text, cls) {
  const unitEl = getBattleUnitEl(uid);
  if (!unitEl) return;
  const wrap = unitEl.querySelector('.b-emoji-wrap');
  if (!wrap) return;
  const el = document.createElement('span');
  el.className = 'float-num ' + cls;
  el.textContent = text;
  el.style.left = (42 + Math.random() * 16) + '%';
  el.style.animationDelay = (Math.random() * 0.04) + 's';
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 1100);
}
function flashBattleUnit(uid) {
  const el = getBattleUnitEl(uid);
  if (!el) return;
  el.classList.remove('hit-flash', 'damage-shake', 'hit-recoil');
  void el.offsetWidth;
  el.classList.add('hit-flash', 'damage-shake', 'hit-recoil');
  setTimeout(() => el.classList.remove('hit-flash', 'damage-shake', 'hit-recoil'), Math.round(360 * bSpeedFactor()));
}
function showUltFlash(name, rarity, element) {
  const el = $('#ultFlash');
  if (!el) return;
  el.classList.add('active');
  el.classList.toggle('ssr', rarity === 'SSR');
  el.style.background = rarity === 'SSR'
    ? ''
    : `radial-gradient(circle at center, rgba(255,255,255,.94), ${ELEMENTS[element] ? ELEMENTS[element].soft : '#ffe0d6'} 38%, transparent 72%)`;
  const nameEl = el.querySelector('.ult-name');
  if (nameEl) nameEl.textContent = name;
  setTimeout(() => { el.classList.remove('active', 'ssr'); }, 950);
}

// 全局进化闪光横幅：成功进化时短暂展示「名字 进化！→ 新形态」，不拦截点击
function showEvolveBanner(displayName, evoName) {
  const el = $('#evoFlash');
  if (!el) return;
  const nameEl = el.querySelector('.evo-name');
  const stageEl = el.querySelector('.evo-stage');
  if (nameEl) nameEl.textContent = '✨ ' + displayName + ' 进化！';
  if (stageEl) stageEl.textContent = '形态进化为 · ' + evoName;
  el.classList.add('active');
  setTimeout(() => el.classList.remove('active'), 1500);
}

function skipBattle() {
  const b = UI.battle;
  if (!b || b.over) return;
  if (b.timer) { clearTimeout(b.timer); b.timer = null; }
  b.silent = true;
  let guard = 0;
  while (!b.over && guard++ < 800) {
    advanceTurn();
    if (b.over) break;
  }
  b.silent = false;
  if (!b.over) endBattle('timeout');
  clearBattleFx();
  updateBattleUI();
  finishBattle();
}
function battleDouble() {
  const b = UI.battle;
  if (!b || b.over) return;
  b.speed = b.speed >= 2 ? 1 : 2;
  const battleRootEl = $('#battleRoot');
  if (battleRootEl) battleRootEl.classList.toggle('speed-2', b.speed >= 2);
  if (b.timer) {
    clearTimeout(b.timer);
    b.timer = setTimeout(battleLoop, 180);
  }
  updateBattleControls();
  toast(b.speed >= 2 ? '已切换为 2 倍速' : '已恢复 1 倍速');
}
function battleEarlyUlt() {
  const b = UI.battle;
  if (!b || b.over) return;
  if (b.earlyUltUsed) { toast('本场战斗已经抢放过奥义啦', 'bad'); return; }
  const candidate = b.allies.filter(u => u.alive && u.rage >= 100).sort((a, c) => c.atk - a.atk)[0];
  if (!candidate) { toast('我方还没有宠物攒满 100 怒气', 'bad'); return; }
  b.earlyUltUsed = true;
  if (b.timer) { clearTimeout(b.timer); b.timer = null; }
  const events = [];
  executeUnitSkill(candidate, 3, events);
  applyBattleEvents(events);
  updateBattleUI();
  checkBattleEnd(b);
  if (b.over) { finishBattle(); return; }
  b.timer = setTimeout(battleLoop, 520);
}

/* -------- 战斗手动介入（只改节奏/目标选择/技能优先级，不改结算公式与伤害系数） -------- */
function battlePause() {
  const b = UI.battle;
  if (!b || b.over) return;
  b.paused = !b.paused;
  if (b.timer) { clearTimeout(b.timer); b.timer = null; }
  if (!b.paused) b.timer = setTimeout(battleLoop, b.speed >= 2 ? 340 : 760);
  updateBattleUI();
  toast(b.paused ? '已暂停：可用「单步」逐回合观察' : '继续自动战斗');
}
function battleStep() {
  const b = UI.battle;
  if (!b || b.over || !b.paused) return;
  if (b.timer) { clearTimeout(b.timer); b.timer = null; }
  const events = advanceTurn();
  applyBattleEvents(events);
  updateBattleUI();
  if (b.over) finishBattle();
}
function battleFocus(uid) {
  const b = UI.battle;
  if (!b || b.over) return;
  const t = (b.enemies || []).find(u => u.uid === uid);
  if (!t || t.side !== 'enemy') { toast('只能集火敌方目标', 'bad'); return; }
  b.focusUid = (b.focusUid === uid) ? null : uid;
  updateBattleUI();
  playSfx('tap');
  toast(b.focusUid ? `已集火 ${t.name}（仅作用于我方单体技能，群体技不改变目标）` : '已取消集火');
}
function battleManualSkill() {
  const b = UI.battle;
  if (!b || b.over) return;
  for (let i = b.idx; i < b.queue.length; i++) {
    const u = b.queue[i];
    if (!u || !u.alive || u.side !== 'ally') continue;
    const ready = [1, 2].find(k => u.skills[k] && u.cooldowns[k] <= 0);
    if (ready != null) {
      b.manualSkill[u.uid] = ready;
      updateBattleControls();
      const nm = (u.skills[ready] && u.skills[ready].def && u.skills[ready].def.name) || '主动技';
      toast(`已为 ${u.name} 指定「${nm}」，下次行动优先释放`);
      playSfx('equip');
      return;
    }
  }
  toast('暂无可就绪的友方主动技（冷却未结束）', 'bad');
}
function renderBattleQueue() {
  const b = UI.battle;
  const root = $('#battleQueue');
  if (!b || !root) return;
  const upcoming = b.queue.slice(b.idx).filter(u => u.alive).slice(0, 6);
  root.innerHTML = upcoming.map((u, i) => {
    const e = ELEMENTS[u.element] || ELEMENTS.light;
    return `<span class="b-q-chip ${u.side} ${i === 0 ? 'now' : ''}">${e.emoji}${esc(u.name)}</span>`;
  }).join('') || '<span class="b-q-chip empty">回合未开始，等待出手顺序…</span>';
}
function healRing(uid) {
  const el = getBattleUnitEl(uid);
  if (!el) return;
  el.classList.remove('heal-ring');
  void el.offsetWidth;
  el.classList.add('heal-ring');
  setTimeout(() => el.classList.remove('heal-ring'), Math.round(620 * bSpeedFactor()));
}
function critImpact(uid) {
  const el = getBattleUnitEl(uid);
  if (!el) return;
  el.classList.remove('crit-impact');
  void el.offsetWidth;
  el.classList.add('crit-impact');
  setTimeout(() => el.classList.remove('crit-impact'), Math.round(340 * bSpeedFactor()));
}

function computeBattleStars(b) {
  if (!b.win) return 0;
  const alive = b.allies.filter(u => u.alive).length;
  const ratio = alive / Math.max(1, b.allies.length);
  let stars = 1;
  if (ratio >= 0.6) stars++;
  if (alive === b.allies.length) stars++;
  return clamp(stars, 1, 3);
}

function starRow(stars) {
  return `<div class="result-stars">${[1, 2, 3].map(i => `<span class="${i <= stars ? '' : 'off'}">★</span>`).join('')}</div>`;
}

// 竞技场连胜档一次性奖励：达到档位且未领过才发，连败清零重新计数，避免重复发奖
const ARENA_STREAK_REWARDS = [
  { streak: 3, reward: { arenaCoin: 30, gold: 600 }, label: '3 连胜' },
  { streak: 5, reward: { arenaCoin: 60, crystal: 5 }, label: '5 连胜' },
  { streak: 8, reward: { arenaCoin: 100, crystal: 12 }, label: '8 连胜' }
];
// 主线失败时的“变强清单”：依据当前队伍真实状态给可执行提示，纯展示不自动战斗
function stageWeakTips() {
  const tips = [];
  const team = getTeamPets();
  if (!team.length) { tips.push('先在宠物页上阵至少一只主力伙伴。'); return tips; }
  const maxLv = Math.max(...team.map(p => num(p.level, 1)));
  if (maxLv < 15) tips.push(`主力最高 Lv.${maxLv} 偏低，先在主线刷小怪攒经验果升级。`);
  else if (maxLv < 25) tips.push(`主力 Lv.${maxLv}，可再升几级或给主力升 1–2 星。`);
  const evolvable = team.filter(p => { const n = nextEvolution(p); return n && p.level >= n.levelReq; });
  if (evolvable.length) tips.push(`有 ${evolvable.length} 只达到进化等级，进化后属性倍率明显提升（成体 ×1.28、究极 ×1.62）。`);
  const emptySlots = team.reduce((n, p) => n + EQUIP_SLOT_KEYS.filter(s => !equipmentById((p.equipment || {})[s])).length, 0);
  if (emptySlots >= 2) tips.push('主力还有空装备槽，可在商店兑换装备并强化，补足攻防生存。');
  const needy = team.filter(p => num(p.hunger, 80) < 30 || num(p.mood, 80) < 30).length;
  if (needy) tips.push(`${needy} 只伙伴饱食或心情偏低（<30）会减攻减速，先投喂、摸头回状态。`);
  const next = nextStageInfo();
  if (next && next.element) tips.push('按属性克制调整队友：' + counterAdviceForElement(next.element));
  tips.push('保证主力饱食≥80、心情≥80，可小幅提升攻击 / 生命 / 速度 / 暴击。');
  return tips;
}
function finishBattle() {
  const b = UI.battle;
  if (!b || b.finished) return;
  b.finished = true;
  markActiveTurn(null);
  if (b.timer) { clearTimeout(b.timer); b.timer = null; }
  const mode = b.config.mode;
  const win = b.win;
  const outcome = b.outcome;
  b.stars = computeBattleStars(b);
  const survived = b.allies.filter(u => u.alive).length;
  const totalAllies = b.allies.length;
  let logs = [];
  let resultTitle = win ? '胜利！' : (outcome === 'timeout' ? '时间到！' : '惜败…');
  let resultEmoji = win ? '🎉' : '💧';
  let resultNote = '';
  let resultChips = [];
  let resultAdvice = null;
  let mainStars = 0;
  let storyLine = '';
  let resultSub = '';

  // 所有出战宠物获得少量亲密度
  for (const ally of b.allies) {
    const pet = state.pets[ally.petUid];
    if (pet) pet.intimacy = clamp(num(pet.intimacy, 0) + (win ? 1.2 : 0.35), 0, 100);
  }
  if (win) bumpMetric('wins', 1);

  if (mode === 'stage') {
    const stage = b.config.stage || getStage(b.config.stageIndex || 1);
    mainStars = win ? b.stars : 0;
    if (win) {
      const firstClear = state.stage.maxCleared < stage.index;
      const rewards = makeStageRewards(stage, firstClear);
      logs = addReward(rewards);
      state.stage.maxCleared = Math.max(state.stage.maxCleared, stage.index);
      state.stage.stars[stage.index] = Math.max(num(state.stage.stars[stage.index], 0), b.stars);
      resultTitle = firstClear ? '首通成功！' : pick(['再次胜利！', '漂亮取胜！', '稳稳拿下！']);
      resultSub = pick(WIN_SUB_POOL);
      if (firstClear) {
        const feels = [stage.winLine].filter(Boolean);
        if (stage.type === 'boss') feels.push(pick(WIN_BOSS_FEEL));
        else feels.push(pick(FIRST_CLEAR_FEEL));
        if (stage.chapter === 10 && stage.type === 'boss') feels.push(FINAL_CLEAR_FEEL);
        storyLine = feels.filter(Boolean).join(' ');
      } else {
        storyLine = pick(REPEAT_WIN);
      }
      resultNote = firstClear
        ? `第 ${stage.chapter} 章进度推进了，新的挂机上限已更新到 ${stage.chapter}-${stage.sub}。`
        : `扫荡与重复挑战都会继续产出资源。当前最高通关：${Math.floor((state.stage.maxCleared - 1) / 5) + 1}-${((state.stage.maxCleared - 1) % 5) + 1}。`;
    } else {
      storyLine = pick(FAIL_FEEL);
      resultSub = pick(FAIL_SUB_POOL);
      resultNote = pick(['队伍还需要再成长一点。', '再练练等级、装备与属性克制就好了。', '先养一波状态，回头轻松拿下这关。']);
      resultAdvice = stageWeakTips();
    }
    resultChips = [
      { icon: '❤️', label: '存活', value: `${survived}/${totalAllies}` },
      { icon: '🔁', label: '回合', value: `${b.round}/${b.maxRounds}` }
    ];
  } else if (mode === 'tower') {
    const floor = b.config.floor || 1;
    mainStars = win ? b.stars : 0;
    if (win) {
      logs = addReward(makeTowerReward(floor));
      if (floor >= state.tower.floor) {
        state.tower.floor = floor + 1;
        state.tower.best = Math.max(state.tower.best, floor);
      }
      bumpMetric('towerClears', 1);
      resultTitle = `第 ${floor} 层通过！`;
      resultNote = `塔灵消散了，下一层是第 ${Math.min(30, state.tower.floor)} 层。塔的奖励包含进化石与钻石。`;
    } else {
      resultNote = '塔灵亮出了更强的姿态。强化装备、升星或试试属性克制再来吧。';
    }
    resultChips = [
      { icon: '🗼', label: '最高层', value: `${state.tower.best} / 30` },
      { icon: '🔁', label: '回合', value: `${b.round}/${b.maxRounds}` }
    ];
  } else if (mode === 'arena') {
    const opp = b.config.opponent || { name: '对手', rating: 1000 };
    const tier = arenaTierOf(state.arena.rating);
    let delta = 0;
    let streakExtra = [];
    let streakNote = '';
    if (win) {
      delta = 24 + rndInt(0, 8);
      state.arena.rating += delta;
      state.arena.wins += 1;
      bumpMetric('arenaWins', 1);
      state.hall.arenaStreak = (state.hall.arenaStreak || 0) + 1;
      state.hall.arenaWinStreak = Math.max(state.hall.arenaWinStreak || 0, state.hall.arenaStreak);
      state.hall.arenaBest = Math.max(state.hall.arenaBest || 0, state.arena.rating);
      logs = addReward({ arenaCoin: 24 + tier.order * 6, crystal: 8 + tier.order * 3 });
      // 连胜档一次性奖励：达到 3/5/8 且未领过才发，不重复领取
      const curStreak = state.hall.arenaStreak;
      let givenMark = state.arena.streakRewardGiven || 0;
      for (const r of ARENA_STREAK_REWARDS) {
        if (curStreak >= r.streak && givenMark < r.streak) {
          logs = logs.concat(addReward(r.reward));
          givenMark = r.streak;
          state.arena.streakRewardGiven = givenMark;
          streakExtra.push({ icon: '🏆', label: r.label + '奖励', value: '已发放' });
          streakNote += ` 🏆达成${r.label}，额外发放连胜奖励。`;
        }
      }
    } else {
      delta = -Math.min(16, 8 + Math.floor(tier.order * 1.5));
      state.arena.rating = Math.max(0, state.arena.rating + delta);
      state.arena.losses += 1;
      state.hall.arenaStreak = 0;
      state.arena.streakRewardGiven = 0; // 连败清零，连胜档重新计数
      logs = addReward({ arenaCoin: 5 });
    }
    generateArenaOpponents(true);
    resultNote = `对 ${opp.name} ${win ? '胜利' : '失败'}，段位分 ${delta > 0 ? '+' : ''}${delta}。当前段位：${arenaTierOf(state.arena.rating).name}。` + streakNote;
    resultChips = [
      { icon: '🏟️', label: '段位分', value: fmt(state.arena.rating) },
      { icon: '🎖️', label: '竞技币', value: fmt(state.items.arenaCoin) },
      ...streakExtra
    ];
  } else if (mode === 'boss') {
    const damage = b.totalDamage;
    const before = state.boss.bestDamage;
    state.boss.bestDamage = Math.max(before, damage);
    const board = getBossLeaderboard();
    // 每日 Boss 以伤害排名，不发放普通通关奖励；排名奖励在面板领取。
    resultTitle = damage > before ? '伤害新纪录！' : '讨伐结束';
    resultEmoji = '👹';
    resultNote = `本次打出 ${fmt(damage)} 点伤害，今日最佳 ${fmt(state.boss.bestDamage)}。当前预计排名第 ${board.rank || '—'} 名。排名奖励可在每日 Boss 面板领取。`;
    resultChips = [
      { icon: '💥', label: '本次伤害', value: fmt(damage) },
      { icon: '👑', label: '预计排名', value: board.rank ? `第 ${board.rank} 名` : '未上榜' }
    ];
    logs = addReward({ crystal: 10 });
  } else if (mode === 'dungeon') {
    const modeData = DUNGEON_MODES[b.config.dungeonMode] || currentDungeonMode();
    if (win) {
      logs = addReward(b.config.reward || makeDungeonReward(b.config.dungeonMode));
      resultTitle = `${modeData.name} 通关！`;
      resultNote = '今天的副本次数已经记录，明天会轮换新的副本。';
    } else {
      resultNote = '副本守卫有点厉害，先去提升队伍再来吧。';
    }
    resultChips = [
      { icon: modeData.emoji, label: '副本', value: modeData.name },
      { icon: '🔁', label: '回合', value: `${b.round}/${b.maxRounds}` }
    ];
  }

  // 主线 / 副本惜败返还 50% 体力（封顶不超过上限），避免失败一次就空转
  let refundStamina = 0;
  if (!win && (mode === 'stage' || mode === 'dungeon') && num(b.config.staminaCost, 0) > 0) {
    refundStamina = Math.round(num(b.config.staminaCost, 0) * 0.5);
    state.stamina.value = Math.min(state.stamina.max, state.stamina.value + refundStamina);
    resultChips.push({ icon: '⚡', label: '惜败返还体力', value: `+${refundStamina}` });
    resultNote += ` 本次惜败返还 50% 体力（⚡+${refundStamina}），先去提升队伍再来。`;
  }

  if (mode !== 'boss') {
    if (win) playSfx('win'); else playSfx('lose');
  } else {
    playSfx('win');
  }
  if (state.tutorial && !state.tutorial.done && state.tutorial.step === 2) {
    advanceTutorial(2);
  }
  saveGame();
  renderAll();
  renderBattleResult({
    win, title: resultTitle, emoji: resultEmoji, stars: mainStars,
    note: resultNote, chips: resultChips, logs, advice: resultAdvice,
    story: storyLine, sub: resultSub, mode
  });
}

function refreshHUD() {
  if (!state || !$('#resGold')) return;
  const setText = (sel, text) => { const el = $(sel); if (el) el.textContent = text; };

  const staminaLeft = state.stamina.value >= state.stamina.max ? 0 : STAMINA_REGEN_MS - ((now - state.stamina.ts) % STAMINA_REGEN_MS);
  const challengeLeft = state.challenge.value >= state.challenge.max ? 0 : CHALLENGE_REGEN_MS - ((now - state.challenge.ts) % CHALLENGE_REGEN_MS);

  const challengePill = $('#resChallenge') && $('#resChallenge').parentElement;
  if (staminaPill) staminaPill.title = state.stamina.value >= state.stamina.max ? '体力已满' : `体力恢复中：${fmtClock(staminaLeft)} 后 +1`;
  if (challengePill) challengePill.title = state.challenge.value >= state.challenge.max ? '挑战券已满' : `挑战券恢复中：${fmtClock(challengeLeft)} 后 +1`;
  const rate = calcIdleRates();
  setText('#homeRateGold', fmtRate(rate.gold) + ' /秒');
  setText('#homeRateFruit', fmtRate(rate.fruit) + ' /秒');
  setText('#homePendingGold', fmt(state.idle.pendingGold));
  setText('#homePendingFruit', fmt(state.idle.pendingFruit));
  const boostEl = $('#homeBoostTimer');

  sad: ['呜…再陪我一会儿好不好', '摸摸头，就没那么难过啦', '靠在你身边，安心多了', '要是有颗小零食就更好了', '耷拉着的尾巴，被摸得翘起来一点', '闷闷地缩着，好在手心很暖', '一点点委屈被顺平啦'],

};
const PAT_COMBO = [
  '连击摸摸，脑袋都要被盘包浆啦',
  '一下接一下，舒服到眯眼睛',
  '别急别急，每个位置都要摸到位',
  '小爪子也想被夸一夸',
  '再摸一下，就一下下嘛'
];
function patSpeech(pet, combo = 0) {
  const h = num(pet.hunger, 80), m = num(pet.mood, 80), int = num(pet.intimacy, 0);
  const pool = (templateOf(pet).lines || []).slice();
  if (h < 30) pool.push(...PAT_COMMON.hungry);
  if (m < 30) pool.push(...PAT_COMMON.sad);
  if (int >= 60) pool.push(...PAT_COMMON.close);
  if (m >= 70 && h >= 50) pool.push(...PAT_COMMON.happy);
  if (combo >= 3) pool.push(...PAT_COMBO);
  pool.push(...PAT_COMMON.normal);
  const main = pick(pool);
  if (int >= 80 && Math.random() < 0.45) {
    const extra = pick(PAT_COMMON.close);
    return main.replace(/[。～~!！.。]$/, '') + '，' + extra;
  }
  return main;
}

          ${state.stage.maxCleared >= 25 ? `<button class="btn btn-lav btn-sm btn-wide" type="button" data-act="openRebirth" style="margin-top:9px">🌀 轮回之泉已开启</button>` : `<div class="tiny muted" style="margin-top:7px">通关第 5 章首领后可开启轮回之泉。</div>`}

function addRewardPreview(reward) {
  const out = [];
  const labelMap = {
    gold: '金币', crystal: '钻石', fruit: '经验果', skillBook: '技能书', equipShard: '装备碎片',
    enhanceStone: '强化石', bondBadge: '羁绊徽章', arenaCoin: '竞技币', starShard: '升星碎片',
    stonesRandom: '随机进化石', stoneChoice: '随机进化石', randomShards: '随机碎片',
    intimacyAll: '全队亲密', frame: '头像框', equipment: '装备', eternal: '永恒结晶'
  };
  for (const key of Object.keys(reward || {})) {
    if (!reward[key]) continue;
    if (key === 'frame') {
      const frame = FRAME_MAP[reward.frame];
      out.push({ icon: '🖼️', label: '头像框·' + (frame ? frame.name : '神秘框'), amount: 1 });
    } else if (key === 'equipment') {
      out.push({ icon: '🎁', label: '装备', amount: 1 });
    } else if (key === 'stones' && typeof reward.stones === 'object') {
      for (const el of ELEMENT_KEYS) if (reward.stones[el]) out.push({ icon: ELEMENTS[el].emoji, label: ELEMENTS[el].name + '进化石', amount: reward.stones[el] });
    } else {
      out.push({ icon: resourceIcon(key), label: labelMap[key] || resourceLabel(key), amount: reward[key] });
    }
  }
  return out;
}

function logsFromReward(reward) {
  const logs = [];
  for (const key of Object.keys(reward || {})) {
    if (!reward[key]) continue;
    if (key === 'equipment') { logs.push({ icon: '🎁', label: '装备', amount: 1 }); continue; }
    if (key === 'frame') {
      const frame = FRAME_MAP[reward.frame];
      logs.push({ icon: '🖼️', label: '头像框·' + (frame ? frame.name : '神秘框'), amount: 1 });
      continue;
    }
    if (key === 'stones' && typeof reward.stones === 'object') {
      for (const el of ELEMENT_KEYS) if (reward.stones[el]) logs.push({ icon: ELEMENTS[el].emoji, label: ELEMENTS[el].name + '进化石', amount: reward.stones[el] });
      continue;
    }
    if (key === 'intimacyAll') { logs.push({ icon: '💗', label: '全队亲密度', amount: reward[key] }); continue; }
    if (key === 'randomShards') { logs.push({ icon: '🧩', label: '随机宠物碎片', amount: reward[key] }); continue; }
    logs.push({ icon: resourceIcon(key), label: resourceLabel(key), amount: reward[key] });
  }
  return logs;
}

/* ========== 6C. 弹窗 / 通知 / 小游戏 ========== */
function toast(message, type = '', duration = 2400) {
  const root = $('#toastRoot');
  if (!root) return;
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = message;
  root.appendChild(el);
  while (root.children.length > 4) root.removeChild(root.firstElementChild);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 260);
  }, Math.max(800, duration));
}

function animateNumber(el, from, to, duration = 900, formatter = fmt) {
  if (!el) return;
  const token = (el._animToken || 0) + 1;
  el._animToken = token;
  const start = performance.now();
  const span = Math.max(1, to - from);
  function frame(now) {
    if (el._animToken !== token) return;
    const p = clamp((now - start) / duration, 0, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = formatter(from + span * eased);
    if (p < 1) requestAnimationFrame(frame);
    else el.textContent = formatter(to);
  }
  requestAnimationFrame(frame);
}

function openModal(title, body, options = {}) {
  const root = $('#modalRoot');
  if (!root) return;
  if (UI.feedGame) { clearTimeout(UI.feedGame.timer); UI.feedGame = null; }
  UI.modal = {
    closable: options.closable !== false,
    title: String(title || ''),
    className: options.className || ''
  };
  const classes = ['modal', options.wide ? 'wide' : '', options.narrow ? 'narrow' : '', options.className || ''].filter(Boolean).join(' ');
  root.innerHTML = `
    <div class="modal-layer open" data-modal-backdrop="1">
      <div class="${classes}" role="dialog" aria-modal="true">
        <div class="modal-head">
          <div><h2>${title || ''}</h2>${options.subtitle ? `<p>${options.subtitle}</p>` : ''}</div>
          ${options.closable === false ? '' : '<button class="modal-x" type="button" data-act="closeModal" aria-label="关闭">×</button>'}
        </div>
        <div class="modal-body">${body}</div>
      </div>
    </div>`;
  document.body.classList.add('modal-open');
  const modalEl = root.querySelector('.modal');
  if (modalEl) { modalEl.tabIndex = -1; modalEl.focus({ preventScroll: true }); modalEl.scrollTop = 0; }
}
function closeModal(force = false) {
  if (!UI.modal) return;
  if (UI.modal.closable === false && !force) return;
  if (UI.feedGame) { clearTimeout(UI.feedGame.timer); UI.feedGame = null; }
  UI.modal = null;
  const root = $('#modalRoot');
  if (root) root.innerHTML = '';
  document.body.classList.remove('modal-open');
}

function finishFeedGame(completed) {
  const game = UI.feedGame;
  if (game && game.timer) clearTimeout(game.timer);
  UI.feedGame = null;

  const pet = state.pets[game.uid];

function accrueIdleToNow() {
  const now = Date.now();
  const seconds = Math.max(0, (now - UI.lastTick) / 1000);

  if (seconds > 0.15) {
    updateCareElapsed(seconds);
    accrueIdle(seconds);
  }
}

function advanceTutorial(step) {
  if (!state || !state.tutorial || state.tutorial.done) return;
  if (state.tutorial.step !== step) return;
  state.tutorial.step += 1;
  if (state.tutorial.step > 5) {
    state.tutorial.done = true;
    state.tutorial.step = 6;
    toast('新手引导完成！接下来就按自己的节奏慢慢玩吧。', 'good', 3200);
  }
  saveGame();
  renderTutorial();
}
function skipTutorial() {
  if (!state) return;
  state.tutorial.done = true;
  state.tutorial.step = 6;

}

  const tab = map[step] || 'home';
  UI.tab = tab;
  state.lastTab = tab;
  if (step === 1) UI.shopTab = 'gacha';
  if (step === 4) UI.petTab = 'growth';

}

/* ---------------- 小菜园：播种后定时成熟，点击收获金币+经验果，零成本不耗体力 ---------------- */
const GARDEN_SIZE = 6;
// 六块地由快到慢分档：成熟时长 3/5/10/30/40/60 分钟递增；收获金币与经验果随档递增，单位时间产出边际递减，避免纯挂机套利
const GARDEN_TIERS = [
  { minutes: 3,   gold: 24,  fruit: 3  },
  { minutes: 5,   gold: 36,  fruit: 5  },
  { minutes: 10,  gold: 60,  fruit: 8  },
  { minutes: 30,  gold: 150, fruit: 16 },
  { minutes: 40,  gold: 190, fruit: 21 },
  { minutes: 60,  gold: 260, fruit: 28 }
];
function gardenTier(i) { return GARDEN_TIERS[i] || GARDEN_TIERS[GARDEN_TIERS.length - 1]; }
function ensureGarden() {
  if (!state.garden || !Array.isArray(state.garden.plots)) state.garden = { plots: [] };
  while (state.garden.plots.length < GARDEN_SIZE) state.garden.plots.push({ state: 'empty' });
}
function gardenPlotStatus(p, now = Date.now()) {
  if (!p || p.state === 'empty') return 'empty';
  if (p.state === 'growing') return now < num(p.readyAt, 0) ? 'growing' : 'ready';
  return 'ready';
}
function gardenPlant(i) {
  ensureGarden();
  const p = state.garden.plots[i];
  if (!p || p.state !== 'empty') return;
  const t = gardenTier(i);
  p.state = 'growing';
  p.tier = i;
  p.minutes = t.minutes;
  p.gold = t.gold;
  p.fruit = t.fruit;
  p.readyAt = Date.now() + t.minutes * 60000;
  toast(`种下啦，约 ${t.minutes} 分钟成熟，收成 ${t.gold} 金币 + ${t.fruit} 经验果～`);
  playSfx('pop');
  persist();
}
function gardenHarvest(i) {
  ensureGarden();
  const p = state.garden.plots[i];
  if (!p) return;
  if (gardenPlotStatus(p) !== 'ready') { toast('还没成熟，再等等哦'); return; }
  const t = gardenTier(i);
  const gold = num(p.gold, t.gold);
  const fruit = num(p.fruit, t.fruit);
  addReward({ gold, fruit });
  p.state = 'empty';
  p.readyAt = 0;
  delete p.tier; delete p.minutes; delete p.gold; delete p.fruit;
  toast(`菜园丰收：+${gold} 金币、+${fruit} 经验果`, 'good', 2600);
  playSfx('claim');
  persist();
}
function gardenWater(i) {
  ensureGarden();
  const p = state.garden.plots[i];
  if (!p || gardenPlotStatus(p) !== 'growing') return;
  // 纯表现互动：只播水滴声与水珠动画，不修改成熟时间 readyAt、不修改收成 gold/fruit、不写奖励
  playSfx('heal');
  const btn = document.querySelector(`.garden-cell[data-index="${i}"]`);
  if (btn) {
    const drop = document.createElement('span');
    drop.className = 'water-drop';
    drop.textContent = '💧';
    btn.appendChild(drop);
    setTimeout(() => drop.remove(), 900);
  }
}
function gardenJustReady() {
  if (!state.garden || !Array.isArray(state.garden.plots)) return false;
  const now = Date.now();
  return state.garden.plots.some(p => p && p.state === 'growing' && num(p.readyAt, 0) <= now);
}

function patPet(uid) {
  const pet = uid ? state.pets[uid] : getMainPet();
  if (!pet) { toast('先去抽一只宠物吧'); return; }
  const now = Date.now();
  if (now - (UI.patTimerBy[pet.uid] || UI.patTimer || 0) < 180) return;
  UI.patTimerBy[pet.uid] = now;
  UI.patTimer = now;
  UI.patCount += 1;
  if (now - (UI.comboAt || 0) < 2500) UI.comboN = (UI.comboN || 0) + 1; else UI.comboN = 1;
  UI.comboAt = now;
  UI.comboMax = Math.max(UI.comboMax || 0, UI.comboN);
  pet.mood = clamp(num(pet.mood, 80) + 0.7, 0, 100);
  pet.intimacy = clamp(num(pet.intimacy, 0) + 0.12, 0, 100);
  const nextLine = patSpeech(pet, UI.comboN || 0);
  UI.patLine = nextLine;
  const speech = $('#petSpeechText');
  if (speech) speech.textContent = nextLine;
  const who = document.querySelector('#petSpeech .who');
  if (who) who.textContent = petDisplayName(pet);

function schedulePalAct() {

  if (!pals.length) return;

  for (let k = 0; k < count; k++) {

/* -------- 关卡 / 副本 -------- */
function buildStageEnemyOptions(stage) {
  let count = 3;
  if (stage.type === 'boss') count = 3;
  else if (stage.type === 'elite') count = 3;
  else if (stage.chapter === 1 && stage.sub <= 2) count = 1;
  else if (stage.sub === 1) count = 2;
  const pool = PETS.filter(p => p.element === stage.element && !templateHasHeal(p));
  const source = pool.length ? pool : PETS.filter(p => p.element === stage.element);
  const lineup = [];
  for (let i = 0; i < count; i++) lineup.push(pick(source.length ? source : enemyPetPool()).id);
  // 标准加难：前两章温和不劝退，第 3 章起逐步抬升敌方战力系数；后期需练度与属性克制
  const diff = stage.chapter <= 2 ? 0.92 : (stage.chapter <= 5 ? 1.02 : (stage.chapter <= 8 ? 1.12 : 1.18));
  const baseFactor = stage.type === 'boss' ? 1.08 : (stage.type === 'elite' ? 1.00 : 0.92);
  const bossDef = stage.type === 'boss' ? bossByChapter(stage.chapter) : null;
  // 章节越早 Boss 档案倍率打折，避免新手首章被高血 Boss 劝退；后期足额高属性
  const bossScale = bossDef ? (stage.chapter <= 2 ? 0.82 : (stage.chapter <= 5 ? 0.92 : 1)) : 1;
  return {
    count,
    lineup,
    element: stage.element,
    type: stage.type,
    boss: stage.type === 'boss',
    bossDef,
    bossScale,
    bossName: bossDef ? bossDef.name : stage.name,
    bossEmoji: bossDef ? bossDef.emoji : stage.emoji,
    powerFactor: baseFactor * diff,
    level: Math.max(3, Math.round(3 + stage.index * 1.45)),
    star: 1,
    evo: stage.chapter >= 7 ? 1 : 0
  };
}
function startStage(index) {
  const stage = getStage(index);
  if (!chapterUnlocked(stage.chapter)) { toast('这一章还没解锁', 'bad'); return; }
  if (index > state.stage.maxCleared + 1) { toast('请先通关前置关卡', 'bad'); return; }
  if (!getTeamPets().length) { toast('请先上阵至少一只宠物', 'bad'); return; }
  if (state.stamina.value < STAGE_STAMINA_COST) { toast('体力不足，等待恢复或明天再来吧', 'bad'); return; }
  const enemies = createEnemyFormation(stage.recPower, buildStageEnemyOptions(stage));
  if (!spendStamina(STAGE_STAMINA_COST)) { toast('体力不足', 'bad'); return; }
  bumpMetric('battles', 1);
  saveGame();
  const ok = startBattle({
    mode: 'stage',
    stage,
    stageIndex: stage.index,
    title: `第 ${stage.chapter}-${stage.sub} 关 · ${stage.name}`,
    subtitle: stage.type === 'boss' ? '章节首领 · 三回合内击败敌人可拿满星评价' : '自动回合制 · 普攻攒怒气，100 怒气放奥义',
    emoji: stage.emoji,
    enemies,
    theme: stage.theme || '',
    storyIntro: stage.intro || '',
    bossTaunt: stage.type === 'boss' ? (BOSS_TAUNTS[stage.chapter] || '') : '',
    staminaCost: STAGE_STAMINA_COST,
    maxRounds: 30
  });
  if (ok) {
    UI.adventureChapter = stage.chapter;
    renderTopbar();
    saveGame();
    playSfx('battle');
  }
}
function sweepStage(index) {
  const stage = getStage(index);
  if ((state.stage.stars[index] || 0) < 3) { toast('三星通关后才能扫荡', 'bad'); return; }
  if (state.stage.maxCleared < index) { toast('还没有通关这一关', 'bad'); return; }
  if (state.stamina.value < STAGE_STAMINA_COST) { toast('体力不足', 'bad'); return; }
  spendStamina(STAGE_STAMINA_COST);
  const logs = addReward(makeStageRewards(stage, false));

  renderAll();

}
function startDungeon() {
  ensureDaily();
  if (state.dungeon.attempts <= 0) { toast('今天的副本次数用完了', 'bad'); return; }
  if (!getTeamPets().length) { toast('请先上阵宠物', 'bad'); return; }
  if (state.stamina.value < DUNGEON_STAMINA_COST) { toast('体力不足，需要 20 体力', 'bad'); return; }

/* -------- 队伍 / 养成 -------- */
function deployPet(uid, row) {
  const pet = state.pets[uid];
  if (!pet) return;
  const cap = row === 'front' ? 2 : 3;
  if (deployedRow(uid) === row) { toast('它已经在那个位置啦'); return; }
  const total = state.team.front.length + state.team.back.length;
  const moving = deployedRow(uid) != null;
  if (!moving && total >= maxTeamSize()) { toast('队伍已满 5 只，请先让一只替补', 'bad'); return; }
  if (state.team[row].length >= cap) { toast(row === 'front' ? '前排已满（2 只）' : '后排已满（3 只）', 'bad'); return; }
  state.team.front = state.team.front.filter(id => id !== uid);
  state.team.back = state.team.back.filter(id => id !== uid);
  state.team[row].push(uid);
  noteBonds();
  saveGame();
  if (UI.modal) closeModal(true);
  renderAll();
  toast(`${petDisplayName(pet)} 已上阵${row === 'front' ? '前排' : '后排'}`, 'good');
}
function benchPet(uid) {
  const pet = state.pets[uid];
  if (!pet) return;
  state.team.front = state.team.front.filter(id => id !== uid);
  state.team.back = state.team.back.filter(id => id !== uid);
  noteBonds();
  saveGame();
  if (UI.modal) closeModal(true);
  renderAll();
  toast(`${petDisplayName(pet)} 已回到替补席`);

function autoTeam() {
  const all = ownedPets().slice().sort((a, b) => petPowerSafe(b) - petPowerSafe(a));
  if (!all.length) { toast('还没有宠物呢', 'bad'); return; }
  const top = all.slice(0, 5);
  const fronts = top.filter(p => templateOf(p).role === 'front').slice(0, 2);
  if (fronts.length < 2) {
    const rest = top.filter(p => !fronts.includes(p)).sort((a, b) => getPetStats(b).def - getPetStats(a).def);
    while (fronts.length < 2 && rest.length) fronts.push(rest.shift());
  }
  const back = top.filter(p => !fronts.includes(p)).slice(0, 3);
  state.team.front = fronts.map(p => p.uid);
  state.team.back = back.map(p => p.uid);
  noteBonds();
  saveGame();
  if (UI.modal) closeModal(true);
  renderAll();
  toast('已按战力自动安排队伍：前排优先高防御，后排补输出', 'good', 3000);
}
function clearTeam() {
  state.team.front = [];
  state.team.back = [];
  saveGame();
  renderAll();
  toast('队伍已清空，记得重新上阵哦');
}

function levelUpPet(uid, count = 1) {
  const pet = state.pets[uid];
  if (!pet) return;
  if (pet.level >= MAX_LEVEL) { toast('已经满级啦', 'bad'); return; }
  count = count >= 10 ? 10 : 1;
  const cost = nextLevelsCost(pet, count);
  if (state.resources.fruit < cost) { toast(`经验果不足，需要 ${fmt(cost)} 个`, 'bad'); return; }
  const before = pet.level;
  state.resources.fruit -= cost;
  pet.level = Math.min(MAX_LEVEL, pet.level + count);
  const actual = pet.level - before;
  bumpMetric('levelUps', actual);
  advanceTutorial(4);
  saveGame();
  renderAll();
  if (UI.modal) openPetModal(uid);
  toast(`${petDisplayName(pet)} 升到 Lv.${pet.level}`, 'good');
  playSfx('level');
}
function starUpPet(uid) {
  const pet = state.pets[uid];
  if (!pet) return;
  const cost = starUpCost(pet);
  if (!cost) { toast('已经十星啦', 'bad'); return; }
  const shards = petShardCount(pet.templateId);
  const useShards = Math.min(shards, cost);
  const missing = cost - useShards;
  const starNeeded = missing * 2;
  if (state.items.starShard < starNeeded) {
    toast(`碎片不足：还缺 ${missing} 枚同名碎片或 ${starNeeded - state.items.starShard} 枚升星碎片`, 'bad');
    return;
  }
  state.petShards[pet.templateId] = shards - useShards;
  state.items.starShard -= starNeeded;
  pet.star = Math.min(10, pet.star + 1);
  bumpMetric('starUps', 1);
  saveGame();
  renderAll();
  if (UI.modal) openPetModal(uid);
  toast(`${petDisplayName(pet)} 升到 ${pet.star} 星！`, 'gold');
  playSfx('star');
}
function evolvePet(uid) {
  const pet = state.pets[uid];
  if (!pet) return;
  const evo = nextEvolution(pet);
  if (!evo) { toast('已经是究极体了', 'bad'); return; }
  const t = templateOf(pet);
  if (pet.level < evo.levelReq) { toast(`需要 Lv.${evo.levelReq} 才能进化`, 'bad'); return; }
  if (state.stones[t.element] < evo.stones) { toast(`需要 ${evo.stones} 颗${ELEMENTS[t.element].name}进化石`, 'bad'); return; }
  if (state.resources.gold < evo.gold) { toast(`需要 ${fmt(evo.gold)} 金币`, 'bad'); return; }
  state.stones[t.element] -= evo.stones;
  state.resources.gold -= evo.gold;
  pet.evo += 1;
  bumpMetric('evolutions', 1);
  noteBonds();
  saveGame();
  renderAll();
  if (UI.modal) openPetModal(uid);
  showEvolveBanner(petDisplayName(pet), EVOLUTIONS[pet.evo].name);
  toast(`${petDisplayName(pet)} 进化成 ${EVOLUTIONS[pet.evo].name}！`, 'gold', 3200);
  playSfx('evolve');
}
function upgradeSkill(uid, index) {
  const pet = state.pets[uid];
  if (!pet) return;
  index = clamp(Math.floor(index), 0, 3);
  const keys = ['basic', 'a1', 'a2', 'ult'];

  if (level >= 10) { toast('技能已经满级', 'bad'); return; }
  if (state.items.skillBook < 1) { toast('需要 1 本技能书', 'bad'); return; }

  state.items.skillBook -= 1;
  state.resources.gold -= goldCost;
  pet.skillLv[key] = level + 1;

function renamePet(uid) {

/* -------- 装备 -------- */
function equipItemAction(itemId, uid) {
  const item = equipmentById(itemId);
  const pet = state.pets[uid];
  if (!item || !pet) { toast('装备或宠物不存在', 'bad'); return; }
  if (item.equippedBy && item.equippedBy !== uid) {
    const oldOwner = state.pets[item.equippedBy];
    if (oldOwner && oldOwner.equipment[item.slot] === item.id) oldOwner.equipment[item.slot] = null;
  }
  const previous = equipmentById(pet.equipment[item.slot]);
  if (previous && previous.id !== item.id) previous.equippedBy = null;
  pet.equipment[item.slot] = item.id;
  item.equippedBy = pet.uid;
  saveGame();
  renderAll();
  if (UI.modal) openPetModal(pet.uid);
  toast(`${petDisplayName(pet)} 装备了 ${item.name}`, 'good');
  playSfx('equip');
}

/* -------- 统一事件分发 -------- */
function handleActionClick(event) {
  const target = event.target.closest('[data-act]');
  if (!target) return;
  if (target.disabled) return;
  event.preventDefault();
  const act = target.dataset.act;
  const uid = target.dataset.uid || '';
  const index = Number(target.dataset.index);
  const count = Number(target.dataset.count || 1);
  switch (act) {
    case 'nav': navTo(target.dataset.tab); break;
    case 'tutorialGo': tutorialGo(target); break;
    case 'skipTutorial': skipTutorial(); break;

    case 'closeModal': closeModal(); break;
    case 'openSettings': openSettingsModal(); break;
    case 'openRebirth': openRebirthModal(); break;

    case 'claimIdle': claimIdle(); break;
    case 'gardenPlant': gardenPlant(Number(target.dataset.index)); break;
    case 'gardenHarvest': gardenHarvest(Number(target.dataset.index)); break;
    case 'gardenWater': gardenWater(Number(target.dataset.index)); break;
    case 'selfFocus': claimSelfCare('focus'); break;
    case 'selfMove': claimSelfCare('move'); break;
    case 'hugPet': hugPet(); break;
    case 'goodnightPet': goodnightPet(); break;
    case 'pat': patPet(); break;
    case 'palPat': patPet(uid); break;
    case 'setMain': setMain(uid); break;
    case 'buyBoost': buyBoost(target.dataset.kind); break;
    case 'buyOfflineSlot': buyOfflineSlot(); break;
    case 'claimOffline': claimOfflineOffer(); break;

    case 'adventureChapter':
      UI.adventureChapter = clamp(Number(target.dataset.chapter) || 1, 1, CHAPTERS.length);
      renderPage();
      break;
    case 'startStage': startStage(Number(target.dataset.index)); break;
    case 'sweepStage': sweepStage(Number(target.dataset.index)); break;
    case 'startDungeon': startDungeon(); break;

    case 'petTab':
      UI.petTab = target.dataset.tab || 'team';
      renderPage();
      break;
    case 'shopTab':
      UI.shopTab = target.dataset.tab || 'gacha';
      renderPage();
      break;
    case 'questTab':
      UI.questTab = target.dataset.tab || 'daily';
      renderPage();
      break;
    case 'miniDeal': miniDeal(); break;
    case 'miniPick': miniPick(target.dataset.el); break;
    case 'achFilter':
      UI.achFilter = target.dataset.filter || 'all';
      renderPage();
      break;
    case 'deploy': deployPet(uid, target.dataset.row === 'front' ? 'front' : 'back'); break;
    case 'bench': benchPet(uid); break;
    case 'autoTeam': autoTeam(); break;
    case 'clearTeam': clearTeam(); break;
    case 'slotPicker': openSlotPicker(target.dataset.row === 'front' ? 'front' : 'back'); break;
    case 'petDetail': openPetModal(uid); break;
    case 'levelUp': levelUpPet(uid, count); break;

/* ========== 7.5 云端自动后台同步（与主应用共享 dd:sync 同步码） ========== */
const SYNC_CFG_KEY = 'dd:sync';
const SYNC_VALUE_MAX = 256 * 1024;
let gameSyncTimer = null;
let gameBgSyncTimer = null;

function gameSyncCfg() {
  try {
    const c = JSON.parse(localStorage.getItem(SYNC_CFG_KEY) || 'null');
    return c && typeof c === 'object' && c.code ? c : null;
  } catch (err) { return null; }
}
function gameSyncHeaders() {
  const c = gameSyncCfg() || {};
  return { 'content-type': 'application/json', 'x-sync-secret': c.secret || '' };
}
function gameSyncConfigAt() {
  const c = gameSyncCfg();
  return Number(c && c.at) || 0;
}
function gameSyncConfigSave(patch) {
  const c = gameSyncCfg() || {};
  try { localStorage.setItem(SYNC_CFG_KEY, JSON.stringify(Object.assign({}, c, patch))); } catch (err) { /* 忽略 */ }
}
function gameCollectSnapshot() {
  // 全量快照：本机 dd: 记录 + 游戏存档，保证一次 push 覆盖整份云端记录（整体时间戳覆盖语义）
  const out = {};
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k) continue;
      const allowed = (k.indexOf('dd:') === 0 && k !== SYNC_CFG_KEY) || k === SAVE_KEY;
      if (!allowed) continue;
      const v = localStorage.getItem(k);
      if (typeof v === 'string' && v.length <= SYNC_VALUE_MAX) out[k] = v;
    }
  } catch (err) { /* 读不到就当空 */ }
  return out;
}
async function gameSyncPush(silent) {
  const cfg = gameSyncCfg();
  if (!cfg || !cfg.code) return;
  try {
    const savedAt = Date.now();
    const res = await fetch('/api/sync/save', {
      method: 'POST',
      headers: gameSyncHeaders(),
      body: JSON.stringify({ code: cfg.code, payload: gameCollectSnapshot(), savedAt })
    });
    const j = await res.json();
    if (j && j.ok) {
      gameSyncConfigSave({ at: Number(j.updatedAt || savedAt) });
    } else if (!silent && j && j.reason === 'bad-secret') {
      toast('需要先在主应用设置里填服务端口令', 'bad', 2800);
    }
  } catch (err) { /* 后台静默：网络不顺不打断游戏 */ }
}
async function gameSyncPull() {
  const cfg = gameSyncCfg();
  if (!cfg || !cfg.code) return;
  if (UI.battle || UI.modal || UI.offlineOffer) return; // 战斗/弹窗/离线结算中不自动覆盖
  try {
    const res = await fetch('/api/sync/load?code=' + encodeURIComponent(cfg.code), {
      cache: 'no-store', headers: gameSyncHeaders()
    });
    const j = await res.json();
    if (!j || !j.ok) return;
    if (Number(j.savedAt || 0) <= gameSyncConfigAt() + 500) return;
    const remote = j.payload || {};
    // 主应用键写回本机存储，留给主应用页读取；游戏只接管游戏键
    Object.keys(remote).forEach((k) => {
      if ((k.indexOf('dd:') === 0 && k !== SYNC_CFG_KEY) && typeof remote[k] === 'string') {
        try { localStorage.setItem(k, remote[k]); } catch (err) { /* 忽略 */ }
      }
    });
    if (typeof remote[SAVE_KEY] === 'string') {
      let parsed = null;
      try { parsed = JSON.parse(remote[SAVE_KEY]); } catch (err) { return; }
      if (!parsed || typeof parsed !== 'object' || !parsed.pets) return;
      try {
        state = sanitizeState(deepMerge(defaultState(), parsed));
      } catch (err) { return; }
      UI.battle = null; UI.modal = null; UI.feedGame = null; UI.offlineOffer = null;
      UI.lastTick = Date.now(); UI.lastSaveTick = Date.now();
      UI.tab = ['home', 'adventure', 'pets', 'battle', 'shop', 'quest'].includes(state.lastTab) ? state.lastTab : 'home';
      saveGame();
      renderAll();
    }
    gameSyncConfigSave({ at: Number(j.savedAt) });
  } catch (err) { /* 静默 */ }
}
async function gameSyncNow(silent) {
  await gameSyncPull();
  await gameSyncPush(silent);
}
function gameSyncSchedule() {
  if (!gameSyncCfg()) return;
  if (gameSyncTimer) clearTimeout(gameSyncTimer);
  gameSyncTimer = setTimeout(() => {
    gameSyncTimer = null;
    gameSyncPush(true);
  }, 8000);
}

/* ========== 8. 音频 / 主循环 / 启动 ========== */
function ensureAudio() {
  if (UI.audioCtx) {
    if (UI.audioCtx.state === 'suspended') UI.audioCtx.resume().catch(() => {});
    return UI.audioCtx;
  }
  if (!state || (!state.settings.sfx && !state.settings.music)) return null;
  try {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;
    UI.audioCtx = new Ctor();
  } catch (err) {
    UI.audioCtx = null;
  }
  return UI.audioCtx;
}
function audioTone(freq, duration, type = 'sine', volume = 0.025, delay = 0, slideTo = null) {
  const ctx = UI.audioCtx;
  if (!ctx || ctx.state === 'closed') return;
  try {
    const t0 = ctx.currentTime + Math.max(0, delay);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(30, freq), t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + duration);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, volume), t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.03);
  } catch (err) {}
}
function playSfx(name) {

  const map = {

    heal: [[520, 0.12, 'sine', 0.018], [780, 0.16, 'sine', 0.016, 0.08]],
    claim: [[660, 0.1, 'triangle', 0.02], [880, 0.16, 'triangle', 0.018, 0.08]],
    buy: [[500, 0.07, 'sine', 0.018], [700, 0.09, 'sine', 0.014, 0.05]],
    level: [[440, 0.08, 'triangle', 0.02], [660, 0.09, 'triangle', 0.018, 0.07], [880, 0.14, 'triangle', 0.016, 0.14]],
    star: [[880, 0.08, 'sine', 0.02], [990, 0.08, 'sine', 0.02, 0.07], [1170, 0.18, 'sine', 0.018, 0.14]],
    evolve: [[330, 0.12, 'triangle', 0.025], [550, 0.12, 'triangle', 0.022, 0.1], [880, 0.22, 'sine', 0.02, 0.2]],
