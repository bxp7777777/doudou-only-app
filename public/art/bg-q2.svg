<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Q版小猪和小金毛在云上打盹">
  <defs>
    <radialGradient id="night" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#f3f0ff" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#eeeafc" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#eeeafc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pigHead" x1="28%" y1="8%" x2="82%" y2="92%">
      <stop offset="0%" stop-color="#ffe7ec"/>
      <stop offset="50%" stop-color="#ffc9d4"/>
      <stop offset="100%" stop-color="#ffa9bb"/>
    </linearGradient>
    <linearGradient id="dogHead" x1="24%" y1="4%" x2="86%" y2="96%">
      <stop offset="0%" stop-color="#fff3de"/>
      <stop offset="50%" stop-color="#fbe1b6"/>
      <stop offset="100%" stop-color="#f0c98f"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2e9f7"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <g id="spark">
      <path d="M0 -24 L6 -6 L24 0 L6 6 L0 24 L-6 6 L-24 0 L-6 -6 Z"/>
    </g>

    <g id="pig">
      <ellipse cx="245" cy="415" rx="92" ry="120" fill="#ff9fb0" stroke="#f292a6" stroke-width="7" transform="rotate(-24 245 415)"/>
      <ellipse cx="470" cy="350" rx="92" ry="120" fill="#ff9fb0" stroke="#f292a6" stroke-width="7" transform="rotate(18 470 350)"/>
      <circle cx="350" cy="600" r="245" fill="url(#pigHead)" stroke="#f2a8b9" stroke-width="7"/>
      <ellipse cx="350" cy="690" rx="98" ry="70" fill="#ff9fb0"/>
      <ellipse cx="322" cy="690" rx="14" ry="18" fill="#e88294"/>
      <ellipse cx="378" cy="690" rx="14" ry="18" fill="#e88294"/>
      <path d="M318 782 Q350 800 382 782" fill="none" stroke="#d9788f" stroke-width="9" stroke-linecap="round"/>
      <path d="M258 572 Q300 542 342 572" fill="none" stroke="#5b4044" stroke-width="15" stroke-linecap="round"/>
      <path d="M388 586 Q430 556 472 586" fill="none" stroke="#5b4044" stroke-width="15" stroke-linecap="round"/>
      <ellipse cx="241" cy="670" rx="50" ry="32" fill="#ff8fa3" opacity="0.5" filter="url(#soft)"/>
      <ellipse cx="472" cy="690" rx="50" ry="32" fill="#ff8fa3" opacity="0.46" filter="url(#soft)"/>
    </g>

    <g id="dog">
      <ellipse cx="520" cy="305" rx="96" ry="134" fill="#e9c48f" transform="rotate(-26 520 305)"/>
      <ellipse cx="880" cy="298" rx="96" ry="134" fill="#e9c48f" transform="rotate(24 880 298)"/>
      <circle cx="690" cy="572" r="250" fill="url(#dogHead)" stroke="#e3b681" stroke-width="7"/>
      <ellipse cx="690" cy="700" rx="148" ry="110" fill="#fff8ec"/>
      <ellipse cx="690" cy="652" rx="45" ry="33" fill="#6b4a45"/>
      <ellipse cx="703" cy="641" rx="13" ry="9" fill="#fff8ec" opacity="0.55"/>
      <path d="M642 714 Q666 736 690 714 Q714 736 738 714" fill="none" stroke="#6b4a45" stroke-width="11" stroke-linecap="round"/>
      <ellipse cx="690" cy="744" rx="21" ry="14" fill="#ff9fb0"/>
      <path d="M560 570 Q617 542 674 570" fill="none" stroke="#5b4044" stroke-width="16" stroke-linecap="round"/>
      <path d="M774 556 Q831 528 888 556" fill="none" stroke="#5b4044" stroke-width="16" stroke-linecap="round"/>
      <ellipse cx="548" cy="660" rx="56" ry="35" fill="#ff9db1" opacity="0.44" filter="url(#soft)"/>
      <ellipse cx="902" cy="648" rx="56" ry="35" fill="#ff9db1" opacity="0.4" filter="url(#soft)"/>
    </g>
  </defs>

  <!-- 夜色柔光 -->
  <circle cx="510" cy="470" r="430" fill="url(#night)"/>

  <!-- 月亮 -->
  <circle cx="852" cy="196" r="86" fill="#fff7dc"/>
  <circle cx="824" cy="180" r="16" fill="#f7eecb" opacity="0.9"/>
  <circle cx="874" cy="214" r="10" fill="#f7eecb" opacity="0.8"/>

  <!-- 星星 -->
  <g transform="translate(196 210) scale(0.9)" fill="#ffe9a8" opacity="0.9"><use href="#spark"/></g>
  <g transform="translate(388 138) scale(0.65)" fill="#fff1c4" opacity="0.85"><use href="#spark"/></g>
  <g transform="translate(636 168) scale(0.55)" fill="#ffe9a8" opacity="0.8"><use href="#spark"/></g>
  <g transform="translate(940 470) scale(0.7)" fill="#fff1c4" opacity="0.7"><use href="#spark"/></g>
  <g transform="translate(120 520) scale(0.5)" fill="#ffe9a8" opacity="0.7"><use href="#spark"/></g>

  <!-- 云朵床 -->
  <ellipse cx="300" cy="850" rx="215" ry="105" fill="url(#cloud)"/>
  <ellipse cx="530" cy="820" rx="235" ry="118" fill="url(#cloud)"/>
  <ellipse cx="740" cy="850" rx="210" ry="100" fill="url(#cloud)"/>
  <ellipse cx="520" cy="915" rx="400" ry="120" fill="url(#cloud)"/>
  <ellipse cx="520" cy="880" rx="420" ry="120" fill="#ffffff" opacity="0.75"/>

  <!-- 两个小家伙趴在云上打盹 -->
  <g transform="translate(-34 132) rotate(-5 350 600)"><use href="#pig"/></g>
  <g transform="translate(18 150) rotate(4 690 572)"><use href="#dog"/></g>

  <!-- 呼噜 zzz -->
  <g fill="none" stroke="#b9a7d6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M392 452 L452 452 L392 512 L452 512"/>
    <path d="M470 372 L512 372 L470 414 L512 414"/>
  </g>

  <g transform="translate(700 372) scale(1.1)" fill="#ffb3c5" opacity="0.35">
    <path d="M0 0 C-22 -26 -62 -14 -62 19 C-62 48 -28 67 0 90 C28 67 62 48 62 19 C62 -14 22 -26 0 0 Z"/>
  </g>
</svg>