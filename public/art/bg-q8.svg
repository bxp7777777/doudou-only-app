  <use href="#dog" transform="translate(36 108)"/>
  <!-- 落叶 -->
  <g fill="#f0b98a" opacity="0.85">
    <ellipse cx="250" cy="884" rx="26" ry="14" transform="rotate(24 250 884)"/>
    <ellipse cx="760" cy="872" rx="24" ry="13" transform="rotate(-18 760 872)"/>
    <ellipse cx="620" cy="920" rx="22" ry="12" transform="rotate(40 620 920)"/>
  </g>
  <g transform="translate(200 430) scale(0.8)" fill="#ffe6bb" opacity="0.9"><use href="#spark"/></g>
  <g transform="translate(866 430) scale(0.7)" fill="#ffd3dc" opacity="0.7"><use href="#spark"/></g>

