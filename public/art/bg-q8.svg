      <ellipse cx="880" cy="298" rx="96" ry="134" fill="#e6bd86" transform="rotate(24 880 298)"/>
      <circle cx="690" cy="572" r="250" fill="url(#dogHead)" stroke="#e3b681" stroke-width="7"/>
      <ellipse cx="690" cy="700" rx="148" ry="110" fill="#fff6e8"/>
      <ellipse cx="690" cy="652" rx="45" ry="33" fill="#6b4a45"/>
      <ellipse cx="703" cy="641" rx="13" ry="9" fill="#fff6e8" opacity="0.55"/>
      <path d="M642 714 Q666 736 690 714 Q714 736 738 714" fill="none" stroke="#6b4a45" stroke-width="11" stroke-linecap="round"/>
