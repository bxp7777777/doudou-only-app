<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Q版小猪和小金毛窝在暖阳里">
  <defs>

    <linearGradient id="pigHead" x1="28%" y1="8%" x2="82%" y2="92%">
      <stop offset="0%" stop-color="#ffe7ec"/>
      <stop offset="50%" stop-color="#ffc9d4"/>
