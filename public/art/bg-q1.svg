<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Q版小猪和小金毛贴贴">
  <defs>
    <radialGradient id="glow" cx="50%" cy="58%" r="50%">
      <stop offset="0%" stop-color="#fffaf6" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#ffeee9" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffe9e3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pigHead" x1="28%" y1="8%" x2="82%" y2="92%">
      <stop offset="0%" stop-color="#ffe7ec"/>
      <stop offset="50%" stop-color="#ffc9d4"/>
      <stop offset="100%" stop-color="#ffa9bb"/>
    </linearGradient>
    <linearGradient id="pigBody" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffd8e2"/>
      <stop offset="100%" stop-color="#ffb3c4"/>
    </linearGradient>
    <linearGradient id="dogHead" x1="24%" y1="4%" x2="86%" y2="96%">
      <stop offset="0%" stop-color="#fff2d9"/>
      <stop offset="50%" stop-color="#f9dcac"/>
      <stop offset="100%" stop-color="#eec489"/>
    </linearGradient>
    <linearGradient id="dogBody" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fae4bc"/>
      <stop offset="100%" stop-color="#e8bd83"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb3c5"/>
      <stop offset="100%" stop-color="#ff8fa8"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <g id="heart">
      <path d="M0 0 C-22 -26 -62 -14 -62 19 C-62 48 -28 67 0 90 C28 67 62 48 62 19 C62 -14 22 -26 0 0 Z"/>
    </g>
    <g id="spark">
      <path d="M0 -24 L6 -6 L24 0 L6 6 L0 24 L-6 6 L-24 0 L-6 -6 Z"/>
    </g>

    <!-- 小猪（Q版：脑袋占大半） -->
    <g id="pig">
      <ellipse cx="245" cy="415" rx="95" ry="125" fill="#ff9fb0" stroke="#f292a6" stroke-width="7" transform="rotate(-24 245 415)"/>
      <ellipse cx="470" cy="340" rx="95" ry="125" fill="#ff9fb0" stroke="#f292a6" stroke-width="7" transform="rotate(18 470 340)"/>
      <circle cx="350" cy="600" r="250" fill="url(#pigHead)" stroke="#f2a8b9" stroke-width="7"/>
      <ellipse cx="350" cy="690" rx="100" ry="72" fill="#ff9fb0"/>
      <ellipse cx="320" cy="690" rx="14" ry="19" fill="#e88294"/>
      <ellipse cx="380" cy="690" rx="14" ry="19" fill="#e88294"/>
      <path d="M316 782 Q350 804 384 782" fill="none" stroke="#d9788f" stroke-width="9" stroke-linecap="round"/>
      <path d="M255 570 Q300 530 345 570" fill="none" stroke="#5b4044" stroke-width="15" stroke-linecap="round"/>
      <path d="M385 585 Q430 545 475 585" fill="none" stroke="#5b4044" stroke-width="15" stroke-linecap="round"/>
      <ellipse cx="243" cy="668" rx="50" ry="32" fill="#ff8fa3" opacity="0.5" filter="url(#soft)"/>
      <ellipse cx="472" cy="688" rx="50" ry="32" fill="#ff8fa3" opacity="0.46" filter="url(#soft)"/>
    </g>

    <!-- 小金毛 -->
    <g id="dog">
      <ellipse cx="520" cy="300" rx="100" ry="140" fill="#e6bd86" transform="rotate(-26 520 300)"/>
      <ellipse cx="880" cy="290" rx="100" ry="140" fill="#e6bd86" transform="rotate(24 880 290)"/>
      <circle cx="690" cy="570" r="255" fill="url(#dogHead)" stroke="#e3b681" stroke-width="7"/>
      <ellipse cx="690" cy="700" rx="150" ry="112" fill="#fff6e8"/>
      <ellipse cx="690" cy="650" rx="46" ry="34" fill="#6b4a45"/>
      <ellipse cx="704" cy="638" rx="14" ry="10" fill="#fff6e8" opacity="0.55"/>
      <path d="M640 712 Q665 736 690 712 Q715 736 740 712" fill="none" stroke="#6b4a45" stroke-width="11" stroke-linecap="round"/>
      <ellipse cx="690" cy="742" rx="22" ry="15" fill="#ff9fb0"/>
      <path d="M555 565 Q615 515 675 565" fill="none" stroke="#5b4044" stroke-width="16" stroke-linecap="round"/>
      <path d="M770 550 Q830 500 890 550" fill="none" stroke="#5b4044" stroke-width="16" stroke-linecap="round"/>
      <ellipse cx="545" cy="658" rx="58" ry="36" fill="#ff9db1" opacity="0.45" filter="url(#soft)"/>
      <ellipse cx="905" cy="646" rx="58" ry="36" fill="#ff9db1" opacity="0.42" filter="url(#soft)"/>
    </g>
  </defs>

  <circle cx="510" cy="560" r="430" fill="url(#glow)"/>

  <!-- 身体 -->
  <ellipse cx="330" cy="1010" rx="300" ry="250" fill="url(#pigBody)" opacity="0.97"/>
  <ellipse cx="700" cy="985" rx="315" ry="255" fill="url(#dogBody)" opacity="0.98"/>

  <use href="#dog"/>
  <use href="#pig"/>

  <!-- 贴贴的爱心 -->
  <g transform="translate(640 262) scale(1.2)" fill="url(#heartGrad)" opacity="0.9"><use href="#heart"/></g>
  <g transform="translate(498 300) scale(0.55)" fill="url(#heartGrad)" opacity="0.7"><use href="#heart"/></g>
  <g transform="translate(806 236) scale(0.45)" fill="url(#heartGrad)" opacity="0.6"><use href="#heart"/></g>

  <g transform="translate(250 430) scale(1.1)" fill="#ffd3dc" opacity="0.9"><use href="#spark"/></g>
  <g transform="translate(930 430) scale(0.9)" fill="#ffdcb0" opacity="0.85"><use href="#spark"/></g>
  <g transform="translate(520 140) scale(0.7)" fill="#ffb9c8" opacity="0.7"><use href="#spark"/></g>
</svg>