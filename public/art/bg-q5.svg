<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Q版小猪和小金毛雨天共撑一把小伞">
  <defs>

    <linearGradient id="pigHead" x1="28%" y1="8%" x2="82%" y2="92%">
      <stop offset="0%" stop-color="#ffe7ec"/>
      <stop offset="50%" stop-color="#ffc9d4"/>
      <stop offset="100%" stop-color="#ffa9bb"/>
    </linearGradient>
    <linearGradient id="dogHead" x1="24%" y1="4%" x2="86%" y2="96%">
      <stop offset="0%" stop-color="#fff2d9"/>
      <stop offset="50%" stop-color="#f9dcac"/>
      <stop offset="100%" stop-color="#eec489"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <g id="spark">
      <path d="M0 -24 L6 -6 L24 0 L6 6 L0 24 L-6 6 L-24 0 L-6 -6 Z"/>
    </g>
    <g id="pig">
      <ellipse cx="245" cy="415" rx="92" ry="120" fill="#ff9fb0" stroke="#f292a6" stroke-width="7" transform="rotate(-24 245 415)"/>
      <ellipse cx="470" cy="350" rx="92" ry="120" fill="#ff9fb0" stroke="#f292a6" stroke-width="7" transform="rotate(18 470 350)"/>
      <circle cx="350" cy="600" r="245" fill="url(#pigHead)" stroke="#f2a8b9" stroke-width="7"/>
      <ellipse cx="350" cy="690" rx="98" ry="70" fill="#ff9fb0"/>
      <ellipse cx="322" cy="690" rx="14" ry="18" fill="#e88294"/>
      <ellipse cx="378" cy="690" rx="14" ry="18" fill="#e88294"/>
      <path d="M318 782 Q350 800 382 782" fill="none" stroke="#d9788f" stroke-width="9" stroke-linecap="round"/>
      <path d="M258 572 Q300 542 342 572" fill="none" stroke="#5b4044" stroke-width="15" stroke-linecap="round"/>
      <path d="M388 586 Q430 556 472 586" fill="none" stroke="#5b4044" stroke-width="15" stroke-linecap="round"/>
      <ellipse cx="241" cy="670" rx="50" ry="32" fill="#ff8fa3" opacity="0.5" filter="url(#soft)"/>
      <ellipse cx="472" cy="690" rx="50" ry="32" fill="#ff8fa3" opacity="0.46" filter="url(#soft)"/>
    </g>
    <g id="dog">
      <ellipse cx="520" cy="305" rx="96" ry="134" fill="#e6bd86" transform="rotate(-26 520 305)"/>
      <ellipse cx="880" cy="298" rx="96" ry="134" fill="#e6bd86" transform="rotate(24 880 298)"/>
      <circle cx="690" cy="572" r="250" fill="url(#dogHead)" stroke="#e3b681" stroke-width="7"/>
      <ellipse cx="690" cy="700" rx="148" ry="110" fill="#fff6e8"/>
      <ellipse cx="690" cy="652" rx="45" ry="33" fill="#6b4a45"/>
      <ellipse cx="703" cy="641" rx="13" ry="9" fill="#fff6e8" opacity="0.55"/>
      <path d="M642 714 Q666 736 690 714 Q714 736 738 714" fill="none" stroke="#6b4a45" stroke-width="11" stroke-linecap="round"/>
      <ellipse cx="690" cy="744" rx="21" ry="14" fill="#ff9fb0"/>
      <path d="M555 570 Q615 530 675 570" fill="none" stroke="#5b4044" stroke-width="16" stroke-linecap="round"/>
      <path d="M770 556 Q830 516 890 556" fill="none" stroke="#5b4044" stroke-width="16" stroke-linecap="round"/>
      <ellipse cx="546" cy="660" rx="56" ry="35" fill="#ff9db1" opacity="0.44" filter="url(#soft)"/>
      <ellipse cx="906" cy="648" rx="56" ry="35" fill="#ff9db1" opacity="0.4" filter="url(#soft)"/>
    </g>

    <radialGradient id="mist" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#eef5ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#dbe9fb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="512" cy="500" r="440" fill="url(#mist)"/>
  <line x1="120" y1="180" x2="106" y2="224" stroke="#aecbe8" stroke-width="6" stroke-linecap="round" opacity="0.35"/>
  <line x1="250" y1="120" x2="236" y2="164" stroke="#aecbe8" stroke-width="6" stroke-linecap="round" opacity="0.47"/>
  <line x1="380" y1="210" x2="366" y2="254" stroke="#aecbe8" stroke-width="6" stroke-linecap="round" opacity="0.59"/>
  <line x1="520" y1="140" x2="506" y2="184" stroke="#aecbe8" stroke-width="6" stroke-linecap="round" opacity="0.35"/>
  <line x1="660" y1="190" x2="646" y2="234" stroke="#aecbe8" stroke-width="6" stroke-linecap="round" opacity="0.47"/>
  <line x1="800" y1="130" x2="786" y2="174" stroke="#aecbe8" stroke-width="6" stroke-linecap="round" opacity="0.59"/>
  <line x1="930" y1="220" x2="916" y2="264" stroke="#aecbe8" stroke-width="6" stroke-linecap="round" opacity="0.35"/>
  <line x1="180" y1="360" x2="166" y2="404" stroke="#aecbe8" stroke-width="6" stroke-linecap="round" opacity="0.47"/>
  <line x1="430" y1="340" x2="416" y2="384" stroke="#aecbe8" stroke-width="6" stroke-linecap="round" opacity="0.59"/>
  <line x1="760" y1="350" x2="746" y2="394" stroke="#aecbe8" stroke-width="6" stroke-linecap="round" opacity="0.35"/>
  <!-- 小伞 -->
  <g transform="translate(512 300)">
    <path d="M-210 40 Q0 -190 210 40 Q150 10 105 40 Q60 10 0 40 Q-60 10 -105 40 Q-150 10 -210 40 Z" fill="#ffb3c5" stroke="#ef8fa8" stroke-width="6"/>
    <line x1="0" y1="40" x2="0" y2="250" stroke="#b98a63" stroke-width="9" stroke-linecap="round"/>
    <path d="M0 250 Q0 286 -30 286" fill="none" stroke="#b98a63" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- 水洼 -->
  <ellipse cx="430" cy="948" rx="240" ry="34" fill="#cfe2f6" opacity="0.7"/>
  <ellipse cx="720" cy="940" rx="180" ry="28" fill="#cfe2f6" opacity="0.55"/>
  <use href="#pig" transform="translate(-70 120)"/>
  <use href="#dog" transform="translate(40 118)"/>
  <g transform="translate(196 470) scale(0.8)" fill="#bcd8f3" opacity="0.8"><use href="#spark"/></g>
  <g transform="translate(858 470) scale(0.7)" fill="#ffd3dc" opacity="0.7"><use href="#spark"/></g>

</svg>
