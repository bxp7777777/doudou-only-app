<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Q版小猪和小金毛一起吃点心">
  <defs>
    <radialGradient id="glow" cx="50%" cy="52%" r="52%">
      <stop offset="0%" stop-color="#fffaf4" stop-opacity="0.92"/>
      <stop offset="65%" stop-color="#fff1e6" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#ffeee2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pigHead" x1="28%" y1="8%" x2="82%" y2="92%">
      <stop offset="0%" stop-color="#ffe7ec"/>
      <stop offset="50%" stop-color="#ffc9d4"/>
      <stop offset="100%" stop-color="#ffa9bb"/>
    </linearGradient>
    <linearGradient id="dogHead" x1="24%" y1="4%" x2="86%" y2="96%">
      <stop offset="0%" stop-color="#fff2d9"/>
      <stop offset="50%" stop-color="#f9dcac"/>
      <stop offset="100%" stop-color="#eec489"/>
    </linearGradient>
    <linearGradient id="pigBody" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffd8e2"/>
      <stop offset="100%" stop-color="#ffb3c4"/>
    </linearGradient>
    <linearGradient id="dogBody" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fae4bc"/>
      <stop offset="100%" stop-color="#e8bd83"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb3c5"/>
      <stop offset="100%" stop-color="#ff8fa8"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <g id="heart">
      <path d="M0 0 C-22 -26 -62 -14 -62 19 C-62 48 -28 67 0 90 C28 67 62 48 62 19 C62 -14 22 -26 0 0 Z"/>
    </g>
    <g id="spark">
      <path d="M0 -24 L6 -6 L24 0 L6 6 L0 24 L-6 6 L-24 0 L-6 -6 Z"/>
    </g>

    <g id="pig">
      <ellipse cx="245" cy="415" rx="92" ry="120" fill="#ff9fb0" stroke="#f292a6" stroke-width="7" transform="rotate(-24 245 415)"/>
      <ellipse cx="470" cy="350" rx="92" ry="120" fill="#ff9fb0" stroke="#f292a6" stroke-width="7" transform="rotate(18 470 350)"/>
      <circle cx="350" cy="600" r="245" fill="url(#pigHead)" stroke="#f2a8b9" stroke-width="7"/>
      <ellipse cx="350" cy="690" rx="98" ry="70" fill="#ff9fb0"/>
      <ellipse cx="322" cy="690" rx="14" ry="18" fill="#e88294"/>
      <ellipse cx="378" cy="690" rx="14" ry="18" fill="#e88294"/>
      <path d="M318 782 Q350 800 382 782" fill="none" stroke="#d9788f" stroke-width="9" stroke-linecap="round"/>
      <path d="M258 572 Q300 542 342 572" fill="none" stroke="#5b4044" stroke-width="15" stroke-linecap="round"/>
      <path d="M388 586 Q430 556 472 586" fill="none" stroke="#5b4044" stroke-width="15" stroke-linecap="round"/>
      <ellipse cx="241" cy="670" rx="50" ry="32" fill="#ff8fa3" opacity="0.5" filter="url(#soft)"/>
      <ellipse cx="472" cy="690" rx="50" ry="32" fill="#ff8fa3" opacity="0.46" filter="url(#soft)"/>
    </g>

    <g id="dog">
      <ellipse cx="520" cy="305" rx="96" ry="134" fill="#e6bd86" transform="rotate(-26 520 305)"/>
      <ellipse cx="880" cy="298" rx="96" ry="134" fill="#e6bd86" transform="rotate(24 880 298)"/>
      <circle cx="690" cy="572" r="250" fill="url(#dogHead)" stroke="#e3b681" stroke-width="7"/>
      <ellipse cx="690" cy="700" rx="148" ry="110" fill="#fff6e8"/>
      <ellipse cx="690" cy="652" rx="45" ry="33" fill="#6b4a45"/>
      <ellipse cx="703" cy="641" rx="13" ry="9" fill="#fff6e8" opacity="0.55"/>
      <path d="M642 714 Q666 736 690 714 Q714 736 738 714" fill="none" stroke="#6b4a45" stroke-width="11" stroke-linecap="round"/>
      <ellipse cx="690" cy="744" rx="21" ry="14" fill="#ff9fb0"/>
      <path d="M555 570 Q615 530 675 570" fill="none" stroke="#5b4044" stroke-width="16" stroke-linecap="round"/>
      <path d="M770 556 Q830 516 890 556" fill="none" stroke="#5b4044" stroke-width="16" stroke-linecap="round"/>
      <ellipse cx="546" cy="660" rx="56" ry="35" fill="#ff9db1" opacity="0.44" filter="url(#soft)"/>
      <ellipse cx="906" cy="648" rx="56" ry="35" fill="#ff9db1" opacity="0.4" filter="url(#soft)"/>
    </g>
  </defs>

  <circle cx="512" cy="540" r="430" fill="url(#glow)"/>

  <!-- 身体 -->
  <ellipse cx="240" cy="1024" rx="300" ry="250" fill="url(#pigBody)" opacity="0.95"/>
  <ellipse cx="780" cy="1014" rx="310" ry="255" fill="url(#dogBody)" opacity="0.96"/>

  <!-- 两个小家伙凑到桌边 -->
  <g transform="translate(-90 -100)"><use href="#pig"/></g>
  <g transform="translate(60 -100)"><use href="#dog"/></g>

  <!-- 小桌子 -->
  <ellipse cx="512" cy="812" rx="300" ry="26" fill="#f7dfca" opacity="0.85"/>
  <rect x="240" y="792" width="34" height="200" rx="16" fill="#e8c39f"/>
  <rect x="750" y="792" width="34" height="200" rx="16" fill="#e8c39f"/>
  <rect x="170" y="748" width="684" height="48" rx="24" fill="#f2d3b3" stroke="#e3bd98" stroke-width="6"/>

  <!-- 蛋糕 -->
  <ellipse cx="522" cy="752" rx="92" ry="18" fill="#fff8ee" stroke="#f0d6bc" stroke-width="4"/>
  <rect x="452" y="662" width="140" height="88" rx="16" fill="#ffe6c8" stroke="#f1ccaa" stroke-width="5"/>
  <rect x="452" y="708" width="140" height="30" rx="10" fill="#fff6ea"/>
  <ellipse cx="522" cy="668" rx="70" ry="18" fill="#ffd9e2"/>
  <circle cx="522" cy="646" r="17" fill="#ff8fa8"/>
  <path d="M522 630 Q534 614 548 618" fill="none" stroke="#7fb98a" stroke-width="6" stroke-linecap="round"/>

  <!-- 爱心和星星 -->
  <g transform="translate(560 300) scale(1)" fill="url(#heartGrad)" opacity="0.9"><use href="#heart"/></g>
  <g transform="translate(432 246) scale(0.6)" fill="url(#heartGrad)" opacity="0.7"><use href="#heart"/></g>
  <g transform="translate(704 232) scale(0.5)" fill="url(#heartGrad)" opacity="0.6"><use href="#heart"/></g>
  <g transform="translate(176 428) scale(0.9)" fill="#ffd3dc" opacity="0.9"><use href="#spark"/></g>
  <g transform="translate(906 400) scale(0.8)" fill="#ffe6bb" opacity="0.9"><use href="#spark"/></g>
</svg>